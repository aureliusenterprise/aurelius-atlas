# The standalone stack's copy of the webapp's nginx configuration, mounted
# straight into the webapp container (SPC-04, DD-695). It is the asset version
# of apps/aurelius-atlas-webapp/nginx.conf.template: every
# ${AURELIUS_ATLAS_WEBAPP_*} placeholder is written in with the value this
# stack uses (the upstreams, the peer names, the DNS resolver, the certificate
# paths) and the three clauses that resolve to nothing are gone. No service
# renders it at boot.
# The browser's OTLP push rides the stack's proxy at /otel/ (the webapp's
# config.json names it), so the otel_exporter block below carries no ingest
# token: the webapp's own edge leg is a spare path here, and the chart's copy
# of it is the one that needs the bearer (DD-695).
# The template's own rules stay: multi-locale serving (SHL-11), the browser
# rate limit (SRV-09), and the hardened image's contract that the file is
# included inside its *http* block, so the http-scoped directives below sit at
# file top and the server block follows. Keep everything else server-scoped.

# Browser rate limit on the API proxy (SRV-09, DD-238): a per-client-IP leaky
# bucket, 300 requests/minute sustained with a burst of 100 served immediately
# (nodelay — a browser issues a page's requests at once), refusals answered
# 429 (nginx's default 503 is a server-fault code and retries are pointless
# for a browser). The key is a map, not $binary_remote_addr: requests from
# private ranges — internal services calling the API directly, and dev/e2e
# traffic — get the empty key, which nginx does not account (the blog's
# allowlist pattern). The limit is the browser's: an internal caller bursting
# is working, an attacker bursting is browsing. Extend the geo block (a 0 entry
# per range) for deployment networks that are not RFC 1918.
#
# Client-IP trust (DD-261) is absent here by design: the stack's proxy is the
# front door and $binary_remote_addr already is the browser, so there is no
# `set_real_ip_from` block to place above the geo bucket.

geo $atlas_api_limit_key {
    default 1;
    127.0.0.0/8 0;
    ::1 0;
    10.0.0.0/8 0;
    172.16.0.0/12 0;
    192.168.0.0/16 0;
}

map $atlas_api_limit_key $atlas_api_limit_addr {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $atlas_api_limit_addr zone=atlas_api:10m rate=300r/m;
# The browser-leg twin (CHT-100): /otel/ is auth-gated by the collector's own
# OIDC receiver, but the 401 path is still work — a logged-in tab (or a
# scripted flood behind one) otherwise reaches the collector unbounded while
# /api/ buckets. Browser-sized with headroom: an OTLP push is bursty by
# design, an attack is a sustained stream.
limit_req_zone $atlas_api_limit_addr zone=atlas_otel:10m rate=600r/m;
# The lineage-model twin (7.22a, LDG-06): the aux API verifies every caller
# (LM-08), but the 401 path is still work — the same browser-sized bucket as
# /otel/ (a page draws its diagram with one call; a flood is sustained).
limit_req_zone $atlas_api_limit_addr zone=atlas_lineage_model:10m rate=600r/m;
# The validate-entity twin (7.24, EDT-22): the aux API verifies every caller
# (VE-03), but the 401 path is still work — the same browser-sized bucket as
# /lineage-model/ (an editor validates on a debounced cadence; a flood is
# sustained).
limit_req_zone $atlas_api_limit_addr zone=atlas_validate_entity:10m rate=600r/m;
limit_req_status 429;

# Native edge tracing (SHL-15, DD-239): a /api/ request that reaches this
# nginx gets an edge span exported to the collector's legacy gRPC leg
# (OTLP/gRPC, TLS-pinned to the stack CA). The stack's proxy sends /api/ to the
# server itself, so this leg is a spare path here, and it carries no ingest
# bearer: the browser's OTLP push rides the proxy at /otel/ (DD-695). Where a
# deployment does use this listener's edge spans, its copy of the block adds
# the shared ingest header, as the chart's does (CIA-10).
otel_exporter {
    endpoint https://otel-collector:4320;
    trusted_certificate /certs/ca.pem;
}
otel_service_name aurelius-atlas-webapp-edge;

server {
    # TLS to the last hop (DD-270): the Gateway's BackendTLSPolicy dials this
    # listener with CA validation and the Service name as SNI, so the leaf
    # here carries that name as its SAN (the chart's Certificate). Plaintext
    # behind the gateway was DD-285's shape until the browser's bearer tokens
    # (7.3) and OTLP pushes started crossing this hop in the clear — the same
    # reason the /api/ proxy below verifies its upstream.
    listen 8080 ssl;

    ssl_certificate /certs/aurelius-atlas-webapp.pem;
    ssl_certificate_key /certs/aurelius-atlas-webapp-key.pem;

    # Assets produce no spans: tracing is opted in per location (/api/
    # below); the module's off/ignore defaults cover every other route.
    otel_trace off;

    # Version-disclosure hardening: keep the nginx version out of the
    # Server header and error pages.
    server_tokens off;

    root /usr/share/nginx/html;

    include /etc/nginx/app.d/*.conf;

    # Security headers (M2).
    #   - style-src 'unsafe-inline': @angular/build inlines critical CSS as a
    #     <style> tag in index.html (no hash available at config time).
    #   - script-src 'self' + the theme pre-render hash: the build ships one
    #     inline script — the data-theme bootstrap (DD-159) — whose sha256
    #     rides here (the silent-check-sso hash precedent). Recompute with
    #     the example app's recipe if the script's bytes change.
    #   - connect-src/frame-src carry no Keycloak origin (7.3, APC-05): this
    #     stack's browser reaches Keycloak through the same origin at /auth/
    #     (docker/gateway/nginx.conf), so no cross-origin fetch or iframe.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-cPd7BkhA9gz2uOXcqes/dMvn6M3yEyGkqoV5CfKUTWk='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS (CHT-99) is absent: the stack's proxy is the only reader of this
    # listener and it answers its own HSTS header, so a second one here would
    # replace it (the chart renders its own when nginx.hsts.enabled).

    # keycloak-js silent SSO iframe: same-origin only, and its one inline
    # script is allowed via hash (sha256 of the script element's content —
    # recompute with:
    #   python -c "import re,base64,hashlib; h=re.search(r'<script>(.*?)</script>', open('public/silent-check-sso.html').read(), 16).group(1); print('sha256-'+base64.b64encode(hashlib.sha256(h.encode()).digest()).decode())"
    # ) instead of loosening CSP app-wide. add_header here replaces the
    # inherited server-level set, so repeat the non-CSP headers.
    location = /silent-check-sso.html {
        # The asset is built per locale (browser/<locale>/silent-check-sso.html);
        # keycloak-js requests it at the origin root, so resolve it explicitly.
        try_files /en-US/silent-check-sso.html /nl-NL/silent-check-sso.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-miQlUSMEyNrSzHUXigoiPbVCIcDQvHCRNPop+QMZUus='; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Browser preferred-language detection via the Accept-Language header.
    # (The http-level `map` directive from the Angular docs doesn't fit here:
    # the hardened image only includes conf.d inside the server scope.)
    set $accept_language en-US;

    # Same-origin reverse proxies for the backend API and the OTLP collector,
    # mirroring the dev-server proxy (proxy.conf.json). The /api prefix is
    # forwarded INTACT (DD-139): the Atlas server serves its routes under
    # /api/atlas/..., and the client composes `${apiBaseUrl}/atlas/...` from
    # config — a rewriting proxy would double-strip the prefix. The /otel
    # prefix is stripped, as the collector serves /v1/traces at its root.
    # The CSP above already promises connect-src 'self' for /api, /otel and
    # /lineage-model — these locations make that real in production.
    #
    # The upstream names below are this stack's service names, written in
    # (SPC-04): the server, the collector, and the two aux APIs, the last
    # three reached through the proxy's network. The hostname goes through a
    # variable so nginx resolves it via `resolver`
    # *per request* — a missing backend then returns 502 instead of refusing
    # to boot the SPA. 127.0.0.11 is Docker's built-in DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # The browser bucket (SRV-09): public addresses above, in a burst;
        # 429 on overflow. The server itself never rate limits — internal
        # callers arrive on private ranges, whose key is empty and unaccounted.
        limit_req zone=atlas_api burst=100 nodelay;

        # The traced location (ETR-01): the edge span parents the server's
        # request span (propagate = extract the inbound traceparent, inject
        # this span's id toward the upstream), and records the status nginx
        # answered — 9.3's limiter lands here, so a 429 refusal is a span too.
        otel_trace on;
        otel_trace_context propagate;

        set $api_upstream https://proxy:21000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upstream is TLS with the stack's own certificate. This upstream
        # carries user bearer tokens from 7.3 on, so its certificate MUST be
        # verified: unverified, a network-path attacker between nginx and the
        # API can impersonate the backend and harvest every token. The trust
        # anchor is the stack CA the piece bind-mounts at /certs/ca.pem (SPC-
        # 04). nginx refuses to start when the file is missing — failing
        # loudly beats silently unverified.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
        proxy_redirect off;
    }

    # OTLP push (traces and metrics) for the browser SDK; same-origin keeps
    # the CSP at 'self' (the wiring arrives with 7.3's observability slice).
    # The collector's browser leg (4318) authenticates the signed-in user:
    # the SPA attaches its Keycloak access token to every OTLP push, and the
    # proxy passes the Authorization header through untouched (nginx's
    # default — no proxy_set_header here) to the collector's OIDC receiver,
    # which validates issuer, signature and the otel-collector audience
    # (DD-193, CIA-01/02). A logged-out push has no token and is answered
    # 401 — accepted, the telemetry gate is the login (DD-193).
    location /otel/ {
        # The browser-leg bucket (CHT-100): same trusted-address key as
        # /api/, so behind a Gateway with trustedProxyCIDRs it buckets per
        # browser, and without it per Gateway — same shape as SRV-09.
        limit_req zone=atlas_otel burst=100 nodelay;

        set $otel_upstream https://otel-collector:4318;
        rewrite ^/otel(/.*)$ $1 break;
        proxy_pass $otel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name otel-collector;
        proxy_redirect off;
    }

    # The lineage-model auxiliary API (7.22a, LDG-06, DD-384): the details
    # page's lineage diagram fetches its model here (LM-01); the /lineage-model
    # prefix is stripped, as the aux API serves its route at its root. The aux
    # API verifies the bearer token itself (LM-08) — nginx adds no auth of its
    # own, an anonymous request reaches the API's 401. The prefix carries user
    # bearer tokens, so the upstream certificate is verified exactly as /api/'s
    # is (DD-142's reason: unverified, a path attacker harvests every token).
    location /lineage-model/ {
        limit_req zone=atlas_lineage_model burst=100 nodelay;

        set $lineage_model_upstream https://proxy:21002;
        rewrite ^/lineage-model(/.*)$ $1 break;
        proxy_pass $lineage_model_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-lineage-model;
        proxy_redirect off;
    }

    # The validate-entity auxiliary API (7.24, EDT-22, DD-435): the editor's
    # governance banner validates the draft entity here (EDT-21); the
    # /validate-entity prefix is stripped, as the aux API serves its route at
    # its root (DV-144: the legacy's validate_entity proxy path is not ported).
    # The aux API verifies the bearer token itself (VE-03) — nginx adds no auth
    # of its own, an anonymous request reaches the API's 401. The prefix carries
    # user bearer tokens, so the upstream certificate is verified exactly as
    # /api/'s is (DD-142's reason: unverified, a path attacker harvests tokens).
    location /validate-entity/ {
        limit_req zone=atlas_validate_entity burst=100 nodelay;

        set $validate_entity_upstream https://proxy:21003;
        rewrite ^/validate-entity(/.*)$ $1 break;
        proxy_pass $validate_entity_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-validate-entity;
        proxy_redirect off;
    }

    # Redirect "/" to the preferred locale, defaulting to en-US.
    # absolute_redirect off: nginx's default expands a relative `return` to
    # an absolute URL from the listening socket — behind a Gateway that ends
    # the browser's TLS at 443, the answer carries the container's :8080 and
    # dies in the client (DD-647). A same-origin relative Location is what
    # the 302 must be.
    absolute_redirect off;
    location = / {
        if ($http_accept_language ~* "^nl") {
            set $accept_language nl-NL;
        }
        return 302 /$accept_language/$is_args$args;
    }

    # Serve each locale's app; unknown paths under a locale prefix fall back
    # to that locale's index.html so client-side routing keeps working.
    location /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    location /nl-NL/ {
        try_files $uri $uri/ /nl-NL/index.html;
    }

    # Unknown paths fall back to the default locale's app (SPA routing).
    location / {
        try_files $uri /en-US/index.html;
    }
}
