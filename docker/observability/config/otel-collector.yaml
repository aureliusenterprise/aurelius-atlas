# The standalone stack's collector configuration (DD-675): the slice's
# (infra/observability/config/otel-collector.yaml) with the OIDC validator
# changed - it reads the stack realm's keys from a file instead of discovering
# them from the dev Keycloak's published listeners, because this stack's tokens
# carry the stack's own issuer, https://<STANDALONE_HOST>:9000/auth/realms/aurelius-atlas
# (SPS-01, SPS-08), which no container can dial (the URL is the proxy's browser
# address). The jwks-fetch one shot (docker/observability/compose.yaml) keeps
# /jwks/jwks.json current. The three credential-typed legs, the identity
# processors, the exporters and the pipelines are the slice's text (DD-675).
receivers:
    # Three ingest legs, credential-typed (DD-193, DD-196). TLS (below) proves
    # which collector you reach on all of them; the auth extension proves who
    # writes. The contrib image has no compositeauth extension, so a port
    # carries exactly one authenticator — the legs are separate ports by
    # construction.
    #
    # The browser leg: the webapp/example /otel/ proxies pass the signed-in
    # user's Keycloak access token through (CSP stays 'self'), and the oidc
    # extension validates it against the issuer — every span/metric carries
    # the user's identity (the sub claim). Unauthenticated pushes are 401.
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
                tls:
                    cert_file: /certs/otel-collector.pem
                    key_file: /certs/otel-collector-key.pem
                auth:
                    authenticator: oidc
    # The per-service leg (DD-196, CIA-06): headless producers with a Keycloak
    # identity — the three slice metrics-pullers (oauth2client extension) and
    # the Atlas server (the in-app refresh shim) — present client-credentials
    # JWTs minted for their otel-* realm clients. The SAME oidc extension as
    # the browser leg validates them: one issuer, one audience
    # (otel-collector), one trust story; the azp claim carries the client id
    # (the resource processor stamps it). The shared token is answered 401
    # here (CIA-08) — the legs are credential-typed.
    otlp/services:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
                tls:
                    cert_file: /certs/otel-collector.pem
                    key_file: /certs/otel-collector-key.pem
                auth:
                    authenticator: oidc
            http:
                endpoint: 0.0.0.0:4319
                tls:
                    cert_file: /certs/otel-collector.pem
                    key_file: /certs/otel-collector-key.pem
                auth:
                    authenticator: oidc
    # The legacy leg (DD-196): the two producers that cannot present a
    # Keycloak JWT — Keycloak's native OTLP (the issuer cannot mint its own
    # token at cold boot) and the FastAPI example (static-header SDK, 60s
    # tokens) — keep 7.17's shared ingest token (bearertokenauth, CIA-10).
    # Retires when a Quarkus bearer hook and the example's shim exist.
    otlp/legacy:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4320
                tls:
                    cert_file: /certs/otel-collector.pem
                    key_file: /certs/otel-collector-key.pem
                auth:
                    authenticator: bearertokenauth
            http:
                endpoint: 0.0.0.0:4321
                tls:
                    cert_file: /certs/otel-collector.pem
                    key_file: /certs/otel-collector-key.pem
                auth:
                    authenticator: bearertokenauth

processors:
    batch:
    resource:
        attributes:
            - action: upsert
              key: deployment.environment.name
              value: development
            # CIA-05 (DD-194): the OIDC verifier keeps the verified token's
            # claims in the request context under their raw JWT names —
            # Keycloak's subject claim is `sub`, so the path is
            # auth.claims.sub (the extension README's `subject` example fits
            # issuers that name the claim that). Copy it onto the resource so
            # every user-driven span/metric carries the user's identity
            # (searchable in Tempo as resource["enduser.id"]). Legacy-leg
            # pushes carry no auth context: the upsert lands an empty
            # attribute, so those producers stay unattributed (enduser.id=""),
            # by design. Service-account pushes carry the client's UUID `sub`
            # here; transform/identity (below) clears it (CIA-09, DD-196).
            - action: upsert
              key: enduser.id
              from_context: auth.claims.sub
            # CIA-09 (DD-196): the verified token's azp (authorized party) is
            # the minting client — per-service identity on the per-service
            # leg (otel-postgres, …), `aurelius` on the browser leg. Empty on
            # the legacy leg (no OIDC context, the DD-194 empty-upsert rule).
            - action: upsert
              key: otel.ingest.client
              from_context: auth.claims.azp
    # CIA-09 (DD-196): a service-account push must not wear a user identity.
    # The service-account sub is a client UUID, not a person — on pushes from
    # an otel-* client, clear the enduser.id the sub-upsert above stamped, so
    # human and machine identity stay distinguishable (enduser.id=<sub> +
    # otel.ingest.client=aurelius for users; enduser.id="" +
    # otel.ingest.client=otel-* for services; both empty on the legacy leg).
    transform/identity:
        trace_statements:
            - context: resource
              statements:
                  - set(attributes["enduser.id"], "") where IsMatch(attributes["otel.ingest.client"], "^otel-")
        metric_statements:
            - context: resource
              statements:
                  - set(attributes["enduser.id"], "") where IsMatch(attributes["otel.ingest.client"], "^otel-")
        log_statements:
            - context: resource
              statements:
                  - set(attributes["enduser.id"], "") where IsMatch(attributes["otel.ingest.client"], "^otel-")
    # The metrics leg of CIA-05 (DD-194): the prometheus exporter keeps only
    # a few resource attributes as labels (service.name -> exported_job) and
    # drops the rest, so the stamped enduser.id would never reach Prometheus.
    # Promote it onto every datapoint, where the exporter turns it into the
    # enduser_id label — panels can group by user. Service-leg metrics carry
    # the empty enduser.id (DD-196: cleared by transform/identity, stamped
    # with otel.ingest.client), so producer series get one constant
    # enduser_id="" label — no cardinality growth. DD-196 extends the
    # promotion: otel.ingest.client rides the same hop (label
    # otel_ingest_client) — where per-service attribution becomes queryable.
    transform/user_labels:
        metric_statements:
            - context: datapoint
              statements:
                  - set(attributes["enduser.id"], resource.attributes["enduser.id"])
                  - set(attributes["otel.ingest.client"], resource.attributes["otel.ingest.client"])

exporters:
    debug:
        verbosity: basic
    otlp_http/loki:
        endpoint: http://loki:3100/otlp
    otlp_http/tempo:
        endpoint: http://tempo:4318
    prometheus:
        endpoint: 0.0.0.0:9464
        # OTel SDKs aggregate histograms exponentially; the
        # classic text format would flatten them to a lone +Inf bucket
        # (histogram_quantile then always NaN). Emit them as Prometheus
        # native histograms so p95 panels work for every producer.
        send_native_histogram: true
        # A series whose producer stopped is dropped 2 minutes after its last
        # point (the default is 5): the SDKs export every 60 s, and the silence
        # rules see a stopped producer 3 minutes sooner (INC-04, the
        # 2026-11-05 rehearsal).
        metric_expiration: 2m

extensions:
    health_check:
    # Shared ingest secret for the service leg, compared against the
    # Authorization header. The stack's value is infra/keycloak/.env's
    # OTEL_COLLECTOR_INGEST_TOKEN (the same bearer Keycloak and the webapp's
    # edge carry on the legacy leg), which compose interpolates into the
    # container env from the stack's env-files (DD-669).
    bearertokenauth:
        tokens:
            - ${env:OTEL_COLLECTOR_INGEST_TOKEN}
    # Ingest validator (DD-193, browser leg; DD-196, per-service leg): verifies
    # the presented token against the issuer's keys and requires the
    # otel-collector audience the realm's otel-ingest scope mints.
    #
    # One issuer, read from a file (DD-675): every token this stack carries —
    # the browser's and every app's — is minted by the stack's own Keycloak at
    # its browser issuer, https://<STANDALONE_HOST>:9000/auth/realms/aurelius-atlas
    # (KC_HOSTNAME pins it, so the iss claim is that URL on every listener).
    # SPS-08: only this issuer_url derives from the host — the stack's compose
    # sets STANDALONE_HOST (default localhost) in the container's environment,
    # and confmap's env provider fills it at start. Discovery cannot run here:
    # the issuer's URL is the proxy's address, which no container can dial
    # in-network, and the JWKS extension dials it at start. So
    # public_keys_file replaces discovery — the jwks-fetch one shot
    # (docker/observability/compose.yaml) writes the realm's published keys to
    # the shared /jwks volume after Keycloak is healthy, and the extension
    # watches the file for changes.
    oidc:
        providers:
            - issuer_url: https://${env:STANDALONE_HOST}:9000/auth/realms/aurelius-atlas
              audience: otel-collector
              public_keys_file: /jwks/jwks.json

service:
    extensions: [health_check, bearertokenauth, oidc]
    # Internal telemetry (otelcol_* pipeline health) on 0.0.0.0 so
    # Prometheus (job otel-collector-internal) can scrape it — the default
    # binds to loopback, which is unreachable across containers.
    telemetry:
        metrics:
            readers:
                - pull:
                      exporter:
                          prometheus:
                              host: 0.0.0.0
                              port: 8888
    pipelines:
        traces:
            receivers: [otlp, otlp/services, otlp/legacy]
            processors: [resource, transform/identity, batch]
            exporters: [otlp_http/tempo, debug]
        metrics:
            receivers: [otlp, otlp/services, otlp/legacy]
            processors: [resource, transform/identity, transform/user_labels, batch]
            exporters: [prometheus, debug]
        logs:
            # Service legs only: no browser producer emits OTLP logs, and the
            # OIDC leg stays trace/metric-shaped (the SDK's signals).
            receivers: [otlp/services, otlp/legacy]
            processors: [resource, transform/identity, batch]
            exporters: [otlp_http/loki, debug]
