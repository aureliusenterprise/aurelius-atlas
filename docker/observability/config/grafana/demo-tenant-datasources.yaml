# The standalone Grafana's data sources on the demo tenant's indices: the store's Elasticsearch, signed in to
# as the read-only user grafana_demo_reader (the one shot `tenants` makes it), its certificate checked against
# the store's CA. Grafana filters every query on a data source's time field, so each index with one gets a data
# source of its own: the entities by their creation, the audit events by their time. The time fields are epoch
# milliseconds, which Elasticsearch ranges and histograms as dates.
apiVersion: 1

datasources:
    - name: Demo tenant - entities
      uid: demo-tenant-entities
      type: elasticsearch
      access: proxy
      url: https://elasticsearch:9200
      basicAuth: true
      basicAuthUser: grafana_demo_reader
      editable: false
      jsonData:
          index: aurelius-atlas-tenant-demo-entities
          timeField: createTime
          tlsAuthWithCACert: true
      secureJsonData:
          basicAuthPassword: ${GRAFANA_ES_READER_PASSWORD}
          tlsCACert: $__file{/etc/grafana/elasticsearch-certs/ca.pem}

    - name: Demo tenant - audit events
      uid: demo-tenant-audits
      type: elasticsearch
      access: proxy
      url: https://elasticsearch:9200
      basicAuth: true
      basicAuthUser: grafana_demo_reader
      editable: false
      jsonData:
          index: aurelius-atlas-tenant-demo-entity-audits
          timeField: timestamp
          tlsAuthWithCACert: true
      secureJsonData:
          basicAuthPassword: ${GRAFANA_ES_READER_PASSWORD}
          tlsCACert: $__file{/etc/grafana/elasticsearch-certs/ca.pem}
