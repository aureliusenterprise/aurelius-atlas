name: Publish Documentation (Main)

# Scope-split (CHT-102, pentest L6b): the public-docs pushers (main, tag,
# delete) serialize on one group; PR previews run per-PR elsewhere, so a
# preview's queue slot can no longer displace a main deploy.
concurrency:
    group: "docs-public"

# Default-deny: mike deploy --push writes the public-docs branch and needs
# contents:write; nothing else in this workflow needs a scope.
permissions:
    contents: write

on:
    push:
        branches:
            - main

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  python: "true"

            - name: Publish documentation for main branch
              run: |
                  REF_NAME=$REF
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  uv run mike deploy -b public-docs --push "$SANITIZED_REF_NAME"
              shell: bash
              env:
                  # Pass the ref through the environment so it is data, never
                  # shell code (${{ }} interpolation would execute $(...) in a
                  # branch name).
                  REF: ${{ github.ref_name }}
