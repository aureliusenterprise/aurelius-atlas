name: CI Canary (GKE)

# Phase 1 of docs/architecture/self-hosted-ci.md: prove the dev container
# pipeline mechanics on the ARC runner pool before the real CI job moves.
# Manual-only, runs-on the GKE pool label directly (not CI_RUNS_ON - the
# canary exists to test that target, hosted flips are its control). The gate
# is 5 consecutive green runs; then set the flag-day variables (infra/arc
# README) and the ci job moves. Delete this workflow in Phase 3.

on:
    # Push trigger (branch-scoped): workflow_dispatch needs the file on the
    # default branch, which PR 150 has not merged yet. Repeat runs = the
    # dispatch below, or an empty commit. Delete this workflow in Phase 3.
    workflow_dispatch:
    push:
        branches: [feat/validate-job-in-devcontainer]

permissions:
    contents: read
    packages: read

jobs:
    canary:
        runs-on: atlas-ci
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # GKE shape: no hosted toolchains to clean, no Actions cache
            # service (private repo + self-hosted), caches via the
            # toolchain-cache PVC mounted into the container.
            - name: Validate in the dev container on GKE
              uses: ./.github/actions/run-in-devcontainer
              with:
                  set-shas: "false"
                  disk-cleanup: "false"
                  use-actions-cache: "false"
                  cache-mounts: ${{ vars.CI_CACHE_MOUNTS }}
                  image-cache-dir: /home/runner/_work/.ci-cache/docker
                  # Mirrors CI_CACHE_MOUNTS targets: /work (the PVC) is the
                  # runner's _work dir, bind-mounted into the container at
                  # /var/cache/ci - OUTSIDE the checkout, so the next run's
                  # `git clean -ffdx` never touches the cache dirs.
                  cache-env: |
                      UV_CACHE_DIR=/var/cache/ci/uv
                      npm_config_cache=/var/cache/ci/npm
                      PRE_COMMIT_HOME=/var/cache/ci/pre-commit
                  run-cmd: uv run pre-commit run --all-files
