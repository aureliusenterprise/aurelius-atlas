name: CI Canary (AKS)

# Phase 1 of docs/architecture/self-hosted-ci.md: prove the dev container
# pipeline mechanics on the ARC runner pool before the real CI job moves.
# Manual-only, runs-on the AKS pool label directly (not CI_RUNS_ON - the
# canary exists to test that target, hosted flips are its control). The gate
# is 5 consecutive green runs; then set the flag-day variables (infra/arc
# README) and the ci job moves. Delete this workflow in Phase 3.

on:
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    canary:
        runs-on: atlas-ci
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # AKS shape: no hosted toolchains to clean, no Actions cache
            # service (private repo + self-hosted), caches via the
            # toolchain-cache PVC mounted into the container.
            - name: Validate in the dev container on AKS
              uses: ./.github/actions/run-in-devcontainer
              with:
                  set-shas: "false"
                  disk-cleanup: "false"
                  use-actions-cache: "false"
                  cache-mounts: ${{ vars.CI_CACHE_MOUNTS }}
                  run-cmd: uv run pre-commit run --all-files
