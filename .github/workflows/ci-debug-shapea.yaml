# TEMPORARY forensics (PR 150): the e2e databases boot on hosted runners,
# on Shape B, and in this devcontainer (proved locally: down -v + prune +
# up --wait = healthy), but a FRESH postgres container on the CI daemon
# exits on `mktemp -d /tmp/atlas-certs.XXXXXX` (EACCES) and fresh
# elasticsearch dies on /proc/self/coredump_filter (EACCES) - two
# write-permission anomalies on world-writable targets. ROOT CAUSES
# (round 3 matrix): (1) the dhi hardened postgres digest rolled to
# /tmp=2775 root:999 - uid 70 cannot write /tmp at all (local digest
# is the 1777 one - tag content differs per registry path); (2) the
# GKE node (Ubuntu 26.04, kernel 6.12.105+) exposes /proc/self/
# coredump_filter 644 root:root - ES 9.5 writes it unconditionally at
# bootstrap (upstream Elasticsearch.java), fatal after the entrypoint's
# root->1000 drop. "Databases used to start" = node auto-upgrade +
# image roll, both recent. Candidate fixes: tmpfs /tmp mode=1777
# (plain --tmpfs inherits the image's 2775 - round 3 B), fake
# coredump_filter bind-mount for ES. Round 4 validates both, plus the
# sysctl knob for the record. Delete after diagnosis.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    # A branch can't workflow_dispatch (needs the file on the default
    # branch); a push trigger on the workflow's own path is the lever -
    # pushing this file runs it.
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        env:
            # The pod exports SOPS_AGE_KEY_FILE (cache-init touches the
            # file); SOPS_AGE_KEY carries the key (as in ci.yaml).
            SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Daemon facts
              run: |
                  echo "### docker info (security)"
                  docker info 2>&1 | grep -iE "server version|security|userns|rootless|storage|cgroup" || true
                  echo "### /etc/docker/daemon.json"
                  cat /etc/docker/daemon.json 2>/dev/null || echo "(none)"
                  echo "### subuid/subgid"
                  cat /etc/subuid /etc/subgid 2>/dev/null || echo "(none)"
                  echo "### tmp mounts (host side)"
                  mount | grep -E " /tmp | /var/lib/docker | /var/lib/containerd " || true
                  echo "### id / kernel"
                  id
                  uname -a
                  echo "### node OS (docker info)"
                  docker info 2>&1 | grep -iE "operating system|kernel version" || true
                  echo "### apparmor"
                  cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "(no apparmor)"
                  echo "### runner-container probes (node-level writability)"
                  sh -c 'echo 0 > /proc/self/coredump_filter && echo coredump-filter: WRITABLE || echo coredump-filter: EACCES'
                  ls -ld /tmp

            # The compose stacks interpolate ${OTEL_*}/${DATABASE_*} from
            # the project .env - decrypted .env.enc (nx decrypt, sops).
            # Round 1 died here.
            # FIX CANDIDATES: postgres tmpfs mode=1777; ES fake
            # coredump_filter bind. || true everywhere.
            - name: Postgres fix probes
              continue-on-error: true
              run: |
                  PG=dhi.io/postgres:18-alpine3.23
                  PROBE='id; ls -ld /tmp; mktemp -d /tmp/atlas-certs.XXXXXX && echo mktemp:OK || echo mktemp:EACCES; install -m 600 /etc/hostname /tmp/srv.pem && echo install:OK || echo install:EACCES'
                  echo "### P1: facts on the CI digest"
                  docker run --rm --entrypoint sh $PG -c "$PROBE" || true
                  echo "### P2: tmpfs mode=1777 (candidate fix)"
                  docker run --rm --tmpfs /tmp:mode=1777,exec --entrypoint sh $PG -c "$PROBE" || true

            - name: Elasticsearch fix probes
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  echo 0x23 > probe-cf
                  chmod 666 probe-cf
                  echo "### E1: fake coredump_filter bind, as uid 1000"
                  docker run --rm --user 1000:1000 -v "$PWD/probe-cf:/proc/1/coredump_filter" \
                      --entrypoint bash $ES -c 'ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter && echo E1:WRITABLE || echo E1:EACCES' || true
                  echo "### E2: full ES boot with the bind (compose env, as user 0 like dev compose)"
                  docker run -d --name esprobe -u 0 -v "$PWD/probe-cf:/proc/1/coredump_filter" \
                      -e discovery.type=single-node -e xpack.security.enabled=false \
                      -e cluster.name=probe -e ES_JAVA_OPTS="-Xms512m -Xmx512m" $ES || true
                  sleep 45
                  docker logs esprobe 2>&1 | grep -oE '"message":"[^"]*(coredump|AccessDenied|started)[^"]*"' | head -3
                  docker rm -f esprobe >/dev/null 2>&1 || true
                  echo "### E3: sysctl knob for the record (privileged runner; node-wide, resets on reboot)"
                  sysctl -w fs.suid_dumpable=1 2>&1 | tail -1 || true
                  docker run --rm --user 1000:1000 --entrypoint bash $ES -c 'echo 0 > /proc/self/coredump_filter && echo E3:WRITABLE || echo E3:EACCES' || true
                  sysctl -w fs.suid_dumpable=0 >/dev/null 2>&1 || true
