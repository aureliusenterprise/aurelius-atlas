# TEMPORARY Shape A forensics (PR 150) — round 12: verify the OS fix.
#
# Rounds 1-11 root-caused the ES boot failure: COS 6.12.105+ nodes run a
# BPF-LSM policy that denies container processes the
# /proc/self/coredump_filter write ES 9.5 does at bootstrap (upstream
# elastic/elasticsearch#139589). The fix is the new atlas-ci node pool
# (UBUNTU_CONTAINERD, runner pinned via nodeSelector+toleration, kept
# warm by minRunners=1; the cluster autoscaler placed it in -b for the
# RWO cache PD). This round proves the databases boot on the Ubuntu
# node: plain ES, the ES compose stack (TLS, healthcheck), and the
# postgres compose stack (tmpfs /tmp fix, runs as uid 70).
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            - name: Where am I
              run: |
                  echo "### node / kernel (expect Ubuntu, not COS)"
                  grep -E "^PRETTY_NAME" /etc/os-release
                  uname -r
                  # The container gate on this node is dumpability, not
                  # bpflsm (kernel 6.8 predates it): the ES entrypoint
                  # starts as root and setuids to uid 1000, which clears
                  # the dumpable flag, and a non-dumpable process's
                  # /proc/self/coredump_filter stays root-owned 0644 =
                  # EACCES. suid_dumpable=2 keeps post-setuid processes
                  # dumpable. (COS ships =2 already - its denial was the
                  # 6.12 bpflsm one, immune to this knob: round 11.)
                  # Privileged container => this writes the NODE sysctl;
                  # dockerd's containers inherit it. The privileged runner
                  # pod itself is dumpable from exec (no setuid), which is
                  # why it always wrote the file fine.
                  sysctl -w fs.suid_dumpable=2
                  cat /proc/sys/fs/suid_dumpable
                  echo "### coredump_filter writable from a container?"
                  docker run --rm dhi.io/elasticsearch:9.5-debian13 \
                      sh -c 'echo 0x23 > /proc/self/coredump_filter && cat /proc/self/coredump_filter && echo WRITE-OK'

            - name: ES boots plain
              run: |
                  docker rm -f e12 >/dev/null 2>&1 || true
                  docker run -d --name e12 \
                      -e discovery.type=single-node -e xpack.security.enabled=false \
                      -e cluster.name=e12 -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
                      dhi.io/elasticsearch:9.5-debian13 >/dev/null
                  sleep 40
                  docker inspect -f 'state={{.State.Status}}' e12
                  docker logs e12 2>&1 |
                      grep -oE '"error\.(type|message)":"[^"]*"|"message":"started on[^"]*"' | head -4
                  docker rm -f e12 >/dev/null 2>&1 || true

            - name: ES compose stack (TLS + healthcheck)
              run: |
                  bash tools/tls/certgen.sh dev/elasticsearch
                  docker compose -f dev/elasticsearch/docker-compose.yaml \
                      up -d --wait elasticsearch
                  docker inspect -f 'es-compose health={{.State.Health.Status}}' \
                      "$(docker compose -f dev/elasticsearch/docker-compose.yaml ps -q elasticsearch)"
                  docker compose -f dev/elasticsearch/docker-compose.yaml down -v

            - name: Postgres compose stack (tmpfs fix)
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: |
                  npx nx run aurelius-atlas-dev-postgres:decrypt
                  docker compose -f dev/postgres/docker-compose.yaml up -d --wait postgres
                  PGC="$(docker compose -f dev/postgres/docker-compose.yaml ps -q postgres)"
                  docker inspect -f 'pg health={{.State.Health.Status}}' "$PGC"
                  docker exec "$PGC" sh -c 'ls -ld /tmp && psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tc "select 1"'
                  docker compose -f dev/postgres/docker-compose.yaml down -v

            - name: Cleanup
              if: always()
              run: |
                  docker compose -f dev/elasticsearch/docker-compose.yaml down -v 2>/dev/null || true
                  docker compose -f dev/postgres/docker-compose.yaml down -v 2>/dev/null || true
                  docker ps -aq --filter name=e12 | xargs -r docker rm -f
