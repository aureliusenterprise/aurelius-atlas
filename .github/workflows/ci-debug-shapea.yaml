# TEMPORARY Shape A forensics (PR 150) — round 14: the javaagent escape.
#
# Rounds 1-13 exhausted the environment: on GKE nodes (COS AND Ubuntu,
# every uid incl. init@1000, --privileged, --cgroup-parent
# kubepods.slice, apparmor/seccomp off, suid_dumpable=2) the procfs
# write ES 9.x does at bootstrap is denied for EVERY docker container,
# while the k8s runner pod is exempt (GKE's container lockdown;
# upstream elastic/elasticsearch#139589 closed not-planned: "the
# environment must allow the write"; 9.2.8/9.4.4 ship the same fatal
# write - no version escape).
#
# The setting is COSMETIC - it excludes file-backed pages from core
# dumps, and CI never collects core dumps. Only its FAILURE is fatal.
# The escape: a pure-JDK -javaagent that rewrites the path constant in
# Elasticsearch.class at load - "/proc/self/coredump_filter" (26
# bytes) -> "/tmp/coredump_filter.jvm12" (26 bytes, same length, no
# ASM needed): the write goes to a plain file on the container's tmpfs
# and succeeds; ES's bootstrap proceeds unchanged. Portable to every
# host (dev containers included - the redirect is harmless there).
#
# W1 builds the agent, W2 boots ES with it (expect "started on").
# If green: wire the agent into dev/elasticsearch + the store-es
# testcontainer helper (and the e2e compose stacks), then full ci.yaml.
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            - name: Build the agent
              run: |
                  which javac
                  bash tools/es-coredump-agent/build.sh
                  ls -la tools/es-coredump-agent/coredump-noop.jar

            - name: ES boots with the agent
              run: |
                  docker rm -f e14 >/dev/null 2>&1 || true
                  docker run -d --name e14 \
                      -v "$PWD/tools/es-coredump-agent/coredump-noop.jar:/agent/coredump-noop.jar:ro" \
                      -e discovery.type=single-node -e xpack.security.enabled=false \
                      -e cluster.name=e14 \
                      -e ES_JAVA_OPTS="-Xms512m -Xmx512m -javaagent:/agent/coredump-noop.jar" \
                      dhi.io/elasticsearch:9.5-debian13 >/dev/null
                  sleep 45
                  docker inspect -f 'e14 state={{.State.Status}}' e14
                  docker logs e14 2>&1 |
                      grep -oE '"error\.(type|message)":"[^"]*"|"message":"started on[^"]*"|Could not set coredump' | head -4
                  docker exec e14 sh -c 'ls -l /tmp/coredump_filter.jvm12 && cat /tmp/coredump_filter.jvm12' 2>/dev/null
                  docker rm -f e14 >/dev/null 2>&1 || true

            - name: Cleanup
              if: always()
              run: docker ps -aq --filter name=e14 | xargs -r docker rm -f
