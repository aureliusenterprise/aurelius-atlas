# TEMPORARY Shape A forensics (PR 150) — round 10: the AppArmor verdict.
#
# Theory (rounds 5-9): the ES bootstrap writes /proc/self/coredump_filter
# unconditionally (Files.writeString, catch -> fatal RuntimeException —
# bytecode-verified). On Shape A that write gets EACCES for uid 1000, and
# caps do NOT fix it (R8/R9). The node LSM order is
# capability,lockdown,yama,loadpin,safesetid,apparmor,bpf,ima with AppArmor
# enabled (Y). Docker's docker-default AppArmor profile denies writes under
# /proc/**. Every environment fits: k8s runner pod = privileged =
# apparmor unconfined (runner-side write OK, R5); CI containers =
# docker-default (EACCES); devcontainer dind = WSL2, apparmor absent
# (boots); hosted runners = docker seccomp-only (boots).
# Fix candidate = apparmor=unconfined (surgical, per-service).
# Matrix: plain, apparmor=unconfined, privileged. Full boots, 90s,
# report the fatal reason / started. Remove after diagnosis.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            - name: Elasticsearch apparmor matrix
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  boot() {
                      local name="$1"; shift
                      docker rm -f "$name" >/dev/null 2>&1 || true
                      docker run -d --name "$name" \
                          -e discovery.type=single-node \
                          -e xpack.security.enabled=false \
                          -e cluster.name="$name" \
                          -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
                          "$@" "$ES" >/dev/null 2>&1
                  }
                  probe() {
                      local name="$1"
                      echo "### $name (state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null))"
                      docker logs "$name" 2>&1 |
                          grep -oE '"error\.(type|message)":"[^"]*"|"message":"started on[^"]*"' |
                          head -4
                  }
                  echo "### AppArmor profile of a plain container"
                  docker run --rm --entrypoint cat "$ES" /proc/self/attr/current 2>&1; echo
                  echo "### AppArmor profile of apparmor=unconfined"
                  docker run --rm --security-opt apparmor=unconfined --entrypoint cat "$ES" /proc/self/attr/current 2>&1; echo
                  boot e-plain
                  boot e-unconfined --security-opt apparmor=unconfined
                  boot e-priv --privileged
                  echo "waiting 90s..."
                  sleep 90
                  probe e-plain
                  probe e-unconfined
                  probe e-priv

            - name: Cleanup
              if: always()
              run: docker rm -f e-plain e-unconfined e-priv 2>/dev/null; true
