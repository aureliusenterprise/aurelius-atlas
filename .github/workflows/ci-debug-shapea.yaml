# TEMPORARY forensics (PR 150): the e2e databases boot on hosted runners,
# on Shape B, and in this devcontainer (proved locally: down -v + prune +
# up --wait = healthy), but a FRESH postgres container on the CI daemon
# exits on `mktemp -d /tmp/atlas-certs.XXXXXX` (EACCES) and fresh
# elasticsearch dies on /proc/self/coredump_filter (EACCES) - two
# write-permission anomalies on world-writable targets, repro-free so
# far (the same sequence on this devcontainer = healthy). Facts so
# far: dockerd 29.9.2 on BOTH (local healthy / CI broken - daemon
# version ruled OUT); node kernel 6.12.105+ vs local 6.18 WSL2 - the
# ONLY delta: 6.12-era regressions fit both symptoms (procfs owner
# checks for non-dumpable processes = ES coredump_filter; overlayfs
# copy-up of the sticky /tmp bit = postgres mktemp). Round 3 = causal
# matrix, every probe || true (round 2 died bash -e before the probes):
# plain run vs --tmpfs /tmp vs setpriv-drop, as the container users.
# Delete after diagnosis.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    # A branch can't workflow_dispatch (needs the file on the default
    # branch); a push trigger on the workflow's own path is the lever -
    # pushing this file runs it.
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        env:
            # The pod exports SOPS_AGE_KEY_FILE (cache-init touches the
            # file); SOPS_AGE_KEY carries the key (as in ci.yaml).
            SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Daemon facts
              run: |
                  echo "### docker info (security)"
                  docker info 2>&1 | grep -iE "server version|security|userns|rootless|storage|cgroup" || true
                  echo "### /etc/docker/daemon.json"
                  cat /etc/docker/daemon.json 2>/dev/null || echo "(none)"
                  echo "### subuid/subgid"
                  cat /etc/subuid /etc/subgid 2>/dev/null || echo "(none)"
                  echo "### tmp mounts (host side)"
                  mount | grep -E " /tmp | /var/lib/docker | /var/lib/containerd " || true
                  echo "### id / kernel"
                  id
                  uname -a
                  echo "### node OS (docker info)"
                  docker info 2>&1 | grep -iE "operating system|kernel version" || true
                  echo "### apparmor"
                  cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "(no apparmor)"
                  echo "### runner-container probes (node-level writability)"
                  sh -c 'echo 0 > /proc/self/coredump_filter && echo coredump-filter: WRITABLE || echo coredump-filter: EACCES'
                  ls -ld /tmp

            # The compose stacks interpolate ${OTEL_*}/${DATABASE_*} from
            # the project .env - decrypted .env.enc (nx decrypt, sops).
            # Round 1 died here.
            # Causal matrix, no compose (no env/decrypt/healthcheck
            # surface). Each probe prints id + /tmp mode + the exact
            # failing writes. A=plain, B=--tmpfs /tmp (the candidate
            # fix), C=owner-drop (dumpable theory).
            - name: Postgres image matrix
              continue-on-error: true
              run: |
                  PG=dhi.io/postgres:18-alpine3.23
                  PROBE='id; ls -ld / /tmp; ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter 2>&1 && echo coredump:WRITABLE || echo coredump:EACCES; mktemp -d /tmp/atlas-certs.XXXXXX && echo mktemp:OK || echo mktemp:EACCES; echo x > /tmp/p && echo tmpfile:OK || echo tmpfile:EACCES'
                  echo "### A: plain run (image user)"
                  docker run --rm --entrypoint sh $PG -c "$PROBE" || true
                  echo "### B: --tmpfs /tmp (candidate fix)"
                  docker run --rm --tmpfs /tmp --entrypoint sh $PG -c "$PROBE" || true

            - name: Elasticsearch image matrix
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  PROBE='id; ls -ld /tmp; ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter 2>&1 && echo coredump:WRITABLE || echo coredump:EACCES; mktemp -d /tmp/atlas-certs.XXXXXX && echo mktemp:OK || echo mktemp:EACCES'
                  echo "### A: plain run (image user)"
                  docker run --rm --entrypoint bash $ES -c "$PROBE" || true
                  echo "### B: --tmpfs /tmp"
                  docker run --rm --tmpfs /tmp --entrypoint bash $ES -c "$PROBE" || true
                  echo "### C: root -> setpriv drop (dumpable theory)"
                  docker run --rm --user root --entrypoint bash $ES -c 'id; setpriv --reuid=1000 --regid=0 --clear-groups bash -c "id; echo 0 > /proc/self/coredump_filter 2>&1 && echo coredump:WRITABLE || echo coredump:EACCES"' || true
