# TEMPORARY Shape A forensics (PR 150) — round 11: name the denier.
#
# R10: plain ES container is apparmor=unconfined on this daemon; the
# privileged ES (uid 1000, ALL caps: DAC_OVERRIDE+SYS_PTRACE) dies the
# same "Could not set coredump filter". A denial that survives DAC
# bypass + ptrace caps + unconfined apparmor is an LSM below the
# capability check (COS runs bpflsm) OR the dumpability gate (the file
# is root:root 644 = the process is NON-DUMPABLE; untested knob:
# fs.suid_dumpable=2, which makes post-setuid transitions dumpable —
# R4 tried only =1). dmesg on this privileged runner will name the
# subsystem. Boot plain ES, capture dmesg, then suid_dumpable=2 + boot.
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            - name: Name the denier
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  echo "### node suid_dumpable / runner own proc file"
                  cat /proc/sys/fs/suid_dumpable
                  ls -l /proc/self/coredump_filter
                  grep -E "CapEff|Seccomp:" /proc/self/status
                  dmesg -C 2>/dev/null || true
                  docker rm -f e11a >/dev/null 2>&1 || true
                  docker run -d --name e11a \
                      -e discovery.type=single-node -e xpack.security.enabled=false \
                      -e cluster.name=e11a -e ES_JAVA_OPTS="-Xms512m -Xmx512m" "$ES" >/dev/null
                  sleep 40
                  echo "### dmesg after boot (denials)"
                  dmesg 2>/dev/null | tail -25
                  docker rm -f e11a >/dev/null 2>&1 || true
                  echo "### suid_dumpable=2, boot again"
                  sysctl -w fs.suid_dumpable=2
                  docker run -d --name e11b \
                      -e discovery.type=single-node -e xpack.security.enabled=false \
                      -e cluster.name=e11b -e ES_JAVA_OPTS="-Xms512m -Xmx512m" "$ES" >/dev/null
                  sleep 40
                  docker inspect -f 'e11b state={{.State.Status}}' e11b
                  docker logs e11b 2>&1 |
                      grep -oE '"error\.(type|message)":"[^"]*"|"message":"started on[^"]*"' | head -4
                  dmesg 2>/dev/null | tail -10
                  docker rm -f e11b >/dev/null 2>&1 || true
                  sysctl -w fs.suid_dumpable=0

            - name: Cleanup
              if: always()
              run: docker rm -f e11a e11b 2>/dev/null; sysctl -w fs.suid_dumpable=0 2>/dev/null; true
