# TEMPORARY Shape A forensics (PR 150) — round 8: the ES privilege matrix.
#
# The e2e Elasticsearch node dies at bootstrap on the CI daemon: the JVM
# writes /proc/self/coredump_filter unconditionally (Elasticsearch.java
# initializeNatives), and on the COS 6.12.105 node kernel procfs hands a
# uid-1000 process a root-owned 644 coredump_filter (R5/R7) — EACCES, fatal.
# Root is refused by the JVM ("can not run elasticsearch as root", verified
# locally); R7's --privileged-as-uid-1000 did NOT bypass the gate. The
# gate is a procfs ptrace_may_access + DAC check, so the minimal candidates
# are capabilities: CAP_SYS_PTRACE (bypasses ptrace_may_access on the proc
# open) and CAP_DAC_OVERRIDE (bypasses the write's DAC check). Full boots,
# grep the log for "started" (healthy) vs the coredump fatal.
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            # A full single-node boot; report started vs the coredump fatal.
            - name: Elasticsearch privilege matrix
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  boot() { # name, extra flags...
                      local name="$1"; shift
                      docker rm -f "$name" >/dev/null 2>&1 || true
                      docker run -d --name "$name" \
                          -e discovery.type=single-node \
                          -e xpack.security.enabled=false \
                          -e cluster.name="$name" \
                          -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
                          "$@" "$ES" >/dev/null 2>&1
                  }
                  probe() { # name -> prints started/fatal
                      local name="$1"
                      local line
                      line=$(docker logs "$name" 2>&1 |
                          grep -oE '"message":"[^"]*(coredump|AccessDenied|started on|can not run elasticsearch as root|fatal exception)[^"]*"' |
                          head -1)
                      echo "### $name: ${line:-<no signal yet>} (state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null))"
                  }
                  boot e-plain
                  boot e-sysptrace --cap-add SYS_PTRACE
                  boot e-dacoverride --cap-add DAC_OVERRIDE
                  boot e-both --cap-add SYS_PTRACE --cap-add DAC_OVERRIDE
                  boot e-priv --privileged
                  echo "waiting 60s for bootstrap..."
                  sleep 60
                  probe e-plain
                  probe e-sysptrace
                  probe e-dacoverride
                  probe e-both
                  probe e-priv

            - name: Cleanup
              if: always()
              run: docker rm -f e-plain e-sysptrace e-dacoverride e-both e-priv 2>/dev/null; true
