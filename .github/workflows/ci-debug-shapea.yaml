# TEMPORARY Shape A forensics (PR 150) — round 9: ES fatal REASONS.
#
# Round 8: every privilege variant (plain, SYS_PTRACE, DAC_OVERRIDE, both,
# privileged) exits with "fatal exception while booting Elasticsearch" —
# the probe truncated the message, so the reason per variant is unknown
# (e-priv's is expected to be "can not run elasticsearch as root"; the
# others: coredump_filter AccessDeniedException, or a SYS_BOOT/seccomp
# refusal the caps introduce). Print each container's error.message.
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            - name: Elasticsearch fatal reasons
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  boot() {
                      local name="$1"; shift
                      docker rm -f "$name" >/dev/null 2>&1 || true
                      docker run -d --name "$name" \
                          -e discovery.type=single-node \
                          -e xpack.security.enabled=false \
                          -e cluster.name="$name" \
                          -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
                          "$@" "$ES" >/dev/null 2>&1
                  }
                  probe() {
                      local name="$1"
                      echo "### $name (state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null))"
                      docker logs "$name" 2>&1 |
                          grep -oE '"error\.(type|message)":"[^"]*"' |
                          head -4
                  }
                  echo "### node security facts"
                  cat /sys/kernel/security/lsm 2>/dev/null; echo
                  cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "apparmor: (absent)"
                  uname -r
                  echo "### ES uid-1000 process facts (image user, plain)"
                  docker run --rm --entrypoint sh "$ES" -c 'ls -l /proc/self/coredump_filter; grep -E "CapEff|Seccomp|NoNewPrivs" /proc/self/status; id' 2>&1
                  boot e-plain
                  boot e-sysptrace --cap-add SYS_PTRACE
                  boot e-dacoverride --cap-add DAC_OVERRIDE
                  boot e-both --cap-add SYS_PTRACE --cap-add DAC_OVERRIDE
                  boot e-priv --privileged
                  echo "waiting 45s..."
                  sleep 45
                  probe e-plain
                  probe e-sysptrace
                  probe e-dacoverride
                  probe e-both
                  probe e-priv

            - name: Cleanup
              if: always()
              run: docker rm -f e-plain e-sysptrace e-dacoverride e-both e-priv 2>/dev/null; true
