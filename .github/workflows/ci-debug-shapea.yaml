# TEMPORARY forensics (PR 150): the e2e databases boot on hosted runners,
# on Shape B, and in this devcontainer (proved locally: down -v + prune +
# up --wait = healthy), but a FRESH postgres container on the CI daemon
# exits on `mktemp -d /tmp/atlas-certs.XXXXXX` (EACCES) and fresh
# elasticsearch dies on /proc/self/coredump_filter (EACCES) - two
# write-permission anomalies on world-writable targets. ROOT CAUSES
# (round 3): (1) the dhi hardened postgres digest rolled to /tmp=2775
# root:999 - uid 70 cannot write /tmp; FIX VALIDATED (round 4 P2):
# tmpfs /tmp mode=1777 -> all writes OK. (2) kernel 6.12.105+ (COS,
# dumpability-inheritance series): docker container processes are
# non-dumpable there, and coredump_filter writes require dumpable ->
# ES 9.5's unconditional bootstrap write (Elasticsearch.java) is fatal
# as uid 1000. Round-4 kills: /proc bind (runc proc-safety),
# fs.suid_dumpable=1 (no effect). ES refuses to run as root (upstream
# check), so the remaining lever is PRIVILEGED: capabilities preserved
# -> the kernel gate passes. Round 5: E1 full ES boot as image user +
# --privileged, E2 same plain (expected fatal), E3 root-refusal check.
# Delete after diagnosis.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    # A branch can't workflow_dispatch (needs the file on the default
    # branch); a push trigger on the workflow's own path is the lever -
    # pushing this file runs it.
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        env:
            # The pod exports SOPS_AGE_KEY_FILE (cache-init touches the
            # file); SOPS_AGE_KEY carries the key (as in ci.yaml).
            SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Daemon facts
              run: |
                  echo "### docker info (security)"
                  docker info 2>&1 | grep -iE "server version|security|userns|rootless|storage|cgroup" || true
                  echo "### /etc/docker/daemon.json"
                  cat /etc/docker/daemon.json 2>/dev/null || echo "(none)"
                  echo "### subuid/subgid"
                  cat /etc/subuid /etc/subgid 2>/dev/null || echo "(none)"
                  echo "### tmp mounts (host side)"
                  mount | grep -E " /tmp | /var/lib/docker | /var/lib/containerd " || true
                  echo "### id / kernel"
                  id
                  uname -a
                  echo "### node OS (docker info)"
                  docker info 2>&1 | grep -iE "operating system|kernel version" || true
                  echo "### apparmor"
                  cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "(no apparmor)"
                  echo "### runner-container probes (node-level writability)"
                  sh -c 'echo 0 > /proc/self/coredump_filter && echo coredump-filter: WRITABLE || echo coredump-filter: EACCES'
                  ls -ld /tmp

            # The compose stacks interpolate ${OTEL_*}/${DATABASE_*} from
            # the project .env - decrypted .env.enc (nx decrypt, sops).
            # Round 1 died here.
            # FIX CANDIDATES. P = postgres tmpfs (validated P2 round
            # 4). E = ES boot privilege matrix. || true everywhere.
            - name: Postgres fix probes
              continue-on-error: true
              run: |
                  PG=dhi.io/postgres:18-alpine3.23
                  PROBE='id; ls -ld /tmp; mktemp -d /tmp/atlas-certs.XXXXXX && echo mktemp:OK || echo mktemp:EACCES; install -m 600 /etc/hostname /tmp/srv.pem && echo install:OK || echo install:EACCES'
                  echo "### P1: facts on the CI digest"
                  docker run --rm --entrypoint sh $PG -c "$PROBE" || true
                  echo "### P2: tmpfs mode=1777 (candidate fix)"
                  docker run --rm --tmpfs /tmp:mode=1777,exec --entrypoint sh $PG -c "$PROBE" || true

            - name: Elasticsearch privilege probes
              continue-on-error: true
              run: |
                  ES=dhi.io/elasticsearch:9.5-debian13
                  ENV='-e discovery.type=single-node -e xpack.security.enabled=false -e cluster.name=probe -e ELASTIC_PASSWORD=probe -e ES_JAVA_OPTS=-Xms512m -Xmx512m'
                  echo "### E0: coredump_filter owner+write, default vs seccomp=unconfined (the docker default seccomp profile blocks prctl(PR_SET_DUMPABLE); procfs coredump_filter ownership follows dumpability)"
                  docker run --rm --entrypoint sh $ES -c 'ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter && echo DEFAULT-SECCOMP:WRITABLE || echo DEFAULT-SECCOMP:EACCES' 2>&1 | tail -2
                  docker run --rm --security-opt seccomp=unconfined --entrypoint sh $ES -c 'ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter && echo UNCONFINED:WRITABLE || echo UNCONFINED:EACCES' 2>&1 | tail -2
                  echo "### E0b: RLIMIT_CORE=0 theory - COS runs containers with core limit 0; kernels 6.11+ mark RLIMIT_CORE=0 processes NON-DUMPABLE (procfs coredump_filter -> root:root 644). ulimit -c unlimited should restore writability:"
                  docker run --rm --ulimit core=0:0 --entrypoint sh $ES -c 'ulimit -c; ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter && echo CORE0:WRITABLE || echo CORE0:EACCES' 2>&1 | tail -3
                  docker run --rm --ulimit core=-1:-1 --entrypoint sh $ES -c 'ulimit -c; ls -l /proc/self/coredump_filter; echo 0 > /proc/self/coredump_filter && echo COREINF:WRITABLE || echo COREINF:EACCES' 2>&1 | tail -3
                  echo "### E1: image user + --privileged (full boot)"
                  docker run -d --name e1 $ENV --privileged $ES >/dev/null
                  sleep 50
                  docker logs e1 2>&1 | grep -oE '"message":"[^"]*(coredump|AccessDenied|started|started on)[^"]*"' | head -2
                  docker rm -f e1 >/dev/null
                  echo "### E1b: full boot, seccomp=unconfined (lighter than privileged)"
                  docker run -d --name e1b $ENV --security-opt seccomp=unconfined $ES >/dev/null
                  sleep 50
                  docker logs e1b 2>&1 | grep -oE '"message":"[^"]*(coredump|AccessDenied|started)[^"]*"' | head -2
                  docker rm -f e1b >/dev/null
                  echo "### E2: image user plain (expect fatal)"
                  docker run -d --name e2 $ENV $ES >/dev/null
                  sleep 30
                  docker logs e2 2>&1 | grep -oE '"message":"[^"]*(coredump|AccessDenied|started)[^"]*"' | head -2
                  docker rm -f e2 >/dev/null
                  echo "### E4: full boot with --ulimit core=-1 (the predicted fix)"
                  docker run -d --name e4 $ENV --ulimit core=-1:-1 $ES >/dev/null
                  sleep 50
                  docker logs e4 2>&1 | grep -oE '"message":"[^"]*(coredump|AccessDenied|started)[^"]*"' | head -2
                  docker rm -f e4 >/dev/null
                  echo "### E3: root refusal check"
                  docker run --rm --user 0 --entrypoint sh $ES -c 'echo root-exec-ok' 2>&1 | tail -1
