# TEMPORARY Shape A forensics (PR 150) — round 7: validate the two fixes.
#
# Root causes (rounds 2-6, all on a FRESH container, warm PVC store):
#   postgres: container /tmp = 2775 root:999 (setgid, our docker gid),
#     uid 70 can't mktemp. The TLS entrypoint's `mktemp -d
#     /tmp/atlas-certs.XXXXXX` EACCES. R4 proved `--tmpfs /tmp:mode=1777`
#     makes /tmp = 1777 root:root.
#   elasticsearch: COS 6.12.105 kernel has /proc/self/coredump_filter =
#     644 root:root; ES 9.5 writes 0x23 unconditionally at bootstrap
#     (Elasticsearch.java) → fatal AccessDeniedException. R4 proved
#     `--privileged` boots clean (4.6s).
# This round runs the REAL production commands (the tls.py startup as
# uid 70; a real ES boot) behind the candidate fixes, + store forensics.
# Remove once the e2e databases boot in ci.yaml.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        steps:
            - uses: actions/checkout@v6

            # FIX CANDIDATE 1 — postgres. Exact _TLS_STARTUP_COMMAND
            # (mktemp -d + install -m 600) as uid 70, behind
            # `--tmpfs /tmp:mode=1777`. Control = same command, no tmpfs.
            - name: Postgres TLS-startup fix (tmpfs /tmp:mode=1777)
              continue-on-error: true
              run: |
                  docker rm -f pfix pctl 2>/dev/null || true
                  SIM='d=$(mktemp -d /tmp/atlas-certs.XXXXXX) && install -m 600 /dev/null "$d/server.pem" && install -m 600 /dev/null "$d/server-key.pem" && echo "CERTS-SIM-OK $d"'
                  echo "### FIX (--tmpfs /tmp:mode=1777)"
                  docker run -d --name pfix --tmpfs /tmp:mode=1777 \
                      -e POSTGRES_PASSWORD=atlas dhi.io/postgres:18-alpine3.23
                  sleep 6
                  docker exec -u 70 pfix sh -c "$SIM" 2>&1
                  echo "### CONTROL (no tmpfs)"
                  docker run -d --name pctl \
                      -e POSTGRES_PASSWORD=atlas dhi.io/postgres:18-alpine3.23
                  sleep 6
                  docker exec -u 70 pctl sh -c 'ls -ld /tmp' 2>&1
                  docker exec -u 70 pctl sh -c "$SIM" 2>&1

            # FIX CANDIDATE 2 — elasticsearch. Real dev config boot with
            # `--privileged` + user 0 (as the compose stack runs), verify
            # the coredump_filter write + JVM start. Control = no privilege.
            - name: Elasticsearch boot fix (privileged)
              continue-on-error: true
              run: |
                  docker rm -f efix ectl 2>/dev/null || true
                  echo "### coredump_filter write, uid 1000, privileged"
                  docker run --rm --privileged --user 1000 \
                      --entrypoint sh dhi.io/elasticsearch:9.5-debian13 \
                      -c 'ls -l /proc/self/coredump_filter; echo 0x23 > /proc/self/coredump_filter && echo WRITE-OK || echo WRITE-EACCES' 2>&1
                  echo "### coredump_filter write, uid 1000, plain"
                  docker run --rm --user 1000 \
                      --entrypoint sh dhi.io/elasticsearch:9.5-debian13 \
                      -c 'echo 0x23 > /proc/self/coredump_filter && echo WRITE-OK || echo WRITE-EACCES' 2>&1

            - name: Store forensics (setgid on the PVC daemon stores)
              continue-on-error: true
              run: |
                  echo "### setgid dirs in daemon stores (depth 4)"
                  find /var/lib/docker /var/lib/containerd -maxdepth 4 -perm -2000 -type d 2>/dev/null | head -8
                  echo "### store + ci-cache dir modes"
                  ls -ld /var/lib/docker /var/lib/containerd 2>/dev/null
                  ls -ld /work/.ci-cache /work/.ci-cache/docker /work/.ci-cache/containerd 2>/dev/null

            - name: Cleanup
              if: always()
              run: docker rm -f pfix pctl 2>/dev/null; true
