# TEMPORARY forensics (PR 150): the e2e databases boot on hosted runners,
# on Shape B, and in this devcontainer (proved locally: down -v + prune +
# up --wait = healthy), but a FRESH postgres container on the CI daemon
# exits on `mktemp -d /tmp/atlas-certs.XXXXXX` (EACCES) and fresh
# elasticsearch dies on /proc/self/coredump_filter (EACCES) - two
# write-permission anomalies on world-writable targets, repro-free so
# far (the same sequence on this devcontainer = healthy). Round-1
# facts: dockerd 29.9.2, Security Options: cgroupns only, daemon.json
# empty, no userns-remap; round 1 then died on compose env
# interpolation - the pipeline decrypts .env.enc (nx decrypt), this job
# must too. Round 2: decrypt, boot both stacks, probe the exact writes
# INSIDE the containers, node OS/AppArmor facts. Delete after
# diagnosis.
name: CI Debug (Shape A forensics)

on:
    workflow_dispatch:
    # A branch can't workflow_dispatch (needs the file on the default
    # branch); a push trigger on the workflow's own path is the lever -
    # pushing this file runs it.
    push:
        paths:
            - .github/workflows/ci-debug-shapea.yaml

permissions:
    contents: read

jobs:
    debug:
        runs-on: atlas-ci-shapea
        env:
            # The pod exports SOPS_AGE_KEY_FILE (cache-init touches the
            # file); SOPS_AGE_KEY carries the key (as in ci.yaml).
            SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Daemon facts
              run: |
                  echo "### docker info (security)"
                  docker info 2>&1 | grep -iE "server version|security|userns|rootless|storage|cgroup" || true
                  echo "### /etc/docker/daemon.json"
                  cat /etc/docker/daemon.json 2>/dev/null || echo "(none)"
                  echo "### subuid/subgid"
                  cat /etc/subuid /etc/subgid 2>/dev/null || echo "(none)"
                  echo "### tmp mounts (host side)"
                  mount | grep -E " /tmp | /var/lib/docker | /var/lib/containerd " || true
                  echo "### id / kernel"
                  id
                  uname -a
                  echo "### node OS (docker info)"
                  docker info 2>&1 | grep -iE "operating system|kernel version" || true
                  echo "### apparmor"
                  cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "(no apparmor)"
                  echo "### runner-container probes (node-level writability)"
                  sh -c 'echo 0 > /proc/self/coredump_filter && echo coredump-filter: WRITABLE || echo coredump-filter: EACCES'
                  ls -ld /tmp

            # The compose stacks interpolate ${OTEL_*}/${DATABASE_*} from
            # the project .env - decrypted .env.enc (nx decrypt, sops).
            # Round 1 died here.
            - name: Decrypt envs
              run: |
                  find . -name .env.enc -not -path "*/node_modules/*" \
                      -not -path "*/.venv/*" |
                      while read -r f; do
                          sops decrypt --input-type=dotenv --output-type=dotenv \
                              --output="${f%.enc}" "$f"
                      done
                  grep -c . dev/observability/.env

            - name: Reproduce postgres boot
              run: |
                  cd dev/observability && docker compose up -d
                  cd ../postgres
                  docker compose up -d 2>&1 | tail -5
                  sleep 10
                  docker compose ps
                  echo "### postgres logs"
                  docker compose logs postgres 2>&1 | grep -vE "metrics|otelcol" | tail -10
                  echo "### container facts"
                  C=$(docker compose ps -q postgres)
                  docker inspect "$C" \
                      --format 'CMD={{json .Config.Cmd}}
                      ENTRY={{json .Config.Entrypoint}}
                      USER={{.Config.User}}
                      SECOPT={{json .HostConfig.SecurityOpt}}
                      PRIV={{.HostConfig.Privileged}}
                      TMP={{json .HostConfig.Tmpfs}}
                      MOUNTS={{json .Mounts}}'
                  echo "### inside the container: writability probes"
                  docker exec "$C" ls -ld / /tmp 2>&1 || true
                  docker exec "$C" sh -c 'id
                  mktemp -d /tmp/atlas-certs.XXXXXX; echo mktemp-rc=$?
                  echo x > /tmp/probe && echo plain-file-rc=0 || echo plain-file-rc=$?
                  touch /probe-in-root && echo rootfs-write-rc=0 || echo rootfs-write-rc=$?' 2>&1 || true
                  docker exec "$C" cat /proc/mounts 2>&1 | grep -E " /tmp| / " || true

            # ES's boot dies writing /proc/self/coredump_filter (EACCES).
            # Same probe from the ES container, as the ES user.
            - name: Reproduce elasticsearch boot
              run: |
                  cd dev/elasticsearch
                  docker compose up -d 2>&1 | tail -3
                  sleep 20
                  docker compose ps --format '{{.Name}} {{.Status}}'
                  docker compose logs elasticsearch 2>&1 |
                      grep -oE '"message":"[^"]*(coredump|AccessDenied)[^"]*"' | head -2 || true
                  C=$(docker compose ps -q elasticsearch)
                  docker exec "$C" sh -c 'id
                  echo 0 > /proc/self/coredump_filter 2>/dev/null && echo coredump: WRITABLE || echo coredump: EACCES
                  mktemp -d /tmp/atlas-certs.XXXXXX; echo mktemp-rc=$?' 2>&1 || true
                  docker inspect "$C" --format 'USER={{.Config.User}}
                  SECOPT={{json .HostConfig.SecurityOpt}}' || true
