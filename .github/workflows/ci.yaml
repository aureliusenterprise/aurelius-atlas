name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    # Every job below runs in the dev container image (the bridge toward
    # self-hosted runners - see docs/architecture/self-hosted-ci.md). The
    # run-in-devcontainer action wraps devcontainers/ci with the shared cache
    # layout, registry logins, and secret passthrough; job commands live in
    # .devcontainer/*.sh so they stay runnable locally.
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read
            # Pull the dev container image from GHCR.
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Run pre-commit hooks in the dev container
              uses: ./.github/actions/run-in-devcontainer
              with:
                  set-shas: "false"
                  run-cmd: uv run pre-commit run --all-files

    test:
        runs-on: ubuntu-latest
        needs: validate
        timeout-minutes: 60

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # e2e tests drive Docker containers; inside the dev container they
            # run on the docker-in-docker feature's daemon (started by its
            # docker-init entrypoint), exactly as in a developer container -
            # the hosted runner's daemon is not involved. Failure diagnostics
            # are collected by the script, against that daemon.
            - name: Test affected projects
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  ghcr-login: "true"
                  docker-image-cache: "true"
                  disk-cleanup: "true"
                  run-cmd: bash .devcontainer/test-ci.sh

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

    build-and-scan:
        runs-on: ubuntu-latest
        needs: validate
        timeout-minutes: 60

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Images build on the dev container's DinD daemon; the buildx
            # type=gha cache (tools/plugins/docker.ts) needs the job's runtime
            # token, exposed into the container via the runtime-token step.
            # Build and scan share ONE container run: the scan reads the
            # images from the daemon that built them, and a second container
            # would start with an empty one.
            - name: Build and scan docker images for affected projects
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  ghcr-login: "true"
                  use-runtime-token: "true"
                  docker-image-cache: "true"
                  disk-cleanup: "true"
                  run-cmd: |
                      npx nx affected -t docker-build -c ci &&
                          npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

    sonar:
        runs-on: ubuntu-latest
        needs: [test, build-and-scan]
        timeout-minutes: 30

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Downloaded into the checkout BEFORE the container starts - the
            # container mounts the checkout, so sonar-scanner finds them.
            - name: Download coverage reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            # Decrypt every project, not just the affected ones: with task-based affected,
            # decrypt only counts as affected when .env.enc changes, and a .env that the
            # sonar run decrypts itself is written after Nx has loaded the task env, so
            # sonar-scanner would run without SONAR_TOKEN ("Not authorized").
            # Decrypt and analyze in ONE container run: the decrypted .env files live in
            # the mounted checkout and must still be there when sonar-scanner starts.
            - name: Run SonarQube analysis
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  run-cmd: |
                      npx nx run-many -t decrypt
                      npx nx affected -t sonar

    chromatic:
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 30

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Chromatic only publishes aurelius-atlas-ui's Storybook, so skip
            # the build when the UI (or its dependencies) are not affected.
            # The build runs in the dev container; dist/ lands in the mounted
            # checkout, where the upload step below finds it. The upload stays
            # a host step - chromaui/action's own semantics (exit codes,
            # auto-accept) are unchanged.
            - name: Build Storybook in the dev container
              id: build
              uses: ./.github/actions/run-in-devcontainer
              with:
                  run-cmd: bash .devcontainer/chromatic-check.sh

            - name: Run Chromatic
              if: ${{ steps.build.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  # Pre-built in the dev container - no buildCommand: the
                  # action uploads outputDir as-is when no build command is set.
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
