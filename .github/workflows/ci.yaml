name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    # The whole pipeline in ONE job, running DIRECTLY in the dev container
    # image (ghcr.io/aureliusenterprise/atlas-ci-runner - the runner pod's
    # job container IS that image; infra/arc). No devcontainers/ci wrapper,
    # no sibling container, no per-job image pull: the steps below run in
    # the image developers use, on the GKE pool (docs/architecture/
    # self-hosted-ci.md, self-hosted-ci-decision.md option D).
    #
    # Fail-fast order (one container, one dockerd, one PVC work dir), one
    # named step per phase so the log reads as the pipeline:
    #
    #   validate -> decrypt -> test + docker build -> teardown -> scan ->
    #   sonar ∥ storybook -> chromatic
    #
    # e2e containers, built images, and reports all live on the same daemon
    # / work volume, so later steps read what earlier steps wrote - the
    # scan needs no image export (teardown keeps images), sonar finds
    # coverage and sarif in place, Chromatic finds Storybook's dist/.
    #
    # Tear-down runs right after the tests: the e2e stacks (Keycloak,
    # Postgres, Elasticsearch, observability) would otherwise hold their
    # memory through the whole build/scan/sonar tail. External services run
    # last and only when warranted: SonarQube is the pipeline's final
    # step, Chromatic is gated on the Storybook probe - and a failing
    # pipeline fails the job, so neither is reached.
    ci:
        # The Shape A pool (infra/arc/arc-shapea-values.yaml). Hard-coded:
        # the pool is the dev container image, not a generic runner label;
        # reverting to hosted runners is a git revert, not a variable flip
        # (the CI_* flag-day variables retired with the devcontainers/ci
        # wrapper).
        runs-on: atlas-ci-shapea
        timeout-minutes: 60

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            # EPHEMERAL TREE (the GitHub-hosted model): actions/checkout's
            # DEFAULT clean (git clean -ffdx + git reset --hard) sanitizes
            # the previous job's tree - node_modules, .venv, coverage, dist,
            # diagnostics all wiped. Nothing in the tree persists BY
            # DESIGN. The warm tree saved only ~70s of install (npm 47s +
            # uv ~20s, from caches that live on PVC subPaths OUTSIDE the
            # tree) and caused every warm-tree bug of the Shape A trial
            # week: root-owned dirs from e2e bind mounts breaking checkout
            # (EACCES rmdir), staged diagnostics surviving `git clean` and
            # failing pre-commit (40228013569), the SOPS_AGE_KEY_FILE
            # dance. Caches outside, tree disposable.
            # fetch-depth 0: nx-set-shas / nx affected need history.
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # ~47s cold npm install (measured) -> ~10s restore. Keyed on
            # every lockfile; restore-keys fall back to the newest lock
            # version. zstd falls back to gzip (no zstd in the runner
            # image) - fine at this scale. Split restore/save (the
            # save-always input is deprecated and demonstrably inert:
            # run 40279621021's failure skipped "Post Cache node_modules",
            # so the cache was never saved and every run paid the cold
            # install). The save step below runs with if: always().
            - name: Restore node_modules
              id: restore-node-modules
              uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-modules-

            # .venv is NOT cached: uv sync is ~20s with the uv download
            # cache already on a PVC, and a restored .venv hard-codes the
            # job workdir in its script shebangs, which changes per pod.

            # Affected baseline for nx affected. The runner exports no
            # GITHUB_TOKEN by default, so pass it explicitly.
            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Dev container onCreateCommand - the pipeline needs the
            # workspace installed (npm.sh + uv.sh verbatim, the Shape A
            # contract). postCreateCommand scripts are deliberately not
            # run: pre-commit.sh installs git hooks (CI runs pre-commit
            # explicitly, in the pipeline) and sops.sh runs `nx keygen`, a
            # dev-machine bootstrap - in CI the key arrives through the
            # environment (SOPS_AGE_KEY below).
            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            # Save even when a later step fails: node_modules is
            # cache-worthy the moment npm ci finishes - gating the save on
            # a green pipeline delays the restore hit by every failing
            # run (the deprecated save-always input never fired at all).
            # Skipped when the restore HIT: cache/save re-uploads
            # unconditionally - a hit costs ~40s of re-upload every run
            # (runs 40468045053/40471177041: 9s restore, 40s save).
            - name: Save node_modules
              if: always() && steps.restore-node-modules.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: node_modules
                  key: ${{ steps.restore-node-modules.outputs.cache-primary-key }}

            - name: Validate pre-commit
              run: uv run pre-commit run --all-files

            # Registry logins against the container's OWN dockerd (the
            # docker-in-docker feature starts it at pod boot). dhi.io = the
            # hardened base images; ghcr.io = buildcache push (needs
            # packages:write, hence the scope on this job).
            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Decrypt every project, not just the affected ones - the e2e
            # stacks read the per-project .env, and sonar needs SONAR_TOKEN.
            # Key scoped to this step.
            - name: Decrypt project env
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            # The test phase: the affected unit + e2e suites. Every step
            # runs in the SAME container on the SAME dockerd, so the
            # diagnostics and teardown steps see exactly what the suites
            # left behind. Cache env + PATH come from the pod's container
            # command; SOPS_AGE_KEY stays as a safeguard - a test run
            # re-executes `decrypt` when a .env.enc is in the affected set.
            # Note on durations: the task graph runs e2e suites concurrently
            # on this runner, so per-test times in the junit reports are
            # inflated by CPU contention (a 7s Playwright test can record
            # 80s+). Read them as relative, not absolute; total wall time is
            # what the job optimises (DD-225 audit).
            #
            # docker-build rides the same graph: image builds depend on
            # source, not on tests, and the daemon is warm - serialising them
            # behind the whole test step was a free minute of wall time.
            # --parallel=5: Nx's default (3) left the 6-CPU container idle
            # (run 40471177041: 9m22s recoverable, Nx's own recommendation);
            # one CPU stays headroom for the e2e stacks' containers, which
            # share this cgroup.
            - name: Run unit and integration tests
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t test e2e docker-build -c ci --parallel=5

            # Collect container logs and status for debugging failed tests
            - name: Collect failure diagnostics
              if: failure()
              run: |
                  mkdir -p reports/failure-diagnostics
                  docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
                    > reports/failure-diagnostics/container-status.txt 2>&1 || true
                  for project in $(docker compose ls --all -q); do
                    echo "Collecting logs for project: $project"
                    docker compose --project-name "$project" logs --no-color \
                      > "reports/failure-diagnostics/${project}-logs.txt" 2>&1 || true
                  done

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

            # Coverage reports are generated by the test step and uploaded here
            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            # Tear the e2e stacks down as soon as the tests are done:
            # Keycloak/Postgres/Elasticsearch/observability hold ~8 Gi of
            # the node's memory, and the scan/sonar tail does not need
            # them. Containers/volumes go, IMAGES stay - the scan reads
            # them from this daemon, and the daemon store is warm on the
            # PVC by design (base layers are the point of it). Deleting
            # containers also forecloses compose reusing a stopped one
            # verbatim, command baked with the previous commit (run
            # 40231127680: postgres died on a 2h-old pre-fix container).
            # if: always() sweeps on failure/cancel/timeout;
            # continue-on-error: cleanup must never flip the verdict.
            - name: Tear down test containers
              if: always()
              continue-on-error: true
              run: |
                  docker container prune -f
                  docker volume prune -af

            # Trivy scans the SBOM of every app image - built in the test
            # step's graph (docker-build: e2e stacks build some apps as a
            # dependency, not every affected app has an e2e, so the target
            # names them all; GHCR buildcache tags keep them near-instant on
            # the warm daemon, tools/plugins/docker.ts).
            # docker-vuln-scan -> docker-sbom -> the image on this daemon.
            - name: Scan for vulnerabilities
              run: npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            # The Storybook build Chromatic publishes - only when the UI
            # (or its dependencies) are affected. dist/ lands in the
            # mounted checkout, where the Chromatic step uploads it. The
            # --graph=stdout probe keeps the step a no-op (not a green
            # lie) when the task is out of scope.
            #
            # Launched in the BACKGROUND, under the sonar step: sonar is
            # 85% queue-wait on the SonarQube server (run 40471177041:
            # 13m28s, critical path 2m4s), so the scanner barely uses the
            # node while storybook's compiler does - the two overlap almost
            # for free. The build's exit code lands in .storybook-status,
            # which the await step below turns into this job's verdict.
            # setsid + reparenting: the runner kills each step's process
            # tree when the step ends, so a plain `cmd &` dies at the
            # boundary — the detached session survives into the sonar step.
            - name: Start Storybook build (for Chromatic)
              id: storybook
              run: |
                  if npx nx affected -t build-storybook --graph=stdout |
                      jq -e '.tasks.tasks | has("aurelius-atlas-ui:build-storybook")' >/dev/null; then
                      setsid bash -c \
                          'npx nx build-storybook aurelius-atlas-ui >storybook.log 2>&1; echo $? >.storybook-status' \
                          </dev/null >/dev/null 2>&1 &
                      echo "ui-affected=true" >>"$GITHUB_OUTPUT"
                  else
                      echo "ui-affected=false" >>"$GITHUB_OUTPUT"
                  fi

            # SonarQube analysis requires all previously generated test and scan results to be available.
            # The sonar target dependsOn decrypt (the per-project .env carries SONAR_TOKEN), and with
            # task-based affected decrypt only rides the graph when a .env.enc is affected — so the age
            # key is scoped to this step, as the hosted sonar job's "Decrypt secrets for SonarQube" step
            # did (run 40468045053: keyless decrypt failed every project's .env.enc).
            - name: Run SonarQube analysis
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t sonar

            # Sonar is done; collect the background Storybook build. Sonar
            # outlasts it in every run so far, so this is a join, not a
            # wait - the loop only matters if that flips.
            - name: Await Storybook build
              if: steps.storybook.outputs.ui-affected == 'true'
              run: |
                  while [ ! -f .storybook-status ]; do sleep 2; done
                  cat storybook.log
                  exit "$(cat .storybook-status)"

            # Publish Aurelius Atlas UI's Storybook (dist/ is on the work
            # volume) - only when the build step above produced it.
            # buildCommand is required: chromaui/action v18 preflights a
            # package.json build script ("build-storybook") when no build
            # command is given, and the root package.json has none (run
            # 40202533804: "Build script not found"). The storybook is
            # already built, so the command is a guard, not a rebuild - it
            # fails loudly if dist/ is missing.
            - name: Run Chromatic
              if: ${{ steps.storybook.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  buildCommand: "test -d dist/storybook/aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
