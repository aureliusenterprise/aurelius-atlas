name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    # The whole pipeline in ONE job, running DIRECTLY in the dev container
    # image (ghcr.io/aureliusenterprise/atlas-ci-runner - the runner pod's
    # job container IS that image; infra/arc). No devcontainers/ci wrapper,
    # no sibling container, no per-job image pull: the steps below run in
    # the image developers use, on the GKE pool (docs/architecture/
    # self-hosted-ci.md, self-hosted-ci-decision.md option D).
    #
    # Fail-fast order (one container, one dockerd, one PVC work dir):
    #
    #   validate -> test -> docker build + vuln scan -> storybook -> sonar
    #
    # e2e containers, built images, and reports all live on the same daemon
    # / work volume, so later phases read what earlier phases wrote - the
    # scan needs no image export, sonar finds coverage and sarif in place,
    # Chromatic finds Storybook's dist/.
    #
    # External services run last and only when warranted: SonarQube is the
    # pipeline's final phase (set -e: a failing phase above skips it),
    # Chromatic is gated on the UI-affected output - and a failing pipeline
    # fails the job, so neither is reached.
    ci:
        # The Shape A pool (infra/arc/arc-shapea-values.yaml). Hard-coded:
        # the pool is the dev container image, not a generic runner label;
        # reverting to hosted runners is a git revert, not a variable flip
        # (the CI_* flag-day variables retired with the devcontainers/ci
        # wrapper).
        runs-on: atlas-ci-shapea
        timeout-minutes: 60

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            # Warm-tree hygiene BEFORE checkout (the work dir is the Shape A
            # PVC - it outlives jobs, so the previous run's tree is still
            # here): reset --hard discards tracked modifications (prettier
            # fixes, decrypt-written .env) so actions/checkout can never be
            # refused for "local changes would be overwritten" on a file
            # that changed between commits; clean -ffdx then wipes untracked
            # leftovers - coverage, junit, dist, reports/failure-diagnostics
            # (staging them with `git add -A` would PRESERVE them: clean
            # only removes untracked files, and the staged diagnostics then
            # get linted/rewritten by pre-commit - run 40228013569).
            # The -e keeps the warm trees (npm/uv re-link ~60s cold), the Nx
            # daemon's workspace-data, and the age key file
            # (SOPS_AGE_KEY_FILE points at it; sops needs the file to exist,
            # its content is irrelevant when SOPS_AGE_KEY is set). Guarded:
            # a fresh PVC has no repo yet.
            - name: Clean warm work tree
              run: |
                  if [ -d .git ]; then
                      git reset --hard HEAD
                      git clean -ffdx -e node_modules -e .venv -e .nx/workspace-data -e secrets/keys.txt
                  fi

            # clean: false: the clean step above did the wiping (the default
            # clean would also wipe node_modules/.venv - ~2000 packages
            # re-linked from cache every job).
            # fetch-depth 0: nx-set-shas / nx affected need history.
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  clean: false

            # Affected baseline for nx affected. The runner exports no
            # GITHUB_TOKEN by default, so pass it explicitly.
            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Dev container onCreateCommand - the pipeline needs the
            # workspace installed (npm.sh + uv.sh verbatim, the Shape A
            # contract). postCreateCommand scripts are deliberately not
            # run: pre-commit.sh installs git hooks (CI runs pre-commit
            # explicitly, in the pipeline) and sops.sh runs `nx keygen`, a
            # dev-machine bootstrap - in CI the key arrives through the
            # environment (SOPS_AGE_KEY below).
            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            # Registry logins against the container's OWN dockerd (the
            # docker-in-docker feature starts it at pod boot). dhi.io = the
            # hardened base images; ghcr.io = buildcache push (needs
            # packages:write, hence the scope on this job).
            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # THE pipeline: pre-commit -> nx affected -t test e2e -> docker
            # build + vuln scan + storybook -> decrypt + sonar
            # (.devcontainer/ci-pipeline.sh, container-agnostic). Writes
            # ui-affected to the step output natively (no output file
            # bridge). Cache env + PATH come from the pod's container
            # command; SOPS_AGE_KEY decrypts the per-project .env.enc.
            - name: Run the CI pipeline
              id: core
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: bash .devcontainer/ci-pipeline.sh

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

            # The pipeline's storybook phase built Aurelius Atlas UI's
            # Storybook (dist/ is on the work volume) and reported
            # ui-affected through the step output; publish it only then.
            # buildCommand is required: chromaui/action v18 preflights a
            # package.json build script ("build-storybook") when no build
            # command is given, and the root package.json has none (run
            # 40202533804: "Build script not found"). The storybook is
            # already built, so the command is a guard, not a rebuild - it
            # fails loudly if dist/ is missing.
            - name: Run Chromatic
              if: ${{ steps.core.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  buildCommand: "test -d dist/storybook/aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
