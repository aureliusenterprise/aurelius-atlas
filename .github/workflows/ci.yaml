name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  python: "true"
                  node: "true"

            - name: Run pre-commit hooks
              uses: pre-commit/action@v3.0.1

            # Every public function and every specified rule is named by a test (ADR 049).
            # Collects all Atlas projects' tests without running them, so it does not
            # depend on which projects are affected (DD-009).
            - name: Check traceability
              run: uv run aurelius-atlas-trace check

    test:
        runs-on: ubuntu-latest
        needs: validate

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  python: "true"
                  node: "true"
                  playwright: "true"
                  mkcert: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Test affected projects
              # The `test`/`e2e` targets depend on `decrypt`, so this step
              # legitimately needs the age key. Keep the scope as narrow as
              # possible: a workflow-level env var would expose the key to
              # every step and every third-party action in the job.
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t test e2e -c ci

            # One page per change with results, coverage and traceability (ADR 049 R3).
            - name: Build test report
              if: ${{ !cancelled() }}
              run: |
                  uv run aurelius-atlas-trace report \
                    --output dist/test-report/index.html \
                    --summary dist/test-report/summary.md
                  cat dist/test-report/summary.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload test report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: test-report
                  path: dist/test-report/
                  if-no-files-found: ignore

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/jacocoTestReport.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Collect failure diagnostics
              if: failure()
              run: |
                  mkdir -p reports/failure-diagnostics
                  docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
                    > reports/failure-diagnostics/container-status.txt 2>&1 || true
                  for project in $(docker compose ls --all -q); do
                    echo "Collecting logs for project: $project"
                    docker compose --project-name "$project" logs --no-color \
                      > "reports/failure-diagnostics/${project}-logs.txt" 2>&1 || true
                  done

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

    build-and-scan:
        runs-on: ubuntu-latest
        needs: validate

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  python: "true"
                  node: "true"
                  cosign: "true"
                  trivy: "true"
                  cyclonedx: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Build docker images for affected projects
              run: npx nx affected -t docker-build -c ci

            - name: Generate vulnerability reports for affected projects
              run: npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

    sonar:
        runs-on: ubuntu-latest
        needs: [test, build-and-scan]

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  node: "true"
                  sonarqube: "true"

            - name: Download coverage reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            # Decrypt every project, not just the affected ones: with task-based affected,
            # decrypt only counts as affected when .env.enc changes, and a .env that the
            # sonar run decrypts itself is written after Nx has loaded the task env, so
            # sonar-scanner would run without SONAR_TOKEN ("Not authorized").
            - name: Decrypt secrets for SonarQube
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            - name: Run SonarQube analysis
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t sonar

    chromatic:
        runs-on: ubuntu-latest
        needs: test

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  node: "true"

            - name: Run Chromatic
              uses: chromaui/action@v17
              with:
                  buildCommand: "npx nx build-storybook aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
