name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

# The pipeline is a FAN-OUT DAG on the Shape A pool (DD-232, supersedes
# DD-229's single-job clause; spike runs 40517674042/40520070483 proved the
# pool): `validate` checks the tree and runs the unit suites, then three jobs
# run CONCURRENTLY on separate runner pods — `e2e` (integration suites),
# `scan-sonar` (image builds, trivy, SonarQube), and `chromatic` (Storybook
# build + publish). The core win: sonar is ~85% SonarCloud SERVER-queue wait
# (13m28s wall for 2m4s of scanner in run 40471177041) and e2e is CPU/RAM
# saturation — serializing them in one job wasted ~25 min of wall time.
#
# The pool (infra/arc): per-pod emptyDir cache volumes (no shared PD), so
# jobs must NOT share files through the work volume. Cross-job handoffs ride
# artifacts (coverage) or rebuild (images, via the GHCR buildcache); scan
# and sonar stay in ONE job so the sarif handoff never crosses the boundary.
# The runner image is pre-baked with the node toolchain + dev-stack base
# images, so per-job cold cost is checkout+install (~2 min), not image pulls.
jobs:
    # ─── validate: tree checks + unit suites ───────────────────────────────
    # Everything that gates the fan-out: format/type checks (pre-commit
    # --all-files — deliberate: the type checker catches breakage in files
    # the PR never touched), dependency install, and the unit `test` suites
    # with coverage. Its product is the green light + the coverage artifacts
    # the sonar job uploads.
    validate:
        runs-on: atlas-ci-shapea
        timeout-minutes: 30

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Registry logins: testcontainers pulls, buildcache reads.
            packages: write

        steps:
            # EPHEMERAL TREE (the GitHub-hosted model): actions/checkout's
            # DEFAULT clean (git clean -ffdx + git reset --hard) sanitizes
            # the previous job's tree — node_modules, .venv, coverage, dist,
            # diagnostics all wiped. Nothing in the tree persists BY
            # DESIGN. The warm tree saved only ~70s of install (npm 47s +
            # uv ~20s, from caches that live on cache subPaths OUTSIDE the
            # tree) and caused every warm-tree bug of the Shape A trial
            # week: root-owned dirs from e2e bind mounts breaking checkout
            # (EACCES rmdir), staged diagnostics surviving `git clean` and
            # failing pre-commit (40228013569), the SOPS_AGE_KEY_FILE
            # dance. Caches outside, tree disposable.
            # fetch-depth 0: nx-set-shas / nx affected need history.
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # ~47s cold npm install (measured) -> ~10s restore. Keyed on
            # every lockfile; restore-keys fall back to the newest lock
            # version. zstd falls back to gzip (no zstd in the runner
            # image) - fine at this scale. Split restore/save (the
            # save-always input is deprecated and demonstrably inert: run
            # 40279621021's failure skipped "Post Cache node_modules", so
            # the cache was never saved and every run paid the cold
            # install). The save step below runs with if: always().
            - name: Restore node_modules
              id: restore-node-modules
              uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-modules-

            # .venv is NOT cached: uv sync is ~20s with the uv download
            # cache already on a cache volume, and a restored .venv
            # hard-codes the job workdir in its script shebangs, which
            # changes per pod.

            # Affected baseline for nx affected. The runner exports no
            # GITHUB_TOKEN by default, so pass it explicitly. Every job in
            # the run sees the same head/base SHAs, so each job's
            # `nx affected` set is identical.
            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Dev container onCreateCommand - the pipeline needs the
            # workspace installed (npm.sh + uv.sh verbatim, the Shape A
            # contract). postCreateCommand scripts are deliberately not
            # run: pre-commit.sh installs git hooks (CI runs pre-commit
            # explicitly, in the pipeline) and sops.sh runs `nx keygen`, a
            # dev-machine bootstrap - in CI the key arrives through the
            # environment (SOPS_AGE_KEY below).
            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            # Save even when a later step fails: node_modules is
            # cache-worthy the moment npm ci finishes - gating the save on
            # a green pipeline delays the restore hit by every failing run
            # (the deprecated save-always input never fired at all).
            # Skipped when the restore HIT: cache/save re-uploads
            # unconditionally - a hit costs ~40s of re-upload every run
            # (runs 40468045053/40471177041: 9s restore, 40s save).
            # validate is the ONLY job that saves: the three fan-out jobs
            # restore concurrently, and a concurrent save on the same key
            # is a race for nothing.
            - name: Save node_modules
              if: always() && steps.restore-node-modules.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: node_modules
                  key: ${{ steps.restore-node-modules.outputs.cache-primary-key }}

            - name: Validate pre-commit
              run: uv run pre-commit run --all-files

            # Registry logins against the container's OWN dockerd (the
            # docker-in-docker feature starts it at pod boot). The unit
            # suites include testcontainers (store-es spins a real
            # Elasticsearch), so the dhi.io pull needs the login before
            # the test step — a cold pod without it fails the suite as
            # "unauthorized" (the login rode the test step in the single
            # job). ghcr.io = buildcache pulls (packages:write scope).
            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Decrypt every project, not just the affected ones - unit
            # tests re-execute decrypt when a .env.enc is in the affected
            # set, and keeping every job's decrypt identical (run-many,
            # key scoped to the step) is the per-job contract of the split
            # world. Key scoped to this step.
            - name: Decrypt project env
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            # Unit suites only (the e2e suites moved to the `e2e` job;
            # docker-build moved with them - the scan job rebuilds what it
            # scans via the GHCR buildcache, so no daemon is shared across
            # jobs). Coverage (-c ci) is this job's product: the sonar
            # job uploads it. Cache env + PATH come from the pod's
            # container command; SOPS_AGE_KEY stays as a safeguard - a
            # test run re-executes `decrypt` when a .env.enc is in the
            # affected set.
            - name: Run unit tests
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t test -c ci

            # The coverage handoff: sonar's per-project reportPaths are
            # in-tree relative (<project>/coverage.xml for Python,
            # coverage/<project>/lcov.info for JS), so the artifact must
            # keep workspace-relative paths — upload-artifact's default
            # root is the workspace, and download-artifact restores to the
            # same root.
            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

    # ─── e2e: integration suites ───────────────────────────────────────────
    # The CPU/RAM-heavy half: Playwright/pytest e2e suites with their
    # compose stacks (Keycloak, Postgres, Elasticsearch, observability) and
    # testcontainers, on this pod's own privileged dockerd. Runs on its own
    # pod, so the stacks' ~8 Gi of memory and the suites' CPU no longer
    # serialize with the sonar queue-wait (DD-232). No sonar/scan/storybook
    # here — this job ends at teardown.
    e2e:
        needs: validate
        runs-on: atlas-ci-shapea
        timeout-minutes: 45

        env:
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Restore node_modules
              uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-modules-

            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            # Registry logins against the container's OWN dockerd (the
            # docker-in-docker feature starts it at pod boot). dhi.io = the
            # hardened base images; ghcr.io = buildcache push (needs
            # packages:write, hence the scope on this job).
            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Decrypt project env
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            # The integration phase: the affected e2e suites + the image
            # builds they depend on (e2e stacks build some apps as a
            # dependency; docker-build rides the same graph because image
            # builds depend on source, not on tests, and the daemon is
            # warm - serialising them behind the test step was a free
            # minute). Parallelism stays at Nx's default (3): --parallel=5
            # regressed run 40486044342 - the store-es suite's
            # testcontainers Elasticsearch missed its 180s health window, a
            # fastapi auth fixture read-timed out, and the critical path
            # grew 7m37s -> 10m35s. The node's CPUs are already spent: e2e
            # suites, the compose stacks' JVMs, and pytest workers share
            # them.
            #
            # Note on durations: the task graph runs e2e suites
            # concurrently on this runner, so per-test times in the junit
            # reports are inflated by CPU contention (a 7s Playwright test
            # can record 80s+). Read them as relative, not absolute; total
            # wall time is what the job optimises (DD-225 audit).
            - name: Run integration tests
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t e2e docker-build -c ci

            # Collect container logs and status for debugging failed tests.
            # Same container, same dockerd as the step above, so this sees
            # exactly what the suites left behind.
            - name: Collect failure diagnostics
              if: failure()
              run: |
                  mkdir -p reports/failure-diagnostics
                  docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
                    > reports/failure-diagnostics/container-status.txt 2>&1 || true
                  for project in $(docker compose ls --all -q); do
                    echo "Collecting logs for project: $project"
                    docker compose --project-name "$project" logs --no-color \
                      > "reports/failure-diagnostics/${project}-logs.txt" 2>&1 || true
                  done

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

            # Tear the e2e stacks down as soon as the tests are done:
            # Keycloak/Postgres/Elasticsearch/observability hold ~8 Gi of
            # the pod's memory. `compose down` per project is the strong
            # form: prune only sweeps STOPPED containers, and the suites
            # leave their stacks Up, so the prune pair alone reclaimed one
            # 28.67 kB corpse every run (40471177041/40486044342/40489544189)
            # while the stacks rode on. Containers/volumes/networks go,
            # IMAGES stay - down never touches images. Deleting containers
            # also forecloses compose reusing a stopped one verbatim,
            # command baked with the previous commit (run 40231127680:
            # postgres died on a 2h-old pre-fix container).
            # The prunes stay as the sweeper for non-compose strays
            # (testcontainers' ryuk, anonymous volumes).
            # if: always() sweeps on failure/cancel/timeout;
            # continue-on-error: cleanup must never flip the verdict.
            # (DD-231 — the e2e job is now the only stack owner, so this is
            # the pipeline's single teardown, not the tail of one job.)
            - name: Tear down test containers
              if: always()
              continue-on-error: true
              run: |
                  for project in $(docker compose ls --all -q); do
                      echo "Tearing down compose project: $project"
                      docker compose --project-name "$project" down -v --remove-orphans
                  done
                  docker container prune -f
                  docker volume prune -af

    # ─── scan-sonar: image scanning + SonarQube ────────────────────────────
    # The I/O-wait half of the old serial pipeline. Scan and sonar MUST stay
    # in one job: sonar reads `**/vulnerabilities.sarif` from the work
    # volume, and the fan-out jobs never share files. Sonar is ~85% server
    # queue-wait, so this pod's CPUs idle while SonarCloud digests — exactly
    # the half that now overlaps the e2e job. Coverage arrives as validate's
    # artifact; images rebuild here from the GHCR buildcache (near-instant
    # on a warm node — spike probe-b: 48s for the two heaviest dev-stack
    # images cold, 0.0s once the node has seen the layers).
    scan-sonar:
        needs: validate
        runs-on: atlas-ci-shapea
        timeout-minutes: 45

        env:
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Pull the dev container image, push/pull buildcache tags.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Restore node_modules
              uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-modules-

            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Decrypt project env
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            # Coverage from validate, restored to the workspace root so
            # sonar's in-tree reportPaths resolve:
            # <project>/coverage.xml (Python), coverage/<project>/lcov.info
            # (JS). A no-test-run (validate failed) has no artifact —
            # sonar tolerates missing reports, and this job never starts
            # when validate fails anyway (needs:).
            - name: Download coverage reports
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports
                  path: .

            # Trivy scans the SBOM of every app image. The images are
            # built HERE (docker-vuln-scan -> docker-sbom -> the image on
            # this daemon): the e2e job's daemon is a pod away, so the
            # split's cost is one rebuild per affected app — the GHCR
            # buildcache tags keep it near-instant (tools/plugins/docker.ts).
            - name: Build app images
              run: npx nx affected -t docker-build

            - name: Scan for vulnerabilities
              run: npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            # SonarQube analysis requires the test and scan results to be
            # available: coverage arrived as an artifact, the sarif is
            # scan's own work-volume output (see the job header - scan and
            # sonar co-locate for exactly this handoff). The sonar target
            # dependsOn decrypt (the per-project .env carries SONAR_TOKEN),
            # and with task-based affected decrypt only rides the graph when
            # a .env.enc is affected - so the age key is scoped to this
            # step, as the hosted sonar job's "Decrypt secrets for
            # SonarQube" step did (run 40468045053: keyless decrypt failed
            # every project's .env.enc).
            - name: Run SonarQube analysis
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t sonar

    # ─── chromatic: Storybook build + publish ──────────────────────────────
    # Its own job now that sonar no longer serializes ahead of it — the
    # DD-229 setsid background dance existed to hide the storybook build
    # behind sonar's queue-wait in a single job; in the fan-out, chromatic
    # runs concurrently from the start and the build is a plain foreground
    # step. The --graph=stdout probe keeps the job a no-op (not a green
    # lie) when the UI is out of the affected set.
    chromatic:
        needs: validate
        runs-on: atlas-ci-shapea
        timeout-minutes: 30

        env:
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Restore node_modules
              uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-modules-

            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            - name: Decrypt project env
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            # The Storybook build Chromatic publishes - only when the UI
            # (or its dependencies) are affected. dist/ lands in the
            # mounted checkout, where the Chromatic step uploads it.
            - name: Build Storybook (for Chromatic)
              id: storybook
              run: |
                  if npx nx affected -t build-storybook --graph=stdout |
                      jq -e '.tasks.tasks | has("aurelius-atlas-ui:build-storybook")' >/dev/null; then
                      npx nx build-storybook aurelius-atlas-ui
                      echo "ui-affected=true" >>"$GITHUB_OUTPUT"
                  else
                      echo "ui-affected=false" >>"$GITHUB_OUTPUT"
                  fi

            # Publish Aurelius Atlas UI's Storybook (dist/ is in the
            # checkout) - only when the build step above produced it.
            # buildCommand is required: chromaui/action v18 preflights a
            # package.json build script ("build-storybook") when no build
            # command is given, and the root package.json has none (run
            # 40202533804: "Build script not found"). The storybook is
            # already built, so the command is a guard, not a rebuild - it
            # fails loudly if dist/ is missing.
            - name: Run Chromatic
              if: ${{ steps.storybook.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  buildCommand: "test -d dist/storybook/aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
