name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    # The whole pipeline in ONE job, inside the dev container image (the
    # bridge toward self-hosted runners - see
    # docs/architecture/self-hosted-ci.md), in fail-fast order:
    #
    #   validate -> test -> docker build + vuln scan -> storybook -> sonar
    #
    # One container run means one 8 GB image pull, one cache restore, and one
    # Docker daemon shared by every phase: e2e containers, built images, and
    # reports all live on the same daemon / mounted checkout, so later phases
    # read what earlier phases wrote - the scan needs no image export, sonar
    # finds coverage and sarif in place, Chromatic finds Storybook's dist/.
    #
    # External services run last and only when warranted: SonarQube is the
    # pipeline's final in-container phase (set -e: a failing phase above
    # skips it), Chromatic is a host step gated on the UI-affected output -
    # and a failing pipeline fails the job, so neither is reached.
    ci:
        # Flag-day knob for the self-hosted migration (docs/architecture/self-hosted-ci.md):
        # set the CI_RUNS_ON repo variable to the self-hosted runner label
        # ("atlas-ci", infra/arc) to move CI onto GKE; unset keeps hosted
        # runners. CI_DISK_CLEANUP and CI_USE_ACTIONS_CACHE follow the same
        # flip (self-hosted nodes are clean, and the Actions cache service
        # is unavailable there for private repos - caches become volumes).
        runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
        timeout-minutes: 60

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Run the CI pipeline in the dev container
              id: core
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  ghcr-login: "true"
                  disk-cleanup: ${{ vars.CI_DISK_CLEANUP || 'true' }}
                  use-actions-cache: ${{ vars.CI_USE_ACTIONS_CACHE || 'true' }}
                  cache-mounts: ${{ vars.CI_CACHE_MOUNTS }}
                  # Unset (hosted) -> the action's default in-workspace paths,
                  # which the actions/cache steps restore/save. Self-hosted ->
                  # set CI_CACHE_ENV to the PVC cache targets OUTSIDE the
                  # checkout (root:root bind roots inside it break `git clean`).
                  cache-env: ${{ vars.CI_CACHE_ENV }}
                  run-cmd: bash .devcontainer/ci-pipeline.sh

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

            # The pipeline's storybook phase built Aurelius Atlas UI's
            # Storybook (dist/ is on the mounted checkout) and reported
            # ui-affected through the step output; publish it only then.
            # chromaui/action's own semantics (exit codes, auto-accept) are
            # unchanged - it uploads outputDir as-is when no buildCommand
            # is set.
            - name: Run Chromatic
              if: ${{ steps.core.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
