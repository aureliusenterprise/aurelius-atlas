name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read
            # Pull the dev container image from GHCR.
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Bridge (self-hosted CI plan, PR 2): run the hooks inside the
            # published dev container image — the same environment developers
            # use (see .devcontainer/ and build-devcontainer-image.yaml). The
            # image layers come from the publisher's cache, so the build is a
            # pull-through, not a rebuild.
            #
            # The action runs the devcontainer lifecycle scripts first
            # (onCreateCommand: npm + uv install, postCreateCommand: pre-commit
            # hooks + sops keygen), then the runCmd below. Exit ramp: revert
            # this step to setup-toolchain + pre-commit/action in one commit.
            - name: Run pre-commit hooks in the dev container
              uses: devcontainers/ci@v0.3
              with:
                  imageName: ghcr.io/aureliusenterprise/atlas-ci-runner
                  imageTag: main
                  cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  # Validation only - never publish from this job.
                  push: never
                  runCmd: uv run pre-commit run --all-files

    test:
        runs-on: ubuntu-latest
        needs: validate

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  disk-cleanup: "true"
                  python: "true"
                  node: "true"
                  playwright: "true"
                  mkcert: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Test affected projects
              # The `test`/`e2e` targets depend on `decrypt`, so this step
              # legitimately needs the age key. Keep the scope as narrow as
              # possible: a workflow-level env var would expose the key to
              # every step and every third-party action in the job.
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t test e2e -c ci

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Collect failure diagnostics
              if: failure()
              run: |
                  mkdir -p reports/failure-diagnostics
                  docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
                    > reports/failure-diagnostics/container-status.txt 2>&1 || true
                  for project in $(docker compose ls --all -q); do
                    echo "Collecting logs for project: $project"
                    docker compose --project-name "$project" logs --no-color \
                      > "reports/failure-diagnostics/${project}-logs.txt" 2>&1 || true
                  done

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

    build-and-scan:
        runs-on: ubuntu-latest
        needs: validate

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  disk-cleanup: "true"
                  python: "true"
                  node: "true"
                  cosign: "true"
                  trivy: "true"
                  cyclonedx: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Build docker images for affected projects
              run: npx nx affected -t docker-build -c ci

            - name: Generate vulnerability reports for affected projects
              run: npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

    sonar:
        runs-on: ubuntu-latest
        needs: [test, build-and-scan]

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  node: "true"
                  sonarqube: "true"

            - name: Download coverage reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            # Decrypt every project, not just the affected ones: with task-based affected,
            # decrypt only counts as affected when .env.enc changes, and a .env that the
            # sonar run decrypts itself is written after Nx has loaded the task env, so
            # sonar-scanner would run without SONAR_TOKEN ("Not authorized").
            - name: Decrypt secrets for SonarQube
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx run-many -t decrypt

            - name: Run SonarQube analysis
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: npx nx affected -t sonar

    chromatic:
        runs-on: ubuntu-latest
        needs: test

        env:
            # Task-based affected selection — see the `test` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  node: "true"

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            # Chromatic only publishes aurelius-atlas-ui's Storybook, so skip
            # the publish when the UI (or its dependencies) are not affected.
            - name: Check if aurelius-atlas-ui is affected
              id: affected
              run: |
                  if npx nx affected -t build-storybook --graph=stdout \
                    | jq -e '.tasks.tasks | has("aurelius-atlas-ui:build-storybook")' \
                    > /dev/null; then
                    echo "ui-affected=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ui-affected=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run Chromatic
              if: ${{ steps.affected.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  buildCommand: "npx nx build-storybook aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
