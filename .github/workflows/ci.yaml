name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

# Default-deny: every job declares its own scope below; this top-level block
# is the fallback so a future job that forgets `permissions:` still gets the
# minimum instead of the org default.
permissions:
    contents: read

jobs:
    # Everything cheap and local runs in ONE job, inside the dev container
    # image (the bridge toward self-hosted runners - see
    # docs/architecture/self-hosted-ci.md), in fail-fast order:
    #
    #   validate -> test -> docker build + vuln scan -> storybook
    #
    # One container run means one 8 GB image pull, one cache restore, and one
    # Docker daemon shared by every phase: e2e containers, built images, and
    # reports all live on the same daemon / mounted checkout, so later phases
    # read what earlier phases wrote (this is what lets the scan skip any
    # image export, and sonar find the coverage reports in place).
    #
    # The two external services - Chromatic and SonarQube - are separate jobs
    # gated on this one, so a change that fails validate/test/scan never
    # reaches them.
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 90

        outputs:
            # Written by the pipeline's storybook phase; gates the Chromatic
            # job below.
            ui-affected: ${{ steps.core.outputs.ui-affected }}

        env:
            # Nx 23.3+: select affected by individual tasks instead of whole
            # projects (finer scope, faster sets). Remove once Nx 24 makes
            # this the default and retires the flag.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Run the CI pipeline in the dev container
              id: core
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  ghcr-login: "true"
                  disk-cleanup: "true"
                  run-cmd: bash .devcontainer/ci-pipeline.sh

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            - name: Upload Storybook
              if: ${{ steps.core.outputs.ui-affected == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: storybook
                  path: dist/storybook/aurelius-atlas-ui
                  if-no-files-found: error

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

    chromatic:
        runs-on: ubuntu-latest
        needs: ci
        timeout-minutes: 30

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # The core job built Storybook only when the UI was affected and
            # says so through its job output; the upload needs the build, so
            # it comes back as an artifact. chromaui/action's own semantics
            # (exit codes, auto-accept) are unchanged - it uploads outputDir
            # as-is when no buildCommand is set.
            - name: Download Storybook
              if: ${{ needs.ci.outputs.ui-affected == 'true' }}
              uses: actions/download-artifact@v8
              with:
                  name: storybook
                  path: dist/storybook/aurelius-atlas-ui

            - name: Run Chromatic
              if: ${{ needs.ci.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    sonar:
        runs-on: ubuntu-latest
        needs: ci
        timeout-minutes: 30

        env:
            # Task-based affected selection — see the `ci` job.
            NX_LEGACY_AFFECTED: "false"

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # Coverage and vulnerability reports were written by the core job
            # into the workspace and uploaded as artifacts - restored here so
            # sonar-scanner finds them in the checkout.
            - name: Download coverage reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            - name: Run SonarQube analysis
              uses: ./.github/actions/run-in-devcontainer
              with:
                  sops-age-key: ${{ secrets.AGE_SECRET_KEY }}
                  run-cmd: |
                      npx nx run-many -t decrypt
                      npx nx affected -t sonar
