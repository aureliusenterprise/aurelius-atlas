name: CI Shape A Full (GKE trial)

# Full-pipeline trial on Shape A: the ci job's phases as DIRECT steps,
# running in the dev container image itself (the atlas-ci-shapea scale
# set - infra/arc/arc-shapea-values.yaml). This is the dress rehearsal
# before retiring the devcontainers/ci wrapper: ci.yaml's `ci` job and
# this job run the SAME .devcontainer/ci-pipeline.sh; here it runs
# directly on the runner container (which is the dev container), with
# the caches and docker store on the Shape A PVC.
#
# Manual-only (workflow_dispatch): ~50 min per run, the pool is serial.
# When this goes green, the flip is: ci.yaml's job shape moves to these
# steps (CI_RUNS_ON retired), Shape B (atlas-ci scale set + composite +
# atlas-toolchain-cache PVC) is uninstalled.
#
# Trial 1 (run 40217828572) failed phase 2+ with nested-overlay mount
# rejections: dockerd here uses the containerd snapshotter, whose layer
# store (/var/lib/containerd) sat on the pod root (the node's overlayfs).
# Fixed by mounting it on the PVC (arc-shapea-values.yaml); this file's
# push trigger re-runs the trial after each infra fix.
#
# Trial 2 (run 40219350705): all e2e/test green (82 tasks), every
# docker-build died on "parent snapshot ... does not exist" - BuildKit
# metadata (docker subPath) outliving containerd's snapshot store. Fixed
# by wiping the metadata in cache-init. Trial 3 next.

on:
    # workflow_dispatch needs the file on the default branch (PR 150 has not
    # merged), so the trial is push-triggered on its own file: editing the
    # file re-runs the trial, pushing anything else does not (unlike
    # ci-shapea.yaml, which runs on every branch push as the gate).
    workflow_dispatch:
    push:
        branches: [feat/validate-job-in-devcontainer]
        paths:
            - .github/workflows/ci-shapea-full.yaml

permissions:
    contents: read

jobs:
    full:
        runs-on: atlas-ci-shapea
        timeout-minutes: 60

        env:
            # Nx 23.3+: task-granular affected (mirrors ci.yaml).
            NX_LEGACY_AFFECTED: "false"

        permissions:
            contents: read
            # Pull the dev container image, push buildcache tags.
            packages: write

        steps:
            # clean: false + the scripted clean below = warm-tree checkout
            # (same rationale as ci-shapea.yaml: the PVC work dir keeps
            # node_modules/.venv between jobs, ~60s of re-linking saved).
            # fetch-depth 0 stays for nx-set-shas / nx affected.
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  clean: false

            # -x also wipes ignored files (coverage, junit, dist, reports);
            # the -e keeps the warm trees, the Nx daemon's workspace-data,
            # and the age key file (SOPS_AGE_KEY_FILE points at it; sops
            # needs the file to exist, its content is irrelevant when
            # SOPS_AGE_KEY is set in the environment). git add -A first so
            # checkout's reset (clean: false skips it) cannot refuse on
            # local changes.
            - name: Clean previous checkout (keep warm trees)
              run: |
                  git add -A
                  git clean -ffdx -e node_modules -e .venv -e .nx/workspace-data -e secrets/keys.txt

            # Affected baseline for nx affected (mirrors the composite's
            # set-shas input; the runner exports no GITHUB_TOKEN by
            # default, so pass it explicitly).
            - name: Set SHAs (nx affected baseline)
              uses: nrwl/nx-set-shas@v5
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Dev container onCreateCommand - the pipeline needs the
            # workspace installed (mirrors ci-shapea.yaml; the composite's
            # devcontainer lifecycle did this for Shape B).
            - name: Install dependencies
              run: |
                  bash .devcontainer/npm.sh
                  bash .devcontainer/uv.sh

            # Registry logins against the container's OWN dockerd (the
            # composite did these inside the runCmd preamble). dhi.io =
            # the hardened base images; ghcr.io = buildcache push (needs
            # packages:write, hence the scope on this job).
            - name: Registry logins
              env:
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # THE pipeline - identical script to the ci job's run-cmd, in
            # the dev container (this container). SOPS_AGE_KEY decrypts the
            # per-project .env.enc (sonar phase); cache env + PATH come
            # from the pod's container command.
            - name: Run the CI pipeline
              id: core
              env:
                  SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
              run: bash .devcontainer/ci-pipeline.sh

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

            # Chromatic runs directly on this container (Shape A has no
            # host/container split) - same v18 guard as ci.yaml: the
            # storybook is already built by the pipeline's phase 4.
            - name: Run Chromatic
              if: ${{ steps.core.outputs.ui-affected == 'true' }}
              uses: chromaui/action@v18
              with:
                  buildCommand: "test -d dist/storybook/aurelius-atlas-ui"
                  outputDir: "dist/storybook/aurelius-atlas-ui"
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
