name: Publish Containers

on:
    push:
        tags:
            - v*.*.*

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  disk-cleanup: "true"
                  python: "true"
                  node: "true"
                  cosign: "true"
                  trivy: "true"
                  cyclonedx: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate tag name
              # The tag becomes {args.version} in the docker targets, and Nx
              # re-quotes interpolated values in double quotes — where $(...)
              # still expands. Git tag names may legally contain $ ( ) ; (the
              # v*.*.* trigger matches `v1.0.0$(touch pwn)`), so only a strict
              # semver tag may proceed. The release workflow is the only
              # producer of these tags.
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::Tag name is not a plain semver tag: $VERSION"
                      exit 1
                  fi

            - name: Publish containers
              run: npx nx run-many -t docker-publish -- --version "$VERSION"
              env:
                  # Tag name as data, never shell code (${{ }} interpolation in
                  # a run: block would execute $(...) embedded in a tag name).
                  VERSION: ${{ github.ref_name }}

            - name: Attest containers
              run: npx nx run-many -t docker-attest -- --version "$VERSION"
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Sign containers
              run: npx nx run-many -t docker-sign -- --version "$VERSION"
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Verify container signatures
              run: npx nx run-many -t docker-verify -- --version "$VERSION" --identity "$IDENTITY" --issuer "^https://token\.actions\.githubusercontent\.com$"
              env:
                  VERSION: ${{ github.ref_name }}
                  IDENTITY: "^https://github\\.com/${{ github.repository_owner }}/aurelius-atlas/\\.github/workflows/publish\\.yaml@${{ github.ref }}$"

            # Charts publish after images (CHT-05, ADR 057): the release's
            # OCI chart set lands in the same registry namespace as the
            # images it deploys. Chart versions carry the release semver
            # WITHOUT the leading v (helm's constraint; DD-245), and the
            # umbrella's helm-publish cascades to the component charts it
            # embeds, so one target publishes the tested combination
            # (CHT-07). Aurelius images stay tag-referenced in the charts
            # (CHT-94): what the release published is attested by the chart
            # signature below, and a chart digest bake would only pin the
            # release to itself.
            - name: Publish charts
              run: npx nx run-many -t helm-publish -- --version "${VERSION#v}"
              env:
                  VERSION: ${{ github.ref_name }}

            # The chart artifacts ride the same keyless identity as the
            # images (CHT-95): the publish workflow's OIDC identity, verified
            # against the same pinned identity/issuer regexps.
            - name: Sign charts
              run: npx nx run-many -t helm-sign -- --version "${VERSION#v}"
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Verify chart signatures
              run: npx nx run-many -t helm-verify -- --version "${VERSION#v}" --identity "$IDENTITY" --issuer "^https://token\.actions\.githubusercontent\.com$"
              env:
                  VERSION: ${{ github.ref_name }}
                  IDENTITY: "^https://github\\.com/${{ github.repository_owner }}/aurelius-atlas/\\.github/workflows/publish\\.yaml@${{ github.ref }}$"
