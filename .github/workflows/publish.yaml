name: Publish Containers

on:
    push:
        tags:
            - v*.*.*

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  python: "true"
                  node: "true"
                  cosign: "true"
                  trivy: "true"
                  cyclonedx: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_PASSWORD }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish containers
              run: npx nx run-many -t docker-publish -- --version "$VERSION"
              env:
                  # Tag name as data, never shell code (${{ }} interpolation in
                  # a run: block would execute $(...) embedded in a tag name).
                  VERSION: ${{ github.ref_name }}

            - name: Attest containers
              run: npx nx run-many -t docker-attest -- --version "$VERSION"
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Sign containers
              run: npx nx run-many -t docker-sign -- --version "$VERSION"
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Verify container signatures
              run: npx nx run-many -t docker-verify -- --version "$VERSION" --identity "$IDENTITY" --issuer "^https://token\.actions\.githubusercontent\.com$"
              env:
                  VERSION: ${{ github.ref_name }}
                  IDENTITY: "^https://github\\.com/${{ github.repository_owner }}/project-template/\\.github/workflows/publish\\.yaml@${{ github.ref }}$"
