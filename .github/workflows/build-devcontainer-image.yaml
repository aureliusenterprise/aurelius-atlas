name: Build Dev Container Image

# Builds the Aurelius Atlas dev container as a publishable image and runs the
# in-container smoke test before publishing.
#
# This is the cache image consumed by `devcontainers/ci` steps in CI jobs
# (`cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main`): the image is
# the devcontainer, so CI jobs run in the same environment developers use.
# It is also the base for the future self-hosted runner image.
#
# Publishing is limited to `main` (see the push filters below). Feature-branch
# and pull-request runs build and smoke-test the image without publishing, so
# a broken `.devcontainer` is caught before it can poison the shared cache.

concurrency:
    group: devcontainer-image-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        paths:
            - .devcontainer/**
            - uv.lock
            - .github/workflows/build-devcontainer-image.yaml

    # Manual rebuild (weekly rebuilds keep baked toolchains from going stale).
    schedule:
        - cron: "0 20 * * 1"

    workflow_dispatch:

# Default-deny fallback; the job declares its own scopes.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        permissions:
            contents: read
            # Push the dev container image to GHCR.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Feature installers (Playwright browsers, the JDK, ...) are the
            # slow part of the build. devcontainers/ci can stage them under a
            # folder we cache, so an unchanged feature set installs once.
            - name: Cache dev container features
              uses: actions/cache@v5
              with:
                  path: ${{ github.workspace }}/.devcontainer/.features-cache
                  key: features-cache-${{ hashFiles('.devcontainer/devcontainer.json', '.devcontainer/features/**', 'uv.lock') }}
                  restore-keys: features-cache-

            - name: Build dev container image and run smoke test
              uses: devcontainers/ci@v0.3
              with:
                  imageName: ghcr.io/aureliusenterprise/atlas-ci-runner
                  imageTag: main
                  userDataFolder: ${{ github.workspace }}/.devcontainer/.features-cache
                  # Reuse the published image's layers; the first build after a
                  # cache miss rebuilds from the base image.
                  cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  cacheTo: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  # Publish on push events and manual dispatches; the ref filter
                  # keeps `main` as the only publisher, so PR builds validate
                  # without touching the shared cache image.
                  push: filter
                  refFilterForPush: refs/heads/main
                  eventFilterForPush: ""
                  runCmd: bash .devcontainer/smoke.sh
