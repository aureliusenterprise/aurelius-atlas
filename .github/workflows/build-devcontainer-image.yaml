name: Build Dev Container Image

# Builds the Aurelius Atlas dev container as a publishable image and runs the
# in-container smoke test before publishing.
#
# This is the cache image consumed by `devcontainers/ci` steps in CI jobs
# (`cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main`): the image is
# the devcontainer, so CI jobs run in the same environment developers use.
# It is also the base for the future self-hosted runner image.
#
# Publishing is limited to `main` (see the push filters below). Feature-branch
# and pull-request runs build and smoke-test the image without publishing, so
# a broken `.devcontainer` is caught before it can poison the shared cache.

concurrency:
    group: devcontainer-image-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        paths:
            - .devcontainer/**
            - uv.lock
            - .github/workflows/build-devcontainer-image.yaml

    # Manual rebuild (weekly rebuilds keep baked toolchains from going stale).
    schedule:
        - cron: "0 20 * * 1"

    workflow_dispatch:

# Default-deny fallback; the job declares its own scopes.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        permissions:
            contents: read
            # Push the dev container image to GHCR.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # devcontainers/ci passes --cache-to to buildx (see cacheTo below),
            # which the runner's default `docker` driver rejects ("Cache export
            # is not supported for the docker driver"). A docker-container
            # builder supports registry cache export; the CLI picks it up as
            # the active builder, and its --load flag keeps the image in the
            # local docker store for the run/smoke step.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Feature installers (Playwright browsers, the JDK, ...) are the
            # slow part of the build. devcontainers/ci can stage them under a
            # folder we cache, so an unchanged feature set installs once.
            - name: Cache dev container features
              uses: actions/cache@v5
              with:
                  path: ${{ github.workspace }}/.devcontainer/.features-cache
                  key: features-cache-${{ hashFiles('.devcontainer/devcontainer.json', '.devcontainer/features/**', 'uv.lock') }}
                  restore-keys: features-cache-

            # The runCmd container runs the devcontainer lifecycle scripts
            # (npm install, uv sync, ...) before the smoke test - redirect
            # those tool caches into the workspace and cache them. Shared key
            # with the CI jobs that run in this image (ci.yaml).
            - name: Cache toolchain and hooks
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ github.workspace }}/.container-cache/uv
                      ${{ github.workspace }}/.container-cache/npm
                      ${{ github.workspace }}/.container-cache/pre-commit
                  key: container-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'package-lock.json', '.pre-commit-config.yaml', '.devcontainer/devcontainer.json') }}
                  restore-keys: container-cache-${{ runner.os }}-

            - name: Build dev container image and run smoke test
              uses: devcontainers/ci@v0.3
              with:
                  imageName: ghcr.io/aureliusenterprise/atlas-ci-runner
                  # main pushes (and the weekly rebuild) publish :main, the
                  # devcontainers/ci cache image. Feature-branch pushes publish
                  # a per-commit tag sha-<full-sha> - that is the Shape A
                  # canary image (infra/arc/arc-shapea-values.yaml runs it
                  # directly as the runner pod's job container; the canary
                  # points at the tag via CI_SHAPEA_IMAGE_TAG).
                  imageTag: ${{ github.ref == 'refs/heads/main' && 'main' || format('sha-{0}', github.sha) }}
                  userDataFolder: ${{ github.workspace }}/.devcontainer/.features-cache
                  # Reuse the published image's layers; the first build after a
                  # cache miss rebuilds from the base image.
                  cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  cacheTo: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  # Publish on push events and manual dispatches. main keeps
                  # the :main cache image; other refs publish only their own
                  # sha-<sha> tag, so PR builds validate without touching the
                  # shared cache image.
                  push: filter
                  refFilterForPush: ${{ github.ref == 'refs/heads/main' && 'refs/heads/main' || github.ref }}
                  eventFilterForPush: ""
                  runCmd: bash .devcontainer/smoke.sh
