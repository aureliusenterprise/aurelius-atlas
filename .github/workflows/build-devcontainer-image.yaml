name: Build Dev Container Image

# Builds the Aurelius Atlas dev container as a publishable image.
#
# The published image (ghcr.io/aureliusenterprise/atlas-ci-runner) is what
# the self-hosted CI jobs run IN: on the Shape A ARC scale set the runner
# pod's job container IS this image (infra/arc), so CI runs in the same
# environment developers use. The build itself uses devcontainers/ci, which
# supplies the devcontainer lifecycle the image intentionally ships without
# - the CI values file sets command/runAs*.
#
# Publishing is limited to `main` (see the push filters below). Feature-branch
# and pull-request runs build the image without publishing, so a broken
# `.devcontainer` is caught before it can poison the shared cache. The
# in-container smoke gate retired with the image's CI contract (the tools
# self-verify in their features, dockerd gates pod boot, the e2e jobs run
# Playwright per PR); its one unique check - the playwright pin - lives in
# the guard step below.

concurrency:
    group: devcontainer-image-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        paths:
            - .devcontainer/**
            - uv.lock
            - .github/workflows/build-devcontainer-image.yaml

    # Manual rebuild (weekly rebuilds keep baked toolchains from going stale).
    schedule:
        - cron: "0 20 * * 1"

    workflow_dispatch:

# Default-deny fallback; the job declares its own scopes.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        permissions:
            contents: read
            # Push the dev container image to GHCR.
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # devcontainers/ci passes --cache-to to buildx (see cacheTo below),
            # which the runner's default `docker` driver rejects ("Cache export
            # is not supported for the docker driver"). A docker-container
            # builder supports registry cache export; the CLI picks it up as
            # the active builder, and its --load flag keeps the image in the
            # local docker store for the run/smoke step.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Feature installers (Playwright browsers, the JDK, ...) are the
            # slow part of the build. devcontainers/ci can stage them under a
            # folder we cache, so an unchanged feature set installs once.
            - name: Cache dev container features
              uses: actions/cache@v6
              with:
                  path: ${{ github.workspace }}/.devcontainer/.features-cache
                  key: features-cache-${{ hashFiles('.devcontainer/devcontainer.json', '.devcontainer/features/**', 'uv.lock') }}
                  restore-keys: features-cache-

            # The two playwright pins are independent sources that MUST
            # agree: the baked browsers come from the playwright-browsers
            # feature version (devcontainer.json), the runtime library from
            # uv.lock. Drift = the cryptic "browser not found" at e2e time.
            # This replaces the retired smoke.sh guard (which compared the
            # baked marker to the pin inside the built container); source-to-
            # source is the same failure mode, caught free and earlier.
            - name: Playwright pin guard
              run: |
                  FEATURE=$(jq -r '.["features"]["./features/playwright-browsers"].version' .devcontainer/devcontainer.json)
                  PINNED=$(awk '/^name = "playwright"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' uv.lock)
                  echo "feature=$FEATURE uv.lock=$PINNED"
                  [[ -n "$FEATURE" && -n "$PINNED" ]] || { echo "::error::could not read a playwright pin"; exit 1; }
                  [[ "$FEATURE" == "$PINNED" ]] || { echo "::error::playwright-browsers feature is $FEATURE but uv.lock pins $PINNED - bump .devcontainer/devcontainer.json"; exit 1; }

            - name: Build dev container image
              uses: devcontainers/ci@v0.3
              with:
                  imageName: ghcr.io/aureliusenterprise/atlas-ci-runner
                  # main pushes (and the weekly rebuild) publish :main, the
                  # image the CI scale set runs by default. Feature-branch
                  # pushes publish a per-commit tag sha-<full-sha>, which
                  # CI_SHAPEA_IMAGE_TAG can point the runner pod at
                  # (infra/arc/install.sh) to test a .devcontainer change
                  # before merging.
                  imageTag: ${{ github.ref == 'refs/heads/main' && 'main' || format('sha-{0}', github.sha) }}
                  userDataFolder: ${{ github.workspace }}/.devcontainer/.features-cache
                  # Reuse the published image's layers; the first build after a
                  # cache miss rebuilds from the base image.
                  cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  cacheTo: ghcr.io/aureliusenterprise/atlas-ci-runner:main
                  # Publish on push events and manual dispatches. main keeps
                  # the :main cache image; other refs publish only their own
                  # sha-<sha> tag, so PR builds validate without touching the
                  # shared cache image.
                  push: filter
                  refFilterForPush: ${{ github.ref == 'refs/heads/main' && 'refs/heads/main' || github.ref }}
                  eventFilterForPush: ""
