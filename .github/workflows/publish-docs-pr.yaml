name: Publish Documentation (PR)

concurrency:
    group: "docs"

# Default-deny: mike deploy --push writes the public-docs branch
# (contents:write) and the commit-status step posts the docs link as a
# commit status (statuses:write) so the PR checks entry links straight to
# the published preview. Nothing else in this workflow needs a scope.
permissions:
    contents: write
    statuses: write

on:
    pull_request:
        branches:
            - "**"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  python: "true"

            - name: Publish documentation for PR
              run: |
                  REF_NAME=$HEAD_REF
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  echo "SANITIZED_REF_NAME=$SANITIZED_REF_NAME" >> "$GITHUB_ENV"
                  uv run mike deploy -b public-docs --push "$SANITIZED_REF_NAME"
              shell: bash
              env:
                  # Pass the PR branch through the environment: interpolating
                  # ${{ github.head_ref }} into the shell text would execute
                  # $(...) / backticks embedded in a branch name (this job runs
                  # for fork PRs too).
                  HEAD_REF: ${{ github.head_ref }}

            - name: Publish documentation link as commit status
              # Same mechanism Chromatic's checks use: a commit status with a
              # target_url shows up in the PR checks list and links directly
              # to the published preview, instead of a job-run page or a
              # comment on the conversation. Posted on the PR head SHA (not
              # github.sha, the merge commit, which never appears in the
              # checks list). Skipped for fork PRs: the head commit does not
              # exist in this repository, so the statuses API would reject
              # it; the docs themselves still deploy.
              if: github.event.pull_request.head.repo.full_name == github.repository
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DOCS_URL: https://aureliusenterprise.github.io/aurelius-atlas/${{ env.SANITIZED_REF_NAME }}/
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  gh api "repos/${{ github.repository }}/statuses/$PR_HEAD_SHA" \
                      -f state=success \
                      -f context=documentation-preview \
                      -f target_url="$DOCS_URL" \
                      -f description="Documentation preview published"
