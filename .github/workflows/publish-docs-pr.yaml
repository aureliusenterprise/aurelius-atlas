name: Publish Documentation (PR)

# Per-PR scope (CHT-102): previews of different PRs run freely, and a new
# push to the same PR queues behind its own last run — never another PR's
# run and never a public-docs deploy (docs-public). No cancel-in-progress:
# mike deploy --push is a git transaction, and half-pushed versions are
# worse than a queued preview.
concurrency:
    group: "docs-pr-${{ github.event.pull_request.number }}"

# Default-deny: mike deploy --push writes the public-docs branch
# (contents:write) and the PR comment step posts through GITHUB_TOKEN
# (pull-requests:write). Nothing else in this workflow needs a scope.
permissions:
    contents: write
    pull-requests: write

on:
    pull_request:
        branches:
            - "**"

jobs:
    # Same-repo PR guard (CHT-102, pentest L6a): this workflow writes the
    # public-docs branch and comments on PRs with GITHUB_TOKEN — a fork PR
    # must not run it at all. A fork's preview is built by a maintainer
    # pushing the branch into this repo (the preview name is the branch).
    publish:
        if: github.event.pull_request.head.repo.full_name == github.repository

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  python: "true"

            - name: Publish documentation for PR
              run: |
                  REF_NAME=$HEAD_REF
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  echo "SANITIZED_REF_NAME=$SANITIZED_REF_NAME" >> "$GITHUB_ENV"
                  uv run mike deploy -b public-docs --push "$SANITIZED_REF_NAME"
              shell: bash
              env:
                  # Pass the PR branch through the environment: interpolating
                  # ${{ github.head_ref }} into the shell text would execute
                  # $(...) / backticks embedded in a branch name (this job runs
                  # for fork PRs too).
                  HEAD_REF: ${{ github.head_ref }}

            - name: Add PR comment with documentation link
              uses: hasura/comment-progress@v2.3.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  number: ${{ github.event.number }}
                  id: docs-link
                  message: "Documentation for this PR is available at: <https://aureliusenterprise.github.io/aurelius-atlas/${{ env.SANITIZED_REF_NAME }}/>"
