name: Setup Toolchain
description: Installs the runtimes and tools needed by CI jobs. Must be called after actions/checkout.

inputs:
    sops:
        description: Install SOPS
        default: "false"
    sops-version:
        description: SOPS version to install
        default: v3.13.3
    disk-cleanup:
        description: Remove unneeded pre-installed toolchains and Docker state (for disk-heavy jobs)
        default: "false"
    python:
        description: Set up Python, uv, and install dependencies
        default: "false"
    node:
        description: Set up Node.js and install npm dependencies
        default: "false"
    dockerhub-username:
        description: Docker Hub username (leave empty to skip Docker Hub login)
        default: ""
    dockerhub-token:
        description: Docker Hub token
        default: ""
    github-token:
        description: GitHub token for GHCR login (leave empty to skip)
        default: ""
    cosign:
        description: Install Cosign (for container signing)
        default: "false"
    cosign-version:
        description: Cosign version to install
        default: v3.0.4
    trivy:
        description: Install Trivy (for vulnerability scanning)
        default: "false"
    trivy-version:
        description: Trivy version to install
        default: v0.68.0
    cyclonedx:
        description: Install CycloneDX CLI (for SBOM generation)
        default: "false"
    cyclonedx-version:
        description: CycloneDX CLI version to install
        default: v0.32.0
    mkcert:
        description: Install mkcert and NSS tools (for local TLS development certificates)
        default: "false"
    mkcert-version:
        description: mkcert version to install
        default: v1.4.4
    sonarqube:
        description: Install SonarQube scanner
        default: "false"
    sonarqube-version:
        description: SonarQube scanner version to install
        default: 8.0.1.6346
    playwright:
        description: Install Playwright browsers with system dependencies
        default: "false"
    python-version:
        description: Python version to set up
        default: "3.14"
    node-version:
        description: Node.js version to set up
        default: "24"

runs:
    using: composite
    steps:
        - name: Clean up pre-installed toolchains
          # Opt-in: this step costs 1-2 minutes (deleting ~20 GB of small files is
          # metadata-bound I/O) and only pays off for jobs that fill the disk with
          # Docker images. Other jobs skip it and run faster.
          if: inputs.disk-cleanup == 'true'
          shell: bash
          run: |
              # Deletion is metadata-bound I/O and takes ~2 minutes; run it in
              # the background so it overlaps with the cache restores and
              # installs that follow. Nothing later depends on the space being
              # free yet - the Docker prunes below act on a freshly started,
              # empty daemon.
              nohup sudo rm -rf \
                  /usr/share/dotnet \
                  /usr/share/swift \
                  /usr/local/.ghcup \
                  /usr/local/julia* \
                  /usr/local/lib/android \
                  /usr/local/share/chromium \
                  /opt/microsoft /opt/google \
                  /opt/az \
                  /usr/local/share/powershell \
                  >/dev/null 2>&1 &

              docker system prune -af || true
              docker builder prune -af || true

        - name: Set up Docker with containerd snapshotter
          # Only jobs that log in to a registry use Docker; without this gate
          # the light jobs pay ~20 s for a daemon restart they never need.
          if: inputs.dockerhub-username != ''
          uses: docker/setup-docker-action@v5
          with:
              daemon-config: |
                  {
                    "features": {
                      "containerd-snapshotter": true
                    }
                  }

        - name: Cache SOPS
          id: cache-sops
          if: inputs.sops == 'true'
          uses: actions/cache@v5
          with:
              path: /usr/local/bin/sops
              key: sops-${{ inputs.sops-version }}

        - name: Install SOPS
          if: inputs.sops == 'true' && steps.cache-sops.outputs.cache-hit != 'true'
          shell: bash
          env:
              SOPS_VERSION: ${{ inputs.sops-version }}
          run: |
              curl -LO https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64
              sudo mv sops-${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
              sudo chmod +x /usr/local/bin/sops

        - name: Setup Python
          if: inputs.python == 'true'
          uses: actions/setup-python@v6
          with:
              python-version: ${{ inputs.python-version }}

        - name: Install uv
          if: inputs.python == 'true'
          shell: bash
          run: python -m pip install uv

        - name: Cache the virtualenv
          if: inputs.python == 'true'
          uses: actions/cache@v5
          with:
              path: ./.venv
              key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

        - name: Install Python dependencies
          if: inputs.python == 'true'
          shell: bash
          run: uv venv --allow-existing && uv sync

        - name: Expose GitHub Runtime
          if: inputs.python == 'true'
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Update GITHUB_PATH
          if: inputs.python == 'true'
          shell: bash
          run: echo "$(dirname "$(uv python find)")" >> $GITHUB_PATH

        - name: Setup Node.js and dependencies
          if: inputs.node == 'true'
          uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node-version }}
              cache: npm

        - name: Install Node.js dependencies
          if: inputs.node == 'true'
          shell: bash
          run: npm install

        - name: Cache Playwright browsers
          id: cache-playwright
          if: inputs.playwright == 'true'
          uses: actions/cache@v5
          with:
              path: ~/.cache/ms-playwright
              # The browsers are installed by the Python playwright package
              # (uv run playwright install), whose lock is uv.lock - the npm
              # lockfile does not contain playwright at all.
              key: ${{ runner.os }}-playwright-${{ hashFiles('**/uv.lock') }}

        - name: Log in to Docker Hub
          if: inputs.dockerhub-username != ''
          uses: docker/login-action@v4
          with:
              registry: docker.io
              username: ${{ inputs.dockerhub-username }}
              password: ${{ inputs.dockerhub-token }}

        - name: Log in to Docker Hardened Images registry
          if: inputs.dockerhub-username != ''
          uses: docker/login-action@v4
          with:
              registry: dhi.io
              username: ${{ inputs.dockerhub-username }}
              password: ${{ inputs.dockerhub-token }}

        - name: Log in to the GitHub Container registry
          if: inputs.github-token != ''
          uses: docker/login-action@v4
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ inputs.github-token }}

        - name: Prefetch base images (background)
          if: inputs.dockerhub-username != ''
          shell: bash
          run: |
              # Pull every third-party image the workspace's compose files and
              # Dockerfiles use, in parallel and detached: the pulls keep
              # running while later steps (Playwright, Nx build/test) execute,
              # so docker compose/build find images already in the local store
              # instead of pulling them serially on the critical path.
              # Concurrent pulls of the same tag are deduplicated by the
              # daemon, so a service starting before prefetch finishes just
              # joins the in-flight pull. Images without a dhi.io prefix are
              # locally built app images, not pulled.
              # setsid detaches from the step's process group so the runner
              # does not kill the in-flight pulls when the step exits.
              {
                  grep -rhoE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' \
                      --include=docker-compose.yaml dev apps
                  grep -rhoE '^FROM[[:space:]]+[^[:space:]]+' apps/*/Dockerfile dev/*/Dockerfile 2>/dev/null
              } |
                  awk '{print $2}' |
                  grep '^dhi\.io/' |
                  sort -u |
                  setsid xargs -P 4 -n 1 docker pull -q >/tmp/prefetch.log 2>&1 &
              echo "Base image prefetch started in the background."

        - name: Cache Cosign
          id: cache-cosign
          if: inputs.cosign == 'true'
          uses: actions/cache@v5
          with:
              path: /usr/local/bin/cosign
              key: cosign-${{ inputs.cosign-version }}

        - name: Install Cosign
          if: inputs.cosign == 'true' && steps.cache-cosign.outputs.cache-hit != 'true'
          shell: bash
          env:
              COSIGN_VERSION: ${{ inputs.cosign-version }}
          run: |
              curl -sSfL https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64 -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign

        - name: Install Trivy
          if: inputs.trivy == 'true'
          uses: aquasecurity/setup-trivy@v0.2.6
          with:
              trivy-version: ${{ inputs.trivy-version }}

        - name: Cache CycloneDX CLI
          id: cache-cyclonedx
          if: inputs.cyclonedx == 'true'
          uses: actions/cache@v5
          with:
              path: /usr/local/bin/cyclonedx
              key: cyclonedx-${{ inputs.cyclonedx-version }}

        - name: Install CycloneDX CLI
          if: inputs.cyclonedx == 'true' && steps.cache-cyclonedx.outputs.cache-hit != 'true'
          shell: bash
          env:
              CYCLONEDX_VERSION: ${{ inputs.cyclonedx-version }}
          run: |
              curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_VERSION}/cyclonedx-linux-x64 -o /usr/local/bin/cyclonedx
              chmod +x /usr/local/bin/cyclonedx

        - name: Cache mkcert
          id: cache-mkcert
          if: inputs.mkcert == 'true'
          uses: actions/cache@v5
          with:
              path: /usr/local/bin/mkcert
              key: mkcert-${{ inputs.mkcert-version }}

        - name: Install mkcert
          if: inputs.mkcert == 'true' && steps.cache-mkcert.outputs.cache-hit != 'true'
          shell: bash
          env:
              MKCERT_VERSION: ${{ inputs.mkcert-version }}
          run: |
              sudo apt-get update
              sudo apt-get install -y libnss3-tools
              curl -LO https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64
              sudo mv mkcert-${MKCERT_VERSION}-linux-amd64 /usr/local/bin/mkcert
              sudo chmod +x /usr/local/bin/mkcert

        - name: Cache SonarQube scanner
          id: cache-sonarqube
          if: inputs.sonarqube == 'true'
          uses: actions/cache@v5
          with:
              path: ${{ runner.temp }}/sonar-scanner
              key: sonarqube-${{ inputs.sonarqube-version }}

        - name: Install SonarQube scanner
          if: inputs.sonarqube == 'true' && steps.cache-sonarqube.outputs.cache-hit != 'true'
          shell: bash
          env:
              SONAR_VERSION: ${{ inputs.sonarqube-version }}
              SONAR_ROOT: ${{ runner.temp }}/sonar-scanner
              SONAR_ZIP: /tmp/sonar-scanner.zip
          run: |
              curl -o "$SONAR_ZIP" -L "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_VERSION-linux-x64.zip"
              unzip -o "$SONAR_ZIP" -d "$SONAR_ROOT"
              rm "$SONAR_ZIP"
              "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin/sonar-scanner" --version

        - name: Add SonarQube scanner to PATH
          if: inputs.sonarqube == 'true'
          shell: bash
          env:
              SONAR_VERSION: ${{ inputs.sonarqube-version }}
              SONAR_ROOT: ${{ runner.temp }}/sonar-scanner
          run: |
              echo "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

        - name: Install Playwright
          # Runs even on a cache hit: --with-deps installs the system libraries
          # a fresh runner needs to launch the browsers, while the cached
          # ~/.cache/ms-playwright makes the downloads themselves a no-op.
          if: inputs.playwright == 'true'
          shell: bash
          run: |
              uv run playwright install --with-deps
