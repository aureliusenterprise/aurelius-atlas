name: Run in Dev Container
description: >
    Runs commands inside the Aurelius Atlas dev container image
    (ghcr.io/aureliusenterprise/atlas-ci-runner, published by
    build-devcontainer-image.yaml). Wraps devcontainers/ci with the repo's
    cache layout, registry logins, and secret passthrough. The container sees
    the checkout at /workspaces/aurelius-atlas, so artifacts written by the
    command - and $GITHUB_OUTPUT appends - are visible to host steps.

inputs:
    run-cmd:
        description: Bash commands to run inside the dev container.
        required: true
    set-shas:
        description: Resolve BASE/HEAD for nx affected (nrwl/nx-set-shas).
        default: "true"
    sops-age-key:
        description: SOPS age key (secrets.AGE_SECRET_KEY). Empty to skip.
        default: ""
    dockerhub-username:
        description: Docker Hub username - logs in inside the container. Empty to skip.
        default: ""
    dockerhub-token:
        description: Docker Hub token.
        default: ""
    ghcr-login:
        description: Log in to ghcr.io inside the container (private image pulls).
        default: "false"
    use-runtime-token:
        description: >
            Expose the job runtime token (ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL)
            inside the container, so buildx type=gha cache works from there.
        default: "false"
    disk-cleanup:
        description: Remove unneeded pre-installed toolchains on the runner.
        default: "false"
    docker-image-cache:
        description: >
            Share the container's Docker image store across jobs via
            actions/cache (docker load at job start, docker save at job end).
            The image list is discovered from the daemon, so new base images
            enter the cache the first time any job pulls them - no list to
            maintain. Enable for jobs that pull/run Docker images.
        default: "false"
    image-tag:
        description: Tag of the dev container image to run.
        default: main

outputs:
    ui-affected:
        description: Set by run-cmd when it writes ui-affected to $GITHUB_OUTPUT.
        value: ${{ steps.run.outputs.ui-affected }}

runs:
    using: composite
    steps:
        - name: Clean up pre-installed toolchains
          # The container's Docker state lands on the runner disk, so the
          # image-heavy jobs clear the runner's pre-installed toolchains
          # first. Deletion is metadata-bound I/O (~2 min); run it in the
          # background so it overlaps with the cache restores below.
          if: inputs.disk-cleanup == 'true'
          shell: bash
          run: |
              nohup sudo rm -rf \
                  /usr/share/dotnet \
                  /usr/share/swift \
                  /usr/local/.ghcup \
                  /usr/local/julia* \
                  /usr/local/lib/android \
                  /usr/local/share/chromium \
                  /opt/microsoft /opt/google \
                  /opt/az \
                  /usr/local/share/powershell \
                  >/dev/null 2>&1 &

        - name: Set SHA for affected commands
          if: inputs.set-shas == 'true'
          uses: nrwl/nx-set-shas@v5

        - name: Expose GitHub runtime for the container
          # Mints ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL for buildx
          # type=gha cache, used by docker-build inside the container.
          if: inputs.use-runtime-token == 'true'
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Log in to the GitHub Container registry
          uses: docker/login-action@v4
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ github.token }}

        # Caches shared with build-devcontainer-image.yaml (identical keys):
        # feature installers, and the toolchain/hook caches redirected into
        # the workspace via the env vars on the run step below.
        - name: Cache dev container features
          uses: actions/cache@v5
          with:
              path: ${{ github.workspace }}/.devcontainer/.features-cache
              key: features-cache-${{ hashFiles('.devcontainer/devcontainer.json', '.devcontainer/features/**', 'uv.lock') }}
              restore-keys: features-cache-

        - name: Cache toolchain and hooks
          uses: actions/cache@v5
          with:
              path: |
                  ${{ github.workspace }}/.container-cache/uv
                  ${{ github.workspace }}/.container-cache/npm
                  ${{ github.workspace }}/.container-cache/pre-commit
              key: container-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'package-lock.json', '.pre-commit-config.yaml', '.devcontainer/devcontainer.json') }}
              restore-keys: container-cache-${{ runner.os }}-

        # The shared Docker image store (see the docker-image-cache input).
        # Rolling key: the exact key never repeats, so every job restores the
        # most recent entry saved by ANY job (restore-keys) and saves its own
        # at the end - jobs warm each other. Tolerate cache-service outages:
        # a missed restore/save costs time, not the job.
        - name: Restore Docker image cache
          if: inputs.docker-image-cache == 'true'
          continue-on-error: true
          uses: actions/cache@v5
          with:
              path: ${{ github.workspace }}/.container-cache/docker-images
              key: docker-images-${{ runner.os }}-${{ github.run_id }}
              restore-keys: docker-images-${{ runner.os }}-

        - name: Run in dev container
          id: run
          uses: devcontainers/ci@v0.3
          env:
              SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
              DOCKERHUB_USER: ${{ inputs.dockerhub-username }}
              DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-token }}
              # Runners no longer export GITHUB_TOKEN to step processes by
              # default, so set it explicitly for the passthrough below.
              GITHUB_TOKEN: ${{ github.token }}
          with:
              imageName: ghcr.io/aureliusenterprise/atlas-ci-runner
              imageTag: ${{ inputs.image-tag }}
              cacheFrom: ghcr.io/aureliusenterprise/atlas-ci-runner:${{ inputs.image-tag }}
              userDataFolder: ${{ github.workspace }}/.devcontainer/.features-cache
              # Validation/build only - publishing is the publisher's job.
              push: never
              # Values set above reach the container; bare names pass through
              # the runner environment (BASE/HEAD from nx-set-shas, the buildx
              # runtime token, NX_LEGACY_AFFECTED, ...). Secrets deliberately
              # arrive per-job, mirroring the per-step scoping the hosted jobs
              # had - there is no host credential forwarding in CI.
              env: |
                  UV_CACHE_DIR=/workspaces/aurelius-atlas/.container-cache/uv
                  npm_config_cache=/workspaces/aurelius-atlas/.container-cache/npm
                  PRE_COMMIT_HOME=/workspaces/aurelius-atlas/.container-cache/pre-commit
                  SOPS_AGE_KEY
                  DOCKERHUB_USER
                  DOCKERHUB_PASSWORD
                  GITHUB_TOKEN
                  GITHUB_ACTOR
                  NX_BASE
                  NX_HEAD
                  NX_LEGACY_AFFECTED
                  ACTIONS_RUNTIME_TOKEN
                  ACTIONS_CACHE_URL
              # Registry logins happen INSIDE the container: the dev container
              # runs its own Docker daemon (the docker-in-docker feature), so
              # host-side docker logins do not apply to it. The daemon starts
              # via the feature's docker-init entrypoint (privileged per the
              # feature spec), same as the developer container.
              #
              # `devcontainer build/up` rewrites devcontainer-lock.json in the
              # mounted workspace; the committed lockfile is the source of
              # truth, so undo the side effect first.
              runCmd: |
                  git checkout -- .devcontainer/devcontainer-lock.json
                  if [ -n "${DOCKERHUB_USER:-}" ]; then
                      printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
                      printf '%s' "$DOCKERHUB_PASSWORD" | docker login dhi.io -u "$DOCKERHUB_USER" --password-stdin
                  fi
                  if [ "${{ inputs.ghcr-login }}" = "true" ]; then
                      printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  fi
                  if [ "${{ inputs.docker-image-cache }}" = "true" ] && [ -f .container-cache/docker-images/images.tar.gz ]; then
                      echo "Loading shared Docker image cache..."
                      gunzip -c .container-cache/docker-images/images.tar.gz | docker load --quiet
                  fi
                  ${{ inputs.run-cmd }}
                  rc=$?
                  if [ "${{ inputs.docker-image-cache }}" = "true" ]; then
                      mkdir -p .container-cache/docker-images
                      # Save every image the daemon now holds, minus the dev
                      # container image itself and this repo's own builds
                      # (project images are ephemeral build outputs, not cache
                      # seeds). Discovery from the daemon = zero maintenance
                      # when base images change.
                      imgs="$(docker images --format '{{.Repository}}:{{.Tag}}' |
                          grep -vE '^<none>|^ghcr\.io/aureliusenterprise/(aurelius-atlas-|atlas-ci-runner)|^vsc-' |
                          sort -u)"
                      if [ -n "$imgs" ]; then
                          echo "Saving shared Docker image cache ($(printf '%s\n' "$imgs" | wc -l) images)..."
                          # shellcheck disable=SC2086
                          docker save $imgs | pigz >.container-cache/docker-images/images.tar.gz
                      fi
                  fi
                  exit $rc
