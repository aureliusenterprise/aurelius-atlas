[project]
name = "aurelius-atlas"
readme = "docs/README.md"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[dependency-groups]
dev = [
    "aurelius-atlas-auth",
    "aurelius-atlas-core",
    "aurelius-atlas-data2model",
    "aurelius-atlas-data2model-client",
    "aurelius-atlas-example",
    "aurelius-atlas-fastapi-example",
    "aurelius-atlas-license-report",
    "aurelius-atlas-lineage-model",
    "aurelius-atlas-lineage-model-client",
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-parity",
    "aurelius-atlas-sdk[full]",
    "aurelius-atlas-server",
    "aurelius-atlas-server-client",
    "aurelius-atlas-store-es[testing]",
    "aurelius-atlas-trace",
    "aurelius-atlas-typesystem",
    "aurelius-atlas-validate-entity",
    "aurelius-atlas-validate-entity-client",
    "aurelius-atlas-vulnerability-report",
    "alembic>=1.18",
    "mike",
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=2.0.10",
    "playwright>=1.64.0",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-avro>=0.9.0",
    "pydantic-settings>=2.16.1",
    "pymdown-extensions>=12.2",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.17.0",
    "pytest-playwright>=0.10.0",
    "pytest-sugar>=1.0.0",
    "python-dotenv>=1.2.4",
    "python-keycloak>=7.1",
    "ruff>=0.15.16",
    "sqlalchemy>=2.1.4",
    "sqlmodel>=0.0.24",
    "tenacity>=9.2.1",
    "testcontainers>=4.14",
    "timeout-decorator>=0.5.0",
    "trustme>=1.1",
    "zensical>=0.0.70",
    "griffe-pydantic>=1.3.2",
]

# squidfunk's mike fork with zensical support; pinned to an exact commit so a
# future `uv lock` cannot silently drift to the fork's moving default branch.
# Bump deliberately together with the zensical version.
[tool.uv.sources.mike]
git = "https://github.com/squidfunk/mike.git"
rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac"

[tool.uv.sources.aurelius-atlas-core]
workspace = true

[tool.uv.sources.aurelius-atlas-data2model]
workspace = true

[tool.uv.sources.aurelius-atlas-data2model-client]
workspace = true

[tool.uv.sources.aurelius-atlas-example]
workspace = true

[tool.uv.sources.aurelius-atlas-auth]
workspace = true

[tool.uv.sources.aurelius-atlas-fastapi-example]
workspace = true

[tool.uv.sources.aurelius-atlas-license-report]
workspace = true

[tool.uv.sources.aurelius-atlas-lineage-model]
workspace = true

[tool.uv.sources.aurelius-atlas-lineage-model-client]
workspace = true

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-parity]
workspace = true

[tool.uv.sources.aurelius-atlas-sdk]
workspace = true

[tool.uv.sources.aurelius-atlas-server]
workspace = true

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[tool.uv.sources.aurelius-atlas-trace]
workspace = true

[tool.uv.sources.aurelius-atlas-typesystem]
workspace = true

[tool.uv.sources.aurelius-atlas-validate-entity]
workspace = true

[tool.uv.sources.aurelius-atlas-validate-entity-client]
workspace = true

[tool.uv.sources.aurelius-atlas-vulnerability-report]
workspace = true

[tool.uv.workspace]
members = [
    "apps/aurelius-atlas-data2model",
    "apps/aurelius-atlas-lineage-model",
    "apps/aurelius-atlas-validate-entity",
    "apps/aurelius-atlas-fastapi-example",
    "apps/aurelius-atlas-server",
    "libs/python/aurelius-atlas-auth",
    "libs/python/aurelius-atlas-core",
    "libs/python/aurelius-atlas-data2model-client",
    "libs/python/aurelius-atlas-example",
    "libs/python/aurelius-atlas-lineage-model-client",
    "libs/python/aurelius-atlas-model",
    "libs/python/aurelius-atlas-otel",
    "libs/python/aurelius-atlas-parity",
    "libs/python/aurelius-atlas-sdk",
    "libs/python/aurelius-atlas-server-client",
    "libs/python/aurelius-atlas-store-es",
    "libs/python/aurelius-atlas-trace",
    "libs/python/aurelius-atlas-typesystem",
    "libs/python/aurelius-atlas-validate-entity-client",
    "reports/aurelius-atlas-license-report",
    "reports/aurelius-atlas-vulnerability-report",
]

# What the traceability check covers (ADR 049, DD-010): every workspace member except these template
# projects, without their `testing` subpackages, and the rules of every specification from 0.2 on.
[tool.aurelius-atlas-trace]
deviations = "docs/architecture/conversion/deviations.md"
enforce-from = "0.2"
exclude-projects = [
    "apps/aurelius-atlas-fastapi-example",
    "libs/python/aurelius-atlas-example",
    "libs/python/aurelius-atlas-sdk",
    "reports/aurelius-atlas-license-report",
    "reports/aurelius-atlas-vulnerability-report",
]
exclude-subpackages = ["testing"]
specs = "docs/architecture/conversion/increments"

[tool.pyright]
exclude = [".venv", "site", "coverage", "tmp", "**/dist", "**/target"]
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

# pytest's conftest dir lands on sys.path at collection; pyright needs the same
# view for the app tests' helper-module imports (the 8.2 fake upstream, the 8.4
# client recorders).
[[tool.pyright.executionEnvironments]]
extraPaths = ["apps/aurelius-atlas-lineage-model/tests"]
root = "apps/aurelius-atlas-lineage-model"

[[tool.pyright.executionEnvironments]]
extraPaths = ["libs/python/aurelius-atlas-server-client/tests"]
root = "libs/python/aurelius-atlas-server-client"

[[tool.pyright.executionEnvironments]]
extraPaths = ["libs/python/aurelius-atlas-data2model-client/tests"]
root = "libs/python/aurelius-atlas-data2model-client"

[[tool.pyright.executionEnvironments]]
extraPaths = ["libs/python/aurelius-atlas-lineage-model-client/tests"]
root = "libs/python/aurelius-atlas-lineage-model-client"

[[tool.pyright.executionEnvironments]]
extraPaths = ["libs/python/aurelius-atlas-validate-entity-client/tests"]
root = "libs/python/aurelius-atlas-validate-entity-client"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
log_format = "%(message)s"
log_level = "INFO"
required_plugins = ["pytest-asyncio"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D105",
    "D212",
    "D107",
    "LOG015",
    "S311",
    "FIX002",
    "PT001",
    "TC001",
    "TC002",
    "TC003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase"]
runtime-evaluated-decorators = ["pydantic.validate_call", "attrs.define"]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["INP001"]
# The chart-contract harness shells out to `helm` and asserts on rendered YAML;
# the assert/subprocess safety codes are the harness's shape, not a hazard.
"**/test__*.py" = ["INP001", "S101", "PLR0913", "PLR2004"]
"tests/conftest.py" = ["INP001", "S101", "S603", "S607"]
"tools/griffe/*.py" = ["INP001", "ANN401", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
