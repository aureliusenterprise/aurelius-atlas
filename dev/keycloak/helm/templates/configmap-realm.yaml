{{/*
The realm ConfigMap (CHT-16, DD-256): the chart's files/master.json — a
byte-copy of dev/keycloak/import/master.json (the chart-contract test guards
the copy) — mounted at the import directory for --import-realm. The secret
placeholders stay verbatim: Keycloak's own replace-placeholders mechanism
(the JAVA_OPTS flag) resolves ${DEV_USER_*} and ${OTEL_INGEST_CLIENT_SECRET}
at import time from this container's environment, fed from the generated
Secrets (CHT-19). Helm does not substitute: a render must not produce a
credential a later render would regenerate (the DD-244 preserve rule lives in
the umbrella's lookup, not here).
*/}}
{{- if .Values.realm.import }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ printf "%s-realm" (include "atlas-keycloak.fullname" .) }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
data:
    master.json: |
        {{- .Files.Get "files/master.json" | nindent 8 }}
{{- end }}
