{{/*
The Keycloak StatefulSet (CHT-16). Prod mode — `kc.sh start`, never start-dev.
KC_HOSTNAME pins the issuer (the values/runbook warning). The browser listener
is TLS from the cert-manager Certificate; the management port (9000) is the
plain-HTTP probe surface. The realm ConfigMap mounts at the import directory
and Keycloak's own replace-placeholders resolves the secret placeholders from
this container's environment (DD-256). Telemetry envs render only when a
legacy-leg endpoint is configured (CHT-16).
*/}}
{{- $fullname := include "atlas-keycloak.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
spec:
    replicas: {{ int .Values.replicas }}
    serviceName: {{ include "atlas-keycloak.rssName" . }}
    selector:
        matchLabels:
            {{- include "atlas-keycloak.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "atlas-keycloak.labels" . | nindent 16 }}
                {{- with .Values.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with .Values.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 14 }}
            {{- end }}
        spec:
            serviceAccountName: {{ default $fullname .Values.serviceAccount.name }}
            {{- with .Values.global.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 14 }}
            {{- end }}
            securityContext:
                {{- toYaml .Values.podSecurityContext | nindent 16 }}
            initContainers:
                # The read-only root's build stage (DD-282 Tier 3): the image's
                # persisted build options (h2, health off, /auth) differ from
                # this chart's runtime env, so a bare `kc.sh start` re-runs the
                # Quarkus build at every boot — rewriting all of /opt/keycloak
                #/lib (the live overlay shows it). This stage copies the image
                # tree to an emptyDir and builds THERE with the chart's own
                # build-time options, so the container's start finds a current
                # build, writes nothing outside data/ + /tmp, and its whole
                # writable surface is the kc-home emptyDir. The three options
                # below are exactly the ones the runtime warns are unpersisted
                # (kc.db, kc.health-enabled, kc.http-relative-path — the
                # cluster validation's log line); a contract test pins the
                # parity pairs with the container's env (test__charts_keycloak).
                -   name: kc-build
                    image: {{ include "atlas-keycloak.image" . | quote }}
                    imagePullPolicy: IfNotPresent
                    command:
                        - /bin/sh
                        - -c
                        - >-
                            cp -r /opt/keycloak/. /kc-home/ &&
                            /kc-home/bin/kc.sh build --http-relative-path=/
                    env:
                        -   name: KC_DB
                            value: postgres
                        -   name: KC_HEALTH_ENABLED
                            value: "true"
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                - ALL
                        readOnlyRootFilesystem: true
                    resources:
                        {{- toYaml .Values.kcBuild.resources | nindent 24 }}
                    volumeMounts:
                        -   name: kc-home
                            mountPath: /kc-home
                        -   name: tmp
                            mountPath: /tmp
                {{- if and (eq .Values.database.flavor "bundled") .Values.postgres.enabled }}
                # The compose's `depends_on: condition: service_healthy` for the
                # database (DD-258). Kubernetes has no readiness-gated start, so
                # this waits for the headless Service to publish the database
                # pod — which happens only once that pod's own verify-full
                # pg_isready probe passes, so the wait is transitive on the DB
                # serving verified TLS. bash's /dev/tcp is the compose's KC
                # healthcheck shape and needs no client tool in the image.
                -   name: wait-for-postgres
                    image: {{ include "atlas-keycloak.image" . | quote }}
                    imagePullPolicy: IfNotPresent
                    command:
                        - /bin/bash
                        - -c
                        - |
                            until (exec 3<>/dev/tcp/{{ include "atlas-keycloak.pgFullname" . }}/{{ int .Values.postgres.service.port }}) 2>/dev/null; do
                                echo "waiting for {{ include "atlas-keycloak.pgFullname" . }}:{{ int .Values.postgres.service.port }}" >&2
                                sleep 2
                            done
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                - ALL
                        # bash's /dev/tcp opens no files — a read-only root is
                        # safe here (the keycloak container's own writable root
                        # is its documented decision, DD-282 follow-up).
                        readOnlyRootFilesystem: true
                    resources:
                        {{- toYaml .Values.waitForPostgres.resources | nindent 24 }}
            {{- end }}
            containers:
                -   name: keycloak
                    image: {{ include "atlas-keycloak.image" . | quote }}
                    imagePullPolicy: IfNotPresent
                    command:
                        - /opt/keycloak/bin/kc.sh
                        - start
                        - --import-realm
                        - --http-relative-path=/
                        - {{ printf "-Djgroups.dns.query=%s" (include "atlas-keycloak.rssName" .) | quote }}
                    env:
                        - name: KC_BOOTSTRAP_ADMIN_USERNAME
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.adminSecretName" . }}
                                  key: user
                        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.adminSecretName" . }}
                                  key: password
                        - name: KC_DB
                          value: postgres
                        - name: KC_DB_URL
                          value: {{ include "atlas-keycloak.jdbcUrl" . | quote }}
                        - name: KC_DB_USERNAME
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.dbSecretName" . }}
                                  key: user
                        - name: KC_DB_PASSWORD
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.dbSecretName" . }}
                                  key: password
                        - name: KC_HOSTNAME
                          value: {{ include "atlas-keycloak.host" . | quote }}
                        - name: KC_PROXY_HEADERS
                          value: xforwarded
                        - name: KC_HTTP_ENABLED
                          value: "false"
                        - name: KC_HEALTH_ENABLED
                          value: "true"
                        - name: KC_HTTPS_CERTIFICATE_FILE
                          value: {{ printf "%s/tls.crt" (trimSuffix "/" .Values.tls.mountPath) | quote }}
                        - name: KC_HTTPS_CERTIFICATE_KEY_FILE
                          value: {{ printf "%s/tls.key" (trimSuffix "/" .Values.tls.mountPath) | quote }}
                        - name: JAVA_OPTS
                          value: {{ include "atlas-keycloak.javaOpts" . | quote }}
                        {{- /* Realm placeholders resolved at import (DD-256). The demo users are the master asset's only (CHT-80): the hardened realm seeds no users, so its env — and the users Secret behind it — render for master alone. */}}
                        {{- if eq (include "atlas-keycloak.realmName" .) "master" }}
                        - name: DEV_USER_WRITER_PASSWORD
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.usersSecretName" . }}
                                  key: writer-password
                        - name: DEV_USER_READER_PASSWORD
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.usersSecretName" . }}
                                  key: reader-password
                        {{- end }}
                        {{- /* The otel-* import placeholders (DD-277, CHT-89):
                        the prod asset spells one placeholder per client
                        (CHT-87), so a non-master import gets one env per
                        client id; master's asset shares one placeholder and
                        keeps the single env. */}}
                        {{- $otelSecret := include "atlas-keycloak.otelClientsSecretName" . -}}
                        {{- if eq (include "atlas-keycloak.realmName" .) "master" }}
                        - name: OTEL_INGEST_CLIENT_SECRET
                          valueFrom:
                              secretKeyRef:
                                  name: {{ $otelSecret }}
                                  key: OTEL_INGEST_CLIENT_SECRET
                        {{- else }}
                        {{- range $client := (include "atlas-keycloak.otelClients" .) | fromJsonArray }}
                        {{- $env := printf "%s_CLIENT_SECRET" (replace "-" "_" $client | upper) }}
                        - name: {{ $env }}
                          valueFrom:
                              secretKeyRef:
                                  name: {{ $otelSecret }}
                                  key: {{ $client | quote }}
                        {{- end }}
                        {{- end }}
                        {{- /* CHT-83: the grafana client's secret placeholder —
                        the aurelius-atlas asset's only (CHT-81), so the env
                        and the Secret behind it render for every realm but
                        master (CHT-80's rule inverted: an unused credential
                        is not generated). master's asset has no grafana
                        client; the placeholder there would never resolve. */}}
                        {{- if ne (include "atlas-keycloak.realmName" .) "master" }}
                        - name: GRAFANA_CLIENT_SECRET
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.grafanaOauthSecretName" . }}
                                  key: client-secret
                        {{- end }}
                        {{- /* CHT-110 (10.12): the server client's placeholder —
                        both shipped assets carry it (the master asset since
                        6.1a/DD-250), so unlike grafana's (prod-only) this env
                        renders on every realm. */}}
                        - name: ATLAS_SERVER_CLIENT_SECRET
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.serverClientSecretName" . }}
                                  key: client-secret
                        {{- with (include "atlas-keycloak.telemetryEndpoint" .) }}
                        {{- /* Legacy-leg OTLP only, when telemetry resolves to
                        an endpoint (CHT-16/42): Keycloak is the issuer, so it
                        cannot present a Keycloak-minted JWT at its own boot
                        (DD-193/196). */}}
                        - name: OTEL_SERVICE_NAME
                          value: keycloak
                        - name: OTEL_EXPORTER_OTLP_ENDPOINT
                          value: {{ . | quote }}
                        - name: OTEL_EXPORTER_OTLP_CERTIFICATE
                          value: {{ include "atlas-keycloak.caPath" $ | quote }}
                        {{- /* Quarkus' OTLP sender ignores the generic
                        OTEL_EXPORTER_OTLP_CERTIFICATE (dev compose notes;
                        dev worked around it with a p12 truststore). The
                        runtime Quarkus knob is the fix (CHT-42). */}}
                        - name: QUARKUS_OTEL_EXPORTER_OTLP_TRUST_CERT_CERTS
                          value: {{ include "atlas-keycloak.caPath" $ | quote }}
                        - name: OTEL_TRACES_SAMPLER
                          value: parentbased_traceidratio
                        - name: OTEL_TRACES_SAMPLER_ARG
                          value: {{ $.Values.telemetry.tracesSamplerArg | quote }}
                        - name: OTEL_EXPORTER_OTLP_HEADERS
                          # The secret carries the composed header value
                          # ("Authorization=Bearer <token>") — env values
                          # cannot concat from a secretKeyRef.
                          valueFrom:
                              secretKeyRef:
                                  name: {{ include "atlas-keycloak.legacyTokenSecretName" $ }}
                                  key: otel-header
                        {{- end }}
                    ports:
                        - name: https
                          containerPort: {{ int .Values.service.port }}
                          protocol: TCP
                        - name: management
                          containerPort: {{ int .Values.service.managementPort }}
                          protocol: TCP
                        - name: jgroups
                          containerPort: 7800
                          protocol: TCP
                    volumeMounts:
                        - name: kc-home
                          # The kc-build stage's output, mounted as the
                          # runtime home (DD-282 Tier 3): the whole tree is
                          # writable, but a current build means the runtime
                          # writes only data/ (Narayana's recovery logs) and
                          # /tmp — never lib/ again.
                          mountPath: /opt/keycloak
                        - name: tmp
                          # hsperfdata, vertx-cache, uploads (the live
                          # overlay's tmp tree).
                          mountPath: /tmp
                        - name: tls
                          mountPath: {{ .Values.tls.mountPath | quote }}
                          readOnly: true
                        {{- if .Values.realm.import }}
                        - name: realm
                          mountPath: /opt/keycloak/data/import
                          readOnly: true
                        {{- end }}
                    startupProbe:
                        httpGet:
                            path: {{ .Values.probes.path }}
                            port: management
                            scheme: {{ .Values.probes.scheme }}
                        periodSeconds: {{ int .Values.probes.startup.periodSeconds }}
                        failureThreshold: {{ int .Values.probes.startup.failureThreshold }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                    readinessProbe:
                        httpGet:
                            path: {{ .Values.probes.path }}
                            port: management
                            scheme: {{ .Values.probes.scheme }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    livenessProbe:
                        httpGet:
                            path: {{ .Values.probes.path }}
                            port: management
                            scheme: {{ .Values.probes.scheme }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    resources:
                        {{- toYaml .Values.resources | nindent 24 }}
                    securityContext:
                        allowPrivilegeEscalation: false
                        # KSV-0014 closed (DD-282 Tier 3): the writable tree
                        # is the kc-home emptyDir, not the image root.
                        readOnlyRootFilesystem: true
                        capabilities:
                            drop:
                                - ALL
            volumes:
                -   name: kc-home
                    # The kc-build output (DD-282 Tier 3): a fresh build per
                    # pod — the same shape as the image's own startup build,
                    # just no longer against the root filesystem.
                    emptyDir: {}
                -   name: tmp
                    emptyDir: {}
                -   name: tls
                    secret:
                        secretName: {{ include "atlas-keycloak.tlsSecretName" . }}
                {{- if .Values.realm.import }}
                -   name: realm
                    configMap:
                        name: {{ printf "%s-realm" $fullname }}
                {{- end }}
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 14 }}
            {{- end }}
