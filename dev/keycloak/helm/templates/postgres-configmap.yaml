{{/*
The pg_hba (CHT-17): the dev sibling's, byte-for-byte in meaning — TLS-only
client authentication; the local socket stays open for the probe's pg_isready
inside the pod, every TCP connection must present TLS and a scram secret.
Mounted read-only and pointed at with -c hba_file= at boot.
*/}}
{{- if and (eq .Values.database.flavor "bundled") .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "atlas-keycloak.pgFullname" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labelsPG" . | nindent 8 }}
data:
    pg_hba.conf: |
        # TLS-only client authentication: local socket connections stay open for the
        # container healthcheck's sibling tools; every TCP connection must present TLS.
        # Mounted read-only; hba_file points at the copy made at startup.
        local all all trust
        hostssl all all all scram-sha-256
{{- end }}
