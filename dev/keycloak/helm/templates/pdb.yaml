{{/* The PodDisruptionBudget (CHT-18): the single replica is never fully
voluntarily disrupted. */}}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: {{ include "atlas-keycloak.fullname" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
spec:
    minAvailable: {{ int .Values.pdb.minAvailable }}
    selector:
        matchLabels:
            {{- include "atlas-keycloak.selectorLabels" . | nindent 12 }}
{{- end }}
