{{/* The ServiceAccount. Keycloak speaks to no Kubernetes API; the token has
no use here. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-keycloak.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
automountServiceAccountToken: false
{{- end }}
