{{/*
The browser-facing certificate (CHT-16, DD-243): cert-manager issues it from
the umbrella's issuer into the Secret the StatefulSet mounts. The SANs cover
both worlds: KC_HOSTNAME — the external host the issuer pins to, which the
browser presents SNI for — and every in-cluster name a peer can dial (the
ClusterIP Service, the RSS companion, and their FQDNs). The same Secret
carries ca.crt, the issuer root every trust decision in this pod chains to
(JDBC sslrootcert, CHT-17). cert-manager is a cluster prerequisite (runbook),
never installed by the chart. tls.secretName brings your own and this renders
nothing.
*/}}
{{- if and .Values.certificate.enabled (not .Values.tls.secretName) }}
{{- $fullname := include "atlas-keycloak.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
{{- $issuerRef := .Values.global.trust.issuerRef -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
spec:
    secretName: {{ include "atlas-keycloak.tlsSecretName" . }}
    duration: {{ .Values.certificate.duration }}
    renewBefore: {{ .Values.certificate.renewBefore }}
    subject:
        organizations:
            - aurelius-atlas
    dnsNames:
        - {{ include "atlas-keycloak.host" . }}
        - {{ $fullname }}
        - {{ printf "%s.%s" $fullname $ns }}
        - {{ printf "%s.%s.svc" $fullname $ns }}
        - {{ printf "%s.%s.svc.cluster.local" $fullname $ns }}
        - {{ include "atlas-keycloak.rssName" . }}
        - {{ printf "%s.%s.svc.cluster.local" (include "atlas-keycloak.rssName" .) $ns }}
    issuerRef:
        name: {{ required "global.trust.issuerRef.name is required (DD-243)" $issuerRef.name }}
        {{- with $issuerRef.kind }}
        kind: {{ . }}
        {{- end }}
{{- end }}
