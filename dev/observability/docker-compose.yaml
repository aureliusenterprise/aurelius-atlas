name: aurelius-atlas-dev-observability

services:
    otel-collector:
        image: dhi.io/opentelemetry-collector:0-debian13-contrib
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        # The OIDC extension discovers JWKS at extension start (DD-103): the
        # collector exits 1 while Keycloak is still booting, and the boot
        # order makes that window structural (DD-106) — keycloak (and the
        # other slice composes) attach this stack's network as external, so
        # Nx's implicitDependencies/^up chain and the e2e conftest fixtures
        # all start observability FIRST. The restart window carries the
        # collector over Keycloak's boot: Docker backs off 100ms doubling to
        # a 1min cap, 15 attempts ≈ 6 minutes — bounded, so a Keycloak that
        # never comes up fails loudly (compose up --wait exits on the final
        # crash; the watcher survives the intermediate exits) instead of
        # crash-looping into an open-ingest silence. The count syntax is
        # "on-failure:15" — no space, which YAML would read as a mapping.
        restart: on-failure:15
        depends_on:
            loki:
                condition: service_started
            tempo:
                condition: service_healthy
        environment:
            # ${VAR:?} guard: compose reads this project's .env (generated by
            # nx decrypt) for the interpolation; a missing value fails the
            # start loudly rather than booting an open-ingest collector.
            OTEL_COLLECTOR_INGEST_TOKEN: ${OTEL_COLLECTOR_INGEST_TOKEN:?}
            # The browser leg's token validator (DD-103): the user access
            # token the /otel/ proxies pass through, verified against this
            # issuer's JWKS. The dev defaults point at the dev Keycloak's
            # plaintext listener (ADR 039's named relaxation); e2e suites
            # override with their TLS issuer (the conftest's env), matching
            # the iss claim each stack's Keycloak mints. The extension
            # discovers JWKS from the issuer URL itself (collector ≥ 0.142
            # schema: providers/issuer_url), so there is no separate JWKS URL.
            OTEL_COLLECTOR_OIDC_ISSUER: ${OTEL_COLLECTOR_OIDC_ISSUER:-http://keycloak.localhost:8080/realms/master}
            # Empty string = no pinned CA: the dev issuer is plaintext, so
            # discovery/JWKS needs no trust anchor; the e2e override points
            # this at the shared dev CA mounted below.
            OTEL_COLLECTOR_OIDC_CA_FILE: ${OTEL_COLLECTOR_OIDC_CA_FILE:-}
        extra_hosts:
            # The JWKS fetch target: keycloak.localhost is the dev Keycloak's
            # published listener on this machine (same host-gateway mapping
            # the webapp e2e compose uses — Docker DNS does not resolve
            # .localhost names inside containers).
            - keycloak.localhost:host-gateway
        ports:
            # Loopback-pinned (CIA-03): the host mapping exists for producers
            # on this machine (dev-server proxies, host-gateway e2e paths),
            # never for the network. Producers inside compose stacks reach the
            # collector over service DNS, not these ports. 4318 is the browser
            # leg (OIDC), 4317/4319 the per-service leg (gRPC/HTTP, client
            # JWTs, DD-107), 4320/4321 the legacy leg (gRPC/HTTP, shared
            # token — Keycloak-native, the FastAPI example). The prometheus
            # exporter (:9464) is scraped by Prometheus inside this network
            # and needs no publish at all.
            - "127.0.0.1:4317:4317"
            - "127.0.0.1:4318:4318"
            - "127.0.0.1:4319:4319"
            - "127.0.0.1:4320:4320"
            - "127.0.0.1:4321:4321"
        volumes:
            - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
            - ./certs:/certs:ro
            # The shared dev CA (every project's mkcert CA is the same root):
            # the OIDC extension pins it when validating the e2e stack's
            # TLS-served Keycloak JWKS; the dev issuer (plaintext) leaves
            # the pin unset. Path is fixed so env overrides can be relative
            # to this project.
            - ../../apps/aurelius-atlas-webapp/certs:/dev-ca:ro

    prometheus:
        image: dhi.io/prometheus:3.13-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command:
            - "--config.file=/etc/prometheus/prometheus.yaml"
            - "--storage.tsdb.path=/var/prometheus"
            - "--web.enable-otlp-receiver"
        healthcheck:
            test: ["CMD", "promtool", "check", "ready"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "9090:9090"
        volumes:
            - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
            - prometheus-data:/var/prometheus

    loki:
        image: dhi.io/loki:3-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command: ["-config.file=/etc/loki/config.yaml"]
        ports:
            - "3100:3100"
        volumes:
            - ./config/loki.yaml:/etc/loki/config.yaml:ro
            - loki-data:/loki

    tempo:
        image: dhi.io/tempo:3-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command: ["-config.file=/etc/tempo/config.yaml"]
        healthcheck:
            test: ["CMD", "/opt/tempo/tempo", "-health"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "3200:3200"
        volumes:
            - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
            - tempo-data:/var/tempo

    grafana:
        image: dhi.io/grafana:13-debian13
        user: "65532"
        depends_on:
            loki:
                condition: service_started
            prometheus:
                condition: service_healthy
            tempo:
                condition: service_healthy
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
            - GF_AUTH_DISABLE_LOGIN_FORM=true
            - GF_USERS_VIEWERS_CAN_EDIT=true
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_PATHS_DATA=/var/lib/grafana/data
            - GF_PATHS_LOGS=/var/lib/grafana/logs
            - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
            - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
            - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana

networks:
    default:
        name: aurelius-atlas-dev-observability-network

volumes:
    grafana-data:
    loki-data:
    prometheus-data:
    tempo-data:
