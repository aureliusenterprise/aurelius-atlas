{{/*
Tempo's ConfigMap (CHT-39, DD-655): dev/observability/config/tempo.yaml
deep-merged with the internal-TLS overlay (the merge rule and its proof:
see configmap-loki.yaml). The base is the byte-copy asset (DD-256): the
OTLP receivers (gRPC :4317, HTTP :4318) and the HTTP/API :3200 bind inside
the pod, storage under /var/tempo (the PVC's mount); the cluster-internal
Service exposes the two the collector and Grafana dial (4318, 3200) and
:4317 stays unused in-cluster (CHT-36). The overlay puts TLS on all three:
server.http_tls_config covers :3200, and the OTLP receiver tls blocks
cover the ingest ports — :4318 carries the collector's exported spans, and
:4317 rides along so no plaintext ingest door exists even unexposed.
Tempo's own gRPC peer ports stay plaintext: single replica, in-memory ring
(all calls inside the pod, as in Loki).
*/}}
{{- if .Values.tempo.enabled -}}
{{- $fullname := include "atlas-observability.fullname" . -}}
{{- $mount := trimSuffix "/" .Values.tls.mountPath -}}
{{- $tls := dict "cert_file" (printf "%s/tls.crt" $mount) "key_file" (printf "%s/tls.key" $mount) -}}
{{- $overlay := dict "server" (dict "http_tls_config" $tls) "distributor" (dict "receivers" (dict "otlp" (dict "protocols" (dict "grpc" (dict "tls" $tls) "http" (dict "tls" $tls))))) -}}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ $fullname }}-tempo
    namespace: {{ include "atlas-observability.namespace" . }}
    labels:
        {{- include "atlas-observability.labels" . | nindent 8 }}
data:
    config.yaml: |
        {{- merge (fromYaml (.Files.Get "files/tempo.yaml")) $overlay | toYaml | nindent 8 }}
{{- end }}
