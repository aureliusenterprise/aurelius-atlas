{{/*
The Prometheus scrape ConfigMap (CHT-38, DD-655): dev/observability/config/
prometheus.yaml's five jobs with the native-histogram protocol pins kept,
retargeted to this chart's Service names (DD-266 — static configs, not
service discovery; no Prometheus Operator). The job_names are the contract
the observability-stack dashboard pins (job="otel-collector",
"otel-collector-internal", "loki", "tempo", "prometheus") and are unchanged.
Every target rides https with the trust CA pinned — the server itself
serves TLS (--web.config.file, deployment-prometheus.yaml), the collector's
prometheus exporter serves its leaf, and loki/tempo serve theirs (DD-655).
The exception is job otel-collector-internal: the collector's own telemetry
endpoint has no TLS option, the one plaintext scrape left (a noted
deviation, 10.14 — its metrics name pipeline health, not user data).
*/}}
{{- if .Values.prometheus.enabled -}}
{{- $fullname := include "atlas-observability.fullname" . -}}
{{- $ca := printf "%s/ca.crt" (trimSuffix "/" .Values.tls.mountPath) -}}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ $fullname }}-prometheus
    namespace: {{ include "atlas-observability.namespace" . }}
    labels:
        {{- include "atlas-observability.labels" . | nindent 8 }}
data:
    prometheus.yaml: |
        global:
            scrape_interval: 15s
            evaluation_interval: 15s

        scrape_configs:
            - job_name: prometheus
              scheme: https
              tls_config:
                  ca_file: {{ $ca }}
              static_configs:
                  - targets: ["{{ $fullname }}-prometheus:{{ int .Values.prometheus.probes.port }}"]

            - job_name: otel-collector
              # OTLP-pushed exponential histograms reach us as Prometheus
              # native histograms via the collector's prometheus exporter;
              # text scraping would flatten them to a lone +Inf bucket.
              scrape_protocols: ["PrometheusProto", "OpenMetricsText1.0.0", "PrometheusText0.0.4"]
              scrape_native_histograms: true
              scheme: https
              tls_config:
                  ca_file: {{ $ca }}
              static_configs:
                  - targets: ["{{ $fullname }}:{{ int .Values.service.metricsPort }}"]

            # Self-monitoring: the stack's own internal metrics. :8888 is the
            # collector's internal telemetry (otelcol_* pipeline health);
            # loki/tempo expose their own. Other slices' telemetry arrives via
            # OTLP push (their pullers, DD-266), never scrape. The one http
            # job: the collector's internal telemetry has no TLS option.
            - job_name: otel-collector-internal
              static_configs:
                  - targets: ["{{ $fullname }}:{{ int .Values.service.internalPort }}"]

            - job_name: loki
              scheme: https
              tls_config:
                  ca_file: {{ $ca }}
              static_configs:
                  - targets: ["{{ $fullname }}-loki:{{ int .Values.loki.probes.port }}"]

            - job_name: tempo
              scheme: https
              tls_config:
                  ca_file: {{ $ca }}
              static_configs:
                  - targets: ["{{ $fullname }}-tempo:{{ int .Values.tempo.probes.port }}"]

        # Prometheus's server TLS (DD-655): --web.config.file's
        # tls_server_config block, the only way the server speaks TLS. The
        # key is the exporter-toolkit's (tls_server is rejected at startup:
        # "field tls_server not found in type web.Config", proved live on
        # 3.13.2). It names the mounted leaf's files rather than carrying
        # key material (R5) — the Secret rides the same volume the config
        # mounts from (deployment-prometheus.yaml). The scrape and API —
        # including the OTLP receiver's flag above, which lives on this
        # same server — all arrive over TLS now.
    web-config.yaml: |
        tls_server_config:
            cert_file: {{ printf "%s/tls.crt" (trimSuffix "/" .Values.tls.mountPath) }}
            key_file: {{ printf "%s/tls.key" (trimSuffix "/" .Values.tls.mountPath) }}
{{- end }}
