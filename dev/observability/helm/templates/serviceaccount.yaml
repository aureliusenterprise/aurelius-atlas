{{/* The ServiceAccount. The stack speaks to no Kubernetes API; the token has
no use here. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-observability.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ include "atlas-observability.namespace" . }}
    labels:
        {{- include "atlas-observability.labels" . | nindent 8 }}
automountServiceAccountToken: false
{{- end }}
