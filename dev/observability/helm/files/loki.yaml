auth_enabled: false

server:
    http_listen_port: 3100

common:
    path_prefix: /loki
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules

schema_config:
    configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

# The logs' lifetime (RET-03, ADR 025): the compactor deletes every stream's
# chunks once they are 30 days old.
compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

limits_config:
    retention_period: 720h

analytics:
    reporting_enabled: false

ruler:
    alertmanager_url: http://localhost:9093
