# Slice-owned metrics puller: scrapes this Elasticsearch and pushes OTLP to
# the dev collector (https://otel-collector:4317, external network — see
# docker-compose.yaml). Elasticsearch speaks no OTLP for its own metrics, so a
# puller sidecar is the only push option; dev/observability stays
# project-agnostic by convention (ESD-06).
#
# TLS: the workspace CA (certs/ca.pem) validates the server leaf, whose SANs
# cover "elasticsearch".

receivers:
    elasticsearch:
        endpoint: https://elasticsearch:9200
        username: elastic
        password: ${env:ELASTICSEARCH_PASSWORD}
        tls:
            ca_file: /certs/ca.pem
        collection_interval: 30s

processors:
    resource:
        attributes:
            # Prometheus attribution: series carry exported_job="dev-elasticsearch".
            - action: upsert
              key: service.name
              value: dev-elasticsearch
    batch:

exporters:
    otlp:
        endpoint: https://otel-collector:4317
        # The per-service leg (DD-107, CIA-06): the oidc receiver accepts
        # only client-credentials JWTs; the oauth2client extension mints
        # and attaches the bearer per export (the shared-token header of
        # 7.17 is answered 401 on this leg, CIA-08).
        auth:
            authenticator: oauth2client
        tls:
            ca_file: /certs/ca.pem

extensions:
    # Per-service ingest identity (7.18, DD-107, CIA-07): mints
    # client-credentials JWTs as the otel-elasticsearch realm client (aud
    # otel-collector via the otel-ingest default scope), caches and refreshes
    # ahead of expiry. The token URL is the issuer's plaintext dev listener
    # (ADR 039's relaxation; the e2e conftest overrides with the TLS :8443
    # issuer + the CA pin); an empty ca_file = system trust (plaintext).
    # keycloak.localhost resolves via extra_hosts (host-gateway) in compose.
    oauth2client:
        token_url: ${env:OTEL_INGEST_TOKEN_URL}
        client_id: ${env:OTEL_INGEST_CLIENT_ID}
        client_secret: ${env:OTEL_INGEST_CLIENT_SECRET}
        tls:
            ca_file: ${env:OTEL_INGEST_CA_FILE}

service:
    extensions: [oauth2client]
    pipelines:
        metrics:
            receivers: [elasticsearch]
            processors: [resource, batch]
            exporters: [otlp]
