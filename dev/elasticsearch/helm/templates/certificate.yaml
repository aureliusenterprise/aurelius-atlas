{{/*
The HTTP certificate (CHT-12, DD-243): cert-manager issues it from the
umbrella's issuer into the Secret the StatefulSet mounts (projected into the
image's PEM names). The SANs cover every name a peer can dial: the ClusterIP
Service, the headless companion, and their FQDNs. cert-manager is a cluster
prerequisite (runbook), never installed by the chart. tls.secretName brings
your own and this renders nothing.
*/}}
{{- if and .Values.certificate.enabled (not .Values.tls.secretName) }}
{{- $fullname := include "atlas-elasticsearch.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
{{- $issuerRef := .Values.global.trust.issuerRef -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-elasticsearch.labels" . | nindent 8 }}
spec:
    secretName: {{ printf "%s-tls" $fullname }}
    duration: {{ .Values.certificate.duration }}
    renewBefore: {{ .Values.certificate.renewBefore }}
    subject:
        organizations:
            - aurelius-atlas
    dnsNames:
        - {{ $fullname }}
        - {{ printf "%s.%s" $fullname $ns }}
        - {{ printf "%s.%s.svc" $fullname $ns }}
        - {{ printf "%s.%s.svc.cluster.local" $fullname $ns }}
        - {{ include "atlas-elasticsearch.headlessName" . }}
        - {{ printf "%s.%s.svc.cluster.local" (include "atlas-elasticsearch.headlessName" .) $ns }}
    issuerRef:
        name: {{ required "global.trust.issuerRef.name is required (DD-243)" $issuerRef.name }}
        {{- with $issuerRef.kind }}
        kind: {{ . }}
        {{- end }}
{{- end }}
