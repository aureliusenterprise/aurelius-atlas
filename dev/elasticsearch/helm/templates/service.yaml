{{/*
The Services (CHT-10): the ClusterIP the server reaches, and the headless
companion that governs the StatefulSet's pod DNS.
*/}}
{{- $fullname := include "atlas-elasticsearch.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
    name: {{ $fullname }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-elasticsearch.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    ports:
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: https
          protocol: TCP
    selector:
        {{- include "atlas-elasticsearch.selectorLabels" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "atlas-elasticsearch.headlessName" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-elasticsearch.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    clusterIP: None
    publishNotReadyAddresses: true
    ports:
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: https
          protocol: TCP
    selector:
        {{- include "atlas-elasticsearch.selectorLabels" . | nindent 12 }}
