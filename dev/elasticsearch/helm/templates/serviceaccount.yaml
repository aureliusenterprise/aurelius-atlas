{{/* The ServiceAccount. The store speaks to no Kubernetes API; the token has
no use here. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-elasticsearch.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-elasticsearch.labels" . | nindent 8 }}
automountServiceAccountToken: false
{{- end }}
