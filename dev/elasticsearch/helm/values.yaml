# The search store chart — its runtime contract (CHT-02).
# The port, TLS layout, heap, and data volume of the Elasticsearch the server
# uses as its system of record (ADR 047). The workload is 10.2's (CHT-10..15):
# StatefulSet, the elasticsearch.yml ConfigMap, the exec openssl healthcheck,
# and the coredump-agent init fed by the aurelius-atlas-elasticsearch-agent
# image (DD-255).

# The umbrella's contract (CHT-03), declared whole — see atlas-server/values.yaml.
global:
    namespace: ""
    labels: {}
    image:
        registry: ghcr.io
        namespace: aureliusenterprise
        tag: ""
        pullSecrets: []
    storageClass: ""
    issuer:
        url: ""
    domain: ""
    dnsResolver: ""
    # The umbrella's realm (CHT-74): the realm the puller's ingest JWT mints
    # against. "" takes the chart default (aurelius-atlas).
    realm: ""
    # The issuer signing this store's HTTP certificate (DD-243). Namespaced
    # by default — the umbrella's chart-managed chain is an Issuer (DD-259).
    trust:
        issuerRef:
            name: aurelius-atlas-selfsigned
            kind: Issuer

enabled: true
component: elasticsearch
nameOverride: ""
fullnameOverride: ""

# Topology: single-node (discovery.type=single-node, transport TLS off — the
# dev arrangement, DD-006). replicas > 1 fails the render: the quorum-cluster
# switch (per-node transport certificates) is a later increment (CHT-10).
replicas: 1

image:
    # The hardened store image (dhi.io mirror path; a deployment may point at
    # its own mirror). The Aurelius app images live under global.image.
    # Digest-pinned (CHT-93, DD-278): bump tag and digest together — the
    # digest wins in the render (CHT-92), and the registry-drift guard
    # (CHT-96) fails a tag bump whose digest was not refreshed.
    repository: dhi.io/elasticsearch
    tag: "9.5-debian13"
    digest: sha256:18afc55bce2fdae289c80580769dfc27161ce24d7dc9e6727f8124ee61d0c375

# The coredump-filter javaagent (CHT-15, DD-255): an Aurelius-published image
# (it carries our jar, so it travels under global.image like the apps). The
# init container copies the jar to an emptyDir the store mounts at /agent.
agent:
    image:
        name: aurelius-atlas-elasticsearch-agent
        tag: ""
        # Operator override (CHT-92): a set digest always wins over the tag;
        # the agent's own bytes are attested by the chart signature (CHT-94).
        digest: ""

# The store's built-in `elastic` user (bootstrap password from
# <release>-elasticsearch/elastic-password, DD-244, generated by the umbrella —
# DD-254). secretName set brings your own (key: elastic-password).
auth:
    username: elastic
    secretName: ""

# The rendered elasticsearch.yml (CHT-11): the security contract (security on,
# TLS-only HTTP, transport TLS off, ML off, allow_mmap false) is fixed in the
# template; these are the knobs.
config:
    clusterName: aurelius-atlas
    # Prod keeps Elasticsearch's disk watermarks (the dev compose turns them
    # off for filling dev disks).
    diskThresholdEnabled: true

# Heap = half of memory limit is the rule; set both together. The chart
# renders ES_JAVA_OPTS as -Xms/-Xmx <heap> + the javaagent (CHT-15);
# extraJavaOpts appends after both.
resources:
    requests:
        cpu: 500m
        memory: 2Gi
    limits:
        memory: 2Gi
heap: 1g

extraJavaOpts: ""

persistence:
    size: 30Gi
    accessModes:
        - ReadWriteOnce

service:
    # The server reaches https://<service>.<ns>.svc:9200 with
    # ELASTICSEARCH_CA_CERTS pinned; a headless companion governs the
    # StatefulSet (CHT-10).
    port: 9200

# The slice-owned metrics puller (CHT-43, DD-266): Elasticsearch speaks no
# OTLP, so the chart runs the dev config/metrics-puller.yaml as a Deployment —
# the contrib collector image scraping this store and pushing OTLP (per-
# service leg, oauth2client mint) to the observability chart's collector.
telemetry:
    enabled: false
    # The collector Service; "" derives this release's atlas-observability
    # chart name (the siblingService name rule, as the server chart).
    service: ""
    # The collector's per-service gRPC leg (DD-196).
    port: 4317
    image:
        repository: dhi.io/opentelemetry-collector
        tag: "0-debian13-contrib"
        digest: sha256:79de5a3a0319b189dfb428d3fa36a39b8d83ee6605e106089ce78153f7f5ac6e
    # The issuer-wait init image (CHT-37's pattern, DD-226): a poll, not a
    # workload — curl retries natively and declares the same uid (65532, DD-269).
    issuerWait:
        image:
            repository: dhi.io/curl
            tag: "8"
            digest: sha256:229a580c4b21bffe98970883ae1c11248e82390454e5fec79109132f4b774862
    resources:
        requests:
            cpu: 50m
            memory: 128Mi
        limits:
            memory: 256Mi

tls:
    # "" takes the Certificate's Secret (<fullname>-tls); set to bring your
    # own (keys tls.crt/tls.key/ca.crt — projected into the image's PEM names
    # elasticsearch.pem / elasticsearch-key.pem / ca.pem, CHT-12).
    secretName: ""
    # Paths inside config/ (the image's ES_PATH_CONF): the yml names
    # tls/elasticsearch.pem etc. relative to the config dir (DD-006 layout).
    mountPath: /usr/share/elasticsearch/config/tls

certificate:
    # cert-manager issues the HTTP certificate from the umbrella's issuer
    # (CHT-12, DD-243); turn off when tls.secretName brings one by other means.
    # cert-manager is a cluster prerequisite, never installed by the chart.
    enabled: true
    duration: 2160h
    renewBefore: 720h

probes:
    # Exec probes: the hardened image has no curl, so openssl speaks HTTPS,
    # CA-pinned, as elastic, and green-or-yellow is healthy (CHT-14, DD-008).
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
    startup:
        periodSeconds: 10
        failureThreshold: 30

pdb:
    # Single-node store: one voluntary disruption at a time, never zero (CHT-18).
    enabled: true
    minAvailable: 1

serviceAccount:
    create: true
    name: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# The hardened image runs as its fixed non-root user (uid 1000 elasticsearch)
# and its entrypoint does no privilege drop (DD-257) — run it as that uid;
# forcing uid 0 makes the JVM refuse to boot ("can not run elasticsearch as
# root"). fsGroup 1000 hands the data volume to the JVM's group — the in-cluster
# shape of the compose's separate volume-init chown. No drop-ALL: keep the
# image's default capability set.
podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
        type: RuntimeDefault

containerSecurityContext:
    allowPrivilegeEscalation: false

# Network segmentation (CHT-64, DD-271): the ingress allow for the store —
# the server and this chart's metrics puller (when telemetry is on). 9300
# (transport) gets no rule: single-node has no peers (DD-006). peers.<peer>
# renames a peer's pods for a diverging deployment.
networkPolicy:
    enabled: true
    peers:
        server: ""

required: []
