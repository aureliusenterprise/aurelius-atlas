# Slice-owned metrics puller: reads the broker's Kafka-protocol metrics
# (topics, partitions, offsets, consumer groups / lag) and pushes OTLP to the
# dev collector (https://otel-collector:4317, external network — see
# docker-compose.yaml). The broker exposes no metrics endpoint and its metrics
# are JMX-only otherwise — a Prometheus JMX exporter would add a third-party
# jar to the hardened image, so the kafka_metrics receiver (franz-go client,
# part of the same contrib image) is the zero-footprint option.
#
# Auth: the INTERNAL listener (broker:9094) enforces mTLS
# (ssl.client.auth=required); this puller presents its own certgen leaf —
# the "metrics-puller" entry in tls.json, issued with clientAuth EKU like
# every leaf (no ACLs/authorizer on the broker, so any CA-valid cert is
# accepted). No credentials needed, so no ${env:...} here.
#
# protocol_version pins the verified-negotiated API level for Kafka 4.x
# (franz would negotiate the same, pinning keeps behaviour stable on bump).

receivers:
    kafka_metrics:
        brokers:
            - broker:9094
        protocol_version: 2.0.0
        scrapers:
            - topics
            - consumers
        collection_interval: 30s
        tls:
            ca_file: /certs/ca.pem
            cert_file: /certs/metrics-puller.pem
            key_file: /certs/metrics-puller-key.pem

processors:
    resource:
        attributes:
            # Prometheus attribution: the receiving collector's prometheus
            # exporter maps service.name to the job label.
            - action: upsert
              key: service.name
              value: dev-kafka
    batch:

exporters:
    otlp:
        endpoint: https://otel-collector:4317
        tls:
            ca_file: /certs/ca.pem

service:
    pipelines:
        metrics:
            receivers: [kafka_metrics]
            processors: [resource, batch]
            exporters: [otlp]
