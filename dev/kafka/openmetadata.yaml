source:
    type: kafka
    serviceName: aurelius-dev-kafka
    serviceConnection:
        config:
            type: Kafka
            # PUBLIC listener (SSL, mTLS, no auth): cert paths come from this
            # project's certgen output, bind-mounted at /certs by the
            # openmetadata-ingest target. Keep localhost:9092 — the OpenLineage
            # ingestion resolves kafka://<host:port> namespaces against these
            # bootstrapServers verbatim.
            bootstrapServers: localhost:9092
            schemaRegistryURL: https://localhost:8081
            consumerConfig:
                security.protocol: SSL
                ssl.endpoint.identification.algorithm: https
                ssl.ca.location: /certs/ca.pem
                ssl.certificate.location: /certs/openmetadata.pem
                ssl.key.location: /certs/openmetadata-key.pem
            schemaRegistryConfig:
                # Schema Registry serves plain TLS (server auth only); the CA
                # trust is enough, client material included for symmetry.
                # Only keys the confluent_kafka _RestClient understands are
                # accepted here — it rejects unknown properties outright, so
                # ssl.endpoint.identification.algorithm (a librdkafka key,
                # valid in consumerConfig above) must stay out: requests
                # verifies the hostname by default and the SR cert's SAN
                # already covers localhost.
                ssl.ca.location: /certs/ca.pem
    sourceConfig:
        config:
            type: MessagingMetadata
            topicFilterPattern:
                excludes:
                    - _.*
            generateSampleData: false

sink:
    type: metadata-rest
    config: {}

workflowConfig:
    loggerLevel: INFO
    openMetadataServerConfig:
        hostPort: "http://localhost:8585/api"
        authProvider: openmetadata
        securityConfig:
            jwtToken: ${OM_JWT_TOKEN}
