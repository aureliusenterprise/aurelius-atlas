source:
    type: openlineage
    # Must match the service the static sink pipeline is registered under:
    # OM stitches events to the dynamic pipeline "{jobNamespace}-{jobName}"
    # within this service. The sink connector emits jobNamespace
    # "aurelius-openlineage" and job "{connectorName}.{taskId}", so the static
    # pipeline is "aurelius-openlineage-aurelius-kafka-connect-jdbc-sink-example.0".
    serviceName: aurelius-openlineage
    serviceConnection:
        config:
            type: OpenLineage
            brokerConfig:
                # Kafka (Debezium sink transport) → OpenLineage events. The
                # broker's INTERNAL listener (SSL + mTLS, no SASL): the OM OL
                # client supports only username/password SASL, so the OAuth
                # listener is not usable here. Certs are PEM file paths inside
                # the ingestion container (passed verbatim as
                # ssl.*.location to librdkafka), mounted by the compose file.
                brokersUrl: "broker:9094"
                topicName: "openlineage-events"
                consumerGroupName: "openmetadata-consumer"
                consumerOffsets: earliest
                poolTimeout: 1.0
                sessionTimeout: 30
                securityProtocol: SSL
                # Fields are flattened here; the parser wraps them in the
                # RootModel internally.
                sslConfig:
                    caCertificate: /certs/ca.pem
                    sslCertificate: /certs/openlineage-ingestion.pem
                    sslKey: /certs/openlineage-ingestion-key.pem
    sourceConfig:
        config:
            type: PipelineMetadata
            includeLineage: true
            includeTags: true
            includeOwners: true
            # No-op for this connector by design: OM overrides
            # mark_pipelines_as_deleted() to a blank for OpenLineage (streaming
            # sources would false-delete between events), so statically
            # registered pipelines in this service are never removed by a run.
            markDeletedPipelines: false
            overrideLineage: false
            overrideMetadata: false
            # Table-side lineage is skipped without this: the OL mapper
            # resolves "public.entity" datasets only among these DB services.
            lineageInformation:
                dbServiceNames:
                    - aurelius-dev-postgres

sink:
    type: metadata-rest
    config: {}

workflowConfig:
    loggerLevel: INFO
    openMetadataServerConfig:
        hostPort: "http://openmetadata-server:8585/api"
        authProvider: openmetadata
        securityConfig:
            jwtToken: ${OM_JWT_TOKEN}
