# Slice-owned metrics puller: scrapes this Postgres and pushes OTLP to the
# dev collector (https://otel-collector:4317, external network — see
# docker-compose.yaml). Postgres speaks no OTLP, so a puller sidecar is the
# only push option; dev/observability stays slice-agnostic by convention.
#
# Env vars: the same dev defaults the postgres service itself gets
# (compose interpolates them into the container env; the collector expands
# ${env:...} at load time). TLS: the shared mkcert CA (certs/ca.pem) validates
# the server leaf, whose SANs cover "postgres" — verify-full works.

receivers:
    postgresql:
        endpoint: postgres:5432
        # Block sequence on purpose: in a flow list ([...]) the YAML parser
        # treats the colon inside ${env:...} as a key separator and the
        # collector's resolver never sees the placeholder.
        databases:
            - ${env:DATABASE_NAME}
        username: ${env:DATABASE_USERNAME}
        password: ${env:DATABASE_PASSWORD}
        tls:
            ca_file: /certs/ca.pem
        collection_interval: 30s

processors:
    resource:
        attributes:
            # Prometheus attribution: the receiving collector's prometheus
            # exporter maps service.name to the job label (series carry
            # exported_job="dev-postgres").
            - action: upsert
              key: service.name
              value: dev-postgres
    batch:

exporters:
    otlp:
        endpoint: https://otel-collector:4317
        # The per-service leg (DD-196, CIA-06): the oidc receiver accepts
        # only client-credentials JWTs; the oauth2client extension mints
        # and attaches the bearer per export (the shared-token header of
        # 7.17 is answered 401 on this leg, CIA-08).
        auth:
            authenticator: oauth2client
        tls:
            ca_file: /certs/ca.pem

extensions:
    # Per-service ingest identity (7.18, DD-196, CIA-07): mints
    # client-credentials JWTs as the otel-postgres realm client (aud
    # otel-collector via the otel-ingest default scope), caches and refreshes
    # ahead of expiry. The token URL (compose) is the issuer's TLS :8443
    # listener with the slice CA pinned (DD-202: every producer mints there,
    # the collector validates both listeners) — read from env so the mint
    # target lives once, in compose. keycloak.localhost resolves via
    # extra_hosts (host-gateway).
    oauth2client:
        token_url: ${env:OTEL_INGEST_TOKEN_URL}
        client_id: ${env:OTEL_INGEST_CLIENT_ID}
        client_secret: ${env:OTEL_INGEST_CLIENT_SECRET}
        tls:
            ca_file: ${env:OTEL_INGEST_CA_FILE}

service:
    extensions: [oauth2client]
    pipelines:
        metrics:
            receivers: [postgresql]
            processors: [resource, batch]
            exporters: [otlp]
