name: aurelius-atlas-dev-postgres

services:
    postgres:
        image: dhi.io/postgres:18-alpine3.23
        # Memory cap (CI capacity): the e2e fan-out runs this stack inside
        # the CI runner's dind daemon on a shared node.
        mem_limit: 512m
        environment:
            # ${VAR:?} guards: empty credentials would reinitialise the data
            # volume differently or crash-loop initdb obscurely; abort
            # interpolation instead. (DATABASE_PORT appears only in `ports:`,
            # where an empty value already fails config validation.)
            POSTGRES_USER: ${DATABASE_USERNAME:?}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?}
            POSTGRES_DB: ${DATABASE_NAME:?}
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        # The image runs as a fixed non-root user that cannot read bind-mounted
        # key material it does not own, so the certificates are copied to the
        # container filesystem with strict permissions before startup - and
        # Postgres insists the key is 0600, owned by the server user, so a
        # direct bind-mount at the ssl paths is not an option (host ownership).
        # mktemp -d, not a fixed /tmp path: the target must be born with the
        # running user's ownership every boot. Fixed paths collide on a warm
        # daemon - "File exists" (install, run 40225940082), then EACCES on
        # cp -f over a file owned by a previous run's uid (sticky /tmp
        # forbids unlinking foreign files; userns-remapped daemons change
        # uids across runs - run 40228376483).
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >-
                d=$(mktemp -d /tmp/atlas-certs.XXXXXX) &&
                install -m 600 /certs/postgres.pem $$d/server.pem &&
                install -m 600 /certs/postgres-key.pem $$d/server-key.pem &&
                exec docker-entrypoint.sh
                -c ssl=on
                -c ssl_cert_file=$$d/server.pem
                -c ssl_key_file=$$d/server-key.pem
                -c hba_file=/conf/pg_hba.conf
        stop_signal: SIGINT
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "PGSSLMODE=verify-full PGSSLROOTCERT=/certs/ca.pem pg_isready -h 127.0.0.1 -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - ${DATABASE_PORT}:${DATABASE_PORT}
        volumes:
            - data:/var/lib/postgresql
            - ./certs:/certs:ro
            - ./pg_hba.conf:/conf/pg_hba.conf:ro

    metrics-puller:
        # Slice-owned OTel collector: scrapes this Postgres and pushes OTLP
        # to the dev collector, so dev/observability never learns this slice
        # exists. Targets and attribution live in config/metrics-puller.yaml.
        image: dhi.io/opentelemetry-collector:0-debian13-contrib
        mem_limit: 256m
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        # The oauth2client extension mints its ingest JWT from Keycloak at
        # startup (DD-196): the collector's DD-195 restart pattern, applied
        # to the pullers now that the issuer — not a static token — gates
        # their export.
        restart: on-failure:15
        environment:
            # Same dev defaults the postgres service gets; the collector
            # expands ${env:...} in its config.
            DATABASE_NAME: ${DATABASE_NAME:?}
            DATABASE_USERNAME: ${DATABASE_USERNAME:?}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
            # Per-service ingest identity (7.18, DD-196): the puller mints
            # client-credentials JWTs as the otel-postgres realm client —
            # the oauth2client extension in config/metrics-puller.yaml
            # (mint, cache, refresh).
            OTEL_INGEST_CLIENT_ID: otel-postgres
            OTEL_INGEST_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            # The mint target is the Keycloak TLS listener, literal (DD-202):
            # the iss a token carries is the listener that minted it, and this
            # value is baked into the container at creation — an env default
            # let suite start-order mix mint issuer with collector validator
            # (the ESD-06 401 starvation). The collector validates both
            # listeners; every producer mints here, so one world, no flip.
            # CA: this slice's certs/ (the shared mkcert root, same material).
            OTEL_INGEST_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            OTEL_INGEST_CA_FILE: /certs/ca.pem
        extra_hosts:
            # The mint target: this slice has no Keycloak of its own, so
            # keycloak.localhost is the dev Keycloak's published listener on
            # this machine (the collector's JWKS fetch uses the same mapping).
            - keycloak.localhost:host-gateway
        volumes:
            - ./config/metrics-puller.yaml:/etc/otelcol-contrib/config.yaml:ro
            - ./certs:/certs:ro
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - default
            - observability

networks:
    default:
        name: aurelius-atlas-dev-postgres-network
    # The dev telemetry stack (dev/observability). Attaching is safe because
    # nx guarantees the chain (this project's implicitDependencies on
    # aurelius-atlas-dev-observability make `nx up`/`serve` start it first; e2e
    # fixtures inherit the guarantee through their dependents), and the
    # network exists as soon as observability is up.
    observability:
        name: aurelius-atlas-dev-observability-network
        external: true

volumes:
    data:
