# The minikube environment (CHT-04: environment = values, not a chart fork).
# Targets the devcontainer's minikube: Envoy Gateway as the GatewayClass, the
# chart's self-signed issuer for trust, *.atlas.test hosts via the tunnel
# (runbook: minikube tunnel + /etc/hosts entries).
global:
    domain: atlas.test
    gateway:
        className: envoy-gateway
    storageClass: ""

# Client-IP trust for the two-hop edge (DD-261/CHT-32): minikube's pod
# network is 10.244.0.0/16, and both the Envoy Gateway data plane and the
# webapp pods live in it — the webapp resolves X-Forwarded-For only from
# that network, and the server trusts X-Forwarded-For only from it.
atlas-webapp:
    nginx:
        trustedProxyCIDRs:
            - 10.244.0.0/16
atlas-server:
    forwardedAllowIps: "10.244.0.0/16"
    # The parity scenarios assert a tasks-disabled installation (DD-081), the
    # same pin the compose e2e stack carries (AURELIUS_ATLAS_SERVER_TASKS_ENABLED
    # in apps/aurelius-atlas-server/e2e/docker-compose.yaml). The 10.5 POC lane
    # runs those scenarios here, so the cluster must answer /session with
    # atlas.tasks.enabled=false too.
    config:
        AURELIUS_ATLAS_SERVER_TASKS_ENABLED: "false"

# The aux twins accept the webapp-client audience on this environment (CHT-105,
# DD-282): the e2e suites mint `azp=aurelius` tokens from the realm's public
# `aurelius` client (CHT-79), and the cluster lane proves the twins with those
# tokens. The shipped chart defaults stay per-service (a stock install keeps
# the narrow audience); the override is environment configuration, CHT-04.
atlas-data2model:
    config:
        AURELIUS_ATLAS_DATA2MODEL_AUTH_AUDIENCE: aurelius
atlas-validate-entity:
    config:
        AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE: aurelius
