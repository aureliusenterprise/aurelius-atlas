# The GKE environment overlay (validated on a real GKE cluster, the 10.13
# increment; its first validation was 10.5's cluster hand check).
# Cloud-agnostic core unchanged (CHT-04): only values. Prerequisites the
# runbook installs: GKE Gateway (`--gateway-api=standard` plus the
# Certificate Manager API — the managed Gateway refuses backend-TLS
# features without it), the ACME ClusterIssuer named below (DNS-01 on
# Cloud DNS) with public DNS for every browser host, and the dhi.io / ghcr
# pull secrets.
global:
    # Set to the deployment's real domain (issuer immutability warning!).
    domain: atlas.example.com
    gateway:
        className: gke-l7-global-external-managed
        # Browser trust (DD-643): Let's Encrypt signs the browser leaves and
        # nothing else moves — the private CA the chart builds (createIssuer
        # stays on) keeps signing the internal Service leaves, because a
        # public CA cannot mint .svc.cluster.local names. The old posture
        # (createIssuer: false, ACME as the global issuer) broke exactly
        # there: cert-manager orders for the internal names failed forever.
        edge:
            issuerRef:
                name: atlas-public
                kind: ClusterIssuer
            certificate:
                privateKey:
                    # ECDSA gives a smaller and faster leaf that every
                    # current browser trusts. It does not move the Let's
                    # Encrypt limit, which counts names rather than key
                    # types.
                    algorithm: ECDSA
                    size: 256
        # The managed Gateway probes backends with plain HTTP unless told
        # (DD-645); every TLS backend behind the edge then reads unhealthy
        # and the Gateway answers 500 from a synthetic failure backend.
        healthCheck:
            enabled: true
    storageClass: standard-rwo

# Client-IP trust for the two-hop edge (DD-261/CHT-32): the Gateway data
# plane and the webapp pods both live in the cluster's alias IP range —
# confirm it with `gcloud container clusters describe <c> -o
# json | jq .ipAllocationPolicy` and set both to it. The range below is
# GKE's VPC-native default (the 10.13 cluster validation ran on it).
atlas-webapp:
    nginx:
        trustedProxyCIDRs:
            - 10.4.0.0/14
atlas-server:
    forwardedAllowIps: "10.4.0.0/14"
