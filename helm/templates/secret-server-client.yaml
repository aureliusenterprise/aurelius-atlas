{{/*
The Atlas server's confidential-client secret (CHT-109, 10.12 — 6.1a's chart
half). Two consumers read the one Secret: the Keycloak chart's StatefulSet
feeds it to the realm import's ${ATLAS_SERVER_CLIENT_SECRET} placeholder
(CHT-110 — the placeholder both shipped assets carry, master's client since
6.1a/DD-250), and the server chart's Deployment joins it into
AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET (CHT-108) — the client and its
verifying server must present the same secret.

The gate covers both consumers and, unlike grafana's credential (CHT-83), is
not realm-gated: every shipped realm asset carries the client, so any
keycloak install needs the credential for its import and any server install
needs it for its boot. With neither consumer installed nothing generates
(CHT-80's unused-credential rule).

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- $kc := index .Values "atlas-keycloak" | default dict -}}
{{- $keycloak := $kc.enabled -}}
{{- $server := index .Values "atlas-server" | default dict -}}
{{- if or $keycloak $server.enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-server-client" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $secret := default (get $existing "client-secret" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.serverClient.clientSecret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    client-secret: {{ $secret | quote }}
{{- end }}
