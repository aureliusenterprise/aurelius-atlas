{{/*
The platform admin service client's secret (DD-663). The realm import resolves
the ${ATLAS_ADMIN_CLIENT_SECRET} placeholder of the aurelius-atlas-admin client
from it (both shipped assets carry the client); the Secret is also the
operator's handle for the credential — a client-credentials token of that
client carries the four server roles and drives the admin operations (import,
export, purge, audits) without a human sign-in. Gated as the provisioning
client's is: either consumer installed, it generates.

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- $kc := index .Values "atlas-keycloak" | default dict -}}
{{- $keycloak := $kc.enabled -}}
{{- $server := index .Values "atlas-server" | default dict -}}
{{- if or $keycloak $server.enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-admin-client" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $secret := default (get $existing "client-secret" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.adminClient.clientSecret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    client-secret: {{ $secret | quote }}
{{- end }}
