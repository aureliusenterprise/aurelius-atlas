{{/*
The provisioning command's client secret (TRM-11, 15.5b; DD-600). Two consumers
read the one Secret: the Keycloak chart's StatefulSet feeds it to the realm
import's ${PROVISIONING_CLIENT_SECRET} placeholder, and the server chart's
tenant provisioning Job and operators CronJob join it into
AURELIUS_ATLAS_SERVER_TENANCY_ADMIN_CLIENT_SECRET. Gated as the server
client's is: either consumer installed, it generates.

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- $kc := index .Values "atlas-keycloak" | default dict -}}
{{- $keycloak := $kc.enabled -}}
{{- $server := index .Values "atlas-server" | default dict -}}
{{- if or $keycloak $server.enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-provisioning-client" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $secret := default (get $existing "client-secret" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.provisioningClient.clientSecret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    client-secret: {{ $secret | quote }}
{{- end }}
