{{/*
One HTTPRoute per listener (CHT-30, DD-242). Routing stays coarse: each route
is hostname-pinned to its listener's host with a single backend — the webapp's
/api and /otel proxy is the tested data path (DD-142) and the gateway
deliberately does not duplicate it with path rules.

A BackendTLSPolicy attaches to the backend Service and is what makes Envoy
speak TLS upstream: the server (dashboard host) and Keycloak serve TLS on
their service ports (SRV-06; CHT-16), so their routes get one — validation
pinned to the system's trust root (the CA Secret, key ca.crt; the Gateway API
v1 field is caCertificateRefs, a list) with the Service name as the SNI
hostname, which doubles as the SAN check and matches the SAN every chart
Certificate carries (CHT-22). The webapp and Grafana are plaintext behind the
gateway (DD-242) and get none.
*/}}
{{- if .Values.global.gateway.enabled -}}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $ca := include "aurelius-atlas.caSecretName" . -}}
{{- range $l := fromJsonArray (include "aurelius-atlas.edge.listeners" .) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ printf "%s-%s" $.Release.Name (index $l "name") }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" $ | nindent 8 }}
spec:
    parentRefs:
        - name: {{ $.Release.Name }}
          sectionName: {{ index $l "name" }}
    hostnames:
        - {{ index $l "host" | quote }}
    rules:
        - backendRefs:
              - name: {{ index $l "backend" }}
                port: {{ int (index $l "port") }}
{{- if index $l "tlsBackend" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
    name: {{ printf "%s-%s" $.Release.Name (index $l "backend") }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" $ | nindent 8 }}
spec:
    targetRefs:
        - group: ""
          kind: Service
          name: {{ index $l "backend" }}
    validation:
        caCertificateRefs:
            - group: ""
              kind: Secret
              name: {{ $ca }}
        hostname: {{ index $l "backend" | quote }}
{{- end }}
{{- end }}
{{- end }}
