{{/*
One HTTPRoute per listener (CHT-30, DD-285). Routing stays coarse: each route
is hostname-pinned to its listener's host with a single backend — the webapp's
/api and /otel proxy is the tested data path (DD-142) and the gateway
deliberately does not duplicate it with path rules.

A BackendTLSPolicy attaches to the backend Service and is what makes Envoy
speak TLS upstream: the webapp (DD-270), the server (dashboard host), and
Keycloak serve TLS on their service ports (SRV-06; CHT-16), so their routes
get one — validation pinned to the system's trust root with the Service name
as the SNI hostname, which doubles as the SAN check and matches the SAN
every chart Certificate carries (CHT-22). The pin names the backend-CA
ConfigMap, not the CA Secret: Gateway implementations that read this API
(GKE's managed Gateway) accept only ConfigMap refs and reject the Secret
outright, while cert-manager keeps CAs in Secrets (DD-259) — the
<release>-backend-ca ConfigMap, synced from the CA Secret by the
trust-manager Bundle (ca-bundle.yaml, DD-652), carries the same PEM across
the two kinds. Grafana is the one plaintext
backend behind the gateway and gets none: the edge terminates TLS in front
of it and its login is the realm's (CHT-84, DD-275 — supersedes the
anonymous-Viewer posture of DD-267), so no BackendTLSPolicy hop exists. The
plaintext hop still needs a health check, which healthchecks.yaml renders
as the HTTP variant (DD-653).
*/}}
{{- if .Values.global.gateway.enabled -}}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- range $l := fromJsonArray (include "aurelius-atlas.edge.listeners" .) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ printf "%s-%s" $.Release.Name (index $l "name") }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" $ | nindent 8 }}
spec:
    parentRefs:
        - name: {{ $.Release.Name }}
          sectionName: {{ index $l "name" }}
    hostnames:
        - {{ index $l "host" | quote }}
    rules:
        - backendRefs:
              - name: {{ index $l "backend" }}
                port: {{ int (index $l "port") }}
{{- if index $l "tlsBackend" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
    name: {{ printf "%s-%s" $.Release.Name (index $l "backend") }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" $ | nindent 8 }}
spec:
    targetRefs:
        - group: ""
          kind: Service
          name: {{ index $l "backend" }}
    validation:
        caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: {{ printf "%s-backend-ca" $.Release.Name }}
        hostname: {{ index $l "backend" | quote }}
{{- end }}
{{- end }}
{{- end }}
