{{/*
The validate-entity app's service-client secret (CHT-113, 12.7 — VEV-04's chart
half). Two consumers read the one Secret: the Keycloak chart's StatefulSet
feeds it to the realm import's ${VALIDATE_ENTITY_CLIENT_SECRET} placeholder —
carried by the MASTER asset only (the prod realm's client join lands with 12.3,
12.7's spec: on the prod realm the placeholder does not exist and the import
would never resolve it) — and the validate-entity chart's Deployment joins it
into AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_CLIENT_SECRET (DD-499: the app mints
its own identity to read the governance rules).

Unlike the server credential (CHT-109, both realms), this one gates like the
demo users (CHT-80): the import consumer exists only on master. The Deployment
consumer keeps generating whenever the app is installed, so a prod-realm
cluster still boots the app; without the realm client its mint is refused and
VEV-06 answers 502 — no verdicts rather than invented ones.

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- $kc := index .Values "atlas-keycloak" | default dict -}}
{{- $app := index .Values "atlas-validate-entity" | default dict -}}
{{- $kcRealm := default (default "aurelius-atlas" .Values.global.realm) (default "" (get (default dict $kc.realm) "name")) -}}
{{- if or (and $kc.enabled (eq $kcRealm "master")) $app.enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-validate-entity-client" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $secret := default (get $existing "client-secret" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.validateEntityClient.clientSecret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    client-secret: {{ $secret | quote }}
{{- end }}
