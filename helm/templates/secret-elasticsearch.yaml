{{/*
Deploy-time credentials (DD-244, CHT-19, DD-254). The umbrella generates every
empty credential with randAlphaNum 32 and preserves it across upgrades:
`lookup` reads the live Secret first, so an upgrade re-uses what the first
install minted; a value supplied in values wins over both. None is ever
committed (R5); retrieval is `kubectl get secret -n <ns> <release>-<purpose>`.

Each block renders only while its consumer chart is enabled — disable the
consumer and its credential stops being generated. The five secrets here are
exactly the set 10.2's stateful workloads consume (CHT-13/16); the remaining
credentials land with their consumers (10.3/10.4). The component charts
consume by the <release>-<purpose> name; their *SecretName values bring your
own, in which case set the matching block's values to skip generation.

One file per Secret: Helm splits documents per file before parsing, which is
what keeps the block-gate `{{- ` trims from ever joining two manifests.
*/}}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- if and (index .Values "atlas-elasticsearch") (index .Values "atlas-elasticsearch").enabled }}
{{- $name := printf "%s-elasticsearch" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $password := default (get $existing "elastic-password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.elasticsearch.password | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    elastic-password: {{ $password | quote }}
{{- end }}
