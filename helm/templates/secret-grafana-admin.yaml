{{/*
Grafana's admin identity (CHT-40, DD-267). The observability chart joins it
into GF_SECURITY_ADMIN_USER/PASSWORD so a deployed instance is never
ship-defaulted; the login form stays disabled either way (the compose's
anonymous-Viewer read posture, R5), which makes this the API and
account-recovery credential rather than a daily login.

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- if and (index .Values "atlas-observability") (index .Values "atlas-observability").enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-grafana-admin" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $user := default (get $existing "user" | default (randAlphaNum 16 | b64enc)) (.Values.secrets.grafanaAdmin.user | b64enc) -}}
{{- $password := default (get $existing "password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.grafanaAdmin.password | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    user: {{ $user | quote }}
    password: {{ $password | quote }}
{{- end }}
