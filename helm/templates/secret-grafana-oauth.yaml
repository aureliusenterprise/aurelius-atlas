{{/*
Grafana's relying-party client secret (CHT-83, DD-275). Two consumers read
the one Secret: the Keycloak chart's StatefulSet feeds it to the realm
import's ${GRAFANA_CLIENT_SECRET} placeholder (CHT-81, the same placeholder
mechanism as ${OTEL_INGEST_CLIENT_SECRET}), and the observability chart's
Grafana container joins it into GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (CHT-84)
— the client and its relying party must present the same secret.

The gate covers both consumers: the observability chart's Grafana joins the
Secret into its env whenever it runs, and the keycloak chart needs it only
when the imported realm carries the grafana client (CHT-83: realm `master`
has none, so a master install generates no grafana credential — CHT-80's
rule). With neither consumer installed nothing generates.

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- $kc := index .Values "atlas-keycloak" | default dict -}}
{{- $keycloak := and $kc.enabled (ne (default (default "aurelius-atlas" .Values.global.realm) $kc.realm.name | default "aurelius-atlas") "master") -}}
{{- $observability := and (index .Values "atlas-observability") (index .Values "atlas-observability").enabled -}}
{{- if or $keycloak $observability }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-grafana-oauth" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $secret := default (get $existing "client-secret" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.grafanaOauth.clientSecret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    client-secret: {{ $secret | quote }}
{{- end }}
