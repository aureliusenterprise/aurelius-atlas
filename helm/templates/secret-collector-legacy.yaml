{{/*
The collector's legacy-leg token (CHT-31, DD-254/DD-256). Generation and
upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.

Two keys, one value: `token` is what a client puts in the Authorization
header's Bearer scheme, and `otel-header` is the composed OTLP env form
("Authorization=Bearer <token>") — OTEL_EXPORTER_OTLP_HEADERS cannot
concatenate from a secretKeyRef, so the composition happens once here. The
consumers so far: the webapp's nginx edge exporter (token → its
${AURELIUS_ATLAS_WEBAPP_OTEL_INGEST_TOKEN} placeholder, CHT-25) and the
Keycloak chart's OTLP ref (otel-header, dormant until 10.3b points
telemetry.endpoint at a collector). The gate covers both consumers; with
neither installed nothing generates.
*/}}
{{- $webapp := and (index .Values "atlas-webapp") (index .Values "atlas-webapp").enabled -}}
{{- $keycloak := and (index .Values "atlas-keycloak") (index .Values "atlas-keycloak").enabled -}}
{{- if or $webapp $keycloak }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $name := printf "%s-collector-legacy" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" $ns $name).data | default dict -}}
{{- $token := default (get $existing "token" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.collectorLegacy.token | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    token: {{ $token | quote }}
    otel-header: {{ printf "Authorization=Bearer %s" ($token | b64dec) | b64enc | quote }}
{{- end }}
