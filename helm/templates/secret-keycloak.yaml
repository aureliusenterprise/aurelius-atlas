{{/*
Keycloak's generated credentials (CHT-16/19, DD-254): the admin bootstrap, the
database role (shared with the bundled Postgres — both ends read the same
Secret, CHT-17), the demo-user passwords the realm import fills
(${DEV_USER_*}), and the otel-* ingest client secrets (DD-277, CHT-88).

The demo-user Secret renders only when the Keycloak chart imports the
`master` realm (CHT-80, DD-273): the hardened `aurelius-atlas` realm seeds
no users — an operator provisions them through the admin console — so a
stock install generates no demo passwords. The comparison mirrors the
subchart's realmName rule (realm.name, then global.realm, then the
production default) with chart-local values.

The otel-clients Secret carries exactly the keys the imported realm consumes
(CHT-88): the prod realm's asset has one placeholder per client
(${OTEL_<ID>_CLIENT_SECRET}, CHT-87), so a non-master render generates one
independently preserved value per client id — rotating or supplying one
never disturbs the others; `master`'s asset shares one placeholder, so the
hatch keeps the single OTEL_INGEST_CLIENT_SECRET key. The roster mirrors the
prod asset's otel-* clients (the chart-local copy per DD-247; the umbrella
suite pins it against the asset).

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- if and (index .Values "atlas-keycloak") (index .Values "atlas-keycloak").enabled }}
{{- $kcRealm := default (default "aurelius-atlas" .Values.global.realm) (index .Values "atlas-keycloak").realm.name -}}
{{- $otelClients := list "otel-atlas-server" "otel-data2model" "otel-elasticsearch" "otel-keycloak" "otel-lineage-model" "otel-postgres" "otel-validate-entity" -}}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $admin := printf "%s-keycloak-admin" .Release.Name -}}
{{- $adminExisting := (lookup "v1" "Secret" $ns $admin).data | default dict -}}
{{- $adminUser := default (get $adminExisting "user" | default (randAlphaNum 16 | b64enc)) (.Values.secrets.keycloakAdmin.user | b64enc) -}}
{{- $adminPassword := default (get $adminExisting "password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakAdmin.password | b64enc) -}}
{{- $db := printf "%s-keycloak-database" .Release.Name -}}
{{- $dbExisting := (lookup "v1" "Secret" $ns $db).data | default dict -}}
{{- $dbUser := default (get $dbExisting "user" | default (randAlphaNum 16 | b64enc)) (.Values.secrets.keycloakDatabase.user | b64enc) -}}
{{- $dbPassword := default (get $dbExisting "password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakDatabase.password | b64enc) -}}
{{- $otel := printf "%s-otel-clients" .Release.Name -}}
{{- $otelExisting := (lookup "v1" "Secret" $ns $otel).data | default dict -}}
{{- $otelShared := default (get $otelExisting "OTEL_INGEST_CLIENT_SECRET" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.otelClients.secret | b64enc) -}}
{{- $otelSupplied := .Values.secrets.otelClients.clients | default dict -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $admin }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    user: {{ $adminUser | quote }}
    password: {{ $adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $db }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    user: {{ $dbUser | quote }}
    password: {{ $dbPassword | quote }}
{{- if eq $kcRealm "master" }}
---
{{- $users := printf "%s-keycloak-users" .Release.Name -}}
{{- $usersExisting := (lookup "v1" "Secret" $ns $users).data | default dict -}}
{{- $writer := default (get $usersExisting "writer-password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakUsers.writerPassword | b64enc) -}}
{{- $reader := default (get $usersExisting "reader-password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakUsers.readerPassword | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $users }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    writer-password: {{ $writer | quote }}
    reader-password: {{ $reader | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $otel }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    {{- if eq $kcRealm "master" }}
    OTEL_INGEST_CLIENT_SECRET: {{ $otelShared | quote }}
    {{- else }}
    {{- range $client := $otelClients }}
    {{- $value := default (get $otelExisting $client | default (randAlphaNum 32 | b64enc)) (get $otelSupplied $client | default "" | b64enc) }}
    {{ $client | quote }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
{{- end }}
