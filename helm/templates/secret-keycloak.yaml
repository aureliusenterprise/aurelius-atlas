{{/*
Keycloak's generated credentials (CHT-16/19, DD-254): the admin bootstrap, the
database role (shared with the bundled Postgres — both ends read the same
Secret, CHT-17), the demo-user passwords the realm import fills
(${DEV_USER_*}), and the otel-* ingest client secret the realm's service
accounts share (${OTEL_INGEST_CLIENT_SECRET} placeholders, DD-256).

Generation and upgrade-preservation follow the pattern documented in
secret-elasticsearch.yaml: lookup first, values override, randAlphaNum fresh.
*/}}
{{- if and (index .Values "atlas-keycloak") (index .Values "atlas-keycloak").enabled }}
{{- $ns := include "aurelius-atlas.namespace" . -}}
{{- $admin := printf "%s-keycloak-admin" .Release.Name -}}
{{- $adminExisting := (lookup "v1" "Secret" $ns $admin).data | default dict -}}
{{- $adminUser := default (get $adminExisting "user" | default (randAlphaNum 16 | b64enc)) (.Values.secrets.keycloakAdmin.user | b64enc) -}}
{{- $adminPassword := default (get $adminExisting "password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakAdmin.password | b64enc) -}}
{{- $db := printf "%s-keycloak-database" .Release.Name -}}
{{- $dbExisting := (lookup "v1" "Secret" $ns $db).data | default dict -}}
{{- $dbUser := default (get $dbExisting "user" | default (randAlphaNum 16 | b64enc)) (.Values.secrets.keycloakDatabase.user | b64enc) -}}
{{- $dbPassword := default (get $dbExisting "password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakDatabase.password | b64enc) -}}
{{- $users := printf "%s-keycloak-users" .Release.Name -}}
{{- $usersExisting := (lookup "v1" "Secret" $ns $users).data | default dict -}}
{{- $writer := default (get $usersExisting "writer-password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakUsers.writerPassword | b64enc) -}}
{{- $reader := default (get $usersExisting "reader-password" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.keycloakUsers.readerPassword | b64enc) -}}
{{- $otel := printf "%s-otel-clients" .Release.Name -}}
{{- $otelExisting := (lookup "v1" "Secret" $ns $otel).data | default dict -}}
{{- $otelSecret := default (get $otelExisting "OTEL_INGEST_CLIENT_SECRET" | default (randAlphaNum 32 | b64enc)) (.Values.secrets.otelClients.secret | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $admin }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    user: {{ $adminUser | quote }}
    password: {{ $adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $db }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    user: {{ $dbUser | quote }}
    password: {{ $dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $users }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    writer-password: {{ $writer | quote }}
    reader-password: {{ $reader | quote }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $otel }}
    namespace: {{ $ns }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
type: Opaque
data:
    OTEL_INGEST_CLIENT_SECRET: {{ $otelSecret | quote }}
{{- end }}
