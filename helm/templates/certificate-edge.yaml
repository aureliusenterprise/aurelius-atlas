{{/*
The browser-host certificate (CHT-29). One umbrella Certificate covering the
browser-facing names the umbrella owns — the atlas host and, when enabled, the
dashboard and grafana hosts — into the Secret the HTTPS listeners terminate
from (<release>-edge-tls). The keycloak host is deliberately absent: its
certificate belongs to the Keycloak chart (its issuer pin, CHT-16) and the
keycloak listener reuses that Secret — unless global.gateway.edge.issuerRef
names a separate browser issuer (DD-643), which moves both browser leaves
off the private CA (a public-SAN-only keycloak companion, below).
cert-manager is a cluster prerequisite (runbook), never installed here.
The issuer is global.gateway.edge.issuerRef when set, else the system's
trust issuer (DD-286) — the same root every in-cluster leaf chains to.
*/}}
{{- if .Values.global.gateway.enabled -}}
{{- $hosts := list -}}
{{- $webapp := index .Values "atlas-webapp" | default dict -}}
{{- $server := index .Values "atlas-server" | default dict -}}
{{- $obs := index .Values "atlas-observability" | default dict -}}
{{- if and .Values.global.hosts.atlas.enabled $webapp.enabled -}}
{{- $hosts = append $hosts (include "aurelius-atlas.atlasHost" .) -}}
{{- end -}}
{{- if and .Values.global.hosts.dashboard.enabled $server.enabled -}}
{{- $hosts = append $hosts (include "aurelius-atlas.dashboardHost" .) -}}
{{- end -}}
{{- if and .Values.global.hosts.grafana.enabled $obs.enabled -}}
{{- $hosts = append $hosts (include "aurelius-atlas.grafanaHost" .) -}}
{{- end -}}
{{- if $hosts }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ printf "%s-edge-tls" .Release.Name }}
    namespace: {{ include "aurelius-atlas.namespace" . }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
spec:
    secretName: {{ printf "%s-edge-tls" .Release.Name }}
    duration: {{ .Values.global.gateway.certificate.duration }}
    renewBefore: {{ .Values.global.gateway.certificate.renewBefore }}
    subject:
        organizations:
            - aurelius-atlas
    dnsNames:
        {{- range $h := $hosts }}
        - {{ $h | quote }}
        {{- end }}
    {{- with .Values.global.gateway.edge.certificate.privateKey.algorithm }}
    privateKey:
        algorithm: {{ . }}
        size: {{ int $.Values.global.gateway.edge.certificate.privateKey.size }}
    {{- end }}
    issuerRef:
        {{- if .Values.global.gateway.edge.issuerRef.name }}
        name: {{ .Values.global.gateway.edge.issuerRef.name }}
        kind: {{ default "Issuer" .Values.global.gateway.edge.issuerRef.kind }}
        {{- else }}
        name: {{ required "global.trust.issuerRef.name is required (DD-286)" .Values.global.trust.issuerRef.name }}
        {{- with .Values.global.trust.issuerRef.kind }}
        kind: {{ . }}
        {{- end }}
        {{- end }}
{{- end }}
{{- if and .Values.global.hosts.keycloak.enabled (index .Values "atlas-keycloak").enabled .Values.global.gateway.edge.issuerRef.name -}}
{{/*
The keycloak browser leaf for a separate edge issuer (DD-643). The keycloak
chart's own certificate carries the public host AND the Service-name SANs
the issuer pin needs; an ACME issuer cannot mint .svc.cluster.local names,
so this companion holds only the public SAN (the SAN-duplication ban,
CHT-29, survives because the private-CA leaf drops out of the browser path
here). Without the edge issuer override, the keycloak listener keeps
reusing the chart-issued leaf — one certificate for both roles (CHT-16).
*/}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ printf "%s-keycloak-edge-tls" .Release.Name }}
    namespace: {{ include "aurelius-atlas.namespace" . }}
    labels:
        {{- include "aurelius-atlas.labels" . | nindent 8 }}
spec:
    secretName: {{ printf "%s-keycloak-edge-tls" .Release.Name }}
    duration: {{ .Values.global.gateway.certificate.duration }}
    renewBefore: {{ .Values.global.gateway.certificate.renewBefore }}
    subject:
        organizations:
            - aurelius-atlas
    dnsNames:
        - {{ include "aurelius-atlas.keycloakHost" . | quote }}
    privateKey:
        algorithm: ECDSA
        size: 256
    issuerRef:
        name: {{ .Values.global.gateway.edge.issuerRef.name }}
        kind: {{ default "Issuer" .Values.global.gateway.edge.issuerRef.kind }}
{{- end }}
{{- end }}
