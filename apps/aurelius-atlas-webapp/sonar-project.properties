# The layout table maps every m4i type to its presentation config; its rows
# share one shape by design (the governance box, the nav line, the score
# factory call repeat per type), which copy-paste detection reads as
# duplication (DD-857). The file is declarative data, not code — exempt it
# from CPD only. Real code still counts. 7.43 renamed it to `layouts.ts`.
sonar.cpd.exclusions=apps/aurelius-atlas-webapp/src/app/search/details/sections/layouts.ts
sonar.tests=apps/aurelius-atlas-webapp/src,apps/aurelius-atlas-webapp/e2e
sonar.test.inclusions=**/*.spec.ts,**/test__*.py
sonar.javascript.lcov.reportPaths=coverage/aurelius-atlas-webapp/lcov.info
sonar.python.version=3.14
