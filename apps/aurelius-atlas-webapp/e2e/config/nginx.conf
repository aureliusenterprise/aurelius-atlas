# E2E override of /etc/nginx/conf.d/default.conf: TLS-terminated SPA serving
# plus TLS-verified proxies proving the /api/ and /otel/ paths (SHL-11).
# Test-only — the shipped image template (nginx.conf.template) stays
# parameterised for deployments (ADR 039: browser-facing TLS on the example,
# relaxed verification in Playwright, CA-verified by an explicit test).
# NOTE: the hardened image includes this file inside its *http* block (the
# last line of the stock nginx.conf), so http-scoped directives (the
# limit_req_zone and otel_exporter below) are legal at file top; the server
# block is the file's bulk, as before.

# The browser rate limit at the edge (SRV-09, DD-238). Two deliberate
# differences from the shipped template: the key is $binary_remote_addr
# directly — the shipped geo allowlist exempts private ranges, and every e2e
# request arrives from the Docker bridge gateway (private), so the allowlist
# would exempt the suite itself; and the bucket is test-sized (rate 60r/m,
# burst 20) so the burst test overflows it in a couple of seconds — the
# shipped 300r/m + burst 100 is browser-sized and unprovable at suite speed.
# The suite's own /api traffic is the proxy test (one call, defined before the
# burst test), and the app issues none (the landing asserts zero); the tests
# after the burst use /otel, "/" or the server's published port, not /api.
limit_req_zone $binary_remote_addr zone=atlas_api:10m rate=60r/m;
# The /otel/ twin of the shipped zone (CHT-100), browser-sized on purpose —
# unlike the /api/ bucket above, this one is not test-sized: every suite
# request arrives from the bridge gateway (one key), and the suite's own
# /otel traffic (resilience, tracing probes) rides it, so throttling here
# would throttle the suite itself.
limit_req_zone $binary_remote_addr zone=atlas_otel:10m rate=600r/m;
limit_req_status 429;

# Native edge tracing (SHL-15, DD-239): the exporter rides the collector's
# legacy gRPC leg (4320) — TLS pinned to the stack CA, shared ingest token
# (CIA-10: nginx has no mint, the token is static). The literal is the dev
# default (conftest's DEFAULT_INGEST_TOKEN): compose passes config-file
# contents verbatim — no interpolation — and this file is test-only (ADR 039).
# Reached over the observability network the webapp service joins; the
# collector's publishes are loopback-pinned (CIA-03), so service DNS is the
# only path.
otel_exporter {
    endpoint https://otel-collector:4320;
    trusted_certificate /certs/ca.pem;
    header authorization "Bearer otel-dev-ingest-token";
}
otel_service_name aurelius-atlas-webapp-edge;

server {
    listen 8080 ssl;

    ssl_certificate /certs/aurelius-atlas-webapp.pem;
    ssl_certificate_key /certs/aurelius-atlas-webapp-key.pem;

    root /usr/share/nginx/html;

    # Assets produce no spans; /api/ opts in below (ETR-01).
    otel_trace off;

    # Security headers — kept in sync with the shipped config
    # (nginx.conf.template); the e2e stack overwrites
    # /etc/nginx/conf.d/default.conf, so the assertions run against this file.
    # script-src carries the theme pre-render's sha256 (DD-159) — keep the
    # two files' hashes identical.
    # connect-src/frame-src carry the Keycloak origins (7.3, APC-05): keycloak-js
    # fetches the realm metadata cross-origin and the silent-SSO iframe embeds it.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-bLKOgCGxZwqOQyQKetdKOchl5wDQhHnVVp+X0UOvsBw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://keycloak.localhost:8080 https://keycloak.localhost:8443; frame-src 'self' http://keycloak.localhost:8080 https://keycloak.localhost:8443" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # keycloak-js silent SSO iframe: strict CSP with the script's hash
    # (see the shipped template for the recompute recipe). add_header here
    # replaces the inherited server-level set, so repeat the other headers.
    location = /silent-check-sso.html {
        # The asset is built per locale (browser/<locale>/silent-check-sso.html);
        # keycloak-js requests it at the origin root, so resolve it explicitly.
        try_files /en-US/silent-check-sso.html /nl-NL/silent-check-sso.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-miQlUSMEyNrSzHUXigoiPbVCIcDQvHCRNPop+QMZUus='; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API proxy: TLS to the Atlas server container, verified against the local
    # development CA (APC-08, DD-142). The /api prefix is forwarded INTACT —
    # the server serves /api/atlas/... (DD-139), unlike the 7.1 placeholder,
    # which rewrote it away to reach Keycloak. The upstream goes through a
    # variable + resolver (Docker's embedded DNS): a literal hostname in
    # proxy_pass is resolved at config load, which races the compose-DNS
    # registration of the atlas-server container and fails nginx at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # The browser bucket (SRV-09): burst 20 served immediately, 429 on
        # overflow — the burst test drives this end to end (DD-238).
        limit_req zone=atlas_api burst=20 nodelay;

        # The traced location (ETR-01): the edge span parents the server's
        # request span and records the answered status — refusals included.
        otel_trace on;
        otel_trace_context propagate;

        set $atlas_upstream atlas-server;
        proxy_pass https://$atlas_upstream:21000;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
        proxy_set_header Host aurelius-atlas-server;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Browser preferred-language detection via the Accept-Language header.
    set $accept_language en-US;

    # OTLP proxy: TLS to the collector, verified against the CA. Proves the
    # /otel/ prefix forwards with the prefix stripped (SHL-11). The
    # collector's browser leg (4318) authenticates the signed-in user: the
    # SPA's Authorization header passes through untouched to its OIDC
    # receiver (DD-193, CIA-01/02); a token-less push is answered 401.
    # The upstream goes through a variable like /api/ above (DD-195): the
    # collector restarts while Keycloak boots (its OIDC extension discovers
    # at start), so a literal host resolved at config load would fail nginx
    # exactly in that window. With the variable, the rewritten URI is
    # forwarded verbatim (variables suppress proxy_pass URI rewriting).
    # The set comes BEFORE the rewrite: `break` stops the rewrite module
    # mid-location, and set is a rewrite-module directive (the shipped
    # template orders them the same way).
    location /otel/ {
        limit_req zone=atlas_otel burst=100 nodelay;

        set $otel_upstream otel-collector;
        rewrite ^/otel(/.*)$ $1 break;
        proxy_pass https://$otel_upstream:4318;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name otel-collector;
        proxy_set_header Host otel-collector;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Redirect "/" to the preferred locale, defaulting to en-US.
    location = / {
        if ($http_accept_language ~* "^nl") {
            set $accept_language nl-NL;
        }
        return 302 /$accept_language/$is_args$args;
    }

    # Serve each locale's app; unknown paths under a locale prefix fall back
    # to that locale's index.html so client-side routing keeps working.
    location /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    location /nl-NL/ {
        try_files $uri $uri/ /nl-NL/index.html;
    }

    # Unknown paths fall back to the default locale's app (SPA routing).
    location / {
        try_files $uri /en-US/index.html;
    }
}
