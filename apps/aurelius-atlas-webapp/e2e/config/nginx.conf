# E2E override of /etc/nginx/conf.d/default.conf: TLS-terminated SPA serving
# plus TLS-verified proxies proving the /api/ and /otel/ paths (SHL-11).
# Test-only — the shipped image template (nginx.conf.template) stays
# parameterised for deployments (ADR 039: browser-facing TLS on the example,
# relaxed verification in Playwright, CA-verified by an explicit test).
# NOTE: the hardened image includes conf.d at *server* level, so the whole
# server block lives here (no http-level directives allowed).
server {
    listen 8080 ssl;

    ssl_certificate /certs/aurelius-atlas-webapp.pem;
    ssl_certificate_key /certs/aurelius-atlas-webapp-key.pem;

    root /usr/share/nginx/html;

    # Security headers — kept in sync with the shipped config
    # (nginx.conf.template); the e2e stack overwrites
    # /etc/nginx/conf.d/default.conf, so the assertions run against this file.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API proxy: TLS to Keycloak on the dev host, verified against the local
    # development CA. Keycloak is the backend the dev stack has; the Atlas
    # API server joins this proxy when 7.3 wires real data.
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass https://keycloak.localhost:8443/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name keycloak.localhost;
        proxy_set_header Host keycloak.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Browser preferred-language detection via the Accept-Language header.
    set $accept_language en-US;

    # OTLP proxy: TLS to the collector, verified against the CA. Proves the
    # /otel/ prefix forwards with the prefix stripped (SHL-11).
    location /otel/ {
        rewrite ^/otel(/.*)$ $1 break;
        proxy_pass https://otel-collector:4318/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name otel-collector;
        proxy_set_header Host otel-collector;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Redirect "/" to the preferred locale, defaulting to en-US.
    location = / {
        if ($http_accept_language ~* "^nl") {
            set $accept_language nl-NL;
        }
        return 302 /$accept_language/$is_args$args;
    }

    # Serve each locale's app; unknown paths under a locale prefix fall back
    # to that locale's index.html so client-side routing keeps working.
    location /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    location /nl-NL/ {
        try_files $uri $uri/ /nl-NL/index.html;
    }

    # Unknown paths fall back to the default locale's app (SPA routing).
    location / {
        try_files $uri /en-US/index.html;
    }
}
