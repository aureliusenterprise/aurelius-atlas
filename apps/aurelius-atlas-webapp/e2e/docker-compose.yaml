name: aurelius-atlas-webapp-e2e

services:
    aurelius-atlas-webapp:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-webapp:local
        configs:
            - source: webapp_config
              target: /usr/share/nginx/html/config.json
            - source: webapp_nginx_config
              target: /etc/nginx/conf.d/default.conf
        volumes:
            - ../certs:/certs:ro
        extra_hosts:
            # The resolved e2e nginx config proxies /api/ to the Atlas server
            # (this compose) and /otel/ to the collector (SHL-11); Keycloak is
            # reached on the host, the collector over the observability network
            # — its publishes are loopback-pinned (CIA-03), so the host gateway
            # address would not answer for it.
            - keycloak.localhost:host-gateway
        ports:
            # Fixed host port, mirroring the example app's e2e stack.
            - 18444:8080
        depends_on:
            # The /lineage-model/ proxy's chain rides this stack (7.22a,
            # LDG-08): the aux app's healthcheck gates the webapp's start, and
            # the aux app gates on data2model below — so when nginx serves, the
            # chain is up. The /validate-entity/ twin joined with 7.24
            # (EDT-22). No host publish: the tests reach it through the
            # proxy, which is the path under test (LDG-06).
            aurelius-atlas-lineage-model:
                condition: service_healthy
            aurelius-atlas-validate-entity:
                condition: service_healthy
        networks:
            - default
            - atlas
            - observability

    # The 8.1 extractor, the chain's far end (mirrors the lineage-model e2e
    # compose). It verifies the forwarded browser token (LM-04, DTM-10), so
    # its audience is `aurelius` — fixed by design, not a deployment knob
    # (AUX-04): the chain forwards the webapp user's own token.
    aurelius-atlas-data2model:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-data2model:local
        environment:
            # ${VAR:?} guards: Nx injects the webapp's .env into the e2e task
            # environment; the aux app names carry their own prefixes but the
            # values are this stack's (the ingest secret is the shared dev one).
            AURELIUS_ATLAS_DATA2MODEL_LOG_LEVEL: info
            AURELIUS_ATLAS_DATA2MODEL_TLS_CERT_FILE: /certs/aurelius-atlas-data2model.pem
            AURELIUS_ATLAS_DATA2MODEL_TLS_KEY_FILE: /certs/aurelius-atlas-data2model-key.pem
            AURELIUS_ATLAS_DATA2MODEL_TLS_CA_FILE: /certs/ca.pem
            AURELIUS_ATLAS_DATA2MODEL_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_DATA2MODEL_AUTH_REALM: master
            AURELIUS_ATLAS_DATA2MODEL_AUTH_AUDIENCE: aurelius
            AURELIUS_ATLAS_DATA2MODEL_AUTH_CA_FILE: /certs/ca.pem
            # The per-service OTLP leg (DD-196): mint at the TLS :8443 issuer,
            # export to the collector's :4319 over the observability network.
            AURELIUS_ATLAS_DATA2MODEL_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_ID: otel-data2model
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_DATA2MODEL_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CA_FILE: /certs/ca.pem
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            - keycloak.localhost:host-gateway
        networks:
            - default
            - observability
        volumes:
            - ../certs:/certs:ro

    # The 8.2 lineage-model API behind the nginx /lineage-model/ location
    # (LDG-06/LDG-08): its upstreams are this stack's real services — the
    # Atlas server over the atlas network (the alias is in its certificate),
    # data2model over the default network. The e2e mints browser tokens for
    # `aurelius`, so the app keeps its own audience and joins the browser
    # client as the extra audience (DD-385) — exactly the chart posture.
    aurelius-atlas-lineage-model:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-lineage-model:local
        depends_on:
            aurelius-atlas-data2model:
                condition: service_healthy
        environment:
            AURELIUS_ATLAS_LINEAGE_MODEL_LOG_LEVEL: info
            AURELIUS_ATLAS_LINEAGE_MODEL_TLS_CERT_FILE: /certs/aurelius-atlas-lineage-model.pem
            AURELIUS_ATLAS_LINEAGE_MODEL_TLS_KEY_FILE: /certs/aurelius-atlas-lineage-model-key.pem
            AURELIUS_ATLAS_LINEAGE_MODEL_TLS_CA_FILE: /certs/ca.pem
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_REALM: master
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_AUDIENCE: aurelius-atlas-lineage-model
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_EXTRA_AUDIENCES: '["aurelius"]'
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_CA_FILE: /certs/ca.pem
            # The chain's upstreams, in-network and TLS-verified against the
            # dev CA (LM-04): the server as the name its certificate carries.
            AURELIUS_ATLAS_LINEAGE_MODEL_ATLAS_BASE_URL: https://aurelius-atlas-server:21000
            AURELIUS_ATLAS_LINEAGE_MODEL_DATA2MODEL_URL: https://aurelius-atlas-data2model:21001
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_ID: otel-lineage-model
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CA_FILE: /certs/ca.pem
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            - keycloak.localhost:host-gateway
        networks:
            - default
            # The Atlas server answers as `aurelius-atlas-server` here — the
            # name in its certificate, the alias its service declares.
            - atlas
            - observability
        volumes:
            - ../certs:/certs:ro

    # The 8.3 validate-entity API behind the nginx /validate-entity/ location
    # (7.24, EDT-22, DD-435): the editor's governance banner validates through
    # this path. The audience is the browser client `aurelius` by design
    # (AUX-04, DV-75): the endpoint is the browser's from begin to end, the
    # app forwards nothing, so no extra-audiences join (unlike the lineage
    # app's DD-385 pair).
    aurelius-atlas-validate-entity:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-validate-entity:local
        environment:
            # ${VAR:?} guards: Nx injects the webapp's .env into the e2e task
            # environment; the aux app names carry their own prefixes but the
            # values are this stack's (the ingest secret is the shared dev one).
            AURELIUS_ATLAS_VALIDATE_ENTITY_LOG_LEVEL: info
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CERT_FILE: /certs/aurelius-atlas-validate-entity.pem
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_KEY_FILE: /certs/aurelius-atlas-validate-entity-key.pem
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CA_FILE: /certs/ca.pem
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_REALM: master
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE: aurelius
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_CA_FILE: /certs/ca.pem
            # The per-service OTLP leg (DD-196): mint at the TLS :8443 issuer,
            # export to the collector's :4319 over the observability network.
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_ID: otel-validate-entity
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CA_FILE: /certs/ca.pem
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            - keycloak.localhost:host-gateway
        networks:
            - default
            - observability
        volumes:
            - ../certs:/certs:ro

    # The real Atlas server behind the nginx /api/ proxy (DD-142): the chain
    # nginx -> TLS -> server -> Elasticsearch answers /api/atlas/admin/version,
    # so the proxy test proves the whole data path, not just nginx config.
    # Mirrors apps/aurelius-atlas-server/e2e/docker-compose.yaml. The certs are
    # this project's own: tls.json issues the aurelius-atlas-server leaf nginx
    # verifies against, so the stack mounts only its owning project's certs/
    # (DD-216). The store is reached on the dev Elasticsearch network.
    atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        networks:
            atlas:
                # The alias is the name in the server certificate and the nginx
                # proxy_ssl_name; the compose service name stays atlas-server.
                aliases:
                    - aurelius-atlas-server
            # The dev telemetry stack (started by conftest first): the collector
            # answers as `otel-collector` here — the name in its certificate.
            # Its publishes are loopback-pinned (CIA-03), so service DNS is the
            # only path.
            observability: {}
        ports:
            # Fixed host port, mirroring the webapp's 18444: the conftest's
            # readiness strategy probes the server's version endpoint directly.
            - 18445:21000
        environment:
            # ${VAR:?} guards: Nx injects the webapp's .env into the e2e task
            # environment; a missing value fails the compose start loudly.
            AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # Client-IP trust (SRV-10, DD-238): the nginx proxy is the front
            # door and rewrites X-Forwarded-For, so the server is told to trust
            # the Docker bridge range — uvicorn's default (loopback) would make
            # every proxied request look like it came from the proxy. With the
            # hop declared, the server's access log and OTel peer attributes
            # name the browser's address.
            AURELIUS_ATLAS_SERVER_FORWARDED_ALLOW_IPS: 172.16.0.0/12
            # HSTS off in e2e (DD-236): the webapp e2e browser reaches Keycloak over
            # keycloak.localhost; includeSubDomains on localhost would pin it to HTTPS.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # OTLP ingest identity (7.18, DD-196): the server exports through
            # its own pipeline (aurelius-atlas-otel), minting client-credentials
            # JWTs as otel-atlas-server for the per-service leg — the OIDC
            # receiver on :4319 answers the shared token 401 (CIA-08), so the
            # 7.17 static OTEL_EXPORTER_* trio is gone. The mint goes to the
            # e2e Keycloak's TLS listener (the conftest's issuer flip); the
            # secret is Nx-injected from the webapp .env (mirrored there).
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
            # Authentication (6.1a, DD-250): the webapp's tokens, which the
            # proxy forwards, verified against the e2e Keycloak's TLS listener.
            # The server's own sign-in (its confidential client) is not used
            # by this stack; its secret is mirrored in the webapp .env.
            AURELIUS_ATLAS_SERVER_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET: ${AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius"]'
            AURELIUS_ATLAS_SERVER_AUTH_CA_FILE: /certs/ca.pem
            # Export every second in test containers so Tempo read-back
            # probes land sooner (DD-225); mirrors the server e2e compose.
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            # The mint target: the e2e Keycloak's :8443 listener, published
            # loopback-wide on this machine (the webapp service maps it for
            # /api/ too; per-service it is the issuer, not a proxy upstream).
            - keycloak.localhost:host-gateway
        volumes:
            - ../certs:/certs:ro

networks:
    # The dev Elasticsearch stack (started by the e2e target); the server
    # reaches the store as `elasticsearch` on this network, and the aux
    # lineage-model reaches the server as `aurelius-atlas-server` (its
    # certificate name, the alias the server's service declares).
    atlas:
        name: aurelius-atlas-dev-elasticsearch-network
        external: true
    # The dev telemetry stack (dev/observability); both the server's OTLP
    # export and the nginx /otel/ proxy reach the collector on it (SHL-11).
    observability:
        name: aurelius-atlas-dev-observability-network
        external: true

configs:
    webapp_config:
        file: ./config/config.json
    webapp_nginx_config:
        file: ./config/nginx.conf
