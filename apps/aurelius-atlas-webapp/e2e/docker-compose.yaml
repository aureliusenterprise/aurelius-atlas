name: aurelius-atlas-webapp-e2e

# Every service behind the nginx proxy is the owning project's e2e service,
# extended (the pattern of ADR 065/066): the Atlas server from
# ../../aurelius-atlas-server/e2e/compose.server.yaml, and the three aux APIs
# from the owner's e2e layer beside its stack piece - the extractor from
# ../../aurelius-atlas-data2model/e2e/compose.data2model.yaml, the lineage API
# from ../../aurelius-atlas-lineage-model/e2e/compose.lineage-model.yaml, and
# the validator from ../../aurelius-atlas-validate-entity/e2e/
# compose.validate-entity.yaml. Each of those layers extends the project's
# stack piece (../docker/compose.yaml), the identity the standalone stack
# includes, and states the e2e identity on top: the host-mapped issuer, the
# OTel leg, the collector network and a published port. Each base's cert
# mount rebases to its owner's certs folder - every leaf nginx and the
# in-network calls verify is the one its service presents, issued once by
# that project's `nx certgen` (this project's tls.json copies of them are no
# longer mounted; its own webapp leaf still is, below). This stack states
# only its differences: the real server as the lineage app's upstream (the
# fixture-less posture of the 8.2 suite), the browser-client audiences, each
# OTel client secret under this stack's .env name, the proxied services'
# networks (no host publish - the tests reach them through the proxy, the
# path under test, LDG-06), and the second-cadence export. The webapp service
# is this project's own stack piece (../docker/compose.yaml) extended: the
# image and its cert mount arrive by inheritance, and this stack states its
# differences - the suite's resolved nginx config and config.json (the
# configs land on the pieces' bind targets, deeper path winning where they
# overlap), the piece's server gate gone (this stack names no such service),
# and the fixed host port.
services:
    aurelius-atlas-webapp:
        extends:
            file: ../docker/compose.yaml
            service: aurelius-atlas-webapp
        configs:
            - source: webapp_config
              target: /usr/share/nginx/html/config.json
            - source: webapp_nginx_config
              target: /etc/nginx/conf.d/default.conf
        volumes:
            # The piece's nginx.conf and config.json binds lose to the suite's
            # configs above (same targets); the certs are the stack's own.
            !override
            - ../certs:/certs:ro
        extra_hosts:
            # The resolved e2e nginx config proxies /api/ to the Atlas server
            # (this compose) and /otel/ to the collector (SHL-11); Keycloak is
            # reached on the host, the collector over the observability network
            # — its publishes are loopback-pinned (CIA-03), so the host gateway
            # address would not answer for it.
            - keycloak.localhost:host-gateway
        ports:
            # Fixed host port, mirroring the example app's e2e stack.
            - 18444:8080
        depends_on:
            # The piece's gate is the standalone stack's server, which this
            # stack does not name (the suite's server is atlas-server below).
            # The /lineage-model/ proxy's chain rides this stack
            # (7.22a, LDG-08): the aux app's healthcheck gates the webapp's
            # start, and the aux app gates on data2model below — so when nginx
            # serves, the chain is up. The /validate-entity/ twin joined with
            # 7.24 (EDT-22). No host publish: the tests reach it through the
            # proxy, which is the path under test (LDG-06).
            !override
            aurelius-atlas-lineage-model:
                condition: service_healthy
            aurelius-atlas-validate-entity:
                condition: service_healthy
        networks:
            - default
            - atlas
            - observability

    # The 8.1 extractor, the chain's far end (mirrors the lineage-model e2e
    # compose). It verifies the forwarded browser token (LM-04, DTM-10), so
    # its audience is `aurelius` — fixed by design, not a deployment knob
    # (AUX-04): the chain forwards the webapp user's own token. No host
    # publish: the app reaches it in-network and the tests ride the proxy.
    aurelius-atlas-data2model:
        extends:
            file: ../../aurelius-atlas-data2model/e2e/compose.data2model.yaml
            service: aurelius-atlas-data2model
        networks:
            # The chain's services reach each other over the stack's default
            # network; the base's collector network merges in by key.
            - default
        environment:
            # The shared dev ingest secret (DD-196), under this stack's .env
            # name (the base states no guard — each consumer uses its own).
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        ports: !reset null

    # The 8.2 lineage-model API behind the nginx /lineage-model/ location
    # (LDG-06/LDG-08): its upstreams are this stack's real services — the
    # Atlas server over the atlas network (the alias is in its certificate),
    # data2model over the default network. The e2e mints browser tokens for
    # `aurelius`, so the app keeps its own audience and joins the browser
    # client as the extra audience (DD-385) — exactly the chart posture. No
    # host publish: the tests ride the proxy.
    aurelius-atlas-lineage-model:
        extends:
            file: ../../aurelius-atlas-lineage-model/e2e/compose.lineage-model.yaml
            service: aurelius-atlas-lineage-model
        networks:
            # The Atlas server answers as `aurelius-atlas-server` here — the
            # name in its certificate, the alias its service declares. The
            # base's default and collector networks merge in by key.
            - atlas
        environment:
            # The chain's upstream: the real server (the 8.2 suite's fixture
            # is its difference there), in-network and TLS-verified against
            # the dev CA (LM-04), as the name its certificate carries.
            AURELIUS_ATLAS_LINEAGE_MODEL_ATLAS_BASE_URL: https://aurelius-atlas-server:21000
            # The app keeps its own audience and joins the browser client as
            # the extra audience (DD-385) — fixed here, as the chart posture
            # (the 8.2 suite's values ride its own .env).
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_AUDIENCE: aurelius-atlas-lineage-model
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_EXTRA_AUDIENCES: '["aurelius"]'
            # The shared dev ingest secret (DD-196), under this stack's .env
            # name (the base states no guard — each consumer uses its own).
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
        ports: !reset null

    # The validate-entity API behind the nginx /validate-entity/ location
    # (7.24, EDT-22, DD-435): the editor's governance banner validates through
    # this path. The caller-side audience is the browser client `aurelius` by
    # design (AUX-04, DV-75): the endpoint is the browser's from begin to end,
    # the app forwards nothing, so no extra-audiences join (unlike the lineage
    # app's DD-385 pair). Since 12.7 the app reads its governance rules from
    # the chain's server as its OWN service identity (VEV-04, DD-499): the
    # leg's secret is mirrored in the webapp .env and the app reaches the
    # server on the atlas network, under its certificate name — all in the
    # base. No host publish: the tests ride the proxy.
    aurelius-atlas-validate-entity:
        extends:
            file: ../../aurelius-atlas-validate-entity/e2e/compose.validate-entity.yaml
            service: aurelius-atlas-validate-entity
        networks:
            # The nginx proxy reaches the app over the stack's default
            # network; the base's store and collector networks merge in.
            - default
        environment:
            # The shared dev ingest secret (DD-196), under this stack's .env
            # name (the base states no guard — each consumer uses its own).
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        ports: !reset null

    # The real Atlas server behind the nginx /api/ proxy (DD-142): the chain
    # nginx -> TLS -> server -> Elasticsearch answers /api/atlas/admin/version,
    # so the proxy test proves the whole data path, not just nginx config. The
    # server's own e2e base carries its identity and settings; the nginx
    # proxy_ssl_name is the atlas-network alias the base declares. The store is
    # reached on the dev Elasticsearch network.
    atlas-server:
        extends:
            file: ../../aurelius-atlas-server/e2e/compose.server.yaml
            service: atlas-server
        ports:
            # Fixed host port, mirroring the webapp's 18444: the conftest's
            # readiness strategy probes the server's version endpoint directly.
            - 18445:21000
        environment:
            # Two keys over the base's map: this stack's own client-IP trust
            # and the audience pair.
            # Client-IP trust (SRV-10, DD-238): the nginx proxy is the front
            # door and rewrites X-Forwarded-For, so the server is told to trust
            # the Docker bridge range — uvicorn's default (loopback) would make
            # every proxied request look like it came from the proxy. With the
            # hop declared, the server's access log and OTel peer attributes
            # name the browser's address.
            AURELIUS_ATLAS_SERVER_FORWARDED_ALLOW_IPS: 172.16.0.0/12
            # Both identities of this suite are accepted (AUT-02): the
            # browser's `aurelius` token, which the proxy forwards, and the
            # validate-entity app's own client-credentials token, whose azp
            # joins the audiences here (VEV-04, DD-499).
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-validate-entity"]'

networks:
    # The dev Elasticsearch stack (started by the e2e target); the server
    # reaches the store as `elasticsearch` on this network, and the aux
    # lineage-model reaches the server as `aurelius-atlas-server` (its
    # certificate name, the alias the server's service declares).
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    # The dev telemetry stack (infra/observability); both the server's OTLP
    # export and the nginx /otel/ proxy reach the collector on it (SHL-11).
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true

configs:
    webapp_config:
        file: ./config/config.json
    webapp_nginx_config:
        file: ./config/nginx.conf
