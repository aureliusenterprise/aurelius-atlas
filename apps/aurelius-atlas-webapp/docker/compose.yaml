# The standalone stack's webapp piece, included by ../../../docker/docker-compose.yaml (ADR 065).
# Relative paths read from this file's folder; service names are the stack's, so keep them.
# The webapp's own nginx serves only the webapp, in a container of its own: the proxy in front
# (../docker-compose.yaml) routes to it by name and sends /api/ to the server itself. It signs in
# to the realm aurelius-atlas through the public client aurelius.
# Its nginx configuration is a static asset the stack ships at ../../../docker/webapp/nginx.conf
# (SPC-04, DD-695): the upstreams and certificate paths this stack uses are written into it, so no
# service renders anything at boot. The chart's init container (DD-262) renders the image's own
# template for the runtime that has no proxy in front of this port.
# WEBAPP_IMAGE names the image the webapp runs (compose-time variable, not a .env setting). Unset,
# it is the `nx docker-build` tag (ADR 065: the stack builds, never pulls). An install that ships
# published images sets WEBAPP_IMAGE to the registry reference or a digest.
name: aurelius-atlas-standalone

x-webapp-image: &webapp-image ${WEBAPP_IMAGE:-ghcr.io/aureliusenterprise/aurelius-atlas-webapp:local}

services:
    aurelius-atlas-webapp:
        image: *webapp-image
        depends_on:
            aurelius-atlas-server:
                condition: service_started
        volumes:
            # The stack's own webapp configuration, mounted as the image's conf.d file (SPC-04).
            - ../../../docker/webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            # The browser's config, as the deployment's ConfigMap serves it. It names localhost,
            # which is the one host the stack serves (SPC-02, DD-694), and the proxy's catch-all
            # location serves this file to the browser.
            - ./config.json:/usr/share/nginx/html/config.json:ro
            - ${WEBAPP_CERTS_DIR:?name the webapp certificate folder}:/certs:ro
