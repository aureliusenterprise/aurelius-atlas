{{/*
The ClusterIP Service (CHT-23) on 8080, TLS end to end (DD-270): the Gateway
terminates browser TLS at the edge (DD-242) and dials this Service's backend
over TLS, validated by the BackendTLSPolicy the umbrella renders for the
webapp listener (CHT-30). The Gateway's HTTPRoute names this Service; the
policy pins the trust root and uses this name as the SNI/SAN pair.
*/}}
apiVersion: v1
kind: Service
metadata:
    name: {{ include "atlas-webapp.fullname" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-webapp.labels" . | nindent 8 }}
spec:
    type: {{ .Values.service.type }}
    ports:
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: {{ int .Values.port }}
          protocol: TCP
    selector:
        {{- include "atlas-webapp.selectorLabels" . | nindent 12 }}
