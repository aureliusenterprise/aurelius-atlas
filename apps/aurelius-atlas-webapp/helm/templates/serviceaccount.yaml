{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-webapp.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-webapp.labels" . | nindent 8 }}
automountServiceAccountToken: false
{{- end }}
