# Loads the native OpenTelemetry tracing module (SHL-15, DD-239). The
# hardened image includes this directory in the *main* context of its
# /etc/nginx/nginx.conf, which is the only context where load_module is
# legal. The .so ships at /usr/lib/nginx/modules (the image's
# --modules-path); musl resolves it through the loader path, like the base
# image's own modules.
load_module modules/ngx_otel_module.so;
