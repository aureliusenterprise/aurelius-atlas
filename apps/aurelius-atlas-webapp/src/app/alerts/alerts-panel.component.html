<!--
  The alerts panel body (ALR-01, ALR-06, ALR-07), carried by the ui-lib
  drawer. The feed is the ui-lib AlertList, wired to the store: the rows
  come from the service, dismissal writes through it. The panel stores
  nothing (the settings panel's shape, SPL-14).

  Clear all rides the drawer's head slot (ALR-06, DD-088): the sticky
  head keeps the escape hatch in reach no matter how long the feed
  grows, and it shows only while the store has alerts.

  i18n ids are the shell.alerts.* dictionary paths (DD-039 bridge,
  SHC-07 pattern). Strings bound into component inputs live in TypeScript
  as $localize (BRW-02), so no markers are needed here.
-->
<aurelius-atlas-ui-drawer [(active)]="active" [title]="title" [ariaLabel]="closeLabel" (cancelRequested)="close()">
    @if (alerts.hasAlerts()) {
        <button
            type="button"
            drawer-actions
            class="button is-small is-text aurelius-alert-clear"
            (click)="alerts.clearAll()"
        >
            {{ clearLabel }}
        </button>
    }
    <aurelius-atlas-ui-alert-list
        [alerts]="alerts.alerts()"
        [ariaLabel]="feedLabel"
        [emptyLabel]="emptyLabel"
        [dismissLabel]="dismissLabel"
        [timesPrefix]="timesPrefix"
        (dismiss)="alerts.dismiss($event)"
    ></aurelius-atlas-ui-alert-list>
</aurelius-atlas-ui-drawer>
