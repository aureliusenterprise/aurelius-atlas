<!--
  The Aurelius Atlas navbar chrome (SHC-02..SHC-05), ported from the legacy
  Aurelius navbar search-free (DD-145): the search bar and the nav buttons stay
  with the search slice; the PWA install/update items, the services dropdown,
  and the loading/pipeline sticky block are not ported (see DD-145).

  i18n ids are the legacy dictionary paths, read by the XLIFF bridge (DD-128,
  extended to @@shell.* by SHC-07). Translation descriptions are comments,
  never `id|description` suffixes — the suffix joins the extracted id and the
  key-keyed bridge can never match it (DD-144).
-->
<!-- The legacy navbar is pinned (SHM-05, `navbar is-fixed-top`); the body
     carries the matching has-navbar-fixed-top padding (index.html). -->
<aurelius-atlas-ui-header fixed [name]="appName" [logo]="appLogo" logoCssClass="logo">
    <!-- Settings and Alerts sit in the always-visible utility group: the ui-lib
         Header projects them into the brand bar (left of the burger on a
         narrow screen, left of Documentation on a wide one), so the two drawer
         controls never collapse into the burger menu. -->
    <div class="aurelius-navbar-utility" navbar-utility>
        <!-- Settings gear (SPL-01, SPL-14, DD-166, DD-167): opens the panel
             by navigating the `drawer` aux outlet — the open state rides the
             URL, so the locale switch's reload keeps it. RouterLinkActive
             keys `is-active` off the drawer segment, so the gear is lit
             while the panel is open; the link then targets the URL it is
             on, and the router cancels that same-URL navigation — a no-op.
             The link keeps the URL's query, so the search shown behind the
             drawer stays (SBX-04). -->
        <a
            class="navbar-item"
            i18n-aria-label="@@shell.header.settings"
            aria-label="Settings"
            [routerLink]="[{ outlets: { drawer: ['settings'] } }]"
            queryParamsHandling="preserve"
            routerLinkActive="is-active"
        >
            <span class="icon">
                <fa-icon aria-hidden="true" [icon]="faGear"></fa-icon>
            </span>
        </a>

        <!-- Alerts bell (ALR-01, ALR-02, ALR-02a, ALR-12): the gear's pattern — the
             bell opens the alerts drawer through the one `drawer` outlet,
             and opening it swaps the settings panel away. The ui-lib Badge
             carries the presence dot — unread presence, not the whole
             store: opening the drawer reads the feed and the dot goes;
             its colour is the highest unread severity (the icon carries
             the ring's transform origin, the pendulum hangs from its
             handle). -->
        <a
            class="navbar-item"
            i18n-aria-label="@@shell.header.alerts"
            aria-label="Alerts"
            [routerLink]="[{ outlets: { drawer: ['alerts'] } }]"
            queryParamsHandling="preserve"
            routerLinkActive="is-active"
        >
            <aurelius-atlas-ui-badge [visible]="alerts.hasUnread()" [severity]="alerts.topUnreadSeverity()">
                <span class="icon aurelius-bell-icon" #bellIcon>
                    <fa-icon aria-hidden="true" [icon]="faBell"></fa-icon>
                </span>
            </aurelius-atlas-ui-badge>
        </a>
    </div>

    <ng-container navbar-end>
        <!-- Documentation (SHC-03) -->
        <div class="navbar-item">
            <div class="buttons">
                <!-- Legacy navbar-documentation: icon + word, opens in a new tab. -->
                <a
                    class="button is-outlined is-dark"
                    rel="noopener noreferrer"
                    target="_blank"
                    [href]="documentationUrl"
                >
                    <span class="icon">
                        <fa-icon aria-hidden="true" [icon]="faBook"></fa-icon>
                    </span>
                    <!-- Documentation. -->
                    <span i18n="@@shell.header.documentation">Documentation</span>
                </a>
            </div>
        </div>

        <!-- Account dropdown (SHC-05): welcome / Account-security / Logout. -->
        <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link">
                <!-- The legacy's one inline run, bold name (SHC-05, DD-735).
                     Two Bulma/Angular facts shape this markup and neither is
                     visible in the rendered line:
                     - the wrapper span is load-bearing. Above the burger
                       breakpoint `.navbar-link` is `display: flex` with
                       `gap: 0.75rem`, so two children of the anchor become two
                       flex items and the word space widens to 12px.
                     - the gap between the label and the name is an explicit
                       `&nbsp;` because Angular's default whitespace mode drops
                       a whitespace-only node that holds a newline, which glues
                       the two words together. The legacy names that seam with
                       its own `<span>&nbsp;</span>`. -->
                <span>
                    <span i18n="@@shell.header.welcome">Logged in as</span>
                    <span>&nbsp;</span>
                    <strong>{{ session.identity() }}</strong>
                </span>
            </a>
            <div class="navbar-dropdown is-right">
                @if (tenancy.enabled) {
                    <!-- The tenant the token names, and switching it by signing in again (TNW-06, DD-635). -->
                    @if (session.tenant(); as tenant) {
                        <div class="navbar-item">
                            <span><span i18n="@@shell.header.tenant">Tenant</span>: {{ tenant }}</span>
                        </div>
                    }
                    <button
                        type="button"
                        class="navbar-item navbar-link is-arrowless"
                        (click)="switchTenant()"
                        i18n="@@shell.header.switchTenant"
                    >
                        Switch tenant
                    </button>
                    <hr class="navbar-divider" />
                }
                <!-- Account-security: the Keycloak account console. -->
                <a class="navbar-item" i18n="@@shell.header.security" [href]="accountUrl">Account security</a>
                <hr class="navbar-divider" />
                <!-- Logout is a native button (SHC-05, DD-428, superseding
                     DD-153's anchor clause): the shared navbar-link class
                     rides the dropdown's ink chain, the scss drops the UA's
                     centred text, and the native element brings its own
                     keyboard path — no ARIA role, no key handlers. -->
                <button
                    type="button"
                    class="navbar-item navbar-link is-arrowless"
                    (click)="logout()"
                    i18n="@@shell.header.logout"
                >
                    Logout
                </button>
            </div>
        </div>
    </ng-container>
</aurelius-atlas-ui-header>
