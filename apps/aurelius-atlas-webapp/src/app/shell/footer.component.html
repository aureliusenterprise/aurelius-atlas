<!--
  The Aurelius footer (SHC-06), ported from the legacy shell footer: the current
  copyright year (VER-04), the application name from the runtime config, and the
  version the server answers (VER-01, VER-03) — empty until it lands.

  i18n ids are the legacy dictionary paths, read by the XLIFF bridge (DD-128,
  extended to @@shell.* by SHC-07). Translation descriptions are comments,
  never `id|description` suffixes — the suffix joins the extracted id and the
  key-keyed bridge can never match it (DD-144).
-->
<footer class="footer">
    <div class="container">
        <div class="level">
            <div class="level-left">
                <div class="level-item has-text-centered has-text-white">
                    <!-- Copyright. -->
                    <span i18n="@@shell.footer.copyright">Copyright</span>
                    <span class="icon">
                        <fa-icon aria-hidden="true" [icon]="faCopyright"></fa-icon>
                    </span>
                    {{ copyright }}
                </div>
            </div>
            <div class="level-item has-text-centered has-text-white">{{ appName }}</div>
            <div class="level-right">
                <div class="level-item has-text-centered has-text-white">{{ version() }}</div>
            </div>
        </div>
    </div>
</footer>
