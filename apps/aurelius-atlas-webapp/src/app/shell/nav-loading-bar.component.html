<!-- The Bulma indeterminate bar (the legacy's `progress.is-link`, max=100
     and no value = indeterminate). Router navigation only, the legacy
     `isNavigating` (SRH-09). LR-006 (WCAG 4.1.2): the bar keeps an
     accessible name and stays in the DOM (hidden, not removed) so AT can
     announce the busy state on a slow route. -->
<progress
    class="progress is-link"
    max="100"
    aria-label="Loading"
    i18n-aria-label="@@shell.loadingBar.label"
    [hidden]="!isNavigating()"
></progress>
