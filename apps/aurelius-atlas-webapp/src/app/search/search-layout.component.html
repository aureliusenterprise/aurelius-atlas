<!--
    The search subtree's chrome (SRH-01, DD-218): the hero above the routed
    content, the global search field in its title row — the legacy
    `search.component.html` shape, one-way bound (the legacy `[query]` +
    `(querySubmitted)`; the legacy DATA_STEWARD editor `+` button is 7.7,
    the role gate 6.2). The field reads the store's query, so a
    back-navigation shows the query the URL carries (SRH-02).
-->
<aurelius-atlas-ui-hero [title]="heroTitle">
    <ng-container after-title>
        <div class="level is-mobile">
            <div class="level-item">
                <aurelius-atlas-ui-search-field
                    class="input-bar"
                    [query]="search.queryText()"
                    [placeholder]="searchPlaceholder"
                    (querySubmitted)="onQuerySubmitted($event)"
                ></aurelius-atlas-ui-search-field>
            </div>
            <!-- The create affordance (EDT-09, DD-324): the legacy DATA_STEWARD
                 editor `+`, gated on the atlas-write grant. Opens the
                 create-mode editor drawer through the `drawer` aux outlet. -->
            @if (canWrite()) {
                <div class="level-right">
                    <button
                        type="button"
                        class="button is-info aurelius-create-entity"
                        [attr.aria-label]="createLabel"
                        (click)="openCreate()"
                    >
                        <span class="icon is-small">
                            <fa-icon aria-hidden="true" [icon]="faPlus"></fa-icon>
                        </span>
                    </button>
                </div>
            }
        </div>
        <!-- How the field searches (SBW-02, DD-444): by its words, its
             meaning, or both; the session's choice, not the URL's. A row of
             its own under the field, so the field and the create button
             keep the title row's width. -->
        <div class="buttons has-addons are-small aurelius-search-mode" role="group" [attr.aria-label]="modeLabel">
            @for (option of modes; track option.mode) {
                <button
                    type="button"
                    class="button"
                    [class.is-info]="search.mode() === option.mode"
                    [class.is-selected]="search.mode() === option.mode"
                    [attr.aria-pressed]="search.mode() === option.mode"
                    (click)="onModeSelected(option.mode)"
                >
                    {{ option.label }}
                </button>
            }
        </div>
    </ng-container>
</aurelius-atlas-ui-hero>
<!-- The routed screens' inset (DD-150, owned here per DD-218): the legacy
     hero wraps the outlet in `section.section > div.container` — the pages
     render top-level, the layout insets them. -->
<section class="section search-content">
    <div class="container">
        <router-outlet />
    </div>
</section>
