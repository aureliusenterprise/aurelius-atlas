<!--
    The business-context info modal (BRW-03): the ui-lib modal in card
    anatomy (title, close, backdrop dismiss — the legacy modal context) with
    the legacy description paragraph and the static type-name table. The
    card component two-way binds `active`.
-->
<aurelius-atlas-ui-modal [(active)]="active" [title]="title" [ariaLabel]="closeLabel">
    <div class="content">
        <p i18n="@@search.browse.businessContext.infoModal.description">
            The business part of the data governance model captures data semantics and ownership for the following types
            of entities:
        </p>
        <div class="block">
            <aurelius-atlas-ui-sortable-table [rows]="rows" [rowsSelectable]="false">
                <ng-template aurelius-atlas-ui-table-column [isNarrow]="true" [title]="iconHint">
                    {{ iconTitle }}
                </ng-template>
                <ng-template
                    aurelius-atlas-ui-table-column
                    [isNarrow]="true"
                    [sortBy]="'typeName'"
                    [title]="typeNameHint"
                >
                    {{ typeNameTitle }}
                </ng-template>
                <ng-template aurelius-atlas-ui-table-column [sortBy]="'description'" [title]="descriptionHint">
                    {{ descriptionTitle }}
                </ng-template>
                <ng-template aurelius-atlas-ui-table-row let-row>
                    <td>
                        <span class="icon is-small business" [title]="row.typeName">
                            <fa-icon [icon]="row.icon"></fa-icon>
                        </span>
                    </td>
                    <th scope="row">{{ row.typeName }}</th>
                    <td>{{ row.description }}</td>
                </ng-template>
            </aurelius-atlas-ui-sortable-table>
        </div>
    </div>
</aurelius-atlas-ui-modal>
