    and the `search.browse.description` paragraph, keeping the
    #browse-placeholder id the 7.1 shell tests anchor to — and the three
    context cards in Aurelius's order: business, technical, governance.
-->
<div class="box">
    <h2 class="title is-2" i18n="@@search.browse.title">Getting started</h2>
    <div class="content">
        <p id="browse-placeholder" i18n="@@search.browse.description">
            Welcome to Aurelius Atlas! We would like to help you get started. Please pick your topic of interest below.
        </p>
    </div>
</div>
<div class="columns is-multiline">
    <div class="column">
        <aurelius-atlas-webapp-business-context class="hints"></aurelius-atlas-webapp-business-context>
    </div>
    <div class="column">
        <aurelius-atlas-webapp-technical-context class="hints"></aurelius-atlas-webapp-technical-context>
    </div>
    <div class="column">
        <aurelius-atlas-webapp-governance-responsibilities
            class="hints"
        ></aurelius-atlas-webapp-governance-responsibilities>
    </div>
</div>
