{{/*
The Deployment. TLS is a cert/key pair (the apps accept both-set or
both-unset, the settings module enforces it); the chart mounts the pair when
tls.enabled, and the probes' scheme follows it. No credential env anywhere:
every catalogue call carries the caller's own bearer token (MCP-03, DD-890),
so this is the aux deployment without a secretKeyRef (DD-893, MCP-22).
*/}}
{{- $fullname := include "atlas-mcp.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-mcp.labels" . | nindent 8 }}
spec:
    replicas: {{ int .Values.replicaCount }}
    selector:
        matchLabels:
            {{- include "atlas-mcp.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "atlas-mcp.labels" . | nindent 16 }}
                {{- with .Values.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with .Values.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 14 }}
            {{- end }}
        spec:
            serviceAccountName: {{ default $fullname .Values.serviceAccount.name }}
            {{- with .Values.global.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 14 }}
            {{- end }}
            securityContext:
                {{- toYaml .Values.podSecurityContext | nindent 16 }}
            containers:
                -   name: {{ .Values.component }}
                    image: {{ include "atlas-mcp.image" . | quote }}
                    imagePullPolicy: IfNotPresent
                    securityContext:
                        {{- toYaml .Values.securityContext | nindent 24 }}
                    ports:
                        - name: https
                          containerPort: {{ int .Values.port }}
                          protocol: TCP
                    env:
                        - name: {{ .Values.componentEnvPrefix }}HOST
                          value: "0.0.0.0"
                        - name: {{ .Values.componentEnvPrefix }}PORT
                          value: {{ int .Values.port | quote }}
                        - name: {{ .Values.componentEnvPrefix }}AUTH_SERVER_URL
                          value: {{ include "atlas-mcp.issuerUrl" . | quote }}
                        {{- /* CHT-111's rule, as the aux siblings: the realm is
                        the CHT-74 one fact — an env join, never a static
                        config literal. It names where the CALLER's token was
                        issued (MCP-02). */}}
                        - name: {{ .Values.componentEnvPrefix }}AUTH_REALM
                          value: {{ include "atlas-mcp.realm" . | quote }}
                        {{- /* MCP-03/MCP-21 (DD-890, DD-895): the two catalogue
                        legs. Both ride the co-deployed siblings' Services like
                        lineage-model's upstream join (CHT-28's shape) — and
                        both forward the caller's own token, so unlike every
                        other aux chart this deployment names no secret
                        (DV-208, DD-893): no client secret, no token URL, and
                        no OTLP leg to mint one with. */}}
                        {{- $atlas := include "atlas-mcp.siblingService" (dict "name" "atlas-server" "release" .Release.Name "override" .Values.atlas.service) }}
                        - name: {{ .Values.componentEnvPrefix }}SERVER_BASE_URL
                          value: {{ printf "https://%s:%d" $atlas (int .Values.atlas.port) | quote }}
                        {{- $validateEntity := include "atlas-mcp.siblingService" (dict "name" "atlas-validate-entity" "release" .Release.Name "override" .Values.validateEntity.service) }}
                        - name: {{ .Values.componentEnvPrefix }}VALIDATE_ENTITY_BASE_URL
                          value: {{ printf "https://%s:%d" $validateEntity (int .Values.validateEntity.port) | quote }}
                        {{- with .Values.config }}
                        {{- range $key, $value := . }}
                        - name: {{ $key }}
                          value: {{ $value | quote }}
                        {{- end }}
                        {{- end }}
                        {{- with .Values.secretRefs }}
                        {{- range . }}
                        - name: {{ .name }}
                          valueFrom:
                              secretKeyRef:
                                  name: {{ .secret }}
                                  key: {{ .key }}
                        {{- end }}
                        {{- end }}
                        {{- with .Values.extraEnv }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    {{- if .Values.tls.enabled }}
                    volumeMounts:
                        - name: tls
                          mountPath: /etc/aurelius-atlas/tls
                          readOnly: true
                    {{- end }}
                    readinessProbe:
                        httpGet:
                            path: {{ .Values.probes.readinessPath }}
                            port: {{ int .Values.port }}
                            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    livenessProbe:
                        httpGet:
                            path: {{ .Values.probes.livenessPath }}
                            port: {{ int .Values.port }}
                            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    resources:
                        {{- toYaml .Values.resources | nindent 24 }}
            {{- if .Values.tls.enabled }}
            volumes:
                -   name: tls
                    secret:
                        secretName: {{ default (printf "%s-tls" $fullname) .Values.tls.secretName }}
            {{- end }}
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
