{{/* The ServiceAccount. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-mcp.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-mcp.labels" . | nindent 8 }}
# The workload verifies Keycloak tokens and relays them to two siblings
# (MCP-02, MCP-03); it never calls the API server, so the cluster token has no
# use here.
automountServiceAccountToken: false
{{- end }}
