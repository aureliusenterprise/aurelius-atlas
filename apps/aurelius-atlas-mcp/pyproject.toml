[project]
dependencies = [
    "aurelius-atlas-auth",
    "aurelius-atlas-model",
    "aurelius-atlas-server-client",
    "aurelius-atlas-validate-entity-client",
    "fastmcp>=4.2.6",
    "httpx2>=2.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas MCP API: an agent-facing Model Context Protocol front door over the catalogue."
name = "aurelius-atlas-mcp"
requires-python = ">=3.14"
version = "0.1.0-rc.12"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
markers = [
    "critical: gates a pull request",
    "high: gates a merge, runs on main and weekly",
    "low: on-demand only",
    "medium: weekly proof is enough",
]
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-auth]
workspace = true

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[tool.uv.sources.aurelius-atlas-validate-entity-client]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
