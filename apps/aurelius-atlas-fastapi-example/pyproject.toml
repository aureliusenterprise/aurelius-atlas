[project]
dependencies = [
    "aurelius-atlas-example",
    "aurelius-atlas-sdk[postgresql]",
    "cachetools>=7.2.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "logfire[fastapi,httpx,psycopg]>=5.2.0",
    "psycopg[binary]>=3.3.6",
    "pybreaker>=1.4.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]
description = "This is an example FastAPI application."
name = "aurelius-atlas-fastapi-example"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_fastapi_example"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-example]
workspace = true

[tool.uv.sources.aurelius-atlas-sdk]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
