name: aurelius-atlas-fastapi-example-e2e

services:
    aurelius-atlas-fastapi-example:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-fastapi-example:local
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task
            # environment; an empty Settings field would otherwise surface
            # only as a pydantic validation error inside the started
            # container (or silently break auth/DB connectivity).
            # AURELIUS_ATLAS_FASTAPI_ prefix: Settings.env_prefix; the healthcheck's
            # PORT/TLS_CA_FILE are prefixed too (see Dockerfile).
            AURELIUS_ATLAS_FASTAPI_AUTH_CLIENT_ID: ${AURELIUS_ATLAS_FASTAPI_AUTH_CLIENT_ID:?}
            AURELIUS_ATLAS_FASTAPI_AUTH_REALM_NAME: ${AURELIUS_ATLAS_FASTAPI_AUTH_REALM_NAME:?}
            AURELIUS_ATLAS_FASTAPI_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_FASTAPI_AUTH_CA_FILE: /certs/ca.pem
            # Production mode on purpose: this stack already serves TLS and
            # verifies Postgres/auth-server certs, so it runs the strict
            # startup validators (https auth URL, explicit audience, required
            # write role) and the write-role authorization gate — e2e exercises
            # the hardened posture, not the development defaults. The schema is
            # created by the test fixtures, not auto_create_schema.
            AURELIUS_ATLAS_FASTAPI_ENVIRONMENT: production
            AURELIUS_ATLAS_FASTAPI_AUTH_WRITE_ROLE: ${AURELIUS_ATLAS_FASTAPI_AUTH_WRITE_ROLE:-aurelius-write}
            AURELIUS_ATLAS_FASTAPI_DATABASE_NAME: ${AURELIUS_ATLAS_FASTAPI_DATABASE_NAME:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_HOST: postgres
            AURELIUS_ATLAS_FASTAPI_DATABASE_PASSWORD: ${AURELIUS_ATLAS_FASTAPI_DATABASE_PASSWORD:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_PORT: ${AURELIUS_ATLAS_FASTAPI_DATABASE_PORT:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_USERNAME: ${AURELIUS_ATLAS_FASTAPI_DATABASE_USERNAME:?}
            # TLS: the app serves HTTPS and verifies the TLS-only Postgres
            # against the local development CA (this project's certs/, `nx certgen`).
            AURELIUS_ATLAS_FASTAPI_DATABASE_SSLMODE: verify-full
            AURELIUS_ATLAS_FASTAPI_DATABASE_SSLROOTCERT: /certs/ca.pem
            AURELIUS_ATLAS_FASTAPI_LOG_LEVEL: ${AURELIUS_ATLAS_FASTAPI_LOG_LEVEL:?}
            # The legacy leg (DD-107, CIA-10): the OTel SDK attaches its
            # bearer statically from OTEL_EXPORTER_OTLP_HEADERS and cannot
            # refresh (the dev realm's tokens live 60s), so this producer
            # keeps the shared ingest token — and the per-service leg (4319)
            # is OIDC-only now and would answer it 401 (CIA-08).
            OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector:4321
            OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.pem
            OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTEL_COLLECTOR_INGEST_TOKEN:?}"
            # Same reasoning as the app .env: the 60s default push means a
            # ~35s e2e run flushes once (on shutdown), so the counters enter
            # Prometheus already-final and the RED panels stay flat. Pushing
            # every second lets the suite's traffic show up as a live bump.
            OTEL_METRIC_EXPORT_INTERVAL: "1000"
            AURELIUS_ATLAS_FASTAPI_TLS_CERT_FILE: /certs/aurelius-atlas-fastapi-example.pem
            AURELIUS_ATLAS_FASTAPI_TLS_KEY_FILE: /certs/aurelius-atlas-fastapi-example-key.pem
            # Healthcheck CA for verifying the served certificate (dev CA).
            AURELIUS_ATLAS_FASTAPI_TLS_CA_FILE: /certs/ca.pem
        networks:
            # The collector answers as `otel-collector` on this network — the
            # name in its certificate. Its publishes are loopback-pinned
            # (CIA-03), so a host-gateway extra_host would not reach it.
            - aurelius-atlas-dev-observability-network
            - aurelius-atlas-dev-postgres-network
        extra_hosts:
            - keycloak.localhost:host-gateway
        ports:
            - 8000
        volumes:
            - ../certs:/certs:ro

networks:
    aurelius-atlas-dev-observability-network:
        external: true
    aurelius-atlas-dev-postgres-network:
        external: true
