version: 1
openmetadata:
    host: http://localhost:8585
    tokenEnv: OPENLINEAGE_JWT_TOKEN
pipeline:
    # Own pipeline service (serviceType below) so the app appears as its own
    # box in Service Lineage instead of piling into aurelius-openlineage.
    # Named after the app, not the REST API service (aurelius-fastapi-example-api),
    # to keep the two services distinguishable in search.
    service: aurelius-fastapi-example
    serviceType: CustomPipeline
    # UI label for the Service Lineage box — the raw name truncates to the same
    # string as the API service (aurelius-fastapi-example-api) next to it.
    serviceDisplayName: FastAPI App (Pipeline)
    name: aurelius-fastapi-example-api
    description: FastAPI example application.
    state: Active
edges:
    - from:
          entity: table
          service: aurelius-dev-postgres
          name: entity
      to:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      source: Manual
      description: FastAPI reads the entity table for its GET/SSE endpoints.
    - from:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      to:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/get
      source: Manual
      description: GET /entities serves data read from the entity table.
    - from:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      to:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/{guid}/get
      source: Manual
      description: GET /entities/{guid} serves a row read from the entity table.
    - from:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      to:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/sse/get
      source: Manual
      description: GET /entities/sse streams changes read from the entity table.
    - from:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/put
      to:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      source: Manual
      description: PUT /entities sends data that FastAPI writes to the entity table.
    - from:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/{guid}/delete
      to:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      source: Manual
      description: DELETE /entities/{guid} removes a row from the entity table.
    - from:
          entity: pipeline
          service: aurelius-fastapi-example
          name: aurelius-fastapi-example-api
      to:
          entity: table
          service: aurelius-dev-postgres
          name: entity
      source: Manual
      description: FastAPI writes (upsert/delete) to the entity table.
