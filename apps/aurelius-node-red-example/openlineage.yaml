version: 1
openmetadata:
    host: http://localhost:8585
    tokenEnv: OPENLINEAGE_JWT_TOKEN
pipeline:
    # Own pipeline service (serviceType below) so the app appears as its own
    # box in Service Lineage instead of piling into aurelius-openlineage.
    service: aurelius-node-red-example
    serviceType: CustomPipeline
    # UI label for the Service Lineage box — the raw name truncates
    # ("aurelius-node-red-ex…") and reads as a duplicate of the app itself.
    serviceDisplayName: Node-RED Flow (Pipeline)
    name: aurelius-node-red-example
    description: Example Kafka producer in Node-RED.
    state: Active
edges:
    - from:
          entity: pipeline
          service: aurelius-node-red-example
          name: aurelius-node-red-example
      to:
          entity: topic
          service: aurelius-dev-kafka
          name: example.entity
      source: Manual
      description: Entity topic produced by Node-RED example.
