name: aurelius-atlas-frontend-example-e2e

services:
    aurelius-atlas-frontend-example:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-frontend-example:local
        depends_on:
            aurelius-atlas-fastapi-example:
                condition: service_healthy
        configs:
            - source: frontend_config
              target: /usr/share/nginx/html/config.json
            - source: frontend_nginx_config
              target: /etc/nginx/conf.d/default.conf
        volumes:
            - ../certs:/certs:ro
        extra_hosts:
            # Keycloak is reached on the host; the collector over the
            # observability network (joined below) — its publishes are
            # loopback-pinned (CIA-03), so the gateway address would not answer.
            - keycloak.localhost:host-gateway
        ports:
            # Fixed host port: the SPA origin must be a literal entry in the
            # Keycloak client's web origins (Keycloak compares origins exactly,
            # no port wildcards). conftest.py discovers the port dynamically.
            - 18443:8080
        networks:
            - default
            - aurelius-atlas-dev-observability-network

    aurelius-atlas-fastapi-example:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-fastapi-example:local
        depends_on:
            postgres-app:
                condition: service_healthy
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task
            # environment; an empty value would surface only as a pydantic
            # validation error inside the started container (or silently
            # break auth/DB connectivity).
            # Container side uses the fastapi app's AURELIUS_ATLAS_FASTAPI_ prefix
            # (its Settings.env_prefix, incl. the healthcheck's TLS_CA_FILE);
            # the ${...} side reads THIS project's AURELIUS_ATLAS_FRONTEND_-prefixed
            # task env — the cross-name mapping keeps one source of truth per
            # project (same pattern as the JDBC-sink compose).
            AURELIUS_ATLAS_FASTAPI_AUTH_CLIENT_ID: ${AURELIUS_ATLAS_FRONTEND_AUTH_CLIENT_ID:?}
            AURELIUS_ATLAS_FASTAPI_AUTH_REALM_NAME: ${AURELIUS_ATLAS_FRONTEND_AUTH_REALM_NAME:?}
            AURELIUS_ATLAS_FASTAPI_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_FASTAPI_AUTH_CA_FILE: /certs/ca.pem
            AURELIUS_ATLAS_FASTAPI_DATABASE_NAME: ${AURELIUS_ATLAS_FRONTEND_DATABASE_NAME:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_HOST: postgres-app
            AURELIUS_ATLAS_FASTAPI_DATABASE_SSLMODE: verify-full
            AURELIUS_ATLAS_FASTAPI_DATABASE_SSLROOTCERT: /certs/ca.pem
            AURELIUS_ATLAS_FASTAPI_DATABASE_PASSWORD: ${AURELIUS_ATLAS_FRONTEND_DATABASE_PASSWORD:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_PORT: ${AURELIUS_ATLAS_FRONTEND_DATABASE_PORT:?}
            AURELIUS_ATLAS_FASTAPI_DATABASE_USERNAME: ${AURELIUS_ATLAS_FRONTEND_DATABASE_USERNAME:?}
            AURELIUS_ATLAS_FASTAPI_ENVIRONMENT: ${AURELIUS_ATLAS_FRONTEND_ENVIRONMENT:?}
            AURELIUS_ATLAS_FASTAPI_LOG_LEVEL: ${AURELIUS_ATLAS_FRONTEND_LOG_LEVEL:?}
            AURELIUS_ATLAS_FASTAPI_TLS_CERT_FILE: /certs/aurelius-atlas-fastapi-example.pem
            AURELIUS_ATLAS_FASTAPI_TLS_KEY_FILE: /certs/aurelius-atlas-fastapi-example-key.pem
            # Healthcheck CA for verifying the served certificate (dev CA).
            AURELIUS_ATLAS_FASTAPI_TLS_CA_FILE: /certs/ca.pem
            # OTLP export: the browser's /api/ requests carry W3C traceparent
            # (aurelius-atlas-observability interceptor), so the backend must
            # export to the same collector the browser's /otel/ proxy feeds —
            # otherwise the frontend trace has no server span to join (same
            # wiring as aurelius-atlas-fastapi-example/e2e/docker-compose.yaml).
            # The legacy leg (DD-196, CIA-10): the OTel SDK attaches its
            # bearer statically from OTEL_EXPORTER_OTLP_HEADERS and cannot
            # refresh (the dev realm's tokens live 60s), so this producer
            # keeps the shared ingest token — and the per-service leg (4319)
            # is OIDC-only now and would answer it 401 (CIA-08).
            OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector:4321
            OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.pem
            OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTEL_COLLECTOR_INGEST_TOKEN:?}"
        extra_hosts:
            - keycloak.localhost:host-gateway
        networks:
            # default: reached by the nginx /api/ proxy and postgres-app;
            # observability: reaches the dev collector (conftest starts it first).
            - default
            - aurelius-atlas-dev-observability-network
        ports:
            - 8000
        volumes:
            - ../certs:/certs:ro

    postgres-app:
        image: dhi.io/postgres:18-alpine3.23
        environment:
            POSTGRES_USER: ${AURELIUS_ATLAS_FRONTEND_DATABASE_USERNAME:?}
            POSTGRES_PASSWORD: ${AURELIUS_ATLAS_FRONTEND_DATABASE_PASSWORD:?}
            POSTGRES_DB: ${AURELIUS_ATLAS_FRONTEND_DATABASE_NAME:?}
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        # The image runs as a fixed non-root user that cannot read bind-mounted
        # key material it does not own, so the certificates are copied to the
        # container filesystem with strict permissions before startup - and
        # Postgres insists the key is 0600, owned by the server user, so a
        # direct bind-mount at the ssl paths is not an option (host
        # ownership). mktemp -d, not a fixed /tmp path: the target must be
        # born with the running user's ownership every boot; fixed paths
        # collide on a warm daemon (runs 40225940082, 40228376483).
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >-
                d=$(mktemp -d) && install -m 600 /certs/postgres.pem $$d/server.pem && install -m 600 /certs/postgres-key.pem $$d/server-key.pem && exec docker-entrypoint.sh -c ssl=on -c ssl_cert_file=$$d/server.pem -c ssl_key_file=$$d/server-key.pem -c hba_file=/conf/pg_hba.conf
        stop_signal: SIGINT
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "PGSSLMODE=verify-full PGSSLROOTCERT=/certs/ca.pem pg_isready -h 127.0.0.1 -U ${AURELIUS_ATLAS_FRONTEND_DATABASE_USERNAME} -d ${AURELIUS_ATLAS_FRONTEND_DATABASE_NAME}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5432
        volumes:
            - ../certs:/certs:ro
            - ../../../dev/postgres/pg_hba.conf:/conf/pg_hba.conf:ro

configs:
    frontend_config:
        file: ./config/config.json
    frontend_nginx_config:
        file: ./config/nginx.conf

networks:
    # Started by dev/observability (conftest starts it before this stack), so
    # the backend can export OTLP to the same collector the browser feeds.
    aurelius-atlas-dev-observability-network:
        external: true
