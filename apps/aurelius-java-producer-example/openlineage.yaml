version: 1
openmetadata:
    host: http://localhost:8585
    tokenEnv: OPENLINEAGE_JWT_TOKEN
pipeline:
    service: aurelius-openlineage
    # Matches the pipeline OM derives from the producer's OpenLineage events
    # ("{jobNamespace}-{jobName}") so the live stream stitches into this
    # static graph instead of creating a second pipeline.
    name: aurelius-openlineage-aurelius-java-producer-example
    description: Example Kafka producer in Java.
    state: Active
edges:
    - from:
          entity: pipeline
          service: aurelius-openlineage
          name: aurelius-openlineage-aurelius-java-producer-example
      to:
          entity: topic
          service: aurelius-dev-kafka
          name: example.entity
      source: Manual
      description: Entity topic produced by Java producer example.
