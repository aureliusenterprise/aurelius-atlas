[project]
dependencies = [
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-server-client",
    "httpx2>=2.0.0",
    "psycopg[binary]>=3.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.44",
]
description = "The Aurelius Atlas relational database scanner: a batch reflection of one live database, registered as catalogue entities."
name = "aurelius-atlas-db-scanner"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_db_scanner"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
markers = [
    "critical: gates a pull request",
    "high: gates a merge, runs on main and weekly",
    "low: on-demand only",
    "medium: weekly proof is enough",
]
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
