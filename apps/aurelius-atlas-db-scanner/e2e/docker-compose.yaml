name: aurelius-atlas-db-scanner-e2e

# The scanner is a batch CLI, not a service: the suite runs it in-process against
# this stack's real Atlas server. There is therefore no scanner service here —
# only the catalogue the job speaks to, and that catalogue is the server
# project's e2e service, extended (the pattern of ADR 065/066): image,
# networks, aliases, certificate mount, Keycloak-on-host and the eighteen
# shared settings arrive by inheritance from
# ../../aurelius-atlas-server/e2e/compose.server.yaml, whose ../certs rebases
# to that project's folder — the server's own certificate, the one it
# presents. This stack states only its differences: its port and the scanner's
# audience joined. The store and the collector ride the dev networks; Keycloak
# is reached on the host. The database the scan reads is this stack's own
# disposable Postgres (DD-507): the suite seeds it over its published port and
# drops the whole stack when it ends — it rides no shared store.
services:
    atlas-server:
        extends:
            file: ../../aurelius-atlas-server/e2e/compose.server.yaml
            service: atlas-server
        ports:
            # Fixed host port, loopback-pinned (CIA-03): the suite's client and
            # the server's own image healthcheck speak to it there. 21007 is
            # this stack's; the serve port 21000, the server suite's 21001, the
            # quality scanner's 21005 and the kafka scanner's 21006 stay free.
            - 127.0.0.1:21007:21000
        environment:
            # Both identities of this suite are accepted (AUT-02, DBS-10): the
            # seeding writer's `aurelius` token and the scanner's own
            # client-credentials token, whose azp joins the audiences here
            # (DD-458's family). One key over the base's map.
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-db-scanner"]'

    scan-postgres:
        # The database under scan (DD-507): the suite's own, started with the
        # stack and discarded with it. The hardened image refuses trust auth,
        # so it runs SCRAM with the suite's password — which also keeps the
        # scrubbing path real (DBS-02): the DSN the suite dials carries it.
        image: dhi.io/postgres:18-alpine3.23
        environment:
            POSTGRES_USER: atlas
            # The password arrives as a file, not an env value: the image
            # reads *_FILE itself, so it never lingers in the container's
            # environment where a sibling process could read it.
            POSTGRES_PASSWORD_FILE: /run/secrets/scan_pg_password
            POSTGRES_DB: scan
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        secrets:
            # Environment-sourced (ADR 066's treatment): the value rides the
            # Nx-injected .env, and outside Swarm only this kind honours
            # uid/gid/mode — postgres/postgres 0400, verified against the
            # image (the file-sourced form is a plain bind mount and ignores
            # them).
            - source: scan_pg_password
              uid: "999"
              gid: "999"
              mode: "0400"
        ports:
            # Loopback-pinned (CIA-03): the suite seeds and scans from the host.
            - 127.0.0.1:25432:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U atlas -d scan"]
            interval: 2s
            timeout: 3s
            retries: 30

networks:
    # `extends` copies the service, not the network definitions: both are
    # declared here, as in every consumer of the server base.
    # The dev Elasticsearch stack (started by the e2e target's up dependency,
    # and by conftest as a guard): the server reaches the store as
    # `elasticsearch` on this network.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    # The dev telemetry stack (infra/observability): the server's OTLP export
    # reaches the collector on it.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true

secrets:
    # The scan database's password, from the project .env Nx injects into the
    # e2e task (the same key the suite's DSN uses to seed over the published
    # port). The guard fails the start loudly when it is missing.
    scan_pg_password:
        environment: AURELIUS_ATLAS_DB_SCANNER_POSTGRES_PASSWORD
