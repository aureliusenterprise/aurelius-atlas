[project]
dependencies = [
    "aurelius-atlas-auth",
    "aurelius-atlas-core",
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-quality",
    "aurelius-atlas-store-es",
    "elasticsearch[async]>=9.5.1,<10",
    "fastapi>=0.162.0",
    "httpx2>=2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas server: the Apache Atlas REST API on Elasticsearch."
name = "aurelius-atlas-server"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_server"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
markers = [
    "critical: gates a pull request",
    "high: gates a merge, runs on main and weekly",
    "low: on-demand only",
    "medium: weekly proof is enough",
]
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-auth]
workspace = true

[tool.uv.sources.aurelius-atlas-core]
workspace = true

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-quality]
workspace = true

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
