[project]
dependencies = [
    "aurelius-atlas-core",
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-store-es",
    "fastapi>=0.162.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas server: the Apache Atlas REST API on Elasticsearch."
name = "aurelius-atlas-server"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_server"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-core]
workspace = true

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
