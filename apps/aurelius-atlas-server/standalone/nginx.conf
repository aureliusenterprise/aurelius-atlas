# The one entry of the standalone stack: https://localhost:9000, the webapp at /, the server at /atlas2/,
# Keycloak at /auth/. The server and the webapp share this container's network, so they listen on
# 127.0.0.1:21000 and 127.0.0.1:8080 here.
server {
    listen 9000 ssl;
    server_name localhost;

    ssl_certificate /certs/aurelius-atlas-server.pem;
    ssl_certificate_key /certs/aurelius-atlas-server-key.pem;

    # Keycloak's sign-in answers carry large cookies and headers.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 1g;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 9000;

    location = /atlas2 {
        return 302 /atlas2/;
    }

    # The server knows its root path (/atlas2), so its redirects already carry it.
    location /atlas2/ {
        proxy_pass https://127.0.0.1:21000/;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_redirect off;
        proxy_read_timeout 3600s;
    }

    # Keycloak serves under /auth itself (http-relative-path), so the path passes unchanged.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_redirect off;
    }

    # The stack has no telemetry collector: the webapp's OTLP pushes are taken and dropped.
    location /otel/ {
        return 204;
    }

    # Everything else is the webapp's: its locales, its config.json, its silent sign-in page, and /api/, which
    # its own nginx passes to the server unchanged.
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name aurelius-atlas-webapp;
        # The webapp's nginx names its own port in its redirects (/ to its locale): this entry's instead.
        proxy_redirect https://localhost:8080/ /;
        proxy_read_timeout 3600s;
    }
}
