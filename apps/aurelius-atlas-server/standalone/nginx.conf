# The one entry of the standalone stack: https://localhost:9000, the server at /atlas2/, Keycloak at /auth/.
# The server shares this container's network, so it listens on 127.0.0.1:21000 here.
server {
    listen 9000 ssl;
    server_name localhost;

    ssl_certificate /certs/aurelius-atlas-server.pem;
    ssl_certificate_key /certs/aurelius-atlas-server-key.pem;

    # Keycloak's sign-in answers carry large cookies and headers.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 1g;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 9000;

    location = / {
        return 302 /atlas2/;
    }

    location = /atlas2 {
        return 302 /atlas2/;
    }

    # The server knows its root path (/atlas2), so its redirects already carry it.
    location /atlas2/ {
        proxy_pass https://127.0.0.1:21000/;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_redirect off;
        proxy_read_timeout 3600s;
    }

    # Keycloak serves under /auth itself (http-relative-path), so the path passes unchanged.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_redirect off;
    }
}
