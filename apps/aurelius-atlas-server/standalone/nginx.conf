# The one entry of the standalone stack, and its only reverse proxy: https://localhost:9000, the webapp at /,
# its API at /api/, the server's dashboards at /atlas2/, Keycloak at /auth/. The server shares this
# container's network, so it listens on 127.0.0.1:21000 here; the webapp is a container of its own, which only
# serves the webapp's files.
server {
    listen 9000 ssl;
    server_name localhost;

    ssl_certificate /certs/aurelius-atlas-server.pem;
    ssl_certificate_key /certs/aurelius-atlas-server-key.pem;

    # Keycloak's sign-in answers carry large cookies and headers.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 1g;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 9000;

    location = /atlas2 {
        return 302 /atlas2/;
    }

    # The server knows its root path (/atlas2), so its redirects already carry it.
    location /atlas2/ {
        proxy_pass https://127.0.0.1:21000/;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_redirect off;
        proxy_read_timeout 3600s;
    }

    # Docker's DNS: the webapp is looked up per request, so this proxy starts before it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The webapp's API calls: to the server, the /api prefix intact (DD-139), as its paths start there.
    location /api/ {
        proxy_pass https://127.0.0.1:21000;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_redirect off;
        proxy_read_timeout 3600s;
    }

    # Keycloak serves under /auth itself (http-relative-path), so the path passes unchanged.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_redirect off;
    }

    # The stack has no telemetry collector: the webapp's OTLP pushes are taken and dropped.
    location /otel/ {
        return 204;
    }

    # Everything else is the webapp's files: its locales, its config.json and its silent sign-in page.
    location / {
        set $webapp https://aurelius-atlas-webapp:8080;
        proxy_pass $webapp;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name aurelius-atlas-webapp;
        # The webapp's nginx names its own port in its redirects (/ to its locale): this entry's instead.
        proxy_redirect https://localhost:8080/ /;
        proxy_read_timeout 3600s;
    }
}
