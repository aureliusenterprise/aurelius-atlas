# The server project's own e2e stack: one service, extended from
# compose.server.yaml - the same base the scanner and aux-API suites use, so
# the shared settings live once (the pattern of ADR 065/066). This file states
# only what belongs to this suite: the tasks-off setting the scenarios rely
# on (DD-081), the plain `aurelius` audience the suite's password-grant tokens
# carry (DD-250), and the fixed host port the realm's sign-in redirect returns
# to. compose.server.yaml explains the base and the guard placement.
name: aurelius-atlas-server-e2e

services:
    aurelius-atlas-server:
        extends:
            file: ./compose.server.yaml
            service: atlas-server
        environment:
            # The scenarios check what propagation produces, so it happens in the request (DD-081).
            AURELIUS_ATLAS_SERVER_TASKS_ENABLED: "false"
            # Authentication (6.1a, DD-250): the suite's password-grant tokens
            # carry the plain `aurelius` audience; consumers add their own.
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius"]'
        ports:
            # A fixed host port: the realm's aurelius-atlas-server client
            # registers https://localhost:21001/login.jsp as the e2e sign-in's
            # return (serve keeps 21000).
            - 127.0.0.1:21001:21000

networks:
    # `extends` copies the service, not the network definitions.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
