name: aurelius-atlas-server-e2e

services:
    aurelius-atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task environment; a missing value
            # would otherwise only show as a settings error inside the started container.
            AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
            # The scenarios check what propagation produces, so it happens in the request (DD-081).
            AURELIUS_ATLAS_SERVER_TASKS_ENABLED: "false"
            # The dev store, reached on its network by its service name (in its certificate).
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            # HTTPS with this project's certificate (`nx certgen`); the healthcheck verifies it.
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # HSTS off in e2e (DD-236): the e2e browser signs in over keycloak.localhost,
            # and includeSubDomains on localhost would pin that name to HTTPS.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # OTLP ingest identity (7.18, DD-196): the server exports through
            # its own pipeline (aurelius-atlas-otel), minting client-credentials
            # JWTs as otel-atlas-server for the per-service leg — the OIDC
            # receiver on :4319 answers the shared token 401 (CIA-08), so the
            # 7.17 static OTEL_EXPORTER_* pair is gone. The mint rides the TLS
            # :8443 listener (DD-202): every per-service producer mints there,
            # the collector validates both listeners, so no suite order can
            # split mint issuer from validator. Nx injects the project .env, a
            # missing secret fails the start.
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
            # The SDK's BatchSpanProcessor exports on a 5s cycle by default,
            # which is the floor under the suite's Tempo read-back probes.
            # Test containers export every second (DD-225); prod images keep
            # the default. The name stays bare (OTEL_*, third-party consumer).
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            # The mint target: the e2e Keycloak's :8443 listener, published
            # loopback-wide on this machine (as the webapp stack's nginx uses
            # for /api/). The collector is reached by service DNS — its
            # publishes are loopback-pinned (CIA-03), host-gateway would not
            # answer for it.
            - keycloak.localhost:host-gateway
        networks:
            - aurelius-atlas-dev-elasticsearch-network
            # The collector answers as `otel-collector` on this network — the
            # name in its certificate. Its publishes are loopback-pinned
            # (CIA-03), so a host-gateway extra_host would not reach it.
            - aurelius-atlas-dev-observability-network
        ports:
            - 21000
        volumes:
            - ../certs:/certs:ro

networks:
    aurelius-atlas-dev-elasticsearch-network:
        external: true
    aurelius-atlas-dev-observability-network:
        external: true
