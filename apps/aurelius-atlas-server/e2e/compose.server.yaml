# The e2e Atlas server, as a base: every scanner or aux-API e2e stack that stands up a real
# catalogue of its own extends this service (the pattern of ADR 065/066, proven on the standalone
# stack's pieces). Not a deployment target of its own - run a consumer's docker-compose.yaml.
# The base is the server project's e2e identity: the image, the certificate mount (this file's
# ../certs, which extends rebases here - the server's own cert, issued once by `nx certgen`, is
# the one the service presents), the two shared-infra networks, the Keycloak-on-host mapping,
# and the eighteen settings every copy carried identically. What a consumer states are its
# differences: its port, its audience (`AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES` - the scanner's own
# client-credentials token joins it, DD-458), and anything else of its own; compose merges the
# environment map by key, so one added key is one added line.
# The guards are the consumers': compose interpolates this file with the consuming project's
# environment, and Nx injects each project's .env into its e2e task, so every ${VAR:?} names a
# key the consumer's own .env already carries - no project gains a secret.
# Relative paths read from this file's folder; keep the service name `atlas-server`, the network
# keys and the aliases: the suites and the certificate names speak them.
services:
    atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        networks:
            atlas:
                # The alias is the name in the server certificate; the compose
                # service name stays atlas-server.
                aliases:
                    - aurelius-atlas-server
            # The telemetry stack (infra/observability, started by the e2e
            # target's up dependency and by conftest as a guard): the collector
            # answers as `otel-collector` here - the name in its certificate.
            # Its publishes are loopback-pinned (CIA-03), so service DNS is the
            # only path.
            observability: {}
        extra_hosts:
            # The mint target and the token issuer: the Keycloak TLS listener
            # (DD-202), published loopback-wide on this machine.
            - keycloak.localhost:host-gateway
        volumes:
            - ../certs:/certs:ro
        environment:
            # ${VAR:?} guards: Nx injects the consumer's .env into the e2e task
            # environment; a missing value fails the compose start loudly.
            AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
            # The shared dev store, reached on its network by its service name
            # (the name in its certificate).
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            # HTTPS with the server's certificate (`nx certgen`); the healthcheck
            # verifies it.
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # HSTS off in e2e (DD-236): localhost must not pin the dev names to
            # HTTPS for the browser suites.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # OTLP ingest identity (7.18, DD-196): the per-service mint at the
            # TLS :8443 issuer, exported to the collector's :4319 over the
            # observability network.
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
            # Authentication (6.1a, DD-250): tokens of the dev realm, verified
            # against the same :8443 listener. The suite's writer identities are
            # accepted through the `aurelius` audience; a scanner adds its own.
            AURELIUS_ATLAS_SERVER_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET: ${AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_AUTH_CA_FILE: /certs/ca.pem
            # Export every second in test containers (DD-225): the floor under
            # the suites' Tempo read-back probes.
            OTEL_BSP_SCHEDULE_DELAY: "1000"

networks:
    # The shared Elasticsearch stack (infra/elasticsearch): the server reaches
    # the store as `elasticsearch` on this network. Consumers re-declare both
    # networks - `extends` copies the service, not the network definitions.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
