name: Entities are created, read back and updated through each write endpoint
source:
    - webapp/src/main/java/org/apache/atlas/web/rest/EntityREST.java#createOrUpdate
    - webapp/src/main/java/org/apache/atlas/web/rest/EntityREST.java#partialUpdateEntityAttrByGuid
    - webapp/src/main/java/org/apache/atlas/web/rest/EntityREST.java#partialUpdateEntityByUniqueAttrs
    - webapp/src/main/java/org/apache/atlas/web/rest/EntityREST.java#getById
    - repository/src/main/java/org/apache/atlas/repository/store/graph/v2/AtlasEntityStoreV2.java#preCreateOrUpdate
    - repository/src/main/java/org/apache/atlas/repository/store/graph/v2/EntityGraphMapper.java#mapAttributesAndClassifications
    - repository/src/main/java/org/apache/atlas/repository/store/graph/v2/EntityGraphMapper.java#mapAttribute
    - repository/src/main/java/org/apache/atlas/repository/store/graph/v2/EntityGraphRetriever.java#toAtlasEntityHeaderWithClassifications
    - intg/src/main/java/org/apache/atlas/model/instance/EntityMutationResponse.java
rules: [EWR-02, EWR-05, EWR-06, EWR-09, EWR-11, EWR-12, EWR-13, EWR-14, EWR-15]
covers:
    - aurelius_atlas_server.routes.entity.create_or_update
    - aurelius_atlas_server.routes.entity.create_or_update_bulk
    - aurelius_atlas_server.routes.entity.partial_update_entity_attr_by_guid
    - aurelius_atlas_server.routes.entity.partial_update_entity_by_unique_attrs
stages:
    - name: create a database and a table type, named for this run (DD-055)
      request:
          method: POST
          url: /api/atlas/v2/types/typedefs
          json:
              entityDefs:
                  - name: scenario_db_{run}
                    attributeDefs:
                        - { name: qualifiedName, typeName: string, isUnique: true, isIndexable: true }
                  - name: scenario_table_{run}
                    attributeDefs:
                        - { name: qualifiedName, typeName: string, isUnique: true, isIndexable: true }
                        - { name: size, typeName: int, isOptional: true }
                        - { name: db, typeName: "scenario_db_{run}", isOptional: true }
      response:
          status: 200
          json:
              enumDefs: []
              structDefs: []
              classificationDefs: []
              entityDefs:
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_db_{run}
                    description: scenario_db_{run}
                    typeVersion: "1.0"
                    attributeDefs:
                        - name: qualifiedName
                          typeName: string
                          isOptional: false
                          cardinality: SINGLE
                          valuesMinCount: 1
                          valuesMaxCount: 1
                          isUnique: true
                          isIndexable: true
                          includeInNotification: false
                          searchWeight: -1
                    superTypes: []
                    subTypes: []
                    relationshipAttributeDefs: []
                    businessAttributeDefs: {}
                    category: ENTITY
                    createdBy: admin
                    updatedBy: admin
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_table_{run}
                    description: scenario_table_{run}
                    typeVersion: "1.0"
                    attributeDefs:
                        - name: qualifiedName
                          typeName: string
                          isOptional: false
                          cardinality: SINGLE
                          valuesMinCount: 1
                          valuesMaxCount: 1
                          isUnique: true
                          isIndexable: true
                          includeInNotification: false
                          searchWeight: -1
                        - name: size
                          typeName: int
                          isOptional: true
                          cardinality: SINGLE
                          valuesMinCount: 0
                          valuesMaxCount: 1
                          isUnique: false
                          isIndexable: false
                          includeInNotification: false
                          searchWeight: -1
                        - name: db
                          typeName: scenario_db_{run}
                          isOptional: true
                          cardinality: SINGLE
                          valuesMinCount: 0
                          valuesMaxCount: 1
                          isUnique: false
                          isIndexable: false
                          includeInNotification: false
                          searchWeight: -1
                    superTypes: []
                    subTypes: []
                    relationshipAttributeDefs: []
                    businessAttributeDefs: {}
                    category: ENTITY
                    createdBy: admin
                    updatedBy: admin
              relationshipDefs: []
              businessMetadataDefs: []
          volatile:
              - $.entityDefs[*].guid
              - $.entityDefs[*].createTime
              - $.entityDefs[*].updateTime
          deviations:
              - { id: DV-06, path: "$.entityDefs[0].createdBy", absent: true }
              - { id: DV-06, path: "$.entityDefs[0].updatedBy", absent: true }
              - { id: DV-06, path: "$.entityDefs[1].createdBy", absent: true }
              - { id: DV-06, path: "$.entityDefs[1].updatedBy", absent: true }
    - name: a reference to a GUID neither stored nor in the request names nothing
      request:
          method: POST
          url: /api/atlas/v2/entity
          json:
              entity:
                  typeName: scenario_table_{run}
                  guid: "-1"
                  attributes: { qualifiedName: "t_{run}", db: { guid: "-9", typeName: "scenario_db_{run}" } }
      response:
          status: 404
          json: { errorCode: ATLAS-404-00-00A, errorMessage: Referenced entity -9 is not found }
    - name: create a database and a table that refers to it, in bulk
      request:
          method: POST
          url: /api/atlas/v2/entity/bulk
          json:
              entities:
                  - { typeName: "scenario_db_{run}", guid: "-1", attributes: { qualifiedName: "db_{run}" } }
                  - typeName: scenario_table_{run}
                    guid: "-2"
                    attributes: { qualifiedName: "t_{run}", db: { guid: "-1", typeName: "scenario_db_{run}" } }
      response:
          status: 200
          json:
              mutatedEntities:
                  CREATE:
                      - typeName: scenario_db_{run}
                        attributes: { qualifiedName: "db_{run}" }
                        guid: a new GUID
                        status: ACTIVE
                        displayText: db_{run}
                        classificationNames: []
                        classifications: []
                        meaningNames: []
                        meanings: []
                        isIncomplete: false
                        labels: []
                      - typeName: scenario_table_{run}
                        attributes: { qualifiedName: "t_{run}" }
                        guid: a new GUID
                        status: ACTIVE
                        displayText: t_{run}
                        classificationNames: []
                        classifications: []
                        meaningNames: []
                        meanings: []
                        isIncomplete: false
                        labels: []
              guidAssignments: { "-1": a new GUID, "-2": a new GUID }
          volatile:
              - $.mutatedEntities.CREATE[*].guid
              - $.guidAssignments['-1']
              - $.guidAssignments['-2']
          save:
              db: $.guidAssignments['-1']
              table: $.guidAssignments['-2']
    - name: the table reads back with its reference and the default of its optional int
      request:
          method: GET
          url: /api/atlas/v2/entity/guid/{table}
      response:
          status: 200
          json:
              referredEntities: {}
              entity:
                  typeName: scenario_table_{run}
                  attributes:
                      qualifiedName: t_{run}
                      size: 0
                      db:
                          {
                              guid: "{db}",
                              typeName: "scenario_db_{run}",
                              uniqueAttributes: { qualifiedName: "db_{run}" },
                          }
                  guid: "{table}"
                  isIncomplete: false
                  provenanceType: 0
                  status: ACTIVE
                  createdBy: admin
                  updatedBy: admin
                  createTime: 0
                  updateTime: 0
                  version: 0
                  labels: []
          volatile:
              - $.entity.createTime
              - $.entity.updateTime
          deviations:
              - { id: DV-15, path: $.entity.createdBy, absent: true }
              - { id: DV-15, path: $.entity.updatedBy, absent: true }
    - name: a create with the table's unique value updates it
      request:
          method: POST
          url: /api/atlas/v2/entity
          json:
              entity:
                  { typeName: "scenario_table_{run}", guid: "-5", attributes: { qualifiedName: "t_{run}", size: 5 } }
      response:
          status: 200
          json:
              mutatedEntities:
                  UPDATE:
                      - typeName: scenario_table_{run}
                        attributes: { qualifiedName: "t_{run}" }
                        guid: "{table}"
                        status: ACTIVE
                        displayText: t_{run}
                        classificationNames: []
                        classifications: []
                        meaningNames: []
                        meanings: []
                        isIncomplete: false
                        labels: []
              guidAssignments: { "-5": "{table}" }
    - name: the same create again changes nothing and reports nothing
      request:
          method: POST
          url: /api/atlas/v2/entity
          json:
              entity:
                  { typeName: "scenario_table_{run}", guid: "-5", attributes: { qualifiedName: "t_{run}", size: 5 } }
      response:
          status: 200
          json:
              guidAssignments: { "-5": "{table}" }
    - name: one attribute set by GUID is a partial update
      request:
          method: PUT
          url: /api/atlas/v2/entity/guid/{table}
          params: { name: size }
          json: 7
      response:
          status: 200
          json:
              mutatedEntities:
                  PARTIAL_UPDATE:
                      - &table_header
                        typeName: scenario_table_{run}
                        attributes: { qualifiedName: "t_{run}" }
                        guid: "{table}"
                        status: ACTIVE
                        displayText: t_{run}
                        classificationNames: []
                        classifications: []
                        meaningNames: []
                        meanings: []
                        isIncomplete: false
                        labels: []
              partialUpdatedEntities: [*table_header]
              guidAssignments: {}
    - name: a partial update by unique attributes
      request:
          method: PUT
          url: /api/atlas/v2/entity/uniqueAttribute/type/scenario_table_{run}
          params: { "attr:qualifiedName": "t_{run}" }
          json:
              entity: { typeName: "scenario_table_{run}", attributes: { size: 9 } }
      response:
          status: 200
          json:
              mutatedEntities:
                  PARTIAL_UPDATE: [*table_header]
              partialUpdatedEntities: [*table_header]
              guidAssignments: {}
    - name: the table reads back with the last size
      request:
          method: GET
          url: /api/atlas/v2/entity/uniqueAttribute/type/scenario_table_{run}
          params: { "attr:qualifiedName": "t_{run}", minExtInfo: "true" }
      response:
          status: 200
          json:
              referredEntities: {}
              entity:
                  typeName: scenario_table_{run}
                  attributes:
                      qualifiedName: t_{run}
                      size: 9
                      db:
                          {
                              guid: "{db}",
                              typeName: "scenario_db_{run}",
                              uniqueAttributes: { qualifiedName: "db_{run}" },
                          }
                  guid: "{table}"
                  isIncomplete: false
                  provenanceType: 0
                  status: ACTIVE
                  createdBy: admin
                  updatedBy: admin
                  createTime: 0
                  updateTime: 0
                  version: 0
                  labels: []
          volatile:
              - $.entity.createTime
              - $.entity.updateTime
          deviations:
              - { id: DV-15, path: $.entity.createdBy, absent: true }
              - { id: DV-15, path: $.entity.updatedBy, absent: true }
