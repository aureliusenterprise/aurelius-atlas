# The session of a signed-in user (ADM-06, ADM-07; 6.1). Bearer-authenticated (AUTH-03) with a token the
# runner minted at the issuer: {bearer} is saved into the run before stage 1 by the e2e conftest, which
# signs the dev user in at dev/keycloak (the authorization-code flow itself is proven over TLS by
# test__aurelius_atlas_server_auth_e2e.py). The Java example of getUserProfile — userName admin, groups
# [ADMIN] — is met by aurelius-writer, who holds the ADMIN realm role (the ADMIN group of
# distro/src/conf/users-credentials.properties).
name: The session reports the signed-in user of the realm
source:
    - webapp/src/main/java/org/apache/atlas/web/resources/AdminResource.java#getUserProfile
    - webapp/src/main/java/org/apache/atlas/web/resources/AdminResource.java#AdminResource (session defaults)
    - server-common/src/main/java/org/apache/atlas/security/AtlasKeycloakAuthenticationProvider.java (token → principal, role → authority)
    - webapp/src/main/java/org/apache/atlas/web/security/AtlasSecurityConfig.java (the Keycloak filter chain this mode mirrors)
    - webapp/src/main/java/org/apache/atlas/web/filters/AtlasCSRFPreventionFilter.java (CSRF defaults)
    - intg/src/main/java/org/apache/atlas/AtlasConfiguration.java (feature switch defaults)
    - distro/src/conf/users-credentials.properties (user admin in group ADMIN)
rules: [ADM-05, ADM-06, ADM-07, AUTH-03, SRV-05]
covers: [aurelius_atlas_server.routes.admin.get_session]
needs_auth: true # the guard-off installation (AUTH-01) cannot answer this: SCN-16 skips it in the unit harness
stages:
    - name: as the admin user of a default Atlas installation, on a verified bearer token
      request:
          method: GET
          url: /api/atlas/admin/session
          headers: { Authorization: "Bearer {bearer}" }
      response:
          status: 200
          headers: { content-type: "application/json; charset=UTF-8" }
          json:
              atlas.rest-csrf.enabled: true
              atlas.rest-csrf.browser-useragents-regex: "^Mozilla.*,^Opera.*,^Chrome"
              atlas.rest-csrf.methods-to-ignore: "GET,OPTIONS,HEAD,TRACE"
              atlas.rest-csrf.custom-header: X-XSRF-HEADER
              atlas.entity.update.allowed: true
              atlas.entity.create.allowed: true
              atlas.ui.editable.entity.types: hdfs_path
              atlas.ui.default.version: v2
              atlas.session.timeout.secs: 900
              userName: aurelius-writer
              groups: [ADMIN]
              timezones: ["Java's TimeZone.getAvailableIDs()"]
              atlas.ui.date.timezone.format.enabled: true
              atlas.ui.date.format: "MM/DD/YYYY hh:mm:ss A"
              atlas.debug.metrics.enabled: false
              atlas.tasks.enabled: true
              atlas.tasks.ui.tab.enabled: false
              atlas.lineage.on.demand.enabled: false
              atlas.lineage.on.demand.default.node.count: 3
              atlas.relationship.search.enabled: false
              _csrfToken: "20 random letters and digits"
          # A new token per session; its form is checked by the unit tests.
          # A bearer call has no container session, so Atlas mints a fresh token per call and never stores
          # one (AtlasCSRFPreventionFilter/AdminResource on request.getSession(false)); volatile hides the
          # value, and the unit tests prove the form and the session's stability (CRS-02).
          volatile: [$._csrfToken, $.timezones]
          deviations:
              - { id: DV-13, path: "$['atlas.entity.update.allowed']", value: false }
              - { id: DV-13, path: "$['atlas.entity.create.allowed']", value: false }
              # The ids differ (DV-05) and are compared as volatile; their content is checked by the unit tests.
              - { id: DV-05, path: $.timezones, value: "IANA time zone ids" }
