    - aurelius_atlas_server.routes.types.kind_by_guid
    - aurelius_atlas_server.routes.types.delete_typedefs
stages:
    - name: create one definition of four kinds
      request:
          method: POST
          url: /api/atlas/v2/types/typedefs
          json: &id001
              enumDefs:
                  - name: scenario_kinds_enum
                    elementDefs:
                        - value: ONE
                          ordinal: 1
              structDefs:
                  - name: scenario_kinds_struct
                    attributeDefs:
                        - name: note
                          typeName: string
              classificationDefs:
                  - name: scenario_kinds_tag
              businessMetadataDefs:
                  - name: scenario_kinds_bm
      response:
          status: 200
          json:
              enumDefs:
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_kinds_enum
                    description: scenario_kinds_enum
                    typeVersion: "1.0"
                    elementDefs:
                        - value: ONE
                          ordinal: 1
                    category: ENUM
                    createdBy: admin
                    updatedBy: admin
              structDefs:
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_kinds_struct
                    description: scenario_kinds_struct
                    typeVersion: "1.0"
                    attributeDefs:
                        - name: note
                          typeName: string
                          isOptional: false
                          cardinality: SINGLE
                          valuesMinCount: 1
                          valuesMaxCount: 1
                          isUnique: false
                          isIndexable: false
                          includeInNotification: false
                          searchWeight: -1
                    category: STRUCT
                    createdBy: admin
                    updatedBy: admin
              classificationDefs:
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_kinds_tag
                    description: scenario_kinds_tag
                    typeVersion: "1.0"
                    attributeDefs: []
                    superTypes: []
                    entityTypes: []
                    subTypes: []
                    category: CLASSIFICATION
                    createdBy: admin
                    updatedBy: admin
              entityDefs: []
              relationshipDefs: []
              businessMetadataDefs:
                  - guid: a random UUID
                    createTime: 0
                    updateTime: 0
                    version: 1
                    name: scenario_kinds_bm
                    description: scenario_kinds_bm
                    typeVersion: "1.0"
                    attributeDefs: []
                    category: BUSINESS_METADATA
                    createdBy: admin
                    updatedBy: admin
          volatile:
              - $.enumDefs[0].guid
              - $.enumDefs[0].createTime
              - $.enumDefs[0].updateTime
              - $.structDefs[0].guid
              - $.structDefs[0].createTime
              - $.structDefs[0].updateTime
              - $.classificationDefs[0].guid
              - $.classificationDefs[0].createTime
              - $.classificationDefs[0].updateTime
              - $.businessMetadataDefs[0].guid
              - $.businessMetadataDefs[0].createTime
              - $.businessMetadataDefs[0].updateTime
          save:
              enum: $.enumDefs[0].guid
              struct: $.structDefs[0].guid
              tag: $.classificationDefs[0].guid
              bm: $.businessMetadataDefs[0].guid
          deviations:
              - id: DV-06
                path: $.enumDefs[0].createdBy
                absent: true
              - id: DV-06
                path: $.enumDefs[0].updatedBy
                absent: true
              - id: DV-06
                path: $.structDefs[0].createdBy
                absent: true
              - id: DV-06
                path: $.structDefs[0].updatedBy
                absent: true
              - id: DV-06
                path: $.classificationDefs[0].createdBy
                absent: true
              - id: DV-06
                path: $.classificationDefs[0].updatedBy
                absent: true
              - id: DV-06
