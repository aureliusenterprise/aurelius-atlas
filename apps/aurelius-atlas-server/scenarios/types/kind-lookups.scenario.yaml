name: Enum, struct, classification and business metadata definitions are found by name and GUID of their kind
source:
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getEnumDefByName
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getEnumDefByGuid
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getStructDefByName
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getStructDefByGuid
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getClassificationDefByName
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getClassificationDefByGuid
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getBusinessMetadataDefByName
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#getBusinessMetadataDefByGuid
    - webapp/src/main/java/org/apache/atlas/web/rest/TypesREST.java#deleteAtlasTypeDefs
    - repository/src/main/java/org/apache/atlas/repository/store/graph/AtlasTypeDefGraphStore.java#getEnumDefByName (TYPE_NAME_NOT_FOUND
      when the registry has no enum of that name)
    - repository/src/main/java/org/apache/atlas/repository/store/graph/AtlasTypeDefGraphStore.java#getStructDefByGuid (TYPE_GUID_NOT_FOUND
      when the registry has no struct with that GUID)
    - repository/src/main/java/org/apache/atlas/repository/store/graph/v2/AtlasStructDefStoreV2.java#toAttributeDefFromJson (the
      stored attribute)
    - webapp/src/test/java/org/apache/atlas/web/integration/TypedefsJerseyResourceIT.java#testInvalidGets
rules:
    - TYR-03
    - TYR-05
    - TYR-09
    - TYR-10
covers:
