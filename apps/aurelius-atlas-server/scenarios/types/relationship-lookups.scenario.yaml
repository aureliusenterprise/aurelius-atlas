      request:
          method: GET
          url: /api/atlas/v2/types/entitydef/name/scenario_link_next
      response:
          status: 404
          json:
              errorCode: ATLAS-404-00-001
              errorMessage: Given typename scenario_link_next was invalid
    - name: clean up the relationship
      request:
          method: DELETE
          url: /api/atlas/v2/types/typedef/name/scenario_link_next
      response:
          status: 204
    - name: clean up the entity type
      request:
          method: DELETE
          url: /api/atlas/v2/types/typedef/name/scenario_link_node
      response:
          status: 204
