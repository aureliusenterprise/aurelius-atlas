# The standalone stack's server piece, included by ../../../docker/docker-compose.yaml (ADR 065).
# Relative paths read from this file's folder; service names are the stack's, so keep them.
# The server and its one shots run in the proxy's network: nginx reaches the server on 127.0.0.1:21000,
# and the server's localhost:9000 is the proxy. The proxy, keycloak and elasticsearch are the stack's,
# in ../docker-compose.yaml and the other fragments.
name: aurelius-atlas-standalone

x-certs: &certs ../certs:/certs:ro
x-sample-volume: &sample-volume ${SAMPLE_DIR:-../../../data/atlas-sample}:/sample:ro

services:
    aurelius-atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        # In the proxy's network: nginx reaches it on 127.0.0.1:21000, and its localhost:9000 is the proxy.
        network_mode: service:proxy
        depends_on:
            keycloak:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        environment: &server-environment
            AURELIUS_ATLAS_SERVER_ROOT_PATH: /atlas2
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # HSTS off: includeSubDomains on localhost would pin other local services to HTTPS in the browser.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # Propagation by the task worker after the request, as Atlas's default; false propagates in it (DD-081).
            AURELIUS_ATLAS_SERVER_TASKS_ENABLED: ${ATLAS_TASKS_ENABLED:-true}
            # Tenancy (15.4, ADR 063): off by default; on, each tenant is provisioned by the command (README.md).
            AURELIUS_ATLAS_SERVER_TENANCY_ENABLED: ${ATLAS_TENANCY_ENABLED:-false}
            # The browser host (SPS-01, DD-678): in this container's shared network namespace the
            # proxy answers https://<host>:9000, whatever the host is (its extra_hosts, gateway's
            # compose.yaml), so the issuer URL and the browser are one and the same string.
            AURELIUS_ATLAS_SERVER_AUTH_SERVER_URL: https://${STANDALONE_HOST:-localhost}:9000/auth/
            AURELIUS_ATLAS_SERVER_AUTH_REALM: aurelius-atlas
            AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET: ${ATLAS_SERVER_CLIENT_SECRET:?}
            # The provisioning command, run in this service's image, keeps the realm's tenants (TRM-01, TRM-11).
            AURELIUS_ATLAS_SERVER_TENANCY_ADMIN_CLIENT_SECRET: ${PROVISIONING_CLIENT_SECRET:?}
            # The chart's audience list, kept to the identities this stack runs (helm/values.yaml): the browser's
            # public client, the validate-entity app's own identity on its rules leg (VEV-04), and the admin
            # service identity the sample import signs through (DD-666). Scanners join it when they run here.
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-validate-entity", "aurelius-atlas-admin"]'
            AURELIUS_ATLAS_SERVER_AUTH_CA_FILE: /certs/ca.pem
            # Entities embedded in the background through the stack's embedder (11.3); the server does not wait
            # for it, and an entity index stored before moves once to one that keeps vectors (DD-439).
            AURELIUS_ATLAS_SERVER_EMBEDDING_URL: https://embedder:21004
            AURELIUS_ATLAS_SERVER_EMBEDDING_CA_FILE: /certs/ca.pem
            # OTLP ingest (7.18, DD-196; the stack's own collector, DD-675): the app mints
            # client-credentials JWTs as otel-atlas-server through the stack's issuer and exports
            # on the per-service leg, reached as otel-collector on the stack's network. The
            # secret is the one the realm's ingest clients share (infra/keycloak/.env), joined
            # unguarded (DD-669): unset, the server exports no OTLP.
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://${STANDALONE_HOST:-localhost}:9000/auth/realms/aurelius-atlas/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:-}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
        volumes:
            - *certs

    # One shot: waits for the server, signs in as the admin service identity (DD-666, no human user) and posts
    # SAMPLE_ZIP to admin/import, all through the proxy; without SAMPLE_ZIP, or without its file, it exits at once.
    sample-import:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        entrypoint: [python, /standalone/import_sample.py]
        network_mode: service:proxy
        depends_on:
            - aurelius-atlas-server
        restart: "no"
        environment:
            ATLAS_URL: https://${STANDALONE_HOST:-localhost}:9000/atlas2
            TOKEN_URL: https://${STANDALONE_HOST:-localhost}:9000/auth/realms/aurelius-atlas/protocol/openid-connect/token
            ATLAS_CLIENT_ID: aurelius-atlas-admin
            ATLAS_CLIENT_SECRET: ${ATLAS_ADMIN_CLIENT_SECRET:-}
            CA_FILE: /certs/ca.pem
            SAMPLE_DIR: /sample
            SAMPLE_ZIP: ${SAMPLE_ZIP:-}
            # Atlas's AtlasImportRequest, as JSON: options such as transforms or replicatedFrom.
            IMPORT_REQUEST: ${SAMPLE_IMPORT_REQUEST:-{}}
        volumes:
            - *certs
            - ./import_sample.py:/standalone/import_sample.py:ro
            - *sample-volume

    # One shot of the profile tenancy (README.md, Tenants): provisions the tenant demo with the sample and meyn
    # without one, their organizations included, and gives the realm's operator a store user of its own. A tenant
    # already provisioned is left as it is, so it runs at every start.
    tenants:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        profiles: [tenancy]
        entrypoint: [python, /standalone/tenants.py]
        network_mode: service:proxy
        depends_on:
            keycloak:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        restart: "no"
        environment:
            <<: *server-environment
            AURELIUS_ATLAS_SERVER_TENANCY_ENABLED: "true"
            # The image's packages are in its working directory, which a script's own path leaves out.
            PYTHONPATH: /application
            OPERATOR_PASSWORD: ${DEMO_USER_OPERATOR_PASSWORD:?}
            SAMPLE_DIR: /sample
            TENANT_SAMPLE: ${TENANT_SAMPLE:-sample_data.zip}
        volumes:
            - *certs
            - ./tenants.py:/standalone/tenants.py:ro
            - *sample-volume
