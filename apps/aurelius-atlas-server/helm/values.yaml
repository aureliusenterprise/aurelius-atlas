# The Atlas server chart — its runtime contract (CHT-02).
# The port, probes, settings env (prefix AURELIUS_ATLAS_SERVER_), and trust
# mounts of apps/aurelius-atlas-server. Workload manifests land in 10.3.

# The umbrella's contract (CHT-03). The shape is declared whole: Helm merges
# the umbrella's global over this, and Go templates fail on deep access into a
# missing map — so every key a template reads must exist at its default.
global:
    namespace: ""
    labels: {}
    image:
        registry: ghcr.io
        namespace: aureliusenterprise
        tag: ""
        pullSecrets: []
    issuer:
        url: ""
    domain: ""
    dnsResolver: ""
    # The umbrella's realm (CHT-74): the Keycloak realm every issuer URL this
    # chart builds carries. "" takes the chart default (aurelius-atlas).
    realm: ""
    trust:
        # The issuer the chart's Certificate is signed by (umbrella default;
        # DD-243/DD-259). Standalone renders need it present.
        issuerRef:
            name: aurelius-atlas-selfsigned
            kind: Issuer

enabled: true
component: server
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
port: 21000

image:
    name: aurelius-atlas-server
    # "" takes the chart's appVersion, which the release sets to the image tag (DD-245).
    tag: ""
    # Operator override (CHT-92): a set digest always wins over the tag.
    # Aurelius images ship it empty — the release's own bytes are attested
    # by the chart's cosign signature (CHT-94/95), not a pinned digest.
    digest: ""

resources:
    requests:
        cpu: 250m
        memory: 512Mi
    limits:
        memory: 1Gi

probes:
    livenessPath: /api/atlas/admin/liveness
    readinessPath: /api/atlas/admin/readiness
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 6
    failureThreshold: 3

# TLS material (SRV-06: the server refuses to start without it, DD-234). By
# default the chart's own Certificate (CHT-22) writes the Secret — its ca.crt
# rides the same volume, which is what the store/collector trust settings pin
# (DD-251's closure: one mount, three files, no dead ConfigMap).
tls:
    secretName: ""

# The Certificate cert-manager issues for this Service (CHT-22): SANs are the
# Service name and its FQDNs — the name the webapp's nginx pins with
# proxy_ssl_name (DD-142's tested data path). cert-manager is a cluster
# prerequisite (runbook), never installed by the chart; tls.secretName brings
# your own and this renders nothing.
certificate:
    enabled: true
    duration: 2160h
    renewBefore: 720h

# The Elasticsearch Service this server dials (CHT-21). "" derives the store
# chart's Service name in this release (CHT-13); set it when the store lives
# elsewhere (an external cluster: also point tls at its CA via caConfigMap-
# style values or the ELASTICSEARCH_CA_CERTS config override).
store:
    service: ""
    port: 9200

# The OTLP export leg (7.18, DD-196). Off by default: the collector is 10.3b,
# and the server with an unreachable token URL would boot-export into nothing.
# Enabled, the chart renders the joins (endpoint/token URL from the issuer,
# the secret from <release>-otel-clients).
telemetry:
    enabled: false
    # The collector Service; "" derives this release's atlas-observability
    # chart name (10.3b).
    service: ""
    # The per-service leg (HTTP + OIDC, DD-196).
    port: 4319

# Credential Secret names (DD-244): "" derives <release>-<purpose>, the
# umbrella's generated names. Set to bring your own (CHT-21's joins).
credentialSecrets:
    elasticsearch: ""
    otelClients: ""

# Client-IP trust (SRV-10, DD-238, DD-261): which peers may rewrite the client
# address via X-Forwarded-For, passed to uvicorn. Loopback only in a stock
# render; environment overlays name the in-cluster webapp network, so the
# access log keys on the browser's address (DD-261's two-hop edge).
forwardedAllowIps: "127.0.0.1"

service:
    type: ClusterIP
    port: 21000

serviceAccount:
    create: true
    name: ""

# Settings env, verbatim names (ADR 018: the component's prefix is its contract).
# Computed defaults land in 10.3 (ELASTICSEARCH_HOSTS derives from the store's
# service; REVISION from the release tag):
#   AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS = ["https://<es-service>.<ns>.svc:9200"]
config:
    AURELIUS_ATLAS_SERVER_HOST: "0.0.0.0"
    AURELIUS_ATLAS_SERVER_PORT: "21000"
    AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
    AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /etc/aurelius-atlas/tls/tls.crt
    AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /etc/aurelius-atlas/tls/tls.key
    AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /etc/aurelius-atlas/tls/ca.crt
    # Client-IP trust: the top-level forwardedAllowIps (CHT-21, DD-261).
    # OTLP export on the per-service leg (DD-196): a minted client JWT, not a
    # static header. The joins render when telemetry.enabled (CHT-21).
    AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
    AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    OTEL_SEMCONV_STABILITY_OPT_IN: http

# Settings that arrive from Secrets (DD-244) — the chart renders the joins
# (CHT-21): ELASTICSEARCH_PASSWORD <- <release>-elasticsearch/elastic-password,
# OTEL_CLIENT_SECRET <- <release>-otel-clients/otel-atlas-server on the prod
# realm, /OTEL_INGEST_CLIENT_SECRET on master (CHT-88/90; telemetry.enabled
# only). Their names are the umbrella's credential contract.
secretRefs: []
configMapRefs: []
extraEnv: []

extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Network segmentation (CHT-65, DD-271): the ingress allow for this Service —
# the webapp's /api/ proxy and lineage-model, joined by pod labels. The
# gateway→server rule (the dashboard host) rides the umbrella with the
# HTTPRoute. peers.<peer> renames a peer's pods for a diverging deployment.
networkPolicy:
    enabled: true
    peers:
        webapp: ""
        lineageModel: ""

# The image's declared user (DD-257): dhi.io/python-3.14-alpine runs as
# `nonroot` (uid/gid 65532, verified from the image) and does no privilege
# drop, so the pod must pin it. fsGroup mirrors the compose volume-init shape.
podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
        type: RuntimeDefault
securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
        drop:
            - ALL

# Render-time guards (ADR 018): [{key, message}] on chart values.
required: []
