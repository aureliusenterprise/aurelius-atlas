{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-server.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-server.labels" . | nindent 8 }}
# The workload talks to other workloads over TLS with pinned CAs (ADR 039),
# never to the API server: the cluster token is a credential with no use here.
automountServiceAccountToken: false
{{- end }}
