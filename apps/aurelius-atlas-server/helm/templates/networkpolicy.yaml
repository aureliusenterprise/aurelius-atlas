{{/*
The server's ingress allow (CHT-65, DD-271). Under the umbrella's
namespace-wide default-deny, only the pods the deployment graph actually dials
this port may reach it: the webapp (its nginx /api/ proxy, DD-142's tested
data path) and lineage-model (its ATLAS_BASE_URL join, DD-251). Peers join by
pod labels, not Services (CHT-70): a pod's app.kubernetes.io/name is its chart
name (the selectorLabels rule — a constant, never release-prefixed) and
app.kubernetes.io/instance is this release, so a peer is named by its
chart-name constant, never its Service name. networkPolicy.peers.<peer>
renames a peer for a deployment that diverges. The gateway→server allow (the
dashboard host) belongs to the umbrella — it renders with the dashboard
HTTPRoute (CHT-65's edge half). The probe surface is exempt by CNI design
(CHT-71).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ printf "%s-ingress" (include "atlas-server.fullname" .) }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-server.labels" . | nindent 8 }}
spec:
    podSelector:
        matchLabels:
            {{- include "atlas-server.selectorLabels" . | nindent 12 }}
    policyTypes:
        - Ingress
    ingress:
        -   from:
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: {{ default "atlas-webapp" .Values.networkPolicy.peers.webapp | quote }}
                            app.kubernetes.io/instance: {{ .Release.Name | quote }}
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: {{ default "atlas-lineage-model" .Values.networkPolicy.peers.lineageModel | quote }}
                            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            ports:
                -   port: {{ int .Values.port }}
                    protocol: TCP
{{- end }}
