name: aurelius-atlas-kafka-scanner-e2e

# The scanner is a batch CLI, not a service: the suite runs it in-process
# against this stack's real Atlas server. There is therefore no scanner
# service here — only the catalogue the job speaks to, the same server the
# webapp e2e stack stands up (its env list mirrors that stack verbatim, with
# the scanner's audience joined). The store and the collector ride the dev
# networks; Keycloak is reached on the host. The broker and its Schema
# Registry are this stack's own, started with it and discarded with it
# (DD-541, the disposable-database pattern of DD-507): the suite seeds and
# scans them over their published ports and rides no shared broker.
services:
    atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        networks:
            atlas:
                # The alias is the name in the server certificate; the compose
                # service name stays atlas-server.
                aliases:
                    - aurelius-atlas-server
            # The dev telemetry stack (started by conftest first): the collector
            # answers as `otel-collector` here — the name in its certificate.
            # Its publishes are loopback-pinned (CIA-03), so service DNS is the
            # only path.
            observability: {}
        ports:
            # Fixed host port, loopback-pinned (CIA-03): the suite's client and
            # the server's own image healthcheck speak to it there. 21006 is
            # this stack's; the serve port 21000, the server suite's 21001 and
            # the quality scanner's 21005 stay free.
            - 127.0.0.1:21006:21000
        environment:
            # ${VAR:?} guards: Nx injects the scanner's .env into the e2e task
            # environment; a missing value fails the compose start loudly.
            AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # HSTS off in e2e (DD-236): as in the other e2e stacks, localhost
            # must not pin the dev names to HTTPS.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # OTLP ingest identity (7.18, DD-196): the per-service mint at the
            # TLS :8443 issuer, exported to the collector's :4319 over the
            # observability network.
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
            # Authentication (6.1a, DD-250): tokens of the dev realm, verified
            # against the same :8443 listener. Both identities of this suite
            # are accepted (AUT-02, KSC-09): the seeding writer's `aurelius`
            # token and the scanner's own client-credentials token, whose azp
            # joins the audiences here (DD-469).
            AURELIUS_ATLAS_SERVER_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET: ${AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-kafka-scanner"]'
            AURELIUS_ATLAS_SERVER_AUTH_CA_FILE: /certs/ca.pem
            # Export every second in test containers (DD-225); mirrors the
            # other e2e stacks.
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            # The mint target and the token issuer: the dev Keycloak's :8443
            # listener, published loopback-wide on this machine.
            - keycloak.localhost:host-gateway
        volumes:
            - ../certs:/certs:ro

    broker:
        # The cluster under scan (KSC-10, DD-541): the suite's own KRaft
        # single node, started with the stack and discarded with it. Two
        # client listeners (DD-469): the anonymous HOST listener the scan
        # reads with when the cluster answers PLAINTEXT, and a SASL_PLAINTEXT
        # listener carrying the SCRAM-SHA-512 user the sasl-init service
        # below creates (KSC-10). The fixed ports repeat the advertised
        # listeners verbatim, as db-scanner's Postgres does: the host-side
        # door dials exactly what the broker advertises.
        image: dhi.io/kafka:4.3-debian13
        environment:
            # KAFKA_* settings: the image entrypoint writes them into its own
            # server.properties inside the container layer. INTERNAL serves
            # the stack network, HOST and SASL serve the host, CONTROLLER is
            # the KRaft plane, plain like the inter-broker hop.
            KAFKA_BROKER_ID: "1"
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094,SASL://0.0.0.0:9095
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,HOST://localhost:29092,SASL://localhost:29095
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,SASL:SASL_PLAINTEXT
            KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
            # The SASL listener's server-side login: the SCRAM handler, whose
            # users live in the cluster metadata (the sasl-init service below
            # writes this one) rather than in a JAAS user list, so the login
            # line itself carries no secret. The name spells
            # listener.name.sasl.scram-sha-512.sasl.jaas.config through the
            # image's env mapping: _ a dot, ___ a hyphen.
            KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
            KAFKA_LOG_DIRS: /opt/kafka/logs
            KAFKA_NUM_PARTITIONS: "3"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
            KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        healthcheck:
            # Healthy means the broker answers metadata over the INTERNAL
            # listener: the same door the scanner's admin client walks.
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server broker:9092 || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 30s
        ports:
            # Loopback-pinned (CIA-03): the suite creates its topics and
            # produces its records from the host. In-network consumers use
            # broker:9092.
            - "127.0.0.1:29092:9094"
            - "127.0.0.1:29095:9095"

    sasl-init:
        # The SCRAM principal the SASL listener authenticates (KSC-10): one
        # shot once the broker is healthy, then it exits. The credentials are
        # the suite's own — the same pair the conftest's Settings read from
        # this project's .env (Nx injects it; one value, two places, as
        # db-scanner's Postgres password does).
        image: dhi.io/kafka:4.3-debian13
        depends_on:
            broker:
                condition: service_healthy
        entrypoint: ["/opt/kafka/bin/kafka-configs.sh"]
        command:
            - --bootstrap-server
            - broker:9092
            - --alter
            - --entity-type
            - users
            - --entity-name
            - ${AURELIUS_ATLAS_KAFKA_SCANNER_SASL_USERNAME:?}
            - --add-config
            - SCRAM-SHA-512=[password=${AURELIUS_ATLAS_KAFKA_SCANNER_SASL_PASSWORD:?}]
        restart: "no"

    schema-registry:
        # The Avro/JSON schema door (KSC-05): the scanner reads subjects here
        # before it sniffs a topic's own messages. PLAINTEXT kafkastore to the
        # broker's INTERNAL listener; schemas are metadata, not secrets, in
        # the suite.
        image: confluentinc/cp-schema-registry:8.4.1
        depends_on:
            broker:
                condition: service_healthy
        environment:
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:9092"
            SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
            SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
        healthcheck:
            # Tighter than the old dev-stack check (interval 30s): this stack
            # starts per run, so up --wait rides the interval.
            test:
                [
                    "CMD",
                    "curl",
                    "--output",
                    "/dev/null",
                    "--silent",
                    "--head",
                    "--fail",
                    "http://schema-registry:8081/subjects",
                ]
            interval: 10s
            timeout: 10s
            retries: 12
            start_period: 10s
        ports:
            # Loopback-pinned (CIA-03): the suite registers and deletes its
            # subjects from the host.
            - "127.0.0.1:28081:8081"

networks:
    # The dev Elasticsearch stack (started by the e2e target's up dependency,
    # and by conftest as a guard): the server reaches the store as
    # `elasticsearch` on this network.
    atlas:
        name: aurelius-atlas-dev-elasticsearch-network
        external: true
    # The dev telemetry stack (dev/observability): the server's OTLP export
    # reaches the collector on it.
    observability:
        name: aurelius-atlas-dev-observability-network
        external: true
