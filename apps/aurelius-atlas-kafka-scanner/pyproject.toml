[project]
dependencies = [
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-server-client",
    "avro>=1.12.0",
    "httpx2>=2.0.0",
    "kafka-python-ng>=2.2.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.15.0",
]
description = "The Aurelius Atlas Kafka scanner: a batch read of a Kafka cluster's topics and schemas, registered as catalogue entities."
name = "aurelius-atlas-kafka-scanner"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_kafka_scanner"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
