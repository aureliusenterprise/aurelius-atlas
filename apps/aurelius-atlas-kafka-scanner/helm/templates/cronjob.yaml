{{/*
The CronJob (CHT-115, 121, 122): one run reflects one broker's topics and
writes the tree (KSC-01). The shared batch shape is 12.3's (the quality chart
is the stated twin); the broker block is this chart's own (CHT-121): the
address is required, every other setting renders only when a value names it,
and the OAUTHBEARER leg reuses the catalogue client (DD-514). No Service,
Certificate, or NetworkPolicy (CHT-115).
*/}}
{{- $fullname := include "atlas-kafka-scanner.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
{{- $caSecret := include "atlas-kafka-scanner.caSecretName" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-kafka-scanner.labels" . | nindent 8 }}
spec:
    schedule: {{ .Values.schedule | quote }}
    concurrencyPolicy: {{ default "Forbid" .Values.concurrencyPolicy }}
    startingDeadlineSeconds: {{ int .Values.startingDeadlineSeconds }}
    successfulJobsHistoryLimit: {{ int .Values.successfulJobsHistoryLimit }}
    failedJobsHistoryLimit: {{ int .Values.failedJobsHistoryLimit }}
    suspend: {{ .Values.suspend }}
    {{- with .Values.ttlSecondsAfterFinished }}
    ttlSecondsAfterFinished: {{ int . }}
    {{- end }}
    jobTemplate:
        spec:
            {{- with .Values.activeDeadlineSeconds }}
            activeDeadlineSeconds: {{ int . }}
            {{- end }}
            template:
                metadata:
                    labels:
                        {{- include "atlas-kafka-scanner.labels" . | nindent 24 }}
                        {{- with .Values.podLabels }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    {{- with .Values.podAnnotations }}
                    annotations:
                        {{- toYaml . | nindent 24 }}
                    {{- end }}
                spec:
                    restartPolicy: Never
                    serviceAccountName: {{ default $fullname .Values.serviceAccount.name }}
                    automountServiceAccountToken: false
                    {{- with .Values.global.image.pullSecrets }}
                    imagePullSecrets:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    securityContext:
                        {{- toYaml .Values.podSecurityContext | nindent 24 }}
                    containers:
                        -   name: {{ .Values.component }}
                            image: {{ include "atlas-kafka-scanner.image" . | quote }}
                            imagePullPolicy: IfNotPresent
                            securityContext:
                                {{- toYaml .Values.securityContext | nindent 32 }}
                            {{- with .Values.args }}
                            args:
                                {{- toYaml . | nindent 32 }}
                            {{- end }}
                            env:
                                - name: {{ .Values.componentEnvPrefix }}SERVER_URL
                                  value: {{ .Values.catalogue.serverUrl | quote }}
                                - name: {{ .Values.componentEnvPrefix }}TOKEN_URL
                                  value: {{ include "atlas-kafka-scanner.tokenUrl" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}CLIENT_ID
                                  value: {{ .Values.auth.clientId | quote }}
                                - name: {{ .Values.componentEnvPrefix }}CLIENT_SECRET
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ include "atlas-kafka-scanner.secretName" . }}
                                          key: {{ include "atlas-kafka-scanner.secretKey" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}BOOTSTRAP_SERVERS
                                  value: {{ .Values.broker.bootstrapServers | quote }}
                                {{- /* The broker knobs (CHT-121): rendered only
                                when named; the app's defaults stay the app's. */}}
                                {{- with .Values.broker.securityProtocol }}
                                - name: {{ $.Values.componentEnvPrefix }}SECURITY_PROTOCOL
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- with .Values.broker.systemName }}
                                - name: {{ $.Values.componentEnvPrefix }}SYSTEM_NAME
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- with .Values.broker.topicPattern }}
                                - name: {{ $.Values.componentEnvPrefix }}TOPICS
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- with .Values.broker.sniffMessages }}
                                - name: {{ $.Values.componentEnvPrefix }}SNIFF_MESSAGES
                                  value: {{ int . | quote }}
                                {{- end }}
                                {{- with .Values.broker.pollTimeoutSeconds }}
                                - name: {{ $.Values.componentEnvPrefix }}POLL_TIMEOUT_SECONDS
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- with .Values.broker.adminRequestTimeoutMs }}
                                - name: {{ $.Values.componentEnvPrefix }}ADMIN_REQUEST_TIMEOUT_MS
                                  value: {{ int . | quote }}
                                {{- end }}
                                {{- with .Values.broker.registryTimeoutSeconds }}
                                - name: {{ $.Values.componentEnvPrefix }}REGISTRY_TIMEOUT_SECONDS
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- with .Values.schemaRegistry.url }}
                                - name: {{ $.Values.componentEnvPrefix }}SCHEMA_REGISTRY_URL
                                  value: {{ . | quote }}
                                {{- end }}
                                {{- /* The OAUTHBEARER leg (CHT-122, DD-514): the
                                broker trusts this deployment's issuer, so the
                                broker token reuses the catalogue client. The
                                secret rides the same CLIENT_SECRET join. */}}
                                {{- if .Values.brokerOauth.enabled }}
                                - name: {{ .Values.componentEnvPrefix }}SASL_MECHANISM
                                  value: "OAUTHBEARER"
                                - name: {{ .Values.componentEnvPrefix }}SASL_OAUTH_TOKEN_URL
                                  value: {{ include "atlas-kafka-scanner.tokenUrl" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}SASL_OAUTH_CLIENT_ID
                                  value: {{ .Values.auth.clientId | quote }}
                                - name: {{ .Values.componentEnvPrefix }}SASL_OAUTH_CLIENT_SECRET
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ include "atlas-kafka-scanner.secretName" . }}
                                          key: {{ include "atlas-kafka-scanner.secretKey" . | quote }}
                                {{- end }}
                                {{- if $caSecret }}
                                - name: {{ .Values.componentEnvPrefix }}CA_FILE
                                  value: {{ printf "%s/ca.crt" (trimSuffix "/" .Values.trust.mountPath) | quote }}
                                {{- end }}
                                {{- /* The scan's OTLP export (CHT-125, DD-511),
                                off by default. Auth on: the app-owned leg's
                                trio (DD-196), minting against the issuer the
                                identity join already names. Auth off: the SDK
                                env leg (DD-210), unauthenticated — the shape
                                for a collector that asks for no credential. */}}
                                {{- if .Values.telemetry.enabled }}
                                {{- if .Values.telemetry.auth.enabled }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_ENDPOINT
                                  value: {{ .Values.telemetry.endpoint | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_TOKEN_URL
                                  value: {{ include "atlas-kafka-scanner.tokenUrl" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_CLIENT_ID
                                  value: {{ include "atlas-kafka-scanner.otelClientId" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_CLIENT_SECRET
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ include "atlas-kafka-scanner.otelSecretName" . }}
                                          key: {{ include "atlas-kafka-scanner.otelSecretKey" . | quote }}
                                {{- else }}
                                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                                  value: {{ .Values.telemetry.endpoint | quote }}
                                {{- /* The env leg's own TLS knob (DD-210):
                                the SDK reads the standard var, not CA_FILE. */}}
                                {{- if $caSecret }}
                                - name: OTEL_EXPORTER_OTLP_CERTIFICATE
                                  value: {{ printf "%s/ca.crt" (trimSuffix "/" .Values.trust.mountPath) | quote }}
                                {{- end }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.config }}
                                {{- range $key, $value := . }}
                                - name: {{ $key }}
                                  value: {{ $value | quote }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.secretRefs }}
                                {{- range . }}
                                - name: {{ .name }}
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ .secret }}
                                          key: {{ .key }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.extraEnv }}
                                {{- toYaml . | nindent 32 }}
                                {{- end }}
                            {{- if $caSecret }}
                            volumeMounts:
                                - name: ca
                                  mountPath: {{ .Values.trust.mountPath }}
                                  readOnly: true
                            {{- end }}
                            resources:
                                {{- toYaml .Values.resources | nindent 32 }}
                    {{- if $caSecret }}
                    volumes:
                        -   name: ca
                            secret:
                                secretName: {{ $caSecret }}
                    {{- end }}
                    {{- with .Values.nodeSelector }}
                    nodeSelector:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    {{- with .Values.tolerations }}
                    tolerations:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    {{- with .Values.affinity }}
                    affinity:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
