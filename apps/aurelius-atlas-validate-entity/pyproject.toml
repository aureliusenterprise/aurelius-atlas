[project]
dependencies = [
    "aurelius-atlas-auth",
    "aurelius-atlas-otel",
    "fastapi>=0.141.1",
    "logfire[fastapi]>=5.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas validate-entity API: an entity in, the fixed governance-quality mock out."
name = "aurelius-atlas-validate-entity"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_validate_entity"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-auth]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
