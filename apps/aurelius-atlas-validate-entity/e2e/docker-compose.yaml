name: aurelius-atlas-validate-entity-e2e

# The 12.7 chain: the app under test beside the real Atlas server and the dev
# store (8.2's chain pattern, upstream-as-container; DD-200's sibling). The app
# reads the governance rules from this server with its own service identity
# (VEV-04), so the suite's happy path answers live verdicts over rules seeded
# through the catalogue. The store and the collector ride the dev networks;
# Keycloak is reached on the host (as in the scanner's stack).
# The catalogue is the server project's e2e service, extended (the pattern of
# ADR 065/066): image, networks, aliases, certificate mount, Keycloak-on-host
# and the eighteen shared settings arrive by inheritance from
# ../../aurelius-atlas-server/e2e/compose.server.yaml, whose ../certs rebases
# to that project's folder — the server's own certificate, the one it
# presents. This stack states only its differences: its port and the app's
# audience joined. The validate-entity service below is this project's own
# definition — the webapp's e2e stack extends it from here.
services:
    atlas-server:
        extends:
            file: ../../aurelius-atlas-server/e2e/compose.server.yaml
            service: atlas-server
        ports:
            # Fixed host port, loopback-pinned (CIA-03): the suite seeds rules
            # through it and its client speaks to it there. 21008 is this
            # stack's; the quality scanner's 21005, the kafka-scanner's 21006
            # and the db-scanner's 21007 stay free.
            - 127.0.0.1:21008:21000
        environment:
            # Both identities of this suite are accepted (AUT-02): the seeding
            # writer's `aurelius` token and the app's own client-credentials
            # token, whose azp joins the audiences here (VEV-04, DD-499 —
            # DD-458's sibling). One key over the base's map.
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-validate-entity"]'

    aurelius-atlas-validate-entity:
        # The app under test is this project's own e2e service, extended from
        # compose.validate-entity.yaml beside this file — the base the webapp
        # e2e stack extends too. This stack states its differences: the gate
        # on this stack's server, and the OTel client secret, guarded under
        # this project's own .env name (the base carries no guard for it).
        extends:
            file: ./compose.validate-entity.yaml
            service: aurelius-atlas-validate-entity
        depends_on:
            atlas-server:
                condition: service_healthy
        environment:
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET: ${AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET:?}

networks:
    # `extends` copies the service, not the network definitions: both are
    # declared here, as in every consumer of the server base.
    # The dev Elasticsearch stack (started by the e2e target's up dependency,
    # and by conftest as a guard): the server reaches the store as
    # `elasticsearch` on this network, and the app reaches the server under its
    # certificate name, the alias the server's service declares.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    # The dev telemetry stack (infra/observability): both OTLP exports reach the
    # collector on it.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
