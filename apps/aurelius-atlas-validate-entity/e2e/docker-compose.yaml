name: aurelius-atlas-validate-entity-e2e

# The 12.7 chain: the app under test beside the real Atlas server and the dev
# store (8.2's chain pattern, upstream-as-container; DD-200's sibling). The app
# reads the governance rules from this server with its own service identity
# (VEV-04), so the suite's happy path answers live verdicts over rules seeded
# through the catalogue. The store and the collector ride the dev networks;
# Keycloak is reached on the host (as in the scanner's stack).
services:
    atlas-server:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-server:local
        networks:
            atlas:
                # The alias is the name in the server certificate; the compose
                # service name stays atlas-server.
                aliases:
                    - aurelius-atlas-server
            # The dev telemetry stack: the collector answers as
            # `otel-collector` here — the name in its certificate.
            observability: {}
        ports:
            # Fixed host port, loopback-pinned (CIA-03): the suite seeds rules
            # through it and its client speaks to it there. 21008 is this
            # stack's; the quality scanner's 21005, the kafka-scanner's 21006
            # and the db-scanner's 21007 stay free.
            - 127.0.0.1:21008:21000
        environment:
            # ${VAR:?} guards: Nx injects this project's .env into the e2e
            # task environment; a missing value fails the compose start loudly.
            AURELIUS_ATLAS_SERVER_LOG_LEVEL: info
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD: ${AURELIUS_ATLAS_SERVER_ELASTICSEARCH_PASSWORD:?}
            AURELIUS_ATLAS_SERVER_ELASTICSEARCH_CA_CERTS: /certs/ca.pem
            AURELIUS_ATLAS_SERVER_TLS_CERT_FILE: /certs/aurelius-atlas-server.pem
            AURELIUS_ATLAS_SERVER_TLS_KEY_FILE: /certs/aurelius-atlas-server-key.pem
            AURELIUS_ATLAS_SERVER_TLS_CA_FILE: /certs/ca.pem
            # HSTS off in e2e (DD-236): as in other e2e stacks, localhost must
            # not pin the dev names to HTTPS.
            AURELIUS_ATLAS_SERVER_HSTS_ENABLED: "false"
            # OTLP ingest identity (7.18, DD-196): the per-service mint at the
            # TLS :8443 issuer, exported to the collector's :4319 over the
            # observability network.
            AURELIUS_ATLAS_SERVER_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_ID: otel-atlas-server
            AURELIUS_ATLAS_SERVER_OTEL_CLIENT_SECRET: ${OTEL_INGEST_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_SERVER_OTEL_CA_FILE: /certs/ca.pem
            # Authentication (6.1a, DD-250): tokens of the dev realm, verified
            # against the same :8443 listener. Both identities of this suite
            # are accepted (AUT-02): the seeding writer's `aurelius` token and
            # the app's own client-credentials token, whose azp joins the
            # audiences here (VEV-04, DD-499 — DD-458's sibling).
            AURELIUS_ATLAS_SERVER_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET: ${AURELIUS_ATLAS_SERVER_AUTH_CLIENT_SECRET:?}
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-validate-entity"]'
            AURELIUS_ATLAS_SERVER_AUTH_CA_FILE: /certs/ca.pem
            # Export every second in test containers (DD-225); mirrors the
            # other e2e stacks.
            OTEL_BSP_SCHEDULE_DELAY: "1000"
        extra_hosts:
            # The mint target and the token issuer: the dev Keycloak's :8443
            # listener, published loopback-wide on this machine.
            - keycloak.localhost:host-gateway
        volumes:
            - ../certs:/certs:ro

    aurelius-atlas-validate-entity:
        image: ghcr.io/aureliusenterprise/aurelius-atlas-validate-entity:local
        depends_on:
            atlas-server:
                condition: service_healthy
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task
            # environment; a missing value would otherwise only show as a
            # settings error inside the started container.
            AURELIUS_ATLAS_VALIDATE_ENTITY_LOG_LEVEL: info
            # HTTPS with this project's certificate (`nx certgen`); the
            # healthcheck verifies it.
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CERT_FILE: /certs/aurelius-atlas-validate-entity.pem
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_KEY_FILE: /certs/aurelius-atlas-validate-entity-key.pem
            AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CA_FILE: /certs/ca.pem
            # The e2e issuer (dev/keycloak, TLS listener): POST / verifies the
            # caller's bearer token against it (VE-03). The audience is the dev
            # realm's public `aurelius` client — the webapp's client id, the
            # audience the browser's tokens carry (AUX-04); the suite mints its
            # test tokens for it, as the editor's caller sends them (DV-75).
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_REALM: master
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE: ${AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE:?}
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_CA_FILE: /certs/ca.pem
            # The catalogue leg (12.7, VEV-03/VEV-04): the rules ride this
            # stack's server, in-network — the alias on the store network is
            # the name in the server's certificate (tls.json issues the server
            # leaf for this project, the scanner's precedent), verified against
            # the dev CA. The app signs as its own service client; the secret
            # is the realm import's value, mirrored in the project .env. The
            # rules cache is off here (VEV-05 with 0): the suite seeds rules
            # between calls, and a cached rule set would answer a fresh seed
            # from the stale one.
            AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_BASE_URL: https://aurelius-atlas-server:21000
            AURELIUS_ATLAS_VALIDATE_ENTITY_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_CLIENT_SECRET: ${AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_CLIENT_SECRET:?}
            AURELIUS_ATLAS_VALIDATE_ENTITY_RULES_CACHE_SECONDS: "0"
            # OTLP ingest identity (DD-196, DD-197): the app exports through
            # its own pipeline, minting client-credentials JWTs as
            # otel-validate-entity for the per-service leg (:4319). The mint
            # rides the TLS :8443 listener (DD-202): every per-service
            # producer mints there and the collector validates both
            # listeners, so no suite order can split mint issuer from
            # validator.
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_ID: otel-validate-entity
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET: ${AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_SECRET:?}
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CA_FILE: /certs/ca.pem
        extra_hosts:
            # The issuer, published loopback-wide on this machine by the dev
            # Keycloak stack (as the server suite reaches it for its mint).
            - keycloak.localhost:host-gateway
        networks:
            # The store network carries the server's certificate-name alias,
            # which the app's leg dials (SERVER_BASE_URL above).
            - atlas
            # The collector answers as `otel-collector` on this network — the
            # name in its certificate. Its publishes are loopback-pinned
            # (CIA-03), so a host-gateway extra_host would not reach it.
            - observability
        ports:
            - 21003
        volumes:
            - ../certs:/certs:ro

networks:
    # The dev Elasticsearch stack (started by the e2e target's up dependency,
    # and by conftest as a guard): the server reaches the store as
    # `elasticsearch` on this network, and the app reaches the server under its
    # certificate name, the alias the server's service declares.
    atlas:
        name: aurelius-atlas-dev-elasticsearch-network
        external: true
    # The dev telemetry stack (dev/observability): both OTLP exports reach the
    # collector on it.
    observability:
        name: aurelius-atlas-dev-observability-network
        external: true
