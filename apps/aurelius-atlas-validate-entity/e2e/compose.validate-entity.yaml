# The e2e validate-entity API, as a base: the chain stacks that run the real
# governance validator beside their server extend this service (the pattern of
# ADR 065/066, as the scanner stacks extend the server's e2e base). Not a
# deployment target of its own - run a consumer's docker-compose.yaml. The
# project's stack piece (../docker/compose.yaml), which the standalone stack
# includes, is the identity underneath: the image pin, the certificate mount
# (the piece's ../certs, which extends rebases to this project's certs/ - the
# leaf issued by this project's `nx certgen`, the one the nginx proxy
# verifies), the log level, the TLS trio and the caller-side bearer check
# arrive by inheritance. This layer states the e2e identity on top of it: the
# host-mapped issuer (the dev Keycloak, off this stack's network), the 12.7
# catalogue leg against the stack's server (VEV-03/VEV-04: the rules ride the
# server in-network, under its certificate name, with the app's own
# client-credentials secret guarded under the name every consumer's .env
# carries; the rules cache is off, so a suite's fresh seed never answers from
# a stale set), the collector network, the Keycloak-on-host mapping, the OTel
# leg and a published port - and it undoes the piece's share of the proxy's
# network, which the standalone stack needs and an e2e stack has no proxy for.
# What a consumer states are its differences: its OTel client secret under its
# own .env name, its export cadence, its network list, and its port - or none,
# when only a proxy reaches it.
# The guards are the consumers': compose interpolates this file with the
# consuming project's environment, and Nx injects each project's .env into
# its e2e task. The OTel client-credentials secret is deliberately NOT
# guarded here (a failed base guard is not rescued by a consumer override,
# verified against compose): every consumer adds the key under the name its
# own .env carries. The catalogue leg's secret IS guarded here, under the
# shared name both consumers carry.
# The audience is the piece's literal by design, `aurelius`: the endpoint is
# the browser's from begin to end (AUX-04, DV-75), the app forwards nothing.
# Relative paths read from this file's folder; keep the service name
# `aurelius-atlas-validate-entity` and the network keys: the suites and the
# certificate names speak them.
services:
    aurelius-atlas-validate-entity:
        extends:
            file: ../docker/compose.yaml
            service: aurelius-atlas-validate-entity
        # The standalone piece shares the proxy's network namespace; an e2e
        # stack has no proxy, so the key is deleted and the service joins the
        # networks below (verified against compose).
        network_mode: !reset null
        extra_hosts:
            # The issuer, published loopback-wide on this machine by the dev
            # Keycloak stack (as the server suite reaches it for its mint).
            - keycloak.localhost:host-gateway
        environment:
            # The e2e issuer (infra/keycloak, TLS listener): POST / verifies
            # the caller's bearer token against it (VE-03).
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_REALM: master
            # The catalogue leg (12.7, VEV-03/VEV-04): the rules ride the
            # stack's server, in-network - the alias on the store network is
            # the name in the server's certificate (the server's own leaf,
            # its project's cert folder, mounted by the server base),
            # verified against the dev CA. The app signs as its own service
            # client; the secret is the realm import's value, mirrored in
            # every consumer's .env. The rules cache is off here (VEV-05
            # with 0): the suites seed rules between calls, and a cached
            # rule set would answer a fresh seed from the stale one.
            AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_BASE_URL: https://aurelius-atlas-server:21000
            AURELIUS_ATLAS_VALIDATE_ENTITY_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_CLIENT_SECRET: ${AURELIUS_ATLAS_VALIDATE_ENTITY_SERVER_CLIENT_SECRET:?}
            AURELIUS_ATLAS_VALIDATE_ENTITY_RULES_CACHE_SECONDS: "0"
            # OTLP ingest identity (DD-196, DD-197): the app exports through
            # its own pipeline, minting client-credentials JWTs as
            # otel-validate-entity for the per-service leg (:4319). The mint
            # rides the TLS :8443 listener (DD-202). The client secret joins
            # here from the consumer (its own .env's name).
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_ID: otel-validate-entity
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CA_FILE: /certs/ca.pem
        networks:
            # The store network carries the server's certificate-name alias,
            # which the app's leg dials (SERVER_BASE_URL above); the
            # collector answers as `otel-collector` on the dev telemetry
            # network. A consumer adds its network keys to this map.
            atlas: {}
            observability: {}
        ports:
            - 21003

networks:
    # The dev Elasticsearch stack and the dev telemetry stack. `extends`
    # copies the service, not the network definitions: every consumer
    # declares the same external networks under the same keys.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
