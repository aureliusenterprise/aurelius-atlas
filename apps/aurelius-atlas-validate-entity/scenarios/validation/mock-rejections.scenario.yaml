# The mock never reads its body (8.6, DD-214): the legacy Aurelius app is a
# governance-quality mock that answers its fixed cards to any request (DV-67),
# and the port keeps that contract (VE-01) — no request model, no validation.
# The stage sends bytes no JSON API would accept: the mock is not a JSON API,
# and the 200 proves the body is never parsed. The response is the same fixed
# document as validation/mock.scenario.yaml (ADR 052, read from the legacy
# output/mock_response), for this stage's request.
name: "The validation mock answers its cards to a body it never reads"
source:
    - .scratch/aurelius/backend/m4i-validate-entity/m4i_validate_entity/m4i_validate_entity.py::output
    - .scratch/aurelius/backend/m4i-validate-entity/m4i_validate_entity/m4i_validate_entity.py::mock_response
rules:
    - VE-01
covers:
    - aurelius_atlas_validate_entity.app.create_app
stages:
    - name: A body that is not JSON still answers the mock document
      request:
          method: POST
          url: /
          text: entity{this is not json
      response:
          status: 200
          headers:
              content-type: application/json
          json:
              dataEntity:
                  items:
                      - result:
                            raw: This entity is missing a dataEntity
                        dataqualitytype:
                            raw: attribute
                        usedattributes:
                            raw:
                                - dataEntity
                        name:
                            raw: Attribute - dataEntity
                        compliant:
                            raw: "0"
                        _meta:
                            engine: atlas-dev-gov-quality
                            score: 1
                            id: doc-6290d9e0dd895e02b897451f
                        id:
                            raw: doc-6290d9e0dd895e02b897451f
                  isNonCompliant: true
              definition:
                  items:
                      - result:
                            raw: This entity has a definition
                        dataqualitytype:
                            raw: attribute
                        usedattributes:
                            raw:
                                - definition
                        name:
                            raw: Attribute - definition
                        compliant:
                            raw: "1"
                        _meta:
                            engine: atlas-dev-gov-quality
                            score: 1
                            id: doc-6290d9dedd895e197b974510
                        id:
                            raw: doc-6290d9dedd895e197b974510
                  isNonCompliant: false
              domainLead:
                  items:
                      - result:
                            raw: This entity is missing a domainLead
                        dataqualitytype:
                            raw: attribute
                        usedattributes:
                            raw:
                                - domainLead
                        name:
                            raw: Attribute - domainLead
                        compliant:
                            raw: "0"
                        _meta:
                            engine: atlas-dev-gov-quality
                            score: 1
                            id: doc-6290d9e0dd895e02b8974528
                        id:
                            raw: doc-6290d9e0dd895e02b8974528
                  isNonCompliant: true
              name:
                  items:
                      - result:
                            raw: This entity has a name
                        dataqualitytype:
                            raw: attribute
                        usedattributes:
                            raw:
                                - name
                        name:
                            raw: Attribute - name
                        compliant:
                            raw: "1"
                        _meta:
                            engine: atlas-dev-gov-quality
                            score: 1
                            id: doc-6290d9dedd895e197b974507
                        id:
                            raw: doc-6290d9dedd895e197b974507
                  isNonCompliant: false
