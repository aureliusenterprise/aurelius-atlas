{{/*
The API's TLS certificate (CHT-27, DD-243): cert-manager issues it from the
umbrella's issuer into the Secret the Deployment mounts whole — tls.crt,
tls.key, and ca.crt all present, which is what closes DD-251's first finding
(the AUTH_CA_FILE/OTEL_CA_FILE settings named a ca.crt the skeleton never
mounted). SANs cover every name a peer dials: the ClusterIP Service and its
FQDNs. cert-manager is a cluster prerequisite (runbook), never installed by
the chart; tls.secretName brings your own and this renders nothing.
*/}}
{{- if and .Values.certificate.enabled (not .Values.tls.secretName) }}
{{- $fullname := include "atlas-validate-entity.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
{{- $issuerRef := .Values.global.trust.issuerRef -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-validate-entity.labels" . | nindent 8 }}
spec:
    secretName: {{ printf "%s-tls" $fullname }}
    duration: {{ .Values.certificate.duration }}
    renewBefore: {{ .Values.certificate.renewBefore }}
    subject:
        organizations:
            - aurelius-atlas
    dnsNames:
        - {{ $fullname }}
        - {{ printf "%s.%s" $fullname $ns }}
        - {{ printf "%s.%s.svc" $fullname $ns }}
        - {{ printf "%s.%s.svc.cluster.local" $fullname $ns }}
    issuerRef:
        name: {{ required "global.trust.issuerRef.name is required (DD-243)" $issuerRef.name }}
        {{- with $issuerRef.kind }}
        kind: {{ . }}
        {{- end }}
{{- end }}
