{{/* The Service. */}}
apiVersion: v1
kind: Service
metadata:
    name: {{ include "atlas-validate-entity.fullname" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-validate-entity.labels" . | nindent 8 }}
spec:
    type: {{ .Values.service.type }}
    ports:
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: {{ int .Values.port }}
          protocol: TCP
    selector:
        {{- include "atlas-validate-entity.selectorLabels" . | nindent 12 }}
