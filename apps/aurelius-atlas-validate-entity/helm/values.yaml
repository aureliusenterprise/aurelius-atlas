# The validate-entity chart — its runtime contract (CHT-02).
# apps/aurelius-atlas-validate-entity: FastAPI, prefix AURELIUS_ATLAS_VALIDATE_ENTITY_,
# port 21003. Verifies Keycloak bearer tokens (audience aurelius-atlas-validate-entity)
# and exports OTLP with its own ingest identity. Shares the service shape with
# data2model and lineage-model by design — each chart owns its templates
# (DD-247).

# The umbrella's contract (CHT-03), declared whole — see atlas-server/values.yaml.
global:
    namespace: ""
    labels: {}
    image:
        registry: ghcr.io
        namespace: aureliusenterprise
        tag: ""
        pullSecrets: []
    issuer:
        url: ""
    domain: ""
    dnsResolver: ""

enabled: true
component: validate-entity
componentEnvPrefix: AURELIUS_ATLAS_VALIDATE_ENTITY_
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
port: 21003

image:
    name: aurelius-atlas-validate-entity
    tag: ""

resources:
    requests:
        cpu: 100m
        memory: 256Mi
    limits:
        memory: 512Mi

probes:
    livenessPath: /liveness
    readinessPath: /liveness
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

tls:
    enabled: true
    secretName: ""
    certPath: /etc/aurelius-atlas/tls/tls.crt
    keyPath: /etc/aurelius-atlas/tls/tls.key
    caConfigMap: ""
    caPath: /etc/aurelius-atlas/tls/ca.crt

service:
    type: ClusterIP
    port: 21003

serviceAccount:
    create: true
    name: ""

config:
    AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_REALM: master
    AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE: aurelius-atlas-validate-entity
    AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    AURELIUS_ATLAS_VALIDATE_ENTITY_LOG_LEVEL: info
    AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CERT_FILE: /etc/aurelius-atlas/tls/tls.crt
    AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_KEY_FILE: /etc/aurelius-atlas/tls/tls.key
    AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_ID: otel-validate-entity
    AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    OTEL_SEMCONV_STABILITY_OPT_IN: http

secretRefs: []
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
        type: RuntimeDefault
securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
        drop:
            - ALL

# The issuer guard is the chart's own (validate.yaml): AUTH_SERVER_URL may
# arrive as global.issuer.url (the umbrella) or derive from global.domain.
required: []
