# The validate-entity chart — its runtime contract (CHT-02).
# apps/aurelius-atlas-validate-entity: FastAPI, prefix AURELIUS_ATLAS_VALIDATE_ENTITY_,
# port 21003. Verifies Keycloak bearer tokens (audience aurelius — the browser
# client, since 7.24: the webapp's editor calls it through its nginx, DD-435),
# reads its governance rules from the co-deployed Atlas server as its own
# service identity (12.7, VEV-04, CHT-113), and exports OTLP with its own
# ingest identity. Shares the service shape with data2model and lineage-model
# by design — each chart owns its templates (DD-290).

# The umbrella's contract (CHT-03), declared whole — see atlas-server/values.yaml.
global:
    namespace: ""
    labels: {}
    image:
        registry: ghcr.io
        namespace: aureliusenterprise
        tag: ""
        pullSecrets: []
    issuer:
        url: ""
    domain: ""
    dnsResolver: ""
    # The umbrella's realm (CHT-74): the realm the OTLP mint URL names.
    # "" takes the chart default (aurelius-atlas).
    realm: ""
    trust:
        # The issuer the chart's Certificate is signed by (umbrella default;
        # DD-286/DD-259). Standalone renders need it present.
        issuerRef:
            name: aurelius-atlas-selfsigned
            kind: Issuer

enabled: true
component: validate-entity
componentEnvPrefix: AURELIUS_ATLAS_VALIDATE_ENTITY_
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
port: 21003

image:
    name: aurelius-atlas-validate-entity
    tag: ""
    # Operator override (CHT-92): a set digest always wins over the tag;
    # the release's own bytes are attested by the chart signature (CHT-94).
    digest: ""

resources:
    requests:
        cpu: 100m
        memory: 256Mi
    limits:
        memory: 512Mi

probes:
    livenessPath: /liveness
    readinessPath: /liveness
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

tls:
    # The mounted Secret is the Certificate's output below, which carries
    # ca.crt beside the pair — cert-manager's contract — so the
    # AUTH_CA_FILE/OTEL_CA_FILE paths in config exist (DD-294: the dead
    # caConfigMap/caPath pair retired; nothing ever mounted them).
    enabled: true
    secretName: ""

# The Certificate cert-manager issues for this Service (CHT-27): SANs are the
# Service name and its FQDNs. cert-manager is a cluster prerequisite
# (runbook), never installed by the chart; tls.secretName brings your own and
# this renders nothing.
certificate:
    enabled: true
    duration: 2160h
    renewBefore: 720h

# The 12.7 catalogue leg (CHT-113, VEV-04): the Atlas server the rules read
# runs against. "" derives this release's atlas-server chart name (the
# siblingService name rule, as lineage-model's upstream join, CHT-28).
atlas:
    service: ""
    port: 21000

# The credential joins (CHT-113): "" derives <release>-validate-entity-client,
# the Secret the umbrella generates and the master realm's import resolves
# (the same Secret, both ends of the client — CHT-109's shape).
credentialSecrets:
    validateEntityClient: ""

service:
    type: ClusterIP
    port: 21003

serviceAccount:
    create: true
    name: ""

# The per-service OTLP leg (CHT-42, DD-196): with telemetry.enabled the
# deployment joins the collector endpoint, the issuer's realm token URL
# (CHT-41's public URL, split-horizon-resolved — DD-265), and the ingest
# client secret. The config CLIENT_ID/CA_FILE keys are the defaults; the
# app's export stays off while otel_token_url is None (its settings).
telemetry:
    enabled: false
    # The collector Service; "" derives this release's atlas-observability
    # chart name (the siblingService name rule, as the server chart).
    service: ""
    # The per-service leg (HTTP + OIDC, DD-196).
    port: 4319

config:
    # The endpoint is the browser's from begin to end (7.24, DD-435): the
    # webapp's editor calls it with the user's own token through nginx, so the
    # verifier takes the browser client's audience — the dev .env's value, the
    # e2e compose's value, AUX-04. No extra-audiences join: the caller's token
    # stops at the gate (DV-75); the app's OWN identity belongs to the rules
    # leg, not the verifier (12.7, VEV-04).
    AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_AUDIENCE: aurelius
    AURELIUS_ATLAS_VALIDATE_ENTITY_AUTH_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    AURELIUS_ATLAS_VALIDATE_ENTITY_LOG_LEVEL: info
    AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_CERT_FILE: /etc/aurelius-atlas/tls/tls.crt
    AURELIUS_ATLAS_VALIDATE_ENTITY_TLS_KEY_FILE: /etc/aurelius-atlas/tls/tls.key
    AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CLIENT_ID: otel-validate-entity
    AURELIUS_ATLAS_VALIDATE_ENTITY_OTEL_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    OTEL_SEMCONV_STABILITY_OPT_IN: http

secretRefs: []
extraEnv: []

# Network segmentation (7.24, EDT-22, DD-435): the ingress allow for this
# Service — the webapp only (its /validate-entity/ proxy). peers.<peer>
# renames a peer's pods for a diverging deployment.
networkPolicy:
    enabled: true
    peers:
        webapp: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
    # The image's declared user (DD-257): dhi.io/python-3.14-alpine runs as
    # `nonroot` (uid/gid 65532, verified from the image), no privilege drop.
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
        type: RuntimeDefault
securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
        drop:
            - ALL

# The issuer guard is the chart's own (validate.yaml): AUTH_SERVER_URL may
# arrive as global.issuer.url (the umbrella) or derive from global.domain.
required: []
