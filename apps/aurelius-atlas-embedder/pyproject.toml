[project]
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    # No wheels for Python 3.15 yet; the app imports it only to load the model (DD-433).
    "onnxruntime>=1.31.1; python_version < '3.15'",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas embedder: text in, its embedding out, with a multilingual model on the CPU."
name = "aurelius-atlas-embedder"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_embedder"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
