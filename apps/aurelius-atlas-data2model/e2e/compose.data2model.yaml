# The e2e data2model, as a base: the chain stacks that stand up the real
# extraction service beside their app under test extend this service (the
# pattern of ADR 065/066, as the scanner stacks extend the server's e2e
# base). Not a deployment target of its own - run a consumer's
# docker-compose.yaml. The project's stack piece (../docker/compose.yaml),
# which the standalone stack includes, is the identity underneath: the image
# pin, the certificate mount (the piece's ../certs, which extends rebases to
# this project's certs/ - the leaf the chain verifies against, issued once by
# this project's `nx certgen`), the log level, the TLS trio and the bearer
# check's CA arrive by inheritance. This layer states the e2e identity on top
# of it: the host-mapped issuer (the dev Keycloak's TLS listener, off this
# stack's network), the collector network, the Keycloak-on-host mapping, the
# OTel leg and a published port - and it undoes the piece's share of the
# proxy's network, which the standalone stack needs and an e2e stack has no
# proxy for. What a consumer states are its own differences: its network list
# and its OTel client secret under its .env name.
# The guards are the consumers': compose interpolates this file with the
# consuming project's environment, and Nx injects each project's .env into
# its e2e task. Because a consumer's own .env names the ingest secret under
# its own prefix, the OTel client-credentials secret is deliberately NOT
# guarded here (a failed base guard is not rescued by a consumer override,
# verified against compose): every consumer adds the key, guarded under the
# name its own .env carries - the merge by key then supplies the one value.
# The audience is the piece's literal, `aurelius`: fixed by design, not a
# knob - the chain forwards the webapp's token (AUX-04). The issuer pair is
# replaced whole here: the e2e issuer is the dev Keycloak, not the standalone
# stack's.
# Relative paths read from this file's folder; keep the service name
# `aurelius-atlas-data2model` and the network key `observability`: the suites
# and the certificate names speak them.
services:
    aurelius-atlas-data2model:
        extends:
            file: ../docker/compose.yaml
            service: aurelius-atlas-data2model
        # The standalone piece shares the proxy's network namespace; an e2e
        # stack has no proxy, so the key is deleted and the service joins the
        # networks below (verified against compose).
        network_mode: !reset null
        extra_hosts:
            # The issuer, published loopback-wide on this machine by the dev
            # Keycloak stack (as the server suite reaches it for its mint).
            - keycloak.localhost:host-gateway
        environment:
            # The e2e issuer (infra/keycloak, TLS listener): /extract verifies
            # the caller's bearer token against it (DTM-10).
            AURELIUS_ATLAS_DATA2MODEL_AUTH_SERVER_URL: https://keycloak.localhost:8443/
            AURELIUS_ATLAS_DATA2MODEL_AUTH_REALM: master
            # OTLP ingest identity (DD-196, DD-197): the app exports through
            # its own pipeline, minting client-credentials JWTs as
            # otel-data2model for the per-service leg (:4319). The mint rides
            # the TLS :8443 listener (DD-202): every per-service producer
            # mints there and the collector validates both listeners, so no
            # suite order can split mint issuer from validator. The client
            # secret joins here from the consumer (its own .env's name).
            AURELIUS_ATLAS_DATA2MODEL_OTEL_TOKEN_URL: https://keycloak.localhost:8443/realms/master/protocol/openid-connect/token
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_ID: otel-data2model
            AURELIUS_ATLAS_DATA2MODEL_OTEL_ENDPOINT: https://otel-collector:4319
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CA_FILE: /certs/ca.pem
        networks:
            # The collector answers as `otel-collector` on this network - the
            # name in its certificate. Its publishes are loopback-pinned
            # (CIA-03), so a host-gateway extra_host would not reach it.
            # The chain's own services ride the stack's default network too;
            # that is the consumer's to add.
            observability: {}
        ports:
            - 21001

networks:
    # The dev telemetry stack (infra/observability). `extends` copies the
    # service, not the network definitions: every consumer declares the same
    # external network under the same key.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
