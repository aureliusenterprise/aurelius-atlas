name: aurelius-atlas-data2model-e2e

# The app under test is this project's own e2e service, extended from
# compose.data2model.yaml beside this file (the pattern of ADR 065/066): the
# chain stacks (lineage-model 8.2, the webapp) extend the same base. This
# stack states its difference: the OTel client secret, guarded under this
# project's own .env name, joined into the base's environment map.
services:
    aurelius-atlas-data2model:
        extends:
            file: ./compose.data2model.yaml
            service: aurelius-atlas-data2model
        environment:
            # The base carries no guard for this key — each consumer states
            # the guard under the name its own .env carries (see the base).
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_SECRET: ${AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_SECRET:?}

networks:
    # `extends` copies the service, not the network definitions: the base's
    # collector network is declared here under the same key.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
