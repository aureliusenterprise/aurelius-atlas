{{/*
The data2model ingress allow (CHT-66, DD-271). The one caller this API
serves in-cluster is lineage-model (its DATA2MODEL_URL join, DD-251); the
aux APIs' other clients are external (the browser through the gateway — and
data2model is not a browser host). Peers join by pod labels (CHT-70): chart
name + release instance, never a Service name. lineage-model and
validate-entity render no policy at all — nothing dials them (their clients
are external), and a policy that opened them would pin a caller that does not
exist (CHT-66's second half). The probe surface is exempt by CNI design
(CHT-71).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ printf "%s-ingress" (include "atlas-data2model.fullname" .) }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-data2model.labels" . | nindent 8 }}
spec:
    podSelector:
        matchLabels:
            {{- include "atlas-data2model.selectorLabels" . | nindent 12 }}
    policyTypes:
        - Ingress
    ingress:
        -   from:
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: {{ default "atlas-lineage-model" .Values.networkPolicy.peers.lineageModel | quote }}
                            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            ports:
                -   port: {{ int .Values.port }}
                    protocol: TCP
{{- end }}
