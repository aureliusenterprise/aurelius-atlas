{{/*
The Deployment. TLS is a cert/key pair (the apps accept both-set or
both-unset, the settings module enforces it); the chart mounts the pair when
tls.enabled, and the probes' scheme follows it.
*/}}
{{- $fullname := include "atlas-data2model.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-data2model.labels" . | nindent 8 }}
spec:
    replicas: {{ int .Values.replicaCount }}
    selector:
        matchLabels:
            {{- include "atlas-data2model.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "atlas-data2model.labels" . | nindent 16 }}
                {{- with .Values.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with .Values.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 14 }}
            {{- end }}
        spec:
            serviceAccountName: {{ default $fullname .Values.serviceAccount.name }}
            {{- with .Values.global.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 14 }}
            {{- end }}
            securityContext:
                {{- toYaml .Values.podSecurityContext | nindent 16 }}
            containers:
                -   name: {{ .Values.component }}
                    image: {{ include "atlas-data2model.image" . | quote }}
                    imagePullPolicy: IfNotPresent
                    securityContext:
                        {{- toYaml .Values.securityContext | nindent 24 }}
                    ports:
                        - name: https
                          containerPort: {{ int .Values.port }}
                          protocol: TCP
                    env:
                        - name: {{ .Values.componentEnvPrefix }}HOST
                          value: "0.0.0.0"
                        - name: {{ .Values.componentEnvPrefix }}PORT
                          value: {{ int .Values.port | quote }}
                        - name: {{ .Values.componentEnvPrefix }}AUTH_SERVER_URL
                          value: {{ include "atlas-data2model.issuerUrl" . | quote }}
                        {{- if .Values.telemetry.enabled }}
                        {{/* The per-service OTLP leg (CHT-42, DD-196): a
                        minted client JWT against the issuer's public realm
                        token endpoint (CHT-41/DD-265), exported to the
                        collector's HTTP+OIDC leg. */}}
                        {{- $collector := include "atlas-data2model.siblingService" (dict "name" "atlas-observability" "release" .Release.Name "override" .Values.telemetry.service) }}
                        - name: {{ .Values.componentEnvPrefix }}OTEL_ENDPOINT
                          value: {{ printf "https://%s:%d" $collector (int .Values.telemetry.port) | quote }}
                        - name: {{ .Values.componentEnvPrefix }}OTEL_TOKEN_URL
                          value: {{ printf "%s/realms/%s/protocol/openid-connect/token" (include "atlas-data2model.issuerUrl" .) .Values.telemetry.realm | quote }}
                        - name: {{ .Values.componentEnvPrefix }}OTEL_CLIENT_SECRET
                          valueFrom:
                              secretKeyRef:
                                  name: {{ printf "%s-otel-clients" .Release.Name }}
                                  key: OTEL_INGEST_CLIENT_SECRET
                        {{- end }}
                        {{- with .Values.config }}
                        {{- range $key, $value := . }}
                        - name: {{ $key }}
                          value: {{ $value | quote }}
                        {{- end }}
                        {{- end }}
                        {{- with .Values.secretRefs }}
                        {{- range . }}
                        - name: {{ .name }}
                          valueFrom:
                              secretKeyRef:
                                  name: {{ .secret }}
                                  key: {{ .key }}
                        {{- end }}
                        {{- end }}
                        {{- with .Values.extraEnv }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    {{- if .Values.tls.enabled }}
                    volumeMounts:
                        - name: tls
                          mountPath: /etc/aurelius-atlas/tls
                          readOnly: true
                    {{- end }}
                    readinessProbe:
                        httpGet:
                            path: {{ .Values.probes.readinessPath }}
                            port: {{ int .Values.port }}
                            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    livenessProbe:
                        httpGet:
                            path: {{ .Values.probes.livenessPath }}
                            port: {{ int .Values.port }}
                            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
                        initialDelaySeconds: {{ int .Values.probes.initialDelaySeconds }}
                        periodSeconds: {{ int .Values.probes.periodSeconds }}
                        timeoutSeconds: {{ int .Values.probes.timeoutSeconds }}
                        failureThreshold: {{ int .Values.probes.failureThreshold }}
                    resources:
                        {{- toYaml .Values.resources | nindent 24 }}
            {{- if .Values.tls.enabled }}
            volumes:
                -   name: tls
                    secret:
                        secretName: {{ default (printf "%s-tls" $fullname) .Values.tls.secretName }}
            {{- end }}
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
