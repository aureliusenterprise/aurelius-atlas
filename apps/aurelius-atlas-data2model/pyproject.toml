[project]
dependencies = [
    "aurelius-atlas-auth",
    "aurelius-atlas-data2model-client",
    "aurelius-atlas-otel",
    "fastapi>=0.162.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]
description = "The Aurelius Atlas data2model API: tabular data and rules in, an archimate3 model out."
name = "aurelius-atlas-data2model"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_data2model"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-auth]
workspace = true

[tool.uv.sources.aurelius-atlas-data2model-client]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
