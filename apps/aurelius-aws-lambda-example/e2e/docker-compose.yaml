name: aurelius-aws-lambda-example-e2e
services:
    aurelius-aws-lambda-example:
        command: ["python", "-m", "awslambdaric", "aurelius_aws_lambda_example.main"]
        entrypoint: ["/aws-lambda/aws-lambda-rie"]
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task
            # environment; a missing/empty value would otherwise reach the
            # container as "" and fail Settings validation (or silently
            # disable OAuth) after the image has already started.
            # AURELIUS_LAMBDA_ prefix: Settings.env_prefix. AWS_REGION is the
            # documented exemption (boto3/MSK signer read the standard name).
            AWS_REGION: ${AWS_REGION:?}
            AURELIUS_LAMBDA_ENVIRONMENT: ${AURELIUS_LAMBDA_ENVIRONMENT:?}
            # OAuth listener on the Docker network (SASL_SSL/OAUTHBEARER).
            AURELIUS_LAMBDA_KAFKA_BOOTSTRAP_SERVERS: broker:9095
            AURELIUS_LAMBDA_KAFKA_CA_FILE: /certs/ca.pem
            # Written to the process env by conftest's compose fixture; process
            # env wins over the .env value passed via env_file.
            AURELIUS_LAMBDA_KAFKA_TOPIC_NAME: ${AURELIUS_LAMBDA_KAFKA_TOPIC_NAME:?}
            AURELIUS_LAMBDA_LOG_LEVEL: ${AURELIUS_LAMBDA_LOG_LEVEL:?}
            # In-container override: librdkafka's c-ares resolver short-circuits
            # every *.localhost name to loopback (RFC 6761) and never consults
            # Docker DNS, so the token endpoint must use the plain service name
            # here. Keycloak's KC_HOSTNAME pins the token "iss" claim to
            # keycloak.localhost regardless, so the broker still accepts it.
            AURELIUS_LAMBDA_KAFKA_OAUTH_TOKEN_ENDPOINT_URL: https://keycloak:8443/realms/kafka/protocol/openid-connect/token
            AURELIUS_LAMBDA_KAFKA_OAUTH_CLIENT_ID: ${AURELIUS_LAMBDA_KAFKA_OAUTH_CLIENT_ID:?}
            AURELIUS_LAMBDA_KAFKA_OAUTH_CLIENT_SECRET: ${AURELIUS_LAMBDA_KAFKA_OAUTH_CLIENT_SECRET:?}
            AURELIUS_LAMBDA_SCHEMA_REGISTRY_URL: https://schema-registry:8081
        image: ghcr.io/aureliusenterprise/aurelius-aws-lambda-example:local
        networks:
            - aurelius-dev-kafka-network
            - aurelius-dev-keycloak-network
            - default
        ports:
            - 8080
        restart: unless-stopped
        volumes:
            - ../../../dev/aws-lambda-rie:/aws-lambda
            - ../certs:/certs:ro

networks:
    aurelius-dev-kafka-network:
        external: true
    # Resolves keycloak.localhost (network alias) for token grants in-network.
    aurelius-dev-keycloak-network:
        external: true
