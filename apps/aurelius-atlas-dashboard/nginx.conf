# The stack's resolved site config for the dashboard image (DD-034): TLS-terminated dashboard serving
# plus a TLS-verified proxy to the API-only server. `nx up`/`e2e` mount it over the image's template
# through docker-compose.yaml. The shipped template (apps/aurelius-atlas-dashboard/nginx.conf.template)
# keeps the ${AURELIUS_ATLAS_DASHBOARD_*} placeholders for deployments to resolve; here this stack's own
# topology is filled in: the server service on its HTTPS port, verified against the dev CA. Keep the two
# in sync when either changes.
# NOTE: the hardened image includes conf.d at *server* level, so the whole server block lives here (no
# http-level directives allowed).
server {
    listen 8080 ssl;

    ssl_certificate /certs/aurelius-atlas-dashboard.pem;
    ssl_certificate_key /certs/aurelius-atlas-dashboard-key.pem;

    server_tokens off;
    # Redirects stay relative (the gate's @login below): nginx would absolutize them from this
    # container's own listener — port 8080, not the 8444 the browser came in on. A relative
    # Location is what RFC 9110 allows and what a browser resolves against the origin it is on.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app.d/*.conf;

    # Security headers — kept in sync with the shipped template (no CSP: the vendored dashboards use
    # inline scripts and eval; DV-09). The stack overwrites /etc/nginx/conf.d/default.conf, so browsers
    # and probes see these headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The server of this stack, over its own HTTPS port. Docker's built-in DNS resolves the service name;
    # the variable keeps resolution per-request, so a missing server answers 502 instead of blocking the
    # dashboard container from starting.
    set $atlas_upstream https://aurelius-atlas-server:21000;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API proxy keeps the /api/ prefix (the server's routes carry it) and verifies the server's
    # certificate against the dev CA: the proxy carries the session cookie.
    location /api/ {
        proxy_pass $atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
        proxy_redirect off;
    }

    # The login page of Atlas (AtlasLoginServlet serves it, and Atlas's logout lands there —
    # logoutSuccessUrl("/login.jsp"); the vendored UI's 401 handler navigates here too, ADR 046
    # forbids editing the JS). Under Keycloak, Atlas keeps it off the ignore list and runs the dance
    # through it; here the gate does the same: an anonymous visit takes the login start with this URI
    # kept, and a visit on a session gets the login page (webapp/login.html, DD-040) — this project's
    # own resolver, answering with the dashboard the user was on, as the vendored form's script does.
    location = /login.jsp {
        auth_request /_auth;
        error_page 401 = @login;
        try_files /login.html =404;
    }

    # The old form login's target (dashboardv2/public/js/modules/atlasLogin.js, the script of the
    # login page the OIDC flow replaced). The vendored UI never posts here in this mode and Atlas
    # 2.4.0's Keycloak chain guards it like any other URI, so the proxy lets the server's guard
    # answer it: an anonymous navigation starts the login flow (AUTH-06), an anonymous call is 401
    # (AUTH-04). The way in is the gated page load (DSH-07) or login.jsp above; the way out is
    # /logout.html.
    location = /j_spring_security_check {
        proxy_pass $atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
        proxy_redirect off;
    }

    # The dashboard's logout link (dashboardv2/public/js/views/site/Header.js navigates the browser to
    # /logout.html on this origin): the server destroys the session, expires the cookie and answers the
    # issuer's end-session URL (AUTH-10). Public: logging out without a session is a no-op, not a loop.
    location = /logout.html {
        proxy_pass $atlas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
        proxy_redirect off;
    }

    # The page-load gate of DSH-07 (DD-036): the server's /api/atlas/auth/check answers for the
    # request's session (its cookie rides the subrequest), and a page without one is redirected to the
    # server's login start, which runs the Keycloak code flow and returns to the kept URL. Only the
    # page locations below carry the gate — assets stay open as in Atlas's ignore list (DSH-08), and
    # the API guards itself in the server (AUTH-02). The 401 lands in @login rather than redirecting
    # to the login URL through error_page's path: an error_page to /api/... would re-enter
    # location /api/ and be proxied, answering the browser with the issuer's URL directly; @login's
    # return sends the browser to the login start itself, where the kept URL is visible (DSH-07).
    location = /_auth {
        internal;
        proxy_pass $atlas_upstream/api/atlas/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-atlas-server;
    }

    # The gated pages. Exact matches, so an unknown path under / or /n/ never lands here: it is an
    # asset (404 unless the file exists), not a page. / resolves through try_files to index.html
    # without a redirect, keeping Utils.getBaseUrl at the origin root as before.
    location = / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files /index.html =404;
    }

    location = /index.html {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri =404;
    }

    location = /n/ {
        auth_request /_auth;
        error_page 401 = @login;
        try_files /n/index.html =404;
    }

    location = /n/index.html {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri =404;
    }

    # The gate's answer to a page without a session: the browser goes to the login start on this
    # origin, which starts the flow with the page kept (AUTH-06, DSH-07).
    location @login {
        return 302 /api/atlas/auth/login?next=$request_uri;
    }

    # /n reaches /n/ as a directory does; 308 keeps the method, as the server's old StaticFiles 307 did.
    location = /n {
        return 308 /n/;
    }

    # dashboardv3 under /n/ — its assets, ungated (DSH-08); unknown files stay 404 (no SPA fallback —
    # the dashboards route on the URL fragment).
    location /n/ {
        try_files $uri $uri/ =404;
    }

    # dashboardv2 at the root — its assets, ungated (DSH-08).
    location / {
        try_files $uri $uri/ =404;
    }
}
