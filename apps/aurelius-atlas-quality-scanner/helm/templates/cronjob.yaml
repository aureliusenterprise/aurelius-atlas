{{/*
The CronJob (CHT-115): the schedule the image's Dockerfile names 12.3 as its
scheduler. One run is one scan: the pod runs the image's ENTRYPOINT, writes
through the catalogue door, and exits (DQS-01, DD-460). Forbid + Never +
activeDeadlineSeconds are DD-510's overlap and zombie guards; the hardened pod
context is the service charts' (DD-257), with no service-account token and no
writable root — a batch job that reads sources and writes one bulk request
needs neither. No Service, Certificate, or NetworkPolicy renders (CHT-115):
the job listens on nothing and no in-cluster caller dials it.
*/}}
{{- $fullname := include "atlas-quality-scanner.fullname" . -}}
{{- $ns := default .Release.Namespace .Values.global.namespace -}}
{{- $caSecret := include "atlas-quality-scanner.caSecretName" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
    name: {{ $fullname }}
    namespace: {{ $ns }}
    labels:
        {{- include "atlas-quality-scanner.labels" . | nindent 8 }}
spec:
    schedule: {{ .Values.schedule | quote }}
    concurrencyPolicy: {{ default "Forbid" .Values.concurrencyPolicy }}
    startingDeadlineSeconds: {{ int .Values.startingDeadlineSeconds }}
    successfulJobsHistoryLimit: {{ int .Values.successfulJobsHistoryLimit }}
    failedJobsHistoryLimit: {{ int .Values.failedJobsHistoryLimit }}
    suspend: {{ .Values.suspend }}
    {{- with .Values.ttlSecondsAfterFinished }}
    ttlSecondsAfterFinished: {{ int . }}
    {{- end }}
    jobTemplate:
        spec:
            {{- with .Values.activeDeadlineSeconds }}
            activeDeadlineSeconds: {{ int . }}
            {{- end }}
            template:
                metadata:
                    labels:
                        {{- include "atlas-quality-scanner.labels" . | nindent 24 }}
                        {{- with .Values.podLabels }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    {{- with .Values.podAnnotations }}
                    annotations:
                        {{- toYaml . | nindent 24 }}
                    {{- end }}
                spec:
                    restartPolicy: Never
                    serviceAccountName: {{ default $fullname .Values.serviceAccount.name }}
                    automountServiceAccountToken: false
                    {{- with .Values.global.image.pullSecrets }}
                    imagePullSecrets:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    securityContext:
                        {{- toYaml .Values.podSecurityContext | nindent 24 }}
                    containers:
                        -   name: {{ .Values.component }}
                            image: {{ include "atlas-quality-scanner.image" . | quote }}
                            imagePullPolicy: IfNotPresent
                            securityContext:
                                {{- toYaml .Values.securityContext | nindent 32 }}
                            {{- with .Values.args }}
                            args:
                                {{- toYaml . | nindent 32 }}
                            {{- end }}
                            env:
                                - name: {{ .Values.componentEnvPrefix }}SERVER_URL
                                  value: {{ .Values.catalogue.serverUrl | quote }}
                                - name: {{ .Values.componentEnvPrefix }}TOKEN_URL
                                  value: {{ include "atlas-quality-scanner.tokenUrl" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}CLIENT_ID
                                  value: {{ .Values.auth.clientId | quote }}
                                - name: {{ .Values.componentEnvPrefix }}CLIENT_SECRET
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ include "atlas-quality-scanner.secretName" . }}
                                          key: {{ include "atlas-quality-scanner.secretKey" . | quote }}
                                {{- /* The scan envelope (DQS-17) and bounds, only
                                when named — the app's defaults stay the app's
                                (CHT-117's shape for the scan block). */}}
                                {{- with .Values.scan.sources }}
                                - name: {{ $.Values.componentEnvPrefix }}SOURCES
                                  value: {{ . | toJson | quote }}
                                {{- end }}
                                {{- with .Values.scan.maxRows }}
                                - name: {{ $.Values.componentEnvPrefix }}MAX_ROWS
                                  value: {{ int . | quote }}
                                {{- end }}
                                {{- with .Values.scan.searchLimit }}
                                - name: {{ $.Values.componentEnvPrefix }}SEARCH_LIMIT
                                  value: {{ int . | quote }}
                                {{- end }}
                                {{- if $caSecret }}
                                - name: {{ .Values.componentEnvPrefix }}CA_FILE
                                  value: {{ printf "%s/ca.crt" (trimSuffix "/" .Values.trust.mountPath) | quote }}
                                {{- end }}
                                {{- /* The scan's OTLP export (CHT-125, DD-511),
                                off by default. Auth on: the app-owned leg's
                                trio (DD-196), minting against the issuer the
                                identity join already names. Auth off: the SDK
                                env leg (DD-210), unauthenticated — the shape
                                for a collector that asks for no credential. */}}
                                {{- if .Values.telemetry.enabled }}
                                {{- if .Values.telemetry.auth.enabled }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_ENDPOINT
                                  value: {{ .Values.telemetry.endpoint | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_TOKEN_URL
                                  value: {{ include "atlas-quality-scanner.tokenUrl" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_CLIENT_ID
                                  value: {{ include "atlas-quality-scanner.otelClientId" . | quote }}
                                - name: {{ .Values.componentEnvPrefix }}OTEL_CLIENT_SECRET
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ include "atlas-quality-scanner.otelSecretName" . }}
                                          key: {{ include "atlas-quality-scanner.otelSecretKey" . | quote }}
                                {{- else }}
                                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                                  value: {{ .Values.telemetry.endpoint | quote }}
                                {{- /* The env leg's own TLS knob (DD-210):
                                the SDK reads the standard var, not CA_FILE. */}}
                                {{- if $caSecret }}
                                - name: OTEL_EXPORTER_OTLP_CERTIFICATE
                                  value: {{ printf "%s/ca.crt" (trimSuffix "/" .Values.trust.mountPath) | quote }}
                                {{- end }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.config }}
                                {{- range $key, $value := . }}
                                - name: {{ $key }}
                                  value: {{ $value | quote }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.secretRefs }}
                                {{- range . }}
                                - name: {{ .name }}
                                  valueFrom:
                                      secretKeyRef:
                                          name: {{ .secret }}
                                          key: {{ .key }}
                                {{- end }}
                                {{- end }}
                                {{- with .Values.extraEnv }}
                                {{- toYaml . | nindent 32 }}
                                {{- end }}
                            {{- if $caSecret }}
                            volumeMounts:
                                - name: ca
                                  mountPath: {{ .Values.trust.mountPath }}
                                  readOnly: true
                            {{- end }}
                            resources:
                                {{- toYaml .Values.resources | nindent 32 }}
                    {{- if $caSecret }}
                    volumes:
                        -   name: ca
                            secret:
                                secretName: {{ $caSecret }}
                    {{- end }}
                    {{- with .Values.nodeSelector }}
                    nodeSelector:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    {{- with .Values.tolerations }}
                    tolerations:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
                    {{- with .Values.affinity }}
                    affinity:
                        {{- toYaml . | nindent 22 }}
                    {{- end }}
