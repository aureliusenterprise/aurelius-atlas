{{/* The ServiceAccount. The job authenticates to the catalogue with Keycloak
client credentials (DD-458), never the cluster API, so the token is not even
mounted (CHT-115). */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-quality-scanner.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-quality-scanner.labels" . | nindent 8 }}
automountServiceAccountToken: false
{{- end }}
