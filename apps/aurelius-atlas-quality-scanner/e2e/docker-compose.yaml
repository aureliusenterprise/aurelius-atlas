name: aurelius-atlas-quality-scanner-e2e

# The scanner is a batch CLI, not a service: the suite runs it in-process
# against this stack's real Atlas server. There is therefore no scanner
# service here — only the catalogue the job speaks to, and that catalogue is
# the server project's e2e service, extended (the pattern of ADR 065/066):
# image, networks, aliases, certificate mount, Keycloak-on-host and the
# eighteen shared settings all arrive by inheritance from
# ../aurelius-atlas-server/e2e/compose.server.yaml, whose ../certs rebases to
# that project's folder — the server's own certificate, the one it presents.
# What this stack states are its differences: its port, and the scanner's
# audience joined. The store and the collector ride the shared infra networks;
# Keycloak is reached on the host.
services:
    atlas-server:
        extends:
            file: ../../aurelius-atlas-server/e2e/compose.server.yaml
            service: atlas-server
        ports:
            # Fixed host port, loopback-pinned (CIA-03): the suite's client and
            # the server's own image healthcheck speak to it there. 21005 is
            # this stack's; the serve port 21000 and the server suite's 21001
            # stay free.
            - 127.0.0.1:21005:21000
        environment:
            # Both identities of this suite are accepted (AUT-02, DQS-10): the
            # seeding writer's `aurelius` token and the scanner's own
            # client-credentials token, whose azp joins the audiences here
            # (DD-458). One key over the base's map.
            AURELIUS_ATLAS_SERVER_AUTH_AUDIENCES: '["aurelius", "aurelius-atlas-quality-scanner"]'

networks:
    # `extends` copies the service, not the network definitions: both are
    # declared here, as in every consumer of the base.
    # The dev Elasticsearch stack (started by the e2e target's up dependency,
    # and by conftest as a guard): the server reaches the store as
    # `elasticsearch` on this network.
    atlas:
        name: aurelius-atlas-infra-elasticsearch-network
        external: true
    # The dev telemetry stack (infra/observability): the server's OTLP export
    # reaches the collector on it.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
