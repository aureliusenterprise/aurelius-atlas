[project]
dependencies = [
    "aurelius-atlas-model",
    "aurelius-atlas-otel",
    "aurelius-atlas-quality",
    "aurelius-atlas-server-client",
    "httpx2>=2.0.0",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.15.0",
]
description = "The Aurelius Atlas quality scanner: a batch run of the quality rules over configured extracts, with the scores written back."
name = "aurelius-atlas-quality-scanner"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_quality_scanner"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-otel]
workspace = true

[tool.uv.sources.aurelius-atlas-quality]
workspace = true

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
