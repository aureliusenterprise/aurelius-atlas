# Malformed lineage queries (8.6, DD-214): the legacy reads the query with
# Flask's params.get and crashes on what it cannot use — a missing guid fetches
# the literal string "None" (upstream 404, answered 204; DV-73), an
# out-of-range depth or unknown direction raises int()/Enum() (Flask 500;
# DV-72). Aurelius Atlas validates the query at the boundary (LM-07): the
# pydantic messages below are the wire contract, captured from the app. The
# fake upstream answers these stages' calls from the graph fixtures, but no
# stage ever reaches it — every request is rejected before the lineage fetch.
name: "Malformed lineage queries are 400, not the legacy's 204 or 500"
source:
    - .scratch/aurelius/backend/m4i-lineage-model/m4i_lineage_model/lineage_model.py::lineage_model
rules:
    - LM-07
covers:
    - aurelius_atlas_lineage_model.app.create_app
stages:
    - name: A request without the required guid is 400
      request:
          method: GET
          url: /
      response:
          status: 400
          headers:
              content-type: application/json
          json: {}
          deviations:
              - id: DV-73
                path: $.errorCode
                value: ATLAS-400-00-029
              - id: DV-73
                path: $.errorMessage
                value: "invalid lineage request: Field required"
    - name: A depth of zero is 400, not the legacy's 500
      request:
          method: GET
          url: /
          params:
              guid: 00000000-0000-4000-8000-000000000001
              depth: "0"
      response:
          status: 400
          headers:
              content-type: application/json
          json: {}
          deviations:
              - id: DV-72
                path: $.errorCode
                value: ATLAS-400-00-029
              - id: DV-72
                path: $.errorMessage
                value: "invalid lineage request: Input should be greater than or equal to 1"
    - name: A direction outside the enum is 400, not the legacy's 500
      request:
          method: GET
          url: /
          params:
              guid: 00000000-0000-4000-8000-000000000001
              direction: SIDEWAYS
      response:
          status: 400
          headers:
              content-type: application/json
          json: {}
          deviations:
              - id: DV-72
                path: $.errorCode
                value: ATLAS-400-00-029
              - id: DV-72
                path: $.errorMessage
                value: "invalid lineage request: Input should be 'BOTH', 'INPUT' or 'OUTPUT'"
