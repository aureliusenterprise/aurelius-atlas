{{/* The ServiceAccount. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ default (include "atlas-lineage-model.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-lineage-model.labels" . | nindent 8 }}
# The workload verifies Keycloak tokens and exports OTLP (ADR 013); it never
# calls the API server, so the cluster token has no use here.
automountServiceAccountToken: false
{{- end }}
