# The lineage-model chart — its runtime contract (CHT-02).
# apps/aurelius-atlas-lineage-model: FastAPI, prefix AURELIUS_ATLAS_LINEAGE_MODEL_,
# port 21002. Verifies Keycloak bearer tokens (audience aurelius-atlas-lineage-model)
# and exports OTLP with its own ingest identity. Shares the service shape with
# data2model and validate-entity by design — each chart owns its templates
# (DD-247).

# The umbrella's contract (CHT-03), declared whole — see atlas-server/values.yaml.
global:
    namespace: ""
    labels: {}
    image:
        registry: ghcr.io
        namespace: aureliusenterprise
        tag: ""
        pullSecrets: []
    issuer:
        url: ""
    domain: ""
    dnsResolver: ""
    # The umbrella's realm (CHT-74): the realm the OTLP mint URL names.
    # "" takes the chart default (aurelius-atlas).
    realm: ""
    trust:
        # The issuer the chart's Certificate is signed by (umbrella default;
        # DD-243/DD-259). Standalone renders need it present.
        issuerRef:
            name: aurelius-atlas-selfsigned
            kind: Issuer

enabled: true
component: lineage-model
componentEnvPrefix: AURELIUS_ATLAS_LINEAGE_MODEL_
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
port: 21002

image:
    name: aurelius-atlas-lineage-model
    tag: ""

resources:
    requests:
        cpu: 100m
        memory: 256Mi
    limits:
        memory: 512Mi

probes:
    # The app ships one anonymous probe (LM line, DTM-10 shape): 204 while serving.
    livenessPath: /liveness
    readinessPath: /liveness
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

tls:
    # The mounted Secret is the Certificate's output below, which carries
    # ca.crt beside the pair — cert-manager's contract — so the
    # AUTH_CA_FILE/OTEL_CA_FILE paths in config exist (DD-251: the dead
    # caConfigMap/caPath pair retired; nothing ever mounted them).
    enabled: true
    secretName: ""

# The Certificate cert-manager issues for this Service (CHT-27): SANs are the
# Service name and its FQDNs. cert-manager is a cluster prerequisite
# (runbook), never installed by the chart; tls.secretName brings your own and
# this renders nothing.
certificate:
    enabled: true
    duration: 2160h
    renewBefore: 720h

# The upstreams this app flattens and POSTs to (CHT-28, DD-251's second
# finding: settings.py requires both, no defaults — a hand check boots this
# pod with no out-of-band values). "" derives each co-deployed chart's
# Service in this release (CHT-13's name rule); set it to point elsewhere.
# Trailing slashes render as settings.py's HttpUrl stores them.
atlas:
    service: ""
    port: 21000
data2model:
    service: ""
    port: 21001

service:
    type: ClusterIP
    port: 21002

serviceAccount:
    create: true
    name: ""

# The per-service OTLP leg (CHT-42, DD-196): with telemetry.enabled the
# deployment joins the collector endpoint, the issuer's realm token URL
# (CHT-41's public URL, split-horizon-resolved — DD-265), and the ingest
# client secret. The config CLIENT_ID/CA_FILE keys are the defaults; the
# app's export stays off while otel_token_url is None (its settings).
telemetry:
    enabled: false
    # The collector Service; "" derives this release's atlas-observability
    # chart name (the siblingService name rule, as the server chart).
    service: ""
    # The per-service leg (HTTP + OIDC, DD-196).
    port: 4319

config:
    AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_REALM: master
    AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_AUDIENCE: aurelius-atlas-lineage-model
    AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    AURELIUS_ATLAS_LINEAGE_MODEL_LOG_LEVEL: info
    AURELIUS_ATLAS_LINEAGE_MODEL_TLS_CERT_FILE: /etc/aurelius-atlas/tls/tls.crt
    AURELIUS_ATLAS_LINEAGE_MODEL_TLS_KEY_FILE: /etc/aurelius-atlas/tls/tls.key
    AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_ID: otel-lineage-model
    AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CA_FILE: /etc/aurelius-atlas/tls/ca.crt
    OTEL_SEMCONV_STABILITY_OPT_IN: http

secretRefs: []
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
    # The image's declared user (DD-257): dhi.io/python-3.14-alpine runs as
    # `nonroot` (uid/gid 65532, verified from the image), no privilege drop.
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
        type: RuntimeDefault
securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
        drop:
            - ALL

# The issuer guard is the chart's own (validate.yaml): AUTH_SERVER_URL may
# arrive as global.issuer.url (the umbrella) or derive from global.domain.
required: []
