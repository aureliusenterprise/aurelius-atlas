name: aurelius-atlas-lineage-model-e2e

# The 8.2 chain (DD-200): the app under test, the real 8.1 data2model, and a
# canned-file fixture Atlas. The fixture answers GET /api/atlas/v2/lineage/<guid>
# files under fixtures/ (python http.server maps the URL path to the file), so
# the app's upstream calls run over real HTTP between containers; the graph
# then flows through the real extraction. The 5.1 slice replaces the fixture
# with the server (DV-69).
# The data2model in this chain is that project's own e2e service, extended
# (the pattern of ADR 065/066): image, settings, certificate mount and the
# collector network arrive by inheritance from
# ../../aurelius-atlas-data2model/e2e/compose.data2model.yaml, whose ../certs
# rebases to that project's folder — the leaf this chain verifies against.
# This stack states its differences: the ride on the stack's default network,
# the OTel client secret under this project's .env name, and the second-
# cadence export.
# The network key `observability` names the shared dev collector network in
# every stack of this family.
services:
    fixture-atlas:
        image: dhi.io/python:3.14-alpine3.24
        # The base image's Cmd is `python3` with no entrypoint, so the command
        # carries the interpreter. http.server maps the URL path to the file
        # path: GET /api/atlas/v2/lineage/<guid> serves that file, and an
        # absent guid is a 404 — the app's 204 path (LM-05).
        command: ["python3", "-m", "http.server", "21000", "--directory", "/fixtures"]
        volumes:
            - ./fixtures:/fixtures:ro
        healthcheck:
            test:
                [
                    "CMD",
                    "python3",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:21000/api/atlas/v2/lineage/00000000-0000-4000-8000-000000000001', timeout=5).close()",
                ]
            interval: 5s
            timeout: 5s
            retries: 12

    aurelius-atlas-data2model:
        extends:
            file: ../../aurelius-atlas-data2model/e2e/compose.data2model.yaml
            service: aurelius-atlas-data2model
        networks:
            # The chain's services reach each other over the stack's default
            # network (the app's leg to data2model is TLS on the service
            # name); the base's collector network merges in by key.
            - default
        environment:
            # The secret is the shared dev ingest secret (DD-196): this
            # suite's environment carries it under the lineage-model prefix
            # (the base states no guard — each consumer uses its own name).
            AURELIUS_ATLAS_DATA2MODEL_OTEL_CLIENT_SECRET: ${AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_SECRET:?}
            # Export every second in test containers so the chain probe's
            # Tempo read-back lands sooner (DD-225).
            OTEL_BSP_SCHEDULE_DELAY: "1000"

    aurelius-atlas-lineage-model:
        # The app under test is this project's own e2e service, extended from
        # compose.lineage-model.yaml beside this file — the base the webapp
        # e2e stack extends too. This stack states its differences: the
        # fixture Atlas as the lineage reads' upstream and the gate on it
        # (the webapp stack answers them with its real server), the audience
        # pair and the OTel client secret, guarded under this project's own
        # .env names (the base carries no guard for them).
        extends:
            file: ./compose.lineage-model.yaml
            service: aurelius-atlas-lineage-model
        depends_on:
            # The base's data2model gate merges with this one.
            fixture-atlas:
                condition: service_healthy
        environment:
            # The chain's upstream: the fixture Atlas over plain http (the
            # webapp stack's difference is the real server there).
            AURELIUS_ATLAS_LINEAGE_MODEL_ATLAS_BASE_URL: http://fixture-atlas:21000
            # The app keeps its own audience and joins the browser client as
            # the extra audience (DD-385) — the suite mints its test tokens
            # for `aurelius`, the audience the chain forwards (AUX-04); both
            # values ride the project .env.
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_AUDIENCE: ${AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_AUDIENCE:?}
            AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_EXTRA_AUDIENCES: ${AURELIUS_ATLAS_LINEAGE_MODEL_AUTH_EXTRA_AUDIENCES:?}
            AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_SECRET: ${AURELIUS_ATLAS_LINEAGE_MODEL_OTEL_CLIENT_SECRET:?}

networks:
    # `extends` copies the service, not the network definitions: the base's
    # collector network is declared here under the same key.
    observability:
        name: aurelius-atlas-infra-observability-network
        external: true
