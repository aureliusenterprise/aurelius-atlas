# E2E override of /etc/nginx/conf.d/default.conf: TLS-terminated SPA serving
# plus a TLS-verified proxy to the FastAPI backend. Test-only — the shipped
# image config (apps/aurelius-frontend-example/nginx.conf) stays plaintext for
# the dev browser (ADR 039 relaxation).
# NOTE: the hardened image includes conf.d at *server* level, so the whole
# server block lives here (no http-level directives allowed).
server {
    listen 8080 ssl;

    ssl_certificate /certs/aurelius-frontend-example.pem;
    ssl_certificate_key /certs/aurelius-frontend-example-key.pem;

    root /usr/share/nginx/html;

    # Security headers — kept in sync with the shipped config
    # (apps/aurelius-frontend-example/nginx.conf); the e2e stack overwrites
    # /etc/nginx/conf.d/default.conf, so the assertions run against this file.
    # (script-src 'unsafe-hashes' + hash: Angular's deferred-stylesheet
    #  onload handler — see the shipped nginx.conf for the rationale.)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://keycloak.localhost:8080 https://keycloak.localhost:8443; frame-src 'self' http://keycloak.localhost:8080 https://keycloak.localhost:8443" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # keycloak-js silent SSO iframe: strict CSP with the script's hash
    # (see the shipped nginx.conf for the recompute recipe). add_header here
    # replaces the inherited set, so repeat the other headers.
    location = /silent-check-sso.html {
        # The asset is built per locale (browser/<locale>/silent-check-sso.html);
        # keycloak-js requests it at the origin root, so resolve it explicitly.
        try_files /en-US/silent-check-sso.html /nl-NL/silent-check-sso.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-miQlUSMEyNrSzHUXigoiPbVCIcDQvHCRNPop+QMZUus='; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API proxy: TLS to the backend, verified against the local development CA.
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass https://aurelius-fastapi-example:8000/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name aurelius-fastapi-example;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Browser preferred-language detection via the Accept-Language header.
    set $accept_language en-US;

    # OTLP trace proxy: TLS to the collector, verified against the CA.
    location /otel/ {
        rewrite ^/otel(/.*)$ $1 break;
        proxy_pass https://otel-collector:4318/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_ssl_name otel-collector;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Redirect "/" to the preferred locale, defaulting to en-US.
    location = / {
        if ($http_accept_language ~* "^nl") {
            set $accept_language nl-NL;
        }
        return 302 /$accept_language/$is_args$args;
    }

    # Serve each locale's app; unknown paths under a locale prefix fall back
    # to that locale's index.html so client-side routing keeps working.
    location /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    location /nl-NL/ {
        try_files $uri $uri/ /nl-NL/index.html;
    }

    # Unknown paths fall back to the default locale's app (SPA routing).
    location / {
        try_files $uri /en-US/index.html;
    }
}
