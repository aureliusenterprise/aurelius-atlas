version: 1
openmetadata:
    host: http://localhost:8585
    tokenEnv: OPENLINEAGE_JWT_TOKEN
pipeline:
    # Own pipeline service (serviceType below) so the app appears as its own
    # box in Service Lineage instead of piling into aurelius-openlineage.
    service: aurelius-frontend-example
    serviceType: CustomPipeline
    # UI label for the Service Lineage box — the raw name truncates
    # ("aurelius-frontend-ex…") and reads as a duplicate of the app itself.
    serviceDisplayName: Frontend App (Pipeline)
    name: aurelius-frontend-example
    description: Frontend example application.
    state: Active
edges:
    - from:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/get
      to:
          entity: pipeline
          service: aurelius-frontend-example
          name: aurelius-frontend-example
      source: Manual
      description: GET /entities returns data consumed by the frontend.
    - from:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/{guid}/get
      to:
          entity: pipeline
          service: aurelius-frontend-example
          name: aurelius-frontend-example
      source: Manual
      description: GET /entities/{guid} returns data consumed by the frontend.
    - from:
          entity: pipeline
          service: aurelius-frontend-example
          name: aurelius-frontend-example
      to:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/put
      source: Manual
      description: Frontend creates or updates entities via PUT /entities.
    - from:
          entity: pipeline
          service: aurelius-frontend-example
          name: aurelius-frontend-example
      to:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/{guid}/delete
      source: Manual
      description: Frontend deletes entities via DELETE /entities/{guid}.
    - from:
          entity: apiEndpoint
          service: aurelius-fastapi-example-api
          name: /entities/sse/get
      to:
          entity: pipeline
          service: aurelius-frontend-example
          name: aurelius-frontend-example
      source: Manual
      description: GET /entities/sse streams updates consumed by the frontend.
