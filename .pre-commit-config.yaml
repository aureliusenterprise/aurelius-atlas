# Files copied from Apache Atlas release-2.4.0 stay byte-identical: no hook touches them. The vendored
# dashboards (DD-017), the model and type system test fixtures taken from addons/models (1.1, 1.3) and the
# built-in models vendored into aurelius-atlas-core (DD-032). The DSL grammar, and the parser ANTLR generates
# from it (DD-217).
exclude: ^(apps/aurelius-atlas-dashboard/(dashboardv[23]/|LICENSE$|NOTICE$)|libs/python/aurelius-atlas-(core|model|typesystem)/tests/fixtures/[^/]+\.json$|libs/python/aurelius-atlas-core/aurelius_atlas_core/models/|libs/python/aurelius-atlas-dsl/(grammar/[^/]+\.g4$|aurelius_atlas_dsl/generated/[^/]+\.py$))

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-merge-conflict
            name: Check for merge conflicts
          - id: check-json
            name: Check for JSON syntax errors
          - id: check-toml
            name: Check for TOML syntax errors
          - id: check-yaml
            name: Check for YAML syntax errors
            args: [--unsafe]
          - id: end-of-file-fixer
            name: Ensure files end with a newline
          - id: trailing-whitespace
            name: Trim trailing whitespace
            args: [--markdown-linebreak-ext=md]

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier
            name: Format code with Prettier
            additional_dependencies:
                - prettier@3.9.10
                - prettier-plugin-sort-json@4.2.0
                - prettier-plugin-toml@2.0.6

    # ESLint runs from the workspace's node_modules: the project configs need the Nx
    # plugin presets, angular-eslint, eslint-plugin-storybook and the Nx project graph,
    # which an isolated pre-commit environment cannot provide. Requires `npm ci`.
    - repo: local
      hooks:
          - id: eslint
            name: Check for ESLint errors
            entry: npx --no-install eslint --fix --no-warn-ignored
            language: system
            types_or: [javascript, jsx, ts, tsx, json]
            exclude: ^package-lock\.json$

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.1
      hooks:
          - id: ruff
            name: Check for Python linting errors
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/RobertCraigie/pyright-python
      rev: v1.1.414
      hooks:
          - id: pyright
            name: Check for Python type errors
            entry: uv run pyright
            language: system
            "types_or": [python, pyi]
            require_serial: true

    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: v0.48.0
      hooks:
          - id: markdownlint
            name: Check for Markdown linting errors
            args: ["--ignore", "**/CHANGELOG.md"]

    - repo: https://github.com/thoughtworks/talisman
      rev: v1.37.0
      hooks:
          - id: talisman-commit
            name: Scan for secrets
            entry: cmd --githook pre-commit
            args: ["--checksum", "*.lock"]
