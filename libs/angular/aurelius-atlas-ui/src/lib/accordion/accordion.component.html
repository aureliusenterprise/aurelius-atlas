@let _expanded = expanded();

<div class="card">
    <header class="card-header">
        <div class="card-header-title">
            <ng-content select="[header]"></ng-content>
        </div>
        <button
            class="card-header-icon"
            i18n="@@components.accordion.toggleContent"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-expanded]="_expanded"
            [attr.aria-controls]="_expanded ? contentId : null"
            (click)="toggle()"
        >
            <span class="icon has-text-primary">
                <fa-icon [icon]="_expanded ? faChevronUp : faChevronDown"></fa-icon>
            </span>
        </button>
    </header>
    @if (_expanded) {
        <!-- The panel exists only while open, so the button names it only
             while open too (FORM-CUSTOM-001): a closed toggle's aria-controls
             must not dangle at an absent id. -->
        <div class="card-content" [id]="contentId">
            <ng-content select="[content]"></ng-content>
        </div>
    }
</div>
