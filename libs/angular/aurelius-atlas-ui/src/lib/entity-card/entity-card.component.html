<div class="card">
    <div class="card-content">
        @if (loading()) {
            <div class="media">
                <div class="media-content">
                    <h6 class="title is-6">{{ loadingText() }}</h6>
                </div>
                <div class="media-right">
                    <div class="loader"></div>
                </div>
            </div>
        } @else {
            <div class="media">
                <div class="media-content">
                    <p class="title is-4">
                        <!-- The href is the keyboard path; the click handler
                             cancels the fragment navigation and emits (DD-066). -->
                        <a href="#" (click)="onEntityClick($event)">{{ name() }}</a>
                    </p>
                </div>
                <div class="media-right">
                    @let _name = typeAlias() ?? typeName();
                    @if (_name) {
                        <span class="icon-text" [attr.title]="_name">
                            @if (showIcon() && typeIcon()) {
                                <span class="icon" [ngClass]="typeIconClass()">
                                    <fa-icon [icon]="typeIcon()!"></fa-icon>
                                </span>
                            }
                            @if (showTypeName()) {
                                <span>{{ _name }}</span>
                            }
                            @if (showBaseTypeName() && typeAlias()) {
                                <span>&nbsp;({{ typeName() }})</span>
                            }
                        </span>
                    }
                </div>
            </div>
            <div class="columns is-gapless is-mobile">
                <div class="column">
                    <div class="content">
                        <ng-content select="[card-content]"></ng-content>
                    </div>
                </div>
                @if (showQuality()) {
                    <div class="column is-narrow quality">
                        <ng-content select="[card-quality]"></ng-content>
                    </div>
                }
            </div>
        }
    </div>
</div>
