<!--
    The Aurelius card section (UIC-27, DET-17..DET-22): the level of
    title + count line and sort control + keyword input, then the paged
    grid of projected cards. The legacy chrome, rebuilt dumb — the count
    line is the legacy reset link: always underlined, always clickable
    (an unfiltered reset is a no-op), and while a search filters it the
    count it shows is the filtered one (DET-20); the sort select and its
    direction button are the legacy sorting component's native controls
    (their DQ options drop, DD-369).
-->
<div class="level is-widescreen aurelius-card-section-level">
    <div class="level-left">
        <div>
            <!-- HEADING-002: the section title is an h2 under the page's
                 single h1; the Bulma classes keep the pixels. -->
            <h2 class="title is-3">{{ title() }}</h2>
            <h6 class="subtitle is-6 aurelius-card-section-count">
                <a href="#" class="aurelius-card-section-reset" (click)="onCountClick($event)"
                    >{{ filtered() ? filteredCount() : count() }} {{ resultWord() }}</a
                >
            </h6>
        </div>
    </div>
    <div class="level-right">
        <!-- The filter dropdown (UIC-42, VCF-08, DD-618): the legacy
             details-cards-list funnel — a hoverable Bulma dropdown whose
             panel carries the facet menus. The button carries the click
             and keyboard path the CSS hover cannot (DV-169's note) and
             tints its glyph primary while any section state differs
             from its default, as the demo's is-primary pair does. -->
        <div class="dropdown is-hoverable aurelius-card-section-filter" [class.is-active]="facetsOpen()">
            <div class="dropdown-trigger">
                <button
                    #funnel
                    type="button"
                    class="button is-text is-inverted aurelius-card-section-funnel"
                    [class.is-primary]="filterActive()"
                    aria-haspopup="true"
                    [attr.aria-controls]="dropdownId"
                    [attr.aria-expanded]="facetsOpen()"
                    [attr.title]="filterLabel()"
                    [attr.aria-label]="filterLabel()"
                    (click)="toggleFacets()"
                >
                    <span class="icon is-large">
                        <fa-icon aria-hidden="true" [icon]="faFilter" size="lg"></fa-icon>
                    </span>
                </button>
            </div>
            <div class="dropdown-menu" [id]="dropdownId" role="menu">
                <div class="dropdown-content aurelius-card-section-facet-panel">
                    <div class="dropdown-item">
                        @if (facets().length > 0) {
                            @for (group of facets(); track group.key) {
                                <aurelius-atlas-ui-facet-list
                                    [title]="group.title"
                                    [items]="group.items"
                                    [selectable]="true"
                                    [showMoreLabel]="showMoreLabel()"
                                    [showLessLabel]="showLessLabel()"
                                    (toggled)="
                                        facetToggled.emit({
                                            group: group.key,
                                            value: $event.value,
                                            checked: $event.checked,
                                        })
                                    "
                                />
                            }
                        } @else {
                            <!-- SDX-03's empty state (VCF-10): the legacy
                                 filter component's #noFilters line. -->
                            <p class="is-italic has-text-centered aurelius-card-section-no-filters">
                                {{ notAvailableLabel() }}
                            </p>
                        }
                    </div>
                </div>
            </div>
        </div>
        <div class="field has-addons aurelius-card-section-controls">
            <div class="control has-icons-left">
                <div class="select">
                    <select [ngModel]="sort()" (ngModelChange)="sort.set($event)" [attr.aria-label]="sortLabel()">
                        @for (option of sortOptions(); track option.key) {
                            <option [value]="option.key">{{ option.label }}</option>
                        }
                    </select>
                </div>
                <span class="icon is-small has-text-info is-left">
                    <fa-icon aria-hidden="true" [icon]="faSort"></fa-icon>
                </span>
            </div>
            <div class="control">
                <button
                    type="button"
                    class="button is-info aurelius-card-section-direction"
                    [attr.aria-label]="directionLabel()"
                    [attr.aria-pressed]="sortDescending()"
                    (click)="onDirectionClick()"
                >
                    <span class="icon is-small">
                        <fa-icon aria-hidden="true" [icon]="directionIcon()"></fa-icon>
                    </span>
                </button>
            </div>
        </div>
        <div class="aurelius-card-section-search">
            <aurelius-atlas-ui-search-field
                [query]="query()"
                [placeholder]="placeholder()"
                (queryChange)="query.set($event)"
                (querySubmitted)="querySubmitted.emit($event)"
            />
        </div>
    </div>
</div>

<div class="cards">
    <aurelius-atlas-ui-infinite-scroll-container
        [loading]="loading()"
        [allLoaded]="allLoaded()"
        [loadLabel]="loadLabel()"
        (nextPage)="nextPage.emit()"
    >
        <div class="columns is-multiline aurelius-card-section-grid">
            <ng-content></ng-content>
        </div>
    </aurelius-atlas-ui-infinite-scroll-container>
</div>
