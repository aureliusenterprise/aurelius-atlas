@let _query = query();
@let _placeholder = placeholder();
@let _withSubmitButton = withSubmitButton();

<div class="field has-addons">
    <div class="control has-icons-left has-icons-right is-expanded">
        <!-- The ControlShell's label was the Aurelius context's chrome ('Search');
             the accessible name rides the submit label, the component's
             search-string of that name. The left plate is the ControlShell's
             icon (the context's default `faSearch`, in the hero and every
             card); the demo renders it cyan (has-text-info). -->
        <input
            class="input"
            type="search"
            [attr.placeholder]="_placeholder"
            [attr.aria-label]="submitLabel()"
            [ngModel]="_query"
            (ngModelChange)="onQueryChange($event)"
            (search)="submitQuery()"
        />
        <span class="icon is-small is-left has-text-info">
            <fa-icon [icon]="faSearch"></fa-icon>
        </span>
        @if (_query) {
            <span class="icon is-small is-right">
                <button
                    type="button"
                    class="delete is-small"
                    [attr.aria-label]="clearLabel()"
                    (click)="clearQuery()"
                ></button>
            </span>
        }
    </div>
    @if (_withSubmitButton) {
        <div class="control">
            <button type="button" class="button is-success" [attr.aria-label]="submitLabel()" (click)="submitQuery()">
                <span class="icon is-small">
                    <fa-icon [icon]="faSearch"></fa-icon>
                </span>
            </button>
        </div>
    }
</div>
