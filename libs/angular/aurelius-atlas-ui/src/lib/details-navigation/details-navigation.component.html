<!--
    The sticky up-dropdown shell (UIC-18): Bulma's CSS opens the menu on
    `is-active`, the toggle owns the state. Items are projected — the
    app wires their links (DD-191, DD-380, DD-381). The legacy menu-label
    was a scroll-to-top anchor under that same directive; the shell
    renders the label as text, and the app adds its own anchors as items.
-->
<div class="details-navigation">
    <div class="box is-paddingless">
        <!-- DETAILS-NAV-FOCUS (2.4.7): Escape anywhere in the open dropdown
             closes it and the focus lands back on the trigger. -->
        <!-- NOSONAR S1077: the wrapper is not a control — the Escape
             listener is the dialog's keyboard path (the drawer scrim's
             precedent), reached by keys bubbling from the focusable items
             inside; the wrapper itself never takes focus. -->
        <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
        <div class="dropdown is-up is-right" [class.is-active]="isOpen()" (keydown.escape)="onEscape()">
            <div class="dropdown-trigger">
                <button
                    #trigger
                    class="button is-text is-large"
                    type="button"
                    [attr.aria-label]="toggleLabel()"
                    [attr.aria-expanded]="isOpen()"
                    (click)="onToggleClick()"
                >
                    <span class="icon has-text-link">
                        <fa-icon [icon]="toggleIcon()"></fa-icon>
                    </span>
                </button>
            </div>
            <!-- ROLE-MENU-MISUSE: no role="menu" — the container holds plain
                 links, not menuitems; Bulma's CSS never read the role. -->
            <div class="dropdown-menu">
                <div class="dropdown-content">
                    <div class="dropdown-item">
                        <nav class="menu">
                            <p class="menu-label">{{ label() }}</p>
                            <!-- The caller projects its own ul.menu-list: the
                                 list lives in the file that owns the items,
                                 so every template is valid HTML by itself. -->
                            <ng-content></ng-content>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
