@if (alerts().length > 0) {
    <div class="aurelius-alert-list" role="log" aria-live="polite" [attr.aria-label]="ariaLabel()">
        @for (group of alerts(); track group.id) {
            <!--
                The Bulma notification is dismissable markup (a `delete`
                button in the corner); the severity picks the colour
                (ALR-07): error rides danger, warning and info their
                ramp entries (DD-063). The binding replaces the class
                attribute, so `notification` rides in it.
            -->
            <div [class]="'notification is-' + (group.severity === 'error' ? 'danger' : group.severity)">
                <button
                    type="button"
                    class="delete"
                    [attr.aria-label]="dismissLabel()"
                    (click)="dismiss.emit(group.id)"
                ></button>
                <p class="aurelius-alert-message">{{ group.message }}</p>
                <p class="aurelius-alert-meta">
                    <time [attr.datetime]="group.lastSeen">{{ group.lastSeen | date: "medium" }}</time>
                    @if (group.count > 1) {
                        <span class="tag is-light aurelius-alert-count">{{ timesPrefix() }}{{ group.count }}</span>
                    }
                </p>
            </div>
        }
        <button type="button" class="button is-small is-text aurelius-alert-clear" (click)="clearAll.emit()">
            {{ clearLabel() }}
        </button>
    </div>
} @else {
    <p class="has-text-centered has-text-grey aurelius-alert-empty">{{ emptyLabel() }}</p>
}
