@let _active = active();
@let _title = title();
@let _isCard = _title !== undefined;

@if (_active) {
    <!--
        The layer is a native <dialog> opened with showModal() (UIC-40,
        DD-543): the browser moves it to the top layer, keeps focus inside
        the dialog, marks the page behind inert, and answers Escape with
        the `cancel` event. The Bulma `.modal is-active` classes ride the
        dialog so the layer geometry and the card anatomy keep Bulma's
        CSS; the scss resets the UA sheet, like the drawer panel's (DD-162).
    -->
    <dialog
        #host
        class="modal is-active aurelius-modal"
        [attr.aria-labelledby]="_isCard ? headingId : null"
        [attr.aria-label]="_isCard ? null : label()"
        (cancel)="onCancel($event)"
        (close)="onNativeClose()"
    >
        <!--
            Backdrop dismissal stays the pointer affordance it was (the
            S1077 precedent): the scrim div is the click target, Escape on
            the dialog the keyboard path. The scrim paints the layer, so
            the UA `::backdrop` stays transparent (the scss keeps it out of
            the scroll chain).
        -->
        <!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <!-- The scrim is the pointer path by design; Escape on the dialog is the keyboard
             path. The NOSONAR inside the tag suppresses S1077 and
             Web:MouseEventWithoutKeyboardEquivalentCheck on this line. -->
        <div class="modal-background" (click)="onBackdropClick()"><!-- NOSONAR --></div>
        <!-- eslint-enable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <div [class]="_isCard ? 'modal-card' : 'modal-content'">
            @if (_isCard) {
                <header class="modal-card-head">
                    <h2 [id]="headingId" class="modal-card-title">{{ _title }}</h2>
                    <button type="button" class="delete" [attr.aria-label]="ariaLabel()" (click)="dismiss()"></button>
                </header>
            }
            <div [class.modal-card-body]="_isCard">
                <ng-content select="[modal-content]"></ng-content>
                <ng-content></ng-content>
            </div>
            @if (_isCard) {
                <footer class="modal-card-foot">
                    @if (confirmLabel()) {
                        <button
                            type="button"
                            class="button is-success"
                            [class.is-loading]="confirmPending()"
                            [disabled]="confirmPending()"
                            (click)="onConfirmClick()"
                        >
                            {{ confirmLabel() }}
                        </button>
                    }
                    @if (cancelLabel()) {
                        <button type="button" class="button" (click)="dismiss()">{{ cancelLabel() }}</button>
                    }
                </footer>
            }
        </div>
        @if (!_isCard && showCloseButton()) {
            <button
                type="button"
                class="modal-close is-large"
                [attr.aria-label]="ariaLabel()"
                (click)="close()"
            ></button>
        }
    </dialog>
}
