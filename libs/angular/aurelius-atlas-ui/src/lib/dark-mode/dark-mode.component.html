@let _mode = darkModeService.mode();

<!-- The icon-only button carries a real accessible name (the
     title-only minor: a title is not a reliable name); the tooltip stays
     as the visual hint. The name rides the current mode, so the control
     announces what it is and what is set. -->
<button
    class="button is-text"
    [attr.aria-label]="themeLabel(_mode)"
    [title]="themeLabel(_mode)"
    (click)="darkModeService.next()"
>
    <span class="icon">
        @switch (_mode) {
            @case ("dark") {
                <fa-icon [icon]="faCircleSolid"></fa-icon>
            }
            @case ("light") {
                <fa-icon [icon]="faCircleRegular"></fa-icon>
            }
            @default {
                <fa-icon [icon]="faCircleHalfStroke"></fa-icon>
            }
        }
    </span>
</button>
