[project]
dependencies = ["aurelius-atlas-model", "httpx2>=2.0.0", "pydantic>=2.14.1"]
description = "The Aurelius Atlas server API as a contract and a client: pydantic models for the Atlas REST routes, and an async client for them."
name = "aurelius-atlas-server-client"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_server_client"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
