[project]
dependencies = ["polars>=2.1.0"]
description = "Data quality for Aurelius Atlas: the closed rule vocabulary, the row-mask engine and the score rollup."
name = "aurelius-atlas-quality"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_quality"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
