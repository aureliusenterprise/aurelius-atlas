[project]
dependencies = [
    "aurelius-atlas-dsl",
    "aurelius-atlas-model",
    "aurelius-atlas-store-es",
    "aurelius-atlas-typesystem",
    "elasticsearch[async]>=9.5.1,<10",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]
description = "Atlas stores and services for Aurelius Atlas: the typedef store."
name = "aurelius-atlas-core"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.uv.sources.aurelius-atlas-dsl]
workspace = true

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[tool.uv.sources.aurelius-atlas-typesystem]
workspace = true

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_core"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
