[project]
dependencies = ["pytest>=8.4.1"]
description = "Traceability for Aurelius Atlas: the covers marker, the coverage check and the test report."
name = "aurelius-atlas-trace"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[project.entry-points.pytest11]
aurelius_atlas_trace = "aurelius_atlas_trace.plugin"

[project.scripts]
aurelius-atlas-trace = "aurelius_atlas_trace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_trace"]

[tool.pytest.ini_options]
addopts = ["-p", "pytester"]
asyncio_default_fixture_loop_scope = "module"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
