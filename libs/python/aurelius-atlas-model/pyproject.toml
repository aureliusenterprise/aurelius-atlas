[project]
dependencies = ["pydantic>=2.14.1"]
description = "Atlas data shapes for Aurelius Atlas: type definitions and their REST JSON."
name = "aurelius-atlas-model"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_model"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
