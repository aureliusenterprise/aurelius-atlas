[project]
dependencies = ["httpx2>=2.0.0"]
description = "This library provides common utilities for Aurelius projects."
name = "aurelius-atlas-sdk"
requires-python = ">=3.14"
version = "0.6.1"

[project.optional-dependencies]
# Floor only; no ceiling so consumers can track current boto3.
aws = ["boto3>=1.43.120", "types-boto3[full]>=1.43.116"]
azure = ["msal>=1.39.0"]
full = [
    "boto3>=1.43.120",
    "coloredlogs>=15.0.1",
    "msal>=1.39.0",
    "psycopg[binary]>=3.3.6",
    "testcontainers>=4.15.0",
    "types-boto3[full]>=1.43.116",
    "trustme>=1.1",
]
logging = ["coloredlogs>=15.0.1"]
postgresql = ["psycopg[binary]>=3.3.6"]
testing = ["testcontainers>=4.15.0", "trustme>=1.1"]

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
