[project]
dependencies = ["aurelius-atlas-server-client", "httpx>=0.28.1", "pydantic>=2.14.1"]
description = "The Aurelius Atlas lineage-model API as a contract and a client: the lineage-flattening endpoint as pydantic models, and an async client for it."
name = "aurelius-atlas-lineage-model-client"
requires-python = ">=3.14"
version = "0.1.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_lineage_model_client"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-atlas-server-client]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
