[project]
dependencies = ["httpx2>=2.0.0", "pydantic>=2.14.1", "pytest>=8.4.1", "pyyaml>=6.0.3"]
description = "Parity scenarios for Aurelius Atlas: the scenario format, the runner and the comparison."
name = "aurelius-atlas-parity"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[project.entry-points.pytest11]
aurelius_atlas_parity = "aurelius_atlas_parity.plugin"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_parity"]

[tool.pytest.ini_options]
# The library's own run does not load its plugin through the entry point: that would import the package
# before pytest-cov starts measuring, and every module-level line would count as not run.
addopts = ["-p", "pytester", "-p", "no:aurelius_atlas_parity"]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
