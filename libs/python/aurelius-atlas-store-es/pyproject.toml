[project]
dependencies = ["elasticsearch[async]>=9.5.1,<10", "pydantic>=2.14.1"]
description = "Elasticsearch access for Aurelius Atlas: settings, client lifecycle and health check."
name = "aurelius-atlas-store-es"
requires-python = ">=3.14"
version = "0.6.1"

[project.optional-dependencies]
testing = ["testcontainers>=4.15.0", "trustme>=1.1"]

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_store_es"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
