[project]
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "requests>=2.34.2",
]
description = "The OTLP ingest credential: a refresh-ahead client-credentials token source and the app-owned OTLP export pipeline."
name = "aurelius-atlas-otel"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_otel"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
