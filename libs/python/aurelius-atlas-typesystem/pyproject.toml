[project]
dependencies = ["aurelius-atlas-model", "tzdata>=2026.5"]
description = "The Atlas type system for Aurelius Atlas: resolved types and the type registry."
name = "aurelius-atlas-typesystem"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_typesystem"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
