[project]
dependencies = ["aurelius-atlas-model", "antlr4-python3-runtime==4.13.2"]
description = "The Atlas DSL for Aurelius Atlas: Atlas's grammar, its parser and the query's syntax tree."
name = "aurelius-atlas-dsl"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.uv.sources.aurelius-atlas-model]
workspace = true

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_dsl"]

# The parser ANTLR generates is not ours to cover (DD-240).
[tool.coverage.run]
omit = ["aurelius_atlas_dsl/generated/*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
