plugins:
    - autorefs
    - llmstxt:
          sections:
              User Guide:
                  - user-guide/*.md
                  - user-guide/**/*.md
              Contributor Guide:
                  - contributor-guide/*.md
                  - contributor-guide/**/*.md
              API Reference:
                  - api-reference/*.md
                  - api-reference/**/*.md
              Architecture:
                  - architecture/*.md
                  - architecture/**/*.md
              Changelog:
                  - CHANGELOG.md
    - mike
    - mkdocstrings:
          handlers:
              python:
                  options:
                      docstring_options:
                          ignore_init_summary: true
                      docstring_section_style: list
                      extensions:
                          - tools/griffe/aurelius_pydantic.py:AureliusPydanticExtension:
                                schema: true
                      heading_level: 2
                      inherited_members: true
                      inventories:
                          - https://docs.python.org/3/objects.inv
                      line_length: 120
                      merge_init_into_class: true
                      parameter_headings: true
                      separate_signature: true
                      show_docstring_examples: true
                      show_if_no_docstring: true
                      show_object_full_path: false
                      show_root_heading: true
                      show_signature: true
                      show_signature_annotations: true
                      show_source: false
                      show_symbol_type_heading: true
                      show_symbol_type_toc: true
                      signature_crossrefs: true
                      summary: true
                      unwrap_annotated: true
    - search
    - tags

extra:
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/aureliusenterprise/aurelius-atlas
    version:
        alias: true
        provider: mike

extra_css:
    - stylesheets/table.css
