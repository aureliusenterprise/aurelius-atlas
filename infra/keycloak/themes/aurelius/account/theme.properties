# The Aurelius look on Keycloak's v3 account console (SKT-04, SKT-05): the webapp's band, ink, links and logo.
parent=keycloak.v3
import=common/keycloak

styles=css/aurelius.css

# The webapp's logo in the header, leading back to the webapp; its favicon in the tab.
# logoUrl stays host-free (SPS-01): the browser resolves it against the same origin, so it points
# at the webapp whatever STANDALONE_HOST is — as the legacy m4i theme's "./" did.
logo=img/aurelius-atlas-logo.png
logoUrl=/
favIcon=/img/favicon.ico
favIconType=image/x-icon
title=Aurelius Atlas account

# Light only, as the webapp (SHM-01).
darkMode=false
