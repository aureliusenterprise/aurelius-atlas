{{/*
The Services (CHT-16): the ClusterIP the gateway and the apps reach, and the
RSS (Replica Service) headless companion the JGroups DNS_PING discovers
through — `-Djgroups.dns.query` points at it, so it must exist and publish
not-ready addresses for the cluster to form.
*/}}
{{- $fullname := include "atlas-keycloak.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
    name: {{ $fullname }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    ports:
        # appProtocol names the wire (DD-646): every gateway that reads the
        # standard field (GKE's managed Gateway) speaks TLS to this backend
        # and health-checks it over TLS — the port serves nothing else.
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: https
          protocol: TCP
          appProtocol: HTTPS
        {{- if .Values.service.issuerPort }}
        {{/* DD-265: the HTTPS-standard alias in-cluster producers dial when
        they reach the issuer by its public name (the browser URL implies 443
        and CoreDNS split-horizon resolves that name here, CHT-41). Same
        listener as 8443; the port number is what keeps the emitted issuer
        free of a ":8443" suffix. */}}
        - name: https-issuer
          port: {{ int .Values.service.issuerPort }}
          targetPort: https
          protocol: TCP
        {{- end }}
        {{- if and .Values.telemetry.enabled (eq .Values.database.flavor "bundled") .Values.postgres.enabled }}
        {{/* DD-664: the management listener, published for the puller's
        prometheus receiver (its scrape of Keycloak's own /metrics). Same
        gate as the puller itself — with no puller, no port. Still nothing
        from the gateway: the umbrella routes only the https port. */}}
        - name: management
          port: {{ int .Values.service.managementPort }}
          targetPort: management
          protocol: TCP
        {{- end }}
    selector:
        {{- include "atlas-keycloak.selectorLabels" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "atlas-keycloak.rssName" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.labels" . | nindent 8 }}
spec:
    type: ClusterIP
    clusterIP: None
    publishNotReadyAddresses: true
    ports:
        - name: https
          port: {{ int .Values.service.port }}
          targetPort: https
          protocol: TCP
        - name: jgroups
          port: 7800
          targetPort: jgroups
          protocol: TCP
    selector:
        {{- include "atlas-keycloak.selectorLabels" . | nindent 12 }}
