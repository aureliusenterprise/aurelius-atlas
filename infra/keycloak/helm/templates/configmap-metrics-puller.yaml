{{/*
The metrics puller's collector config (CHT-43): the slice's dev
config/metrics-puller.yaml, ported. The receiver dials this release's bundled
Keycloak database (the `keycloak` database, same constant as KC_DB_URL); the
env-fed slots differ as the spec allows (DD-265/DD-266): the OTLP endpoint
dials this release's collector, and the mint URL is the issuer's public realm
endpoint (which now resolves in-cluster through the CoreDNS entry). The
`service.name` upsert stays the dev value — the accepted dashboards'
exported_job pins are the contract (DD-265). No credential in here (R5):
the database password and the client secret arrive as env.
DD-664 adds the second pipeline: Keycloak's own Micrometer registry, scraped
from the management port (its /metrics, served since KC_METRICS_ENABLED —
the endpoint is un-authenticated and TLS with the same CA). Scraping beats
the OTLP push here: Keycloak's pusher (a) ignores the generic
OTEL_EXPORTER_OTLP_ENDPOINT/HEADERS (dials localhost:4317 un-authenticated —
only the QUARKUS_-prefixed pair reaches the collector) and (b) lands
OTLP-native metric names that clash with every other service's JVM/HTTP
series, while the scrape keeps Micrometer's own names — the contract the
accepted dashboard now pins.
*/}}
{{- if and .Values.telemetry.enabled (eq .Values.database.flavor "bundled") .Values.postgres.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "atlas-keycloak.pullerName" . }}
    namespace: {{ default .Release.Namespace .Values.global.namespace }}
    labels:
        {{- include "atlas-keycloak.pullerLabels" . | nindent 8 }}
data:
    config.yaml: |
        receivers:
            postgresql:
                endpoint: {{ printf "%s:%d" (include "atlas-keycloak.pgFullname" .) (int .Values.postgres.service.port) | quote }}
                # Block sequence on purpose: in a flow list ([...]) the YAML
                # parser treats the colon inside ${env:...} as a key separator
                # and the collector's resolver never sees the placeholder.
                databases:
                    - {{ .Values.postgres.auth.database | quote }}
                username: ${env:KEYCLOAK_DATABASE_USERNAME}
                password: ${env:KEYCLOAK_DATABASE_PASSWORD}
                tls:
                    ca_file: {{ include "atlas-keycloak.caPath" . | quote }}
                collection_interval: 30s
            prometheus:
                config:
                    scrape_configs:
                        -   job_name: keycloak
                            metrics_path: /metrics
                            scrape_interval: 30s
                            scheme: https
                            static_configs:
                                -   targets:
                                        - {{ printf "%s:%d" (include "atlas-keycloak.fullname" .) (int .Values.service.managementPort) | quote }}
                            tls_config:
                                ca_file: {{ include "atlas-keycloak.caPath" . | quote }}

        processors:
            resource:
                attributes:
                    # Prometheus attribution: the receiving collector's
                    # prometheus exporter maps service.name to the job label.
                    # Distinct from the Keycloak server's own
                    # service.name="keycloak".
                    - action: upsert
                      key: service.name
                      value: keycloak-infra
            resource/server:
                attributes:
                    # DD-664: the server's own scraped metrics — the
                    # dashboard's exported_job="keycloak" pins.
                    - action: upsert
                      key: service.name
                      value: keycloak
            batch:

        exporters:
            otlp:
                {{- $collector := include "atlas-keycloak.siblingService" (dict "name" "atlas-observability" "release" .Release.Name "override" .Values.telemetry.service) }}
                endpoint: {{ printf "https://%s:%d" $collector (int .Values.telemetry.puller.port) | quote }}
                # The per-service leg (DD-196, CIA-06): the oidc receiver
                # accepts only client-credentials JWTs; the oauth2client
                # extension mints and attaches the bearer per export.
                auth:
                    authenticator: oauth2client
                tls:
                    ca_file: {{ include "atlas-keycloak.caPath" . | quote }}

        extensions:
            # Per-service ingest identity (DD-196, CIA-07): mints
            # client-credentials JWTs as the otel-keycloak realm client.
            # DD-265: the mint target is the issuer's PUBLIC URL, which the
            # runbook's CoreDNS entry resolves to the Keycloak Service's 443
            # port in-cluster — the same issuer the collector validates
            # against, so one world in dev and cluster alike.
            oauth2client:
                token_url: {{ printf "%s/realms/%s/protocol/openid-connect/token" (include "atlas-keycloak.issuerUrl" .) (include "atlas-keycloak.realmName" .) | quote }}
                client_id: otel-keycloak
                client_secret: ${env:OTEL_INGEST_CLIENT_SECRET}
                tls:
                    ca_file: {{ include "atlas-keycloak.caPath" . | quote }}

        service:
            extensions: [oauth2client]
            pipelines:
                metrics:
                    receivers: [postgresql]
                    processors: [resource, batch]
                    exporters: [otlp]
                metrics/server:
                    receivers: [prometheus]
                    processors: [resource/server, batch]
                    exporters: [otlp]
{{- end }}
