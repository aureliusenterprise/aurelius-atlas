# Phase-0 spike overrides (plan: parallel CI jobs, DD-232 candidate).
#
# Layered on TOP of arc-shapea-values.yaml (install.sh passes both -f flags),
# so every operational detail of the live shape - privileged dockerd, the
# docker-init chain, the toolchain PATH, hostAliases, cache-init, SONAR_USER_HOME
# - is inherited verbatim and cannot drift. This file overrides ONLY the four
# things the spike exists to test.
#
# The question: can N jobs run CONCURRENTLY, each with a cache volume that is
# its own? The live shape cannot - the 50 Gi PD is ReadWriteOnce and
# arc-shapea-values.yaml pins maxRunners: 1 for exactly that reason. ARC builds
# job pods from template.spec (an AutoscalingRunnerSet, not a StatefulSet), so
# volumeClaimTemplates - the per-pod-volume mechanism - is not available to job
# pods. The fallback is an emptyDir on the node's local disk: warm within a pod,
# cold across pods, and the RWO pin is gone.
#
# Deployed as its OWN scale set (label atlas-ci-shapea-spike) so the production
# runner pod is never evicted and `runs-on: atlas-ci-shapea` is unaffected.
# Tear down after the spike:
#   helm -n arc-runners uninstall atlas-ci-shapea-spike

githubConfigUrl: https://github.com/aureliusenterprise/aurelius-atlas
githubConfigSecret: atlas-arc-auth
runnerScaleSetName: atlas-ci-shapea-spike

# The spike's own label: jobs opt in with `runs-on: atlas-ci-shapea-spike`.
scaleSetLabels:
    - atlas-ci-shapea-spike

# Scale to zero (cost: the spike runs on demand, only when dispatched) and to
# two (the spike's whole point: two jobs at once, on separate pods).
minRunners: 0
maxRunners: 2

template:
    spec:
        volumes:
            # The override that matters: `work` - the runner's work volume and
            # every .ci-cache/* subPath under it (uv, npm, pre-commit, sops,
            # docker, containerd, sonar) - becomes an emptyDir instead of the
            # RWO PVC. 60 Gi of the node's 98 GB local disk covers a warm
            # shape-A cache (containerd ~5 GB + docker store + node_modules +
            # .venv); sizeLimit keeps a runaway from eating the node.
            # The volume NAME stays `work`, so cache-init's /work mount, the
            # runner's _work mount, and all seven subPath mounts carry over
            # from the prod values untouched.
            - name: work
              emptyDir:
                  sizeLimit: 60Gi
