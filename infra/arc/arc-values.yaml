# ARC gha-runner-scale-set for aurelius-atlas CI (docs/architecture/self-hosted-ci.md).
# Release name: atlas-ci, namespace: arc-runners. Auth: pre-created secret.
githubConfigUrl: https://github.com/aureliusenterprise/aurelius-atlas
githubConfigSecret: atlas-arc-auth
runnerScaleSetName: atlas-ci
minRunners: 0
# RWO cache (single PD): one runner at a time so the volume is never
# attached to two nodes (a second pod on another node would stuck in
# ContainerCreating). Serial CI is the current volume anyway.
maxRunners: 1

# Jobs target the pool with runs-on: atlas-ci (see CI_RUNS_ON repo variable).
scaleSetLabels:
    - atlas-ci

containerMode:
    type: dind

template:
    spec:
        # Cache dirs are group-writable + setgid (cache-init below), so the
        # runner (uid 1001), the dind sidecar's bind-mounts (dockerd, root)
        # and the remapped dev container all write the same files. OnRoot-
        # Mismatch: recursive chown only when the volume root perms change -
        # never on warm pods (the default, Always, chowns the volume every
        # start). fsGroup lives under securityContext (top-level is pruned
        # by the AutoscalingRunnerSet CRD schema).
        securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
        # Phase 1 (canary on atlas-dev's existing default pool): no
        # nodeSelector/tolerations - the canary requests below fit the
        # default pool's headroom (nodes: 3.92 CPU / 13.9 Gi allocatable,
        # 1.5-4.6 Gi requested). Phase 2 (full pipeline: test fan-out peaks
        # ~6 vCPU / ~30 GB - does NOT fit a 13.9 Gi node) re-enables the
        # dedicated tainted spot pool:
        # nodeSelector:
        #     ci: "true"
        # tolerations:
        #     - key: ci
        #       operator: Equal
        #       value: "true"
        #       effect: NoSchedule
        # dockerd creates missing bind-mount sources root:root 0755 - the
        # dev container (remapped to uid 1001) could not write them. This
        # init container pre-creates the CI_CACHE_MOUNTS sources on the
        # work volume as root:1001 mode 2775; the setgid bit then makes
        # everything created under them (by uv, npm, pre-commit, dockerd)
        # inherit group 1001.
        initContainers:
            - name: cache-init
              image: ghcr.io/actions/actions-runner:latest
              # root: also sweeps stale caches - dockerd creates bind-mount
              # targets (and parents) as root:root inside the container, and
              # uid 1001 cannot unlink those (the old in-checkout layout left
              # .container-cache/ that broke the next checkout's git clean,
              # run 40201875108). A root-owned wreck must not survive.
              securityContext:
                  runAsUser: 0
                  runAsGroup: 0
              command:
                  - /bin/bash
                  - -c
                  - |
                      rm -rf /work/.ci-cache /work/aurelius-atlas/aurelius-atlas/.container-cache
                      mkdir -p /work/.ci-cache/uv /work/.ci-cache/npm /work/.ci-cache/pre-commit
                      chgrp -R 1001 /work/.ci-cache && chmod -R 2775 /work/.ci-cache
              resources:
                  requests:
                      cpu: 10m
                      memory: 32Mi
                  limits:
                      cpu: 500m
                      memory: 128Mi
              volumeMounts:
                  - name: work
                    mountPath: /work
        containers:
            # The job container. In dind mode the image must be EXPLICIT:
            # the chart renders init-dind-externals' image straight from
            # this entry (helm template -> "null" otherwise, rejected by
            # the API). :latest matches the controller's default runner.
            # Phase 1 sizing: the canary is validate-only (~1 CPU, ~2 Gi).
            - name: runner
              image: ghcr.io/actions/actions-runner:latest
              # REQUIRED in dind mode: the chart passes command through
              # verbatim, and the stock image's entrypoint (k8s-mode
              # listener) exits 0 in seconds here. The chart's own dind
              # example sets run.sh - runner then registers and waits.
              command: ["/home/runner/run.sh"]
              # The stock image ships Node only under /home/runner/
              # externals/node24 (the dind-externals mount), NOT on PATH -
              # devcontainers/ci's `npm install -g @devcontainers/cli`
              # needs it (measured: "npm: command not found", run 40193534424).
              env:
                  - name: PATH
                    value: >-
                        /home/runner/externals/node24/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              resources:
                  requests:
                      cpu: 500m
                      memory: 2Gi
                  limits:
                      cpu: "2"
                      memory: 6Gi
            # The dind sidecar is chart-managed in dind mode: a native
            # sidecar (initContainer + restartPolicy: Always, k8s >=1.29 -
            # this cluster is 1.35) running docker:dind privileged, socket
            # at the shared /var/run. The chart IGNORES a user "dind"
            # container entry here (and a native sidecar cannot mount into
            # /var/lib/docker of its own container), so no entry - and the
            # image store lives on the node disk (dind-scratch is unused
            # too, kept for Phase 2 customisation). The 8.3 GB
            # atlas-ci-runner image fits the 100 GB GKE boot disk.
        volumes:
            # 'work' is the chart's persistent volume mounted at
            # /home/runner/_work in BOTH the dind sidecar and the runner
            # (dind-work-volume helper honours a user 'work' volume). It is
            # the only path dockerd can bind-mount from that outlives a job,
            # so the toolchain caches live under it (see CI_CACHE_MOUNTS) and
            # survive the per-job workspace wipe. Backed by the PD PVC
            # (toolchain-cache-pvc.yaml); a missing claim blocks scheduling.
            - name: work
              persistentVolumeClaim:
                  claimName: atlas-toolchain-cache
