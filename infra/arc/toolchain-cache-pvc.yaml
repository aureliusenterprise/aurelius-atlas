# Shared toolchain cache for AKS CI runners (infra/arc/README.md).
# Azure Files (NFS, ReadWriteMany) so uv/npm/pre-commit caches are shared
# across runner pods and nodes. The composite action's UV_CACHE_DIR,
# npm_config_cache and PRE_COMMIT_HOME paths bind onto this volume via the
# CI_CACHE_MOUNTS repo variable; on hosted runners the same paths are filled
# by actions/cache instead. The caches are content-addressed, so shared
# access is safe; prune the subdirs if growth needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: atlas-toolchain-cache
    namespace: arc-runners
spec:
    accessModes:
        - ReadWriteMany
    storageClassName: azurefile
    resources:
        requests:
            storage: 100Gi
