# Shared toolchain cache for GKE CI runners (infra/arc/README.md).
# Phase 1: PD (the cluster default, RWO) - the Filestore API cannot be
# enabled in this project (billing-account service restriction), and the
# canary is serial, so RWO is enough: RWO shares within a node, and ARC
# jobs on one node read the same content-addressed caches. Phase 2 scales
# to RWX (Filestore) if concurrent jobs land on multiple nodes. The
# composite action's UV_CACHE_DIR, npm_config_cache and PRE_COMMIT_HOME
# paths bind onto this volume via the CI_CACHE_MOUNTS repo variable; on
# hosted runners the same paths are filled by actions/cache instead. The
# caches are content-addressed, so shared access is safe; prune the
# subdirs if growth needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: atlas-toolchain-cache
    namespace: arc-runners
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: standard-rwo
    volumeMode: Filesystem
    resources:
        requests:
            storage: 50Gi
