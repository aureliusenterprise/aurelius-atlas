# ARC gha-runner-scale-set - SHAPE A canary (docs/architecture/self-hosted-ci.md).
# Release name: atlas-ci-shapea, namespace: arc-runners.
#
# Shape A = "the job runs IN the dev container image": the runner pod's job
# container IS ghcr.io/aureliusenterprise/atlas-ci-runner (the dev container,
# built by build-devcontainer-image.yaml; branch builds publish a
# sha-<full-sha> tag, main publishes :main). The ci-shapea workflow has
# direct steps - no devcontainers/ci action, no sibling container, no
# per-job image pull.
#
# How the pieces fit (verified against chart 0.15.1 templates + the baked
# feature scripts):
#   - containerMode omitted => "default" mode: the chart passes every field
#     of the "runner" container through verbatim and injects nothing (no
#     dind sidecar, no k8s container hooks). Docker-in-docker is IN the
#     image: the docker-in-docker feature baked dockerd +
#     /usr/local/share/docker-init.sh (starts dockerd as root via the
#     image's passwordless sudo, waits for `docker info`, then exec "$@"),
#     and the ci-runner feature baked the Actions runner binaries at
#     /opt/actions-runner (owned by vscode). The command chains them.
#   - Steps run directly on this container's filesystem: the runner's
#     RunMode=docker only spawns a job container for jobs that request a
#     `container:` - ci-shapea.yaml requests none.
#   - The image ships NO entrypoint/user (the devcontainer CLI injects
#     those for developers), so command + runAs* are explicit here.
#     uid 1000 = the image's vscode (sudoers.d entry, owns
#     /opt/actions-runner); gid/supplemental 999 = the docker group -
#     dockerd's socket is root:docker 0660 by default, and k8s drops the
#     image user's supplementary groups, so they must be declared.
#   - privileged: the docker-in-docker feature's own
#     devcontainer-feature.json says the same for developer containers;
#     dockerd needs iptables, cgroup nesting, and overlay mounts.
githubConfigUrl: https://github.com/aureliusenterprise/aurelius-atlas
githubConfigSecret: atlas-arc-auth
runnerScaleSetName: atlas-ci-shapea
# One warm (idle) runner pod, always. It is what keeps the single
# Ubuntu node of the atlas-ci pool up: the pool is autoscaled 0-1 and
# GKE's autoscaler only adds a node for a PENDING pod - with minRunners
# 0 the pool sits at zero and the first job of the day eats a ~6 min
# node boot. int (NOT 1.0): helm's --set passes a float as a STRING and
# the chart's template omits runnersMin unless the value is numeric
# (rev 13: minRunners="1.0" silently = no warm runner). Keep it here in
# the file - YAML numbers all arrive as the same type, so the chart's
# gt(minRunners, maxRunners) comparison type-checks.
minRunners: 1
# Separate scale set from atlas-ci (Shape B): the RWO cache PD never
# attaches to two pods, and the full ci job keeps running on Shape B while
# this canary proves Shape A.
maxRunners: 1

# runs-on: atlas-ci-shapea (ci-shapea.yaml hardcodes it - a canary targets
# its pool explicitly, like ci-canary.yaml does for atlas-ci).
scaleSetLabels:
    - atlas-ci-shapea

template:
    spec:
        # Pull atlas-ci-runner (private GHCR package) - see README "Shape A"
        # for the one-liner that creates it from the CI PAT.
        imagePullSecrets:
            - name: atlas-ghcr-pull
        # devcontainer.json runArgs: --add-host=keycloak.localhost:127.0.0.1
        # (e2e tests resolve the local Keycloak by that name).
        hostAliases:
            - ip: 127.0.0.1
              hostnames:
                  - keycloak.localhost
        securityContext:
            runAsUser: 1000 # vscode
            runAsGroup: 999 # docker (socket group)
            supplementalGroups: [999]
            # The work PVC root becomes group-writable for vscode on
            # (re-)mount. OnRootMismatch: recursive chown only when the
            # volume root's perms change - never on warm pods (the default,
            # Always, chowns the whole 50 Gi volume on every start).
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        # Creates the cache dirs setgid group-999 (the docker group = the
        # runner's runAsGroup, so every file uv/npm/pre-commit/dockerd write
        # under them inherits gid 999 and all can write). Mirrors Shape B's
        # cache-init; 999 not 1001 because THIS scale set's user is uid 1000
        # with group 999. Runs as root: dockerd also creates bind-mount
        # sources root:root without it.
        initContainers:
            - name: cache-init
              image: ghcr.io/actions/actions-runner:latest
              securityContext:
                  runAsUser: 0
                  runAsGroup: 0
              command:
                  - /bin/bash
                  - -c
                  - |
                      mkdir -p /work/.ci-cache/uv /work/.ci-cache/npm /work/.ci-cache/pre-commit /work/.ci-cache/docker /work/.ci-cache/containerd /work/.ci-cache/sops
                      # sops needs SOPS_AGE_KEY_FILE to EXIST even when
                      # SOPS_AGE_KEY carries the key; the checkout is
                      # ephemeral (clean tree, no keys.txt exclude), so the
                      # file lives on the cache volume. Content irrelevant
                      # (the env key wins); cache-init owns it root:root
                      # 644, readable by uid 1000.
                      touch /work/.ci-cache/sops/keys.txt
                      chmod 644 /work/.ci-cache/sops/keys.txt
                      # NON-recursive on purpose: the tree is multi-GB
                      # (containerd alone ~5 GB), and `chgrp -R`/`chmod -R`
                      # over it made every pod boot take minutes - init
                      # never finished before the controller recycled the
                      # pod (observed 19:01-19:07, jobs stuck queued).
                      # The setgid top dirs make every NEW file inherit
                      # gid 999 + group-writability; existing files were
                      # already created under those dirs.
                      chgrp 999 /work/.ci-cache /work/.ci-cache/* 2>/dev/null || true
                      chmod 2775 /work/.ci-cache /work/.ci-cache/* 2>/dev/null || true
                      # The checkout tree must be uid-1000-owned: e2e
                      # compose/bind mounts run as container root and
                      # write INTO the checkout (dist/, dev/*/certs,
                      # coverage), and root-owned dirs make the next
                      # job's checkout die with "EACCES: permission
                      # denied, rmdir" (gate 40225615871, dev/). Runs as
                      # root (this container), so it fixes what the
                      # uid-1000 worker cannot. Scoped to the checkout
                      # ONLY - recursive over .ci-cache (7 GB containerd)
                      # is the boot stall; over the tree (~1 GB) it is
                      # seconds.
                      chown -R 1000:999 /work/aurelius-atlas 2>/dev/null || true
                      # BuildKit metadata (/var/lib/docker/buildkit) pairs
                      # with containerd's snapshot store (the layer
                      # snapshots ARE containerd snapshots - "buildkit-
                      # layer-snapshot-v1-*"). Both persist on this PVC
                      # together, but a pod that dies mid-build (or an
                      # infra change that moves one store, trial runs
                      # 40217828572 -> 40219350705) leaves the metadata
                      # referencing snapshots that no longer exist: every
                      # build then dies with "parent snapshot ... does not
                      # exist: not found". The pairing is pod-scoped, so
                      # wipe the metadata on every boot - builds use
                      # --cache-from type=registry, so it is disposable.
                      rm -rf /work/.ci-cache/docker/buildkit
              resources:
                  requests:
                      cpu: 10m
                      memory: 32Mi
                  limits:
                      cpu: 500m
                      memory: 128Mi
              volumeMounts:
                  - name: work
                    mountPath: /work
        containers:
            - name: runner
              # Shape A canary tag: CI_SHAPEA_IMAGE_TAG repo var (set to
              # sha-<full-sha> after the branch build publishes it);
              # :main = fallback once the ci-runner feature lands on main.
              image: ghcr.io/aureliusenterprise/atlas-ci-runner:main
              securityContext:
                  privileged: true # dockerd (see header)
              env:
                  # actions/cache -> the in-cluster cache server
                  # (cache-server-values.yaml, README "Cache server").
                  # ONLY honoured by the forked runner the ci-runner
                  # feature bakes (falcondev-oss/github-actions-runner);
                  # stock runners hard-code GitHub's results URL. The fork
                  # also skips runner self-update while this is set
                  # (a self-update would unpatch the binary and silently
                  # revert caching to GitHub's central service). Trailing
                  # slash required by the cache client.
                  - name: CUSTOM_ACTIONS_RESULTS_URL
                    value: http://gha-cache-server.arc-runners.svc.cluster.local:3000/
              command:
                  - /bin/bash
                  - -c
                  - |
                      set -e
                      # Baked toolchains live outside k8s' minimal PATH
                      # (the devcontainer CLI injects them for developers,
                      # and login files are skipped for `bash -c`), so
                      # assemble them explicitly: nvm node, /usr/local/bin
                      # (sops, kubectl, helm, trivy, gcloud, npm -g nx),
                      # py-utils uv, sdkman java.
                      export PATH="/usr/local/share/nvm/versions/node/$(ls /usr/local/share/nvm/versions/node | tail -1)/bin:/usr/local/bin:/usr/local/py-utils/bin:/usr/local/sdkman/bin:/usr/local/sdkman/candidates/java/current/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
                      # devcontainer.json containerEnv, injected verbatim:
                      export NX_DAEMON=true
                      export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
                      # Toolchain caches = the PVC subPaths mounted below,
                      # OUTSIDE the checkout (Shape B lesson: inside it, the
                      # root-owned mount roots break the next git clean).
                      export UV_CACHE_DIR=/var/cache/ci/uv
                      export npm_config_cache=/var/cache/ci/npm
                      export PRE_COMMIT_HOME=/var/cache/ci/pre-commit
                      # docker-in-docker feature containerEnv:
                      export DOCKER_BUILDKIT=1
                      # Work folder: the JIT self-registration (the
                      # controller's ACTIONS_RUNNER_INPUT_JITCONFIG env,
                      # consumed by Runner.Listener) has NO relocatable
                      # work folder - config.sh 2.338 has no --jitconfig
                      # flag at all (pod crash loop 19:20: "Unrecognized
                      # command-line input arguments for command
                      # configure: 'jitconfig'"), and RUNNER_WORKSPACE is
                      # a kubernetes-mode hook input the standalone
                      # listener ignores. The default WorkFolder is _work
                      # RELATIVE to the runner root, so the fix is the
                      # ARC kubernetes-mode trick: mount the work volume
                      # AT /opt/actions-runner/_work (volumeMounts below)
                      # - the default then lands on the PVC. Jobs run as
                      # uid 1000 with the volume group-writable (fsGroup),
                      # so the old "'/opt/actions-runner/_work/_tool' is
                      # denied" (container layer, root-owned) is gone.
                      # The checkout is EPHEMERAL (sanitized every job,
                      # see ci.yaml), so the sops key file lives on the
                      # cache volume - cache-init touches it every boot
                      # (sops needs the file to EXIST; SOPS_AGE_KEY
                      # carries the key, content irrelevant).
                      export SOPS_AGE_KEY_FILE=/var/cache/ci/sops/keys.txt
                      # docker-init.sh: starts dockerd (privileged), waits
                      # for `docker info`, then exec "$@" = the runner.
                      exec /usr/local/share/docker-init.sh /opt/actions-runner/run.sh
              volumeMounts:
                  # The chart does NOT auto-mount `work` in default mode
                  # (the dind/kubernetes-mode helpers add it; default mode
                  # passes fields verbatim), so mount it explicitly - AT
                  # THE RUNNER ROOT'S _work (see the command comment:
                  # the JIT registration's WorkFolder is the relative
                  # `_work`, relative to /opt/actions-runner). The volume
                  # exists for the runner's OWN writes (_work/_tool setup
                  # actions, the job workspace must be uid-1000-writable -
                  # the container layer is root-owned: "Access to the path
                  # '/opt/actions-runner/_work/_tool' is denied"). The
                  # checkout under it is sanitized every job: nothing in
                  # the tree persists by design - the cache subPaths below
                  # are the only persistent state.
                  - name: work
                    mountPath: /opt/actions-runner/_work
                  # Toolchain caches (PVC subPaths, pre-created setgid by
                  # cache-init). Must match the exports in the command.
                  - name: work
                    mountPath: /var/cache/ci/uv
                    subPath: .ci-cache/uv
                  - name: work
                    mountPath: /var/cache/ci/npm
                    subPath: .ci-cache/npm
                  - name: work
                    mountPath: /var/cache/ci/pre-commit
                    subPath: .ci-cache/pre-commit
                  # sops key file (cache-init touches it; see the command
                  # comment) - lives off the ephemeral checkout.
                  - name: work
                    mountPath: /var/cache/ci/sops
                    subPath: .ci-cache/sops
                  # dockerd's image store ON THE PVC: compose base images
                  # (e2e), pulled base layers, etc. survive the per-pod
                  # wipe. ext4 on a PD supports overlayfs (NFS would not -
                  # Filestore is not used here).
                  - name: work
                    mountPath: /var/lib/docker
                    subPath: .ci-cache/docker
                  # containerd's root ON THE PVC - the critical one. The
                  # image's /etc/containerd/config.toml starts containerd
                  # with root=/var/lib/containerd and dockerd runs with the
                  # containerd-snapshotter enabled (storage-driver=overlayfs,
                  # devcontainers/features#1642), so every image/snapshot
                  # layer lives there, NOT under /var/lib/docker. Left on
                  # the pod root (the node's overlayfs), the overlay mounts
                  # are nested and the kernel rejects them: trial run
                  # 40217828572 died with "failed to mount
                  # /tmp/containerd-mount...: invalid argument" on every
                  # e2e container (ryuk) and docker-build. Shape B never
                  # hit this - devcontainers/ci gives the dev container
                  # volume-backed /var/lib/docker AND /var/lib/containerd.
                  - name: work
                    mountPath: /var/lib/containerd
                    subPath: .ci-cache/containerd
              resources:
                  # Sized for the full pipeline fan-out target (dev-compose
                  # caps ~8.75 Gi + runner overhead); requests stay low so
                  # the canary schedules on the default pool's headroom
                  # (n2-standard-8, 13.9 Gi allocatable - Shape B's
                  # ceiling).
                  requests:
                      cpu: "1"
                      memory: 4Gi
                  limits:
                      cpu: "6"
                      memory: 11Gi
        volumes:
            # One claim for everything (shapea-cache-pvc.yaml): the work
            # dir (checkout + tool cache), the .ci-cache/* subPaths above
            # (caches, docker store, containerd root). Separate from Shape
            # B's atlas-toolchain-cache on purpose - see the PVC's header.
            - name: work
              persistentVolumeClaim:
                  claimName: atlas-shapea-cache
