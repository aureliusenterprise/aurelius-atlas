name=aurelius-kafka-connect-jdbc-sink-example
connector.class=io.debezium.connector.jdbc.JdbcSinkConnector
tasks.max=1

batch.size=200
consumer.override.auto.offset.reset=earliest
consumer.override.group.id=${env:AURELIUS_CONNECTOR_CONSUMER_GROUP_NAME}
connection.password=${env:AURELIUS_CONNECTOR_DATABASE_PASSWORD}
connection.url=${env:AURELIUS_CONNECTOR_DATABASE_URL}
connection.username=${env:AURELIUS_CONNECTOR_DATABASE_USERNAME}
delete.enabled=true
errors.tolerance=all
errors.deadletterqueue.context.headers.enable=true
errors.deadletterqueue.topic.name=${env:AURELIUS_CONNECTOR_DLQ_TOPIC_NAME}
errors.deadletterqueue.topic.replication.factor=1
insert.mode=upsert
primary.key.fields=guid
primary.key.mode=record_key
schema.evolution=none
# Schema-qualified target table: the sink's OpenLineage output dataset name is
# derived from the table identifier, and OpenMetadata parses it as
# "schema.table" — an unqualified name would be rejected by the ingestion.
table.name.format=${env:AURELIUS_CONNECTOR_TABLE_NAME}
topics=${env:AURELIUS_CONNECTOR_KAFKA_TOPIC_NAME}
transforms=hoist-primary-key,flatten
transforms.flatten.delimiter=.
transforms.flatten.type=org.apache.kafka.connect.transforms.Flatten$Value
transforms.hoist-primary-key.field=guid
transforms.hoist-primary-key.type=org.apache.kafka.connect.transforms.HoistField$Key

# Native OpenLineage integration (Debezium >= 3.3.0; the plugin tarball needs
# the debezium-openlineage-core + openlineage-java jars, see Dockerfile).
# Without the core jar on the classpath the ServiceLoader finds no factory and
# the integration silently no-ops, so `enabled` alone proves nothing.
openlineage.integration.enabled=true
# Rendered at container start by the compose command (the OL client reads this
# file literally: no ${env:...} substitution, so secrets live in the generated
# file inside the container only).
# /tmp: the runtime image runs as the non-root `kafka` user, so only
# pre-existing world-writable paths can hold the rendered file.
openlineage.integration.config.file.path=/tmp/openlineage.yml
# Job namespace = the OpenMetadata Pipeline Service the lineage is registered
# under, so the ingestion can resolve the pipeline via its namespace fallback.
openlineage.integration.job.namespace=aurelius-openlineage
openlineage.integration.job.description=Debezium JDBC sink for ${env:AURELIUS_CONNECTOR_TABLE_NAME}.
# INPUT dataset namespace value, used verbatim (kafka://<this>) for the Kafka
# topic dataset. Must match the bootstrapServers of the Kafka service as
# scanned into OpenMetadata (aurelius-dev-kafka = localhost:9092) or the
# topic cannot be resolved.
openlineage.integration.dataset.kafka.bootstrap.servers=localhost:9092
