batch.size=200
bootstrap.servers=${env:AURELIUS_CONNECTOR_KAFKA_BOOTSTRAP_SERVERS}
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
connector.client.config.override.policy=All
config.storage.cleanup.policy=compact
config.storage.replication.factor=1
config.storage.topic=${env:AURELIUS_CONNECTOR_CONFIG_STORAGE_TOPIC}
consumer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
consumer.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
consumer.sasl.mechanism=OAUTHBEARER
consumer.sasl.oauthbearer.client.credentials.client.id=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID}
consumer.sasl.oauthbearer.client.credentials.client.secret=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET}
consumer.sasl.oauthbearer.token.endpoint.url=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL}
consumer.security.protocol=SASL_SSL
consumer.ssl.endpoint.identification.algorithm=https
consumer.ssl.truststore.location=/certs/truststore.p12
consumer.ssl.truststore.password=${env:TLS_TRUSTSTORE_PASSWORD}
consumer.ssl.truststore.type=PKCS12
group.id=${env:AURELIUS_CONNECTOR_GROUP_ID}
key.converter=org.apache.kafka.connect.storage.StringConverter
key.converter.schemas.enable=false
log4j.root.loglevel=INFO
offset.storage.cleanup.policy=compact
offset.storage.file.filename=/tmp/connect-standalone.offsets
offset.storage.replication.factor=1
offset.storage.topic=${env:AURELIUS_CONNECTOR_OFFSET_STORAGE_TOPIC}
plugin.path=/usr/share/confluent-hub-components
producer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
producer.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
producer.sasl.mechanism=OAUTHBEARER
producer.sasl.oauthbearer.client.credentials.client.id=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID}
producer.sasl.oauthbearer.client.credentials.client.secret=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET}
producer.sasl.oauthbearer.token.endpoint.url=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL}
producer.security.protocol=SASL_SSL
producer.ssl.endpoint.identification.algorithm=https
producer.ssl.truststore.location=/certs/truststore.p12
producer.ssl.truststore.password=${env:TLS_TRUSTSTORE_PASSWORD}
producer.ssl.truststore.type=PKCS12
rest.advertised.host.name=${env:AURELIUS_CONNECTOR_REST_ADVERTISED_HOST_NAME}
rest.port=${env:AURELIUS_CONNECTOR_REST_PORT}
# Kafka talks to the broker's SASL_SSL/OAUTHBEARER listener (config/status/offset
# topics and the admin client all use these default-tier settings); the truststore
# stays for broker certificate verification. The Schema Registry REST API below
# keeps plain TLS with CA verification (no OAuth).
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
sasl.mechanism=OAUTHBEARER
sasl.oauthbearer.client.credentials.client.id=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID}
sasl.oauthbearer.client.credentials.client.secret=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET}
sasl.oauthbearer.token.endpoint.url=${env:AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL}
security.protocol=SASL_SSL
ssl.endpoint.identification.algorithm=https
ssl.truststore.location=/certs/truststore.p12
ssl.truststore.password=${env:TLS_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12
status.storage.cleanup.policy=compact
status.storage.replication.factor=1
status.storage.topic=${env:AURELIUS_CONNECTOR_STATUS_STORAGE_TOPIC}
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=${env:AURELIUS_CONNECTOR_SCHEMA_REGISTRY_URL}
value.converter.schema.registry.ssl.endpoint.identification.algorithm=https
value.converter.schema.registry.ssl.truststore.location=/certs/truststore.p12
value.converter.schema.registry.ssl.truststore.password=${env:TLS_TRUSTSTORE_PASSWORD}
value.converter.schemas.enable=true
value.converter.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
