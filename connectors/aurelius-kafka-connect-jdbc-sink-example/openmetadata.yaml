# OpenMetadata scan config — Kafka Connect (native `kafkaConnect` connector).
#
# Scans the sink worker's REST API (port 8083, no auth in dev) and registers
# the connector as a Pipeline under service `aurelius-kafka-connect` —
# connector metadata, status, and task health in OpenMetadata.
#
# Lineage is deliberately OFF here (verified against OpenMetadata 2.0.4):
#   1. The worker resolves `${env:VAR}` via EnvVarConfigProvider, but the REST
#      API reports the raw placeholders, so OM cannot see the real
#      `topics` / `table.name.format` values at all.
#   2. Even with resolved values, the connector's sink-lineage heuristic only
#      links a table to a topic when the table's base name equals the topic
#      name; our `public.entity` table vs `example.entity` topic does not
#      match, and the naming convention (domain-prefixed topics) is intentional.
# Lineage for this sink comes from the OpenLineage events + the static edges
# in openlineage.yaml, which carry full run-level detail instead.
#
# Note this scan registers the pipeline under service `aurelius-kafka-connect`
# (connector name as pipeline name), while the OL-event pipeline lives under
# `aurelius-openlineage` with the Debezium `{job}.{taskId}` suffix — two
# objects by design: this one is the operational view, that one the lineage
# carrier.
source:
    type: kafkaconnect
    serviceName: aurelius-kafka-connect
    serviceConnection:
        config:
            type: KafkaConnect
            hostPort: http://localhost:8083
            verifySSL: false
            messagingServiceName: aurelius-dev-kafka
    sourceConfig:
        config:
            type: PipelineMetadata
            includeLineage: false
            markDeletedPipelines: false
            overrideMetadata: false

sink:
    type: metadata-rest
    config: {}

workflowConfig:
    loggerLevel: INFO
    openMetadataServerConfig:
        hostPort: http://localhost:8585/api
        authProvider: openmetadata
        securityConfig:
            jwtToken: ${OM_JWT_TOKEN}
