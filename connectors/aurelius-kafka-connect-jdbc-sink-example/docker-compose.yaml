name: aurelius-kafka-connect-jdbc-sink-example

services:
    kafka-connect:
        image: ghcr.io/aureliusenterprise/aurelius-kafka-connect-jdbc-sink-example:local
        # Render the OpenLineage transport config from the environment at start
        # (the OL client reads openlineage.yml literally — no ${env:...}
        # substitution — so the OAuth secret is materialised in-container only),
        # then exec the standalone worker.
        # $${VAR} is expanded by the container shell from the container
        # environment below, not by compose at parse time — secrets never
        # appear in `docker compose config` output.
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                umask 077
                cat > /tmp/openlineage.yml <<EOF
                transport:
                    type: kafka
                    topicName: $${AURELIUS_CONNECTOR_OPENLINEAGE_TOPIC_NAME}
                    properties:
                        bootstrap.servers: $${AURELIUS_CONNECTOR_KAFKA_BOOTSTRAP_SERVERS}
                        key.serializer: org.apache.kafka.common.serialization.StringSerializer
                        value.serializer: org.apache.kafka.common.serialization.StringSerializer
                        security.protocol: SASL_SSL
                        sasl.mechanism: OAUTHBEARER
                        sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
                        sasl.login.callback.handler.class: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
                        sasl.oauthbearer.token.endpoint.url: $${AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL}
                        sasl.oauthbearer.client.credentials.client.id: $${AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID}
                        sasl.oauthbearer.client.credentials.client.secret: $${AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET}
                        ssl.truststore.type: PKCS12
                        ssl.truststore.location: /certs/truststore.p12
                        ssl.truststore.password: $${TLS_TRUSTSTORE_PASSWORD}
                        ssl.endpoint.identification.algorithm: https
                EOF
                exec /opt/kafka/bin/connect-standalone.sh /connect-worker /connect-connector
        configs:
            - connect-worker
            - connect-connector
        environment:
            # ${VAR:?} guards: Nx injects the project .env into the task
            # environment; empty credentials/topics would fail obscurely
            # inside the worker (or silently misconfigure the sink) instead
            # of at `compose up`.
            # The container keys here feed the ${env:VAR} lookups in
            # workers/*.properties; they all carry the AURELIUS_CONNECTOR_
            # prefix so other projects' injected env can never collide.
            AURELIUS_CONNECTOR_CONSUMER_GROUP_NAME: ${AURELIUS_CONNECTOR_CONSUMER_GROUP_NAME:?}
            AURELIUS_CONNECTOR_DATABASE_PASSWORD: ${AURELIUS_CONNECTOR_POSTGRES_PASSWORD:?}
            AURELIUS_CONNECTOR_DATABASE_URL: jdbc:postgresql://postgres:5432/${AURELIUS_CONNECTOR_POSTGRES_DB:?}?sslmode=verify-full&sslrootcert=/certs/ca.pem
            AURELIUS_CONNECTOR_DATABASE_USERNAME: ${AURELIUS_CONNECTOR_POSTGRES_USER:?}
            AURELIUS_CONNECTOR_DLQ_TOPIC_NAME: ${AURELIUS_CONNECTOR_DLQ_TOPIC_NAME:?}
            AURELIUS_CONNECTOR_KAFKA_TOPIC_NAME: ${AURELIUS_CONNECTOR_KAFKA_TOPIC_NAME:?}
            # OpenLineage event topic (Debezium sink → Kafka → OpenMetadata OL
            # ingestion). Auto-created by the broker.
            AURELIUS_CONNECTOR_OPENLINEAGE_TOPIC_NAME: ${AURELIUS_CONNECTOR_OPENLINEAGE_TOPIC_NAME:?}
            AURELIUS_CONNECTOR_SCHEMA_REGISTRY_URL: https://schema-registry:8081
            AURELIUS_CONNECTOR_TABLE_NAME: ${AURELIUS_CONNECTOR_TABLE_NAME:?}
            # OAuth listener on the Docker network (SASL_SSL/OAUTHBEARER).
            AURELIUS_CONNECTOR_KAFKA_BOOTSTRAP_SERVERS: broker:9095
            AURELIUS_CONNECTOR_CONFIG_STORAGE_TOPIC: aurelius-kafka-connect-jdbc-sink-example.connect-configs
            AURELIUS_CONNECTOR_GROUP_ID: aurelius-kafka-connect-jdbc-sink-example.connect-group
            AURELIUS_CONNECTOR_OFFSET_STORAGE_TOPIC: aurelius-kafka-connect-jdbc-sink-example.connect-offsets
            AURELIUS_CONNECTOR_REST_ADVERTISED_HOST_NAME: localhost
            AURELIUS_CONNECTOR_REST_PORT: 8083
            AURELIUS_CONNECTOR_STATUS_STORAGE_TOPIC: aurelius-kafka-connect-jdbc-sink-example.connect-status
            TLS_TRUSTSTORE_PASSWORD: ${TLS_TRUSTSTORE_PASSWORD:?}
            AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL: ${AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL:?}
            AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID: ${AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_ID:?}
            AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET: ${AURELIUS_CONNECTOR_KAFKA_OAUTH_CLIENT_SECRET:?}
            # JVM truststore so the token-endpoint TLS verifies against the dev CA,
            # plus the Kafka 4.x OAuth URL allowlist (exact string match).
            JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=${TLS_TRUSTSTORE_PASSWORD} -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=${AURELIUS_CONNECTOR_KAFKA_OAUTH_TOKEN_ENDPOINT_URL}
        ports:
            - 8083:8083
        volumes:
            - ./certs:/certs:ro
        networks:
            - aurelius-dev-kafka-network
            - aurelius-dev-postgres-network
            # Resolves keycloak.localhost (network alias) for token grants in-network.
            - aurelius-dev-keycloak-network

configs:
    connect-worker:
        file: ./workers/worker.properties
    connect-connector:
        file: ./workers/connector.properties

networks:
    aurelius-dev-kafka-network:
        external: true

    aurelius-dev-postgres-network:
        external: true

    # Resolves keycloak.localhost (network alias) for token grants in-network.
    aurelius-dev-keycloak-network:
        external: true
