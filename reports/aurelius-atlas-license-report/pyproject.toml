[project]
dependencies = ["jinja2>=3.1.6", "pydantic>=2.14.1", "pydantic-settings>=2.16.1"]
description = "This report provides license analysis information for Aurelius projects."
name = "aurelius-atlas-license-report"
requires-python = ">=3.14"
version = "0.6.1"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_license_report"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
